[project]
name = "crypto-signal"
version = "0.1.0"
description = "Explainable crypto technical signal and confluence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.53,<1",
  "websockets>=15,<16",
]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
