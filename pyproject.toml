[project]
name = "crypto-signal"
version = "0.1.0"
description = "Explainable crypto technical signal and confluence platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
