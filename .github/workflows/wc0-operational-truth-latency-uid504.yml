name: WC0 Operational Truth Latency UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/product/web.py"
      - "tests/test_r25_operational_truth.py"
      - ".github/workflows/wc0-operational-truth-latency-uid504.yml"

permissions:
  contents: read

concurrency:
  group: wc0-operational-truth-latency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and clean Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC0_OP_TRUTH_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc0-op-truth-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused contract acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_r25_operational_truth.py tests/test_market_data_runtime_product.py
          "$TEST_PY" -m ruff check src/crypto_signal/product/web.py tests/test_r25_operational_truth.py
          echo "WC0_OP_TRUTH_FOCUSED_PASS=YES"

      - name: Exact-source live read-only latency acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PORT=48706
          LOG="$RUNNER_TEMP/wc0-op-truth-preview.log"
          cleanup() {
            if [ -n "${PID:-}" ] && kill -0 "$PID" >/dev/null 2>&1; then
              kill "$PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          test -z "$(/usr/sbin/lsof -nP -iTCP:$PORT -sTCP:LISTEN -t 2>/dev/null || true)"
          (
            export PYTHONPATH="$GITHUB_WORKSPACE/src"
            cd "$GITHUB_WORKSPACE"
            exec nice -n 15 "$TEST_PY" "$GITHUB_WORKSPACE/ops/run_dashboard.py" \
              --host 127.0.0.1 \
              --port "$PORT" \
              --ledger "$DEV/runtime/ledger/live_signal_ledger.sqlite3" \
              --alert-outbox "$DEV/runtime/alerts/alert_outbox.sqlite3" \
              --paper-ledger "$DEV/runtime/paper/paper_fund.sqlite3" \
              --candle-cache "$DEV/runtime/data/live_base_15m_cache.sqlite3"
          ) >"$LOG" 2>&1 &
          PID=$!

          ready=0
          for _ in {1..45}; do
            if curl -fsS --max-time 3 "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          START="$(python3 -c 'import time; print(time.monotonic_ns())')"
          curl -fsS --max-time 10 \
            "http://127.0.0.1:$PORT/api/r25/operational-truth" \
            -o "$RUNNER_TEMP/wc0-op-truth.json"
          END="$(python3 -c 'import time; print(time.monotonic_ns())')"
          python3 - "$RUNNER_TEMP/wc0-op-truth.json" "$START" "$END" <<'PY'
          import json
          import sys

          path, start, end = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          elapsed_ms = (end - start) / 1_000_000
          assert data["status"] == "ready"
          assert data["read_only"] is True
          assert data["real_capital"] == 0
          market = data["components"]["market_tape_runtime"]
          assert market["status"] == "delegated"
          assert market["verification_endpoint"] == "/api/market-tape-runtime/status"
          assert market["online_status"] == "NOT_ASSERTED"
          assert elapsed_ms < 10_000
          print(f"WC0_OP_TRUTH_LATENCY_MS={elapsed_ms:.3f}")
          print("WC0_OP_TRUTH_LIVE_PASS=YES")
          print("REAL_CAPITAL=0")
          PY

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC0_OP_TRUTH_FULL_PASS=YES"

      - name: Prove Development remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC0_OP_TRUTH_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
