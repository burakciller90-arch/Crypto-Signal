name: Crypto Stage8 Cross-Market Source Quality

on:
  push:
    branches:
      - feature/stage8-cross-market-context-v1
    paths:
      - ".github/workflows/crypto-stage8-cross-market-source-quality.yml"

permissions:
  contents: read

jobs:
  source-quality:
    name: Public cross-market source quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Cboe, Treasury and Bybit public sources
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import io
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import UTC, date, datetime, timedelta

          USER_AGENT = (
              "Crypto-Signal-SourceQuality/1.0 "
              "(public research; github.com/burakciller90-arch/Crypto-Signal)"
          )

          def get_bytes(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": USER_AGENT, "Accept": "*/*"},
                  method="GET",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200, response.status
                  return response.read()

          # Cboe VIX: official daily history, updated daily.
          cboe_url = (
              "https://cdn.cboe.com/api/global/us_indices/"
              "daily_prices/VIX_History.csv"
          )
          cboe_text = get_bytes(cboe_url).decode("utf-8-sig")
          rows = list(csv.DictReader(io.StringIO(cboe_text)))
          assert len(rows) > 1000
          parsed_vix: list[tuple[date, float]] = []
          for row in rows:
              raw_date = (row.get("DATE") or row.get("Date") or "").strip()
              raw_close = (row.get("CLOSE") or row.get("Close") or "").strip()
              if not raw_date or not raw_close:
                  continue
              day = datetime.strptime(raw_date, "%m/%d/%Y").date()
              close = float(raw_close)
              assert close > 0
              parsed_vix.append((day, close))
          assert len(parsed_vix) > 1000
          assert parsed_vix == sorted(parsed_vix, key=lambda item: item[0])
          vix_day, vix_close = parsed_vix[-1]
          assert (datetime.now(UTC).date() - vix_day).days <= 10
          print(
              "CBOE_VIX_SOURCE_QUALITY_PASS=YES",
              f"latest_day={vix_day.isoformat()}",
              f"latest_close={vix_close}",
              f"rows={len(parsed_vix)}",
          )

          # U.S. Treasury: official Daily Treasury Par Yield Curve XML feed.
          treasury_url = (
              "https://home.treasury.gov/sites/default/files/"
              "interest-rates/yield.xml"
          )
          root = ET.fromstring(get_bytes(treasury_url))
          xml_locals = [node.tag.rsplit("}", 1)[-1] for node in root.iter()]
          print(
              "TREASURY_XML_TAG_DIAGNOSTIC",
              ",".join(xml_locals[:80]),
          )
          parsed_treasury: list[tuple[date, float]] = []
          def parse_treasury_day(raw: str) -> date:
              candidates = (
                  lambda: datetime.fromisoformat(raw.replace("Z", "+00:00")).date(),
                  lambda: datetime.strptime(raw, "%m/%d/%Y").date(),
                  lambda: datetime.strptime(raw, "%m-%d-%Y").date(),
                  lambda: datetime.strptime(raw, "%d-%b-%y").date(),
                  lambda: datetime.strptime(raw, "%Y-%m-%d").date(),
              )
              for parser in candidates:
                  try:
                      return parser()
                  except ValueError:
                      pass
              raise ValueError(f"unsupported Treasury date: {raw!r}")

          for group in root.iter():
              if group.tag.rsplit("}", 1)[-1] != "G_NEW_DATE":
                  continue
              values: dict[str, str] = {}
              for node in group.iter():
                  local = node.tag.rsplit("}", 1)[-1]
                  text = (node.text or "").strip()
                  if text:
                      values[local] = text
              raw_day = values.get("NEW_DATE") or values.get("BID_CURVE_DATE")
              raw_10y = values.get("BC_10YEAR")
              if not raw_day or not raw_10y:
                  continue
              day = parse_treasury_day(raw_day)
              yield_10y = float(raw_10y)
              assert 0 <= yield_10y < 100
              parsed_treasury.append((day, yield_10y))
          print(
              "TREASURY_10Y_DIAGNOSTIC",
              f"rows={len(parsed_treasury)}",
              f"first={min(parsed_treasury)[0].isoformat() if parsed_treasury else 'NONE'}",
              f"last={max(parsed_treasury)[0].isoformat() if parsed_treasury else 'NONE'}",
          )
          assert len(parsed_treasury) >= 10
          parsed_treasury.sort(key=lambda item: item[0])
          treasury_day, treasury_10y = parsed_treasury[-1]
          assert (datetime.now(UTC).date() - treasury_day).days <= 10
          print(
              "TREASURY_10Y_SOURCE_QUALITY_PASS=YES",
              f"latest_day={treasury_day.isoformat()}",
              f"latest_10y={treasury_10y}",
              f"rows={len(parsed_treasury)}",
          )

          # Bybit: public, credential-free daily BTCUSDT Spot klines.
          today_start = datetime.now(UTC).replace(
              hour=0, minute=0, second=0, microsecond=0
          )
          end_ms = int((today_start - timedelta(milliseconds=1)).timestamp() * 1000)
          params = urllib.parse.urlencode(
              {
                  "category": "spot",
                  "symbol": "BTCUSDT",
                  "interval": "D",
                  "end": end_ms,
                  "limit": 5,
              }
          )
          bybit: dict[str, object] | None = None
          bybit_host = ""
          bybit_errors: list[str] = []
          for host in ("api.bybit.com", "api.bytick.com"):
              try:
                  candidate = json.loads(
                      get_bytes(f"https://{host}/v5/market/kline?{params}")
                  )
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  bybit_errors.append(f"{host}:{exc}")
                  continue
              if candidate.get("retCode") == 0:
                  bybit = candidate
                  bybit_host = host
                  break
              bybit_errors.append(
                  f"{host}:retCode={candidate.get('retCode')!r}"
              )
          assert bybit is not None, bybit_errors
          assert bybit.get("retCode") == 0, bybit
          result = bybit.get("result", {})
          assert result.get("category") == "spot"
          assert result.get("symbol") == "BTCUSDT"
          candles = result.get("list")
          assert isinstance(candles, list) and len(candles) >= 3
          starts = [int(row[0]) for row in candles]
          assert starts == sorted(starts, reverse=True)
          assert max(starts) < int(today_start.timestamp() * 1000)
          for row in candles:
              assert len(row) >= 7
              for value in row[1:5]:
                  assert float(value) > 0
          print(
              "BYBIT_BTC_DAILY_SOURCE_QUALITY_PASS=YES",
              f"host={bybit_host}",
              f"latest_start_ms={starts[0]}",
              f"rows={len(candles)}",
          )

          print("STAGE8_CROSS_MARKET_SOURCE_QUALITY_PASS=YES")
          PY
