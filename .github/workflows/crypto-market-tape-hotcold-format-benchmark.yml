name: Crypto Market Tape HotCold Format Benchmark

on:
  push:
    branches:
      - v1.1-market-tape-hotcold-v1
    paths:
      - ".github/workflows/crypto-market-tape-hotcold-format-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark Parquet/Zstd on canonical Market Tape
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 15
    steps:
      - name: Build isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crypto-hotcold-bench /tmp/crypto-hotcold-venv
          mkdir -p /tmp/crypto-hotcold-bench
          sudo -n -H -u crypto-signal-agent /Users/crypto-signal-agent/.local/bin/uv venv             --python 3.12 /tmp/crypto-hotcold-venv
          sudo -n -H -u crypto-signal-agent /Users/crypto-signal-agent/.local/bin/uv pip install             --python /tmp/crypto-hotcold-venv/bin/python             "pyarrow>=18,<23" "zstandard>=0.23,<1"

      - name: Benchmark exact canonical data read-only
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -H -u crypto-signal-agent /usr/bin/env             OUT=/tmp/crypto-hotcold-bench             /tmp/crypto-hotcold-venv/bin/python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sqlite3
          from pathlib import Path

          import pyarrow as pa
          import pyarrow.parquet as pq
          import zstandard as zstd

          root = Path("/Volumes/Crypto-504/Crypto-Signal")
          tape = root / "Development/runtime/market_tape"
          raw_db = tape / "raw_market_tape.sqlite3"
          norm_db = tape / "market_tape.sqlite3"
          out = Path(os.environ["OUT"])
          out.mkdir(parents=True, exist_ok=True)

          def rows(db: Path, sql: str) -> list[dict[str, object]]:
              con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
              con.row_factory = sqlite3.Row
              con.execute("PRAGMA query_only=ON")
              assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              result = [dict(row) for row in con.execute(sql).fetchall()]
              con.close()
              return result

          raw = rows(
              raw_db,
              """
              SELECT event_identity, exchange, channel, symbol, event_kind,
                     source_timestamp_ms, event_at_ms, ingested_at_ms,
                     sequence, update_id, payload_json
              FROM raw_market_events
              ORDER BY event_at_ms, sequence, update_id, event_identity
              """,
          )
          books = rows(
              norm_db,
              """
              SELECT snapshot_identity, exchange, market_type, symbol,
                     event_at_ms, source_timestamp_ms, ingested_at_ms,
                     update_id, sequence, source, adapter_version, payload_json
              FROM market_tape_orderbooks
              ORDER BY event_at_ms, sequence, update_id, snapshot_identity
              """,
          )
          trades = rows(
              norm_db,
              """
              SELECT trade_identity, exchange, market_type, symbol,
                     event_at_ms, source_timestamp_ms, ingested_at_ms,
                     exec_id, sequence, aggressor_side, source,
                     adapter_version, payload_json
              FROM market_tape_trades
              ORDER BY event_at_ms, sequence, exec_id, trade_identity
              """,
          )

          def canonical_line(row: dict[str, object]) -> bytes:
              return (
                  json.dumps(row, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
                  + "\n"
              ).encode()

          def digest(source: list[dict[str, object]]) -> str:
              h = hashlib.sha256()
              for row in source:
                  h.update(canonical_line(row))
              return h.hexdigest()

          def write_jsonl_zst(name: str, source: list[dict[str, object]]) -> Path:
              path = out / f"{name}.jsonl.zst"
              compressor = zstd.ZstdCompressor(level=8, threads=-1)
              with path.open("wb") as raw_file:
                  with compressor.stream_writer(raw_file) as writer:
                      for row in source:
                          writer.write(canonical_line(row))
              return path

          def read_jsonl_zst(path: Path) -> list[dict[str, object]]:
              decompressor = zstd.ZstdDecompressor()
              with path.open("rb") as raw_file:
                  data = decompressor.stream_reader(raw_file).read()
              return [json.loads(line) for line in data.decode().splitlines()]

          def write_parquet(name: str, source: list[dict[str, object]]) -> Path:
              path = out / f"{name}.parquet"
              table = pa.Table.from_pylist(source)
              pq.write_table(
                  table,
                  path,
                  compression="zstd",
                  compression_level=8,
                  use_dictionary=True,
                  write_statistics=True,
              )
              return path

          raw_digest = digest(raw)
          book_digest = digest(books)
          trade_digest = digest(trades)

          raw_json = write_jsonl_zst("raw", raw)
          raw_parquet = write_parquet("raw", raw)
          book_parquet = write_parquet("orderbooks", books)
          trade_parquet = write_parquet("trades", trades)

          raw_json_roundtrip = read_jsonl_zst(raw_json)
          raw_parquet_roundtrip = pq.read_table(raw_parquet).to_pylist()
          book_roundtrip = pq.read_table(book_parquet).to_pylist()
          trade_roundtrip = pq.read_table(trade_parquet).to_pylist()

          assert len(raw_json_roundtrip) == len(raw)
          assert len(raw_parquet_roundtrip) == len(raw)
          assert len(book_roundtrip) == len(books)
          assert len(trade_roundtrip) == len(trades)

          assert digest(raw_json_roundtrip) == raw_digest
          assert digest(raw_parquet_roundtrip) == raw_digest
          assert digest(book_roundtrip) == book_digest
          assert digest(trade_roundtrip) == trade_digest

          raw_sqlite_bytes = raw_db.stat().st_size
          norm_sqlite_bytes = norm_db.stat().st_size
          raw_json_bytes = raw_json.stat().st_size
          raw_parquet_bytes = raw_parquet.stat().st_size
          book_parquet_bytes = book_parquet.stat().st_size
          trade_parquet_bytes = trade_parquet.stat().st_size
          cold_parquet_total = raw_parquet_bytes + book_parquet_bytes + trade_parquet_bytes

          def ratio(source: int, target: int) -> float:
              return source / target if target else 0.0

          print(f"ROWS raw={len(raw)} orderbooks={len(books)} trades={len(trades)}")
          print(f"SQLITE raw_bytes={raw_sqlite_bytes} normalized_bytes={norm_sqlite_bytes} total_bytes={raw_sqlite_bytes + norm_sqlite_bytes}")
          print(f"RAW_JSONL_ZST bytes={raw_json_bytes} ratio_vs_raw_sqlite={ratio(raw_sqlite_bytes, raw_json_bytes):.3f}")
          print(f"RAW_PARQUET_ZSTD bytes={raw_parquet_bytes} ratio_vs_raw_sqlite={ratio(raw_sqlite_bytes, raw_parquet_bytes):.3f}")
          print(f"ORDERBOOK_PARQUET_ZSTD bytes={book_parquet_bytes}")
          print(f"TRADE_PARQUET_ZSTD bytes={trade_parquet_bytes}")
          print(f"COLD_PARQUET_TOTAL bytes={cold_parquet_total} ratio_vs_sqlite_total={ratio(raw_sqlite_bytes + norm_sqlite_bytes, cold_parquet_total):.3f}")
          print(f"RAW_DIGEST={raw_digest}")
          print(f"ORDERBOOK_DIGEST={book_digest}")
          print(f"TRADE_DIGEST={trade_digest}")
          print("HOTCOLD_FORMAT_ROUNDTRIP_PASS=YES")
          print("REAL_CAPITAL=0")
          PY

      - name: Show artifacts and cleanup
        if: always()
        shell: bash
        run: |
          ls -lh /tmp/crypto-hotcold-bench || true
          rm -rf /tmp/crypto-hotcold-bench /tmp/crypto-hotcold-venv
