name: Crypto M2 Liquidation Collector Slice6A TEMP

on:
  push:
    branches: [v1.1-liquidation-collector-hotcold-v2-slice6]
    paths:
      - ".github/workflows/crypto-m2-liquidation-collector-slice6a-temp.yml"
      - "src/crypto_signal/data/adapters/bybit_liquidation_ws.py"
      - "src/crypto_signal/data/liquidation_wire_collection.py"
      - "ops/run_liquidation_market_tape_stream.py"
      - "tests/test_liquidation_wire_collection.py"
      - "docs/M2_LIQUIDATION_COLLECTOR_SLICE6A.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Slice6A focused gate
        run: |
          python -m pytest -q tests/test_liquidation_wire_collection.py tests/test_liquidation_market_tape_persistence.py tests/test_liquidation_heatmap_engine.py
          python -m ruff check src/crypto_signal/data/adapters/bybit_liquidation_ws.py src/crypto_signal/data/liquidation_wire_collection.py ops/run_liquidation_market_tape_stream.py tests/test_liquidation_wire_collection.py
          python -m mypy src/crypto_signal/data/adapters/bybit_liquidation_ws.py src/crypto_signal/data/liquidation_wire_collection.py ops/run_liquidation_market_tape_stream.py
          echo "M2_LIQUIDATION_COLLECTOR_SLICE6A_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_LIQUIDATION_COLLECTOR_SLICE6A_FULL_PASS=YES"
