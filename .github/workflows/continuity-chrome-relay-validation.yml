name: Continuity Chrome Relay Validation

on:
  push:
    branches:
      - feature/continuity-chrome-first-relay
    paths:
      - "ops/continuity/relay_daemon.py"
      - ".github/workflows/continuity-chrome-relay-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile ops/continuity/relay_daemon.py
          grep -q 'Google Chrome' ops/continuity/relay_daemon.py
          grep -q 'CHROME_TARGET_OPEN_REQUESTED' ops/continuity/relay_daemon.py
          grep -q 'STOP_CLICKED' ops/continuity/relay_daemon.py
          echo "CONTINUITY_CHROME_RELAY_VALIDATION_PASS=YES"
