name: Crypto Stream Final F4 Risk Trust UID504

on:
  push:
    branches:
      - 'stream/final-f4-risk-system-trust'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f4-risk-trust
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2

      - name: Focused F4 risk and system trust gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          "$PY" -m pytest -q             tests/test_intelligence_stream_trust_sources.py             tests/test_intelligence_stream_family.py             tests/test_wc2_live_clock_wiring.py             tests/test_wc2_ssd_supervisor_single_owner.py
          "$PY" -m ruff check             src/crypto_signal/product/intelligence_stream_family.py             src/crypto_signal/product/intelligence_stream_trust_sources.py             src/crypto_signal/product/intelligence_stream_policy.py             ops/run_live_evidence_clock.py             tests/test_intelligence_stream_trust_sources.py
          "$PY" -m mypy             src/crypto_signal/product/intelligence_stream_family.py             src/crypto_signal/product/intelligence_stream_trust_sources.py             src/crypto_signal/product/intelligence_stream_production_projector.py             ops/run_live_evidence_clock.py
          echo "F4_FOCUSED_GATE_PASS=YES"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"

      - name: Broad repository regression
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          "$PY" -m pytest -q -m "not asyncio"
          "$PY" -m ruff check src tests ops
          "$PY" -m mypy src
          echo "F4_BROAD_REGRESSION_PASS=YES"
          echo "REAL_CAPITAL=0"
