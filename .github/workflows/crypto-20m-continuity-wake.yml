name: Crypto 20m Continuity Wake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-20m-continuity-wake
  cancel-in-progress: false

jobs:
  wake:
    name: UID504 observed-delivery continuity fallback
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shared observed-delivery cadence and wake only when due
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 "$GITHUB_WORKSPACE/ops/continuity/recurring_wake.py"
          echo "GITHUB_5M_DUE_CHECK_PASS=YES"
