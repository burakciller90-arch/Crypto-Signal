name: Crypto R13 Full Version Integrated Acceptance v2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  acceptance:
    if: github.actor == 'burakciller90-arch' && github.event.issue.title == '[R13] FULL VERSION INTEGRATED ACCEPTANCE V2'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Sync canonical Development for R13
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          test "$(id -u)" = "504"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$DEV" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          test "$(git -C "$DEV" rev-parse origin/main)" = "${{ github.sha }}"
          git -C "$DEV" merge --ff-only "${{ github.sha }}"
          test "$(git -C "$DEV" rev-parse HEAD)" = "${{ github.sha }}"
          PRODUCT_HEAD="$(git -C "$PRODUCT" rev-parse HEAD)"
          git -C "$DEV" diff --quiet "$PRODUCT_HEAD" "${{ github.sha }}" --             src/crypto_signal/product ops/run_dashboard.py
          echo "R13_DEVELOPMENT_SYNC_PASS=YES"
          echo "R13_PRODUCT_CODE_PARITY_PASS=YES product_head=$PRODUCT_HEAD"

      - name: Full repository gate
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          cd "$DEV"
          ./.venv/bin/python -m pytest -q
          ./.venv/bin/python -m ruff check src tests ops/verify_stage10_integrated.py ops/r13_integrated_acceptance.py
          ./.venv/bin/python -m mypy src ops/verify_stage10_integrated.py ops/r13_integrated_acceptance.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R13_FULL_REPOSITORY_GATE_PASS=YES"

      - name: Targeted science paper product continuity matrix
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          cd "$DEV"
          ./.venv/bin/python -m pytest -q             tests/test_alpha_factory_ml_walk_forward.py             tests/test_alpha_factory_ml_cost_stress.py             tests/test_alpha_factory_ml_family_cost_stress.py             tests/test_alpha_factory_ml_family_robustness_ablation.py             tests/test_alpha_factory_ml_family_untouched_forward.py             tests/test_alpha_factory_learning_memory.py             tests/test_meta_intelligence.py             tests/test_paper_venue_rules.py             tests/test_paper_performance.py             tests/test_paper_benchmarks.py             tests/test_paper_write_authority.py             tests/test_dashboard_web.py             tests/test_intelligence_center.py             tests/test_runtime_recovery.py             tests/test_continuity_contracts.py             tests/test_continuity_hardening.py             tests/test_r13_integrated_acceptance.py
          echo "R13_TARGETED_MATRIX_PASS=YES"

      - name: Read-only endurance and stale-data semantics
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PYTHONPATH="$DEV/src" "$DEV/.venv/bin/python"             "$DEV/ops/verify_stage10_integrated.py"             --paper-ledger "$DEV/runtime/paper/paper_fund.sqlite3"             --cycles 12             --pause-seconds 0.25
          node "$DEV/tests/js/test_product_freshness.js"
          echo "R13_ENDURANCE_FRESHNESS_PASS=YES"

      - name: Live integrated runtime verifier
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PYTHONPATH="$DEV/src" "$DEV/.venv/bin/python"             "$DEV/ops/r13_integrated_acceptance.py"             --root "/Volumes/Crypto-504/Crypto-Signal"
          echo "R13_LIVE_RUNTIME_PASS=YES"

      - name: Human-impact boundary and final acceptance
        shell: bash
        run: |
          set -euo pipefail
          STATE="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/continuity"
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          test -f "$STATE/user_pause"
          test -f "$SHARED/user_pause"
          test "$(find "$STATE/leases/active" -maxdepth 1 -type f -name '*.lease' 2>/dev/null | wc -l | tr -d ' ')" = "0"
          test "$(find "$STATE/wake/queue" -maxdepth 1 -type f -name '*.wake' 2>/dev/null | wc -l | tr -d ' ')" = "0"
          test "$(find "$SHARED/queue" -maxdepth 1 -type f -name '*.wake' 2>/dev/null | wc -l | tr -d ' ')" = "0"
          echo "R13_HUMAN_IMPACT_ITEMS_DEFERRED=YES reboot=UNTESTED logout=UNTESTED ssd_detach=UNTESTED"
          echo "R13_CONTINUITY_PAUSE_PRESERVED=YES"
          echo "R13_FULL_VERSION_INTEGRATED_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
