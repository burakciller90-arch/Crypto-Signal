name: Crypto R25 Decision Evidence Product Bridge Hosted

on:
  push:
    branches:
      - v1.1-r25-decision-evidence-product-bridge-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r25-decision-evidence-product-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"

      - name: Focused immutable persistence and product bridge acceptance
        run: |
          python -m pytest -q             tests/test_decision_ledger.py             tests/test_decision_product_bridge.py             tests/test_immutable_forecast_stream.py             tests/test_decision_proof_live_feed.py             tests/test_galactech_markets.py             tests/test_galactech_command_evidence.py             tests/test_galactech_learn_system.py             tests/test_dashboard_web.py
          python -m ruff check             src/crypto_signal/decision_ledger.py             src/crypto_signal/product/web.py             ops/run_dashboard.py             tests/test_decision_ledger.py             tests/test_decision_product_bridge.py             tests/test_galactech_markets.py             tests/test_galactech_learn_system.py             tests/test_dashboard_web.py
          python -m mypy             src/crypto_signal/decision_ledger.py             src/crypto_signal/product/web.py             ops/run_dashboard.py
          node --check src/crypto_signal/product/galactech/app.js
          echo "R25_DECISION_EVIDENCE_PRODUCT_BRIDGE_FOCUSED_PASS=YES"

      - name: Complete repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "R25_DECISION_EVIDENCE_PRODUCT_BRIDGE_FULL_PASS=YES"
          echo "R25_REAL_CAPITAL_ZERO_PASS=YES"
