name: Crypto Market Tape SSD Pilot

on:
  push:
    branches:
      - v1.1-liquidity-dynamics-v1
    paths:
      - ".github/workflows/crypto-market-tape-ssd-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    name: Bounded Market Tape SSD pilot
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Prepare accepted stream source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crypto-market-tape-pilot
          mkdir -p /tmp/crypto-market-tape-pilot
          cp -R src ops /tmp/crypto-market-tape-pilot/
          chmod -R a+rX /tmp/crypto-market-tape-pilot

      - name: Collect bounded canonical SSD pilot as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          test "$(sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          sudo -n -H -u crypto-signal-agent /usr/bin/env \
            PYTHONPATH=/tmp/crypto-market-tape-pilot/src \
            /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python \
            /tmp/crypto-market-tape-pilot/ops/run_market_tape_stream.py \
            --max-events 500 \
            --depth 50 \
            --orderbook-snapshot-interval-ms 1000

      - name: Verify canonical Market Tape stores
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DIR="$ROOT/Development/runtime/market_tape"
          DB="$DIR/market_tape.sqlite3"
          RAW="$DIR/raw_market_tape.sqlite3"

          echo "=== FILES ==="
          ls -lah "$DIR"
          test -s "$DB"
          test -s "$RAW"

          echo "=== QUICK CHECK ==="
          test "$(sqlite3 "$DB" 'PRAGMA quick_check;')" = "ok"
          test "$(sqlite3 "$RAW" 'PRAGMA quick_check;')" = "ok"
          echo "NORMALIZED_QUICK_CHECK=ok"
          echo "RAW_QUICK_CHECK=ok"

          echo "=== COUNTS ==="
          orderbooks="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM market_tape_orderbooks;')"
          trades="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM market_tape_trades;')"
          raw="$(sqlite3 "$RAW" 'SELECT COUNT(*) FROM raw_market_events;')"
          echo "ORDERBOOK_ROWS=$orderbooks"
          echo "TRADE_ROWS=$trades"
          echo "RAW_ROWS=$raw"
          test "$orderbooks" -gt 0
          test "$trades" -gt 0
          test "$raw" -gt 0

          for symbol in BTCUSDT ETHUSDT SOLUSDT; do
            n="$(sqlite3 "$DB" "SELECT COUNT(*) FROM market_tape_orderbooks WHERE exchange='bybit' AND market_type='spot' AND symbol='$symbol';")"
            echo "ORDERBOOK_ROWS_${symbol}=$n"
            test "$n" -gt 0
          done

          echo "MARKET_TAPE_SSD_BOUNDED_PILOT_PASS=YES"
          echo "REAL_CAPITAL=0"
          SH

      - name: Cleanup temp source
        if: always()
        shell: bash
        run: rm -rf /tmp/crypto-market-tape-pilot
