name: Crypto R25 Shadow Intent Journal Hosted

on:
  push:
    branches:
      - v1.1-r25-shadow-intent-journal-slice9-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r25-shadow-intent-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused shadow journal acceptance
        run: |
          python -m pytest -q             tests/test_shadow_intent_journal.py             tests/test_r22_intent_preview.py             tests/test_transaction_tape.py             tests/test_position_sizing_bridge.py
          python -m ruff check             src/crypto_signal/paper/shadow_intent_journal.py             src/crypto_signal/paper/r22_intent_preview.py             tests/test_shadow_intent_journal.py
          python -m mypy             src/crypto_signal/paper/shadow_intent_journal.py             src/crypto_signal/paper/r22_intent_preview.py
          echo "R25_SHADOW_INTENT_JOURNAL_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "R25_SHADOW_INTENT_JOURNAL_FULL_PASS=YES"
          echo "R25_REAL_CAPITAL_ZERO_PASS=YES"
