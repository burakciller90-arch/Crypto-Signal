name: Crypto v1.1 Paper Epoch2 Gate

on:
  push:
    branches:
      - v1.1-paper-fund-epoch2-v1

permissions:
  contents: read

jobs:
  test:
    name: Hosted Epoch2 full gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"
      - name: Focused Epoch boundary
        run: |
          python -m pytest -q tests/test_paper_fund.py tests/test_paper_fund_epochs.py
          python -m ruff check src/crypto_signal/paper/epochs.py tests/test_paper_fund_epochs.py
          python -m mypy src/crypto_signal/paper/epochs.py
          echo "PAPER_EPOCH2_FOCUSED_GATE_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "PAPER_EPOCH2_FULL_GATE_PASS=YES"
