name: Crypto GALACTECH Capital Center Hosted Acceptance

on:
  push:
    branches:
      - v1.1-product-galactech-capital-center-slice3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galactech-capital:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Capital Center focused acceptance
        run: |
          python -m pytest             tests/test_epoch2_read_only_product.py             tests/test_galactech_capital_center.py             tests/test_galactech_command_evidence.py             tests/test_galactech_foundation.py             tests/test_dashboard_web.py -q
          python -m ruff check             src/crypto_signal/paper/epoch2_accounting.py             src/crypto_signal/product/web.py             tests/test_epoch2_read_only_product.py             tests/test_galactech_capital_center.py
          python -m mypy             src/crypto_signal/paper/epoch2_accounting.py             src/crypto_signal/product/web.py
          node --check src/crypto_signal/product/galactech/app.js
          grep -q "canonical Epoch2" src/crypto_signal/product/galactech/app.js
          grep -q "REAL_CAPITAL=0" src/crypto_signal/product/galactech/index.html
      - name: Complete repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "GALACTECH_CAPITAL_CENTER_HOSTED_FULL_PASS=YES"
