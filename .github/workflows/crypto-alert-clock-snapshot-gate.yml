name: Crypto Alert Clock Snapshot Gate

on:
  push:
    branches:
      - 'runtime/alert-clock-snapshot-consistency'

permissions:
  contents: read

jobs:
  test:
    name: Alert clock snapshot consistency gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused alert clock gate
        run: |
          python -m pytest -q tests/test_alert_clock.py
          python -m ruff check src/crypto_signal/alerts/clock.py tests/test_alert_clock.py
          python -m mypy src/crypto_signal/alerts/clock.py
          echo "ALERT_CLOCK_SNAPSHOT_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "ALERT_CLOCK_SNAPSHOT_FULL_PASS=YES"
