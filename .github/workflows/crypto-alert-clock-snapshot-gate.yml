name: Crypto Alert Clock Snapshot Gate

on:
  push:
    branches:
      - 'runtime/alert-clock-snapshot-consistency'

permissions:
  contents: read

jobs:
  test:
    name: Alert clock snapshot consistency gate
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
      - name: Verify exact source and immutable production checkouts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -x "$DEV/.venv/bin/python"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          {
            echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)"
            echo "PRODUCT_HEAD_BEFORE=$(git -C "$PRODUCT" rev-parse HEAD)"
          } > "$RUNNER_TEMP/alert-clock-snapshot-prestate"
          echo "ALERT_CLOCK_SNAPSHOT_EXACT_SOURCE_PASS=YES"
          echo "REAL_CAPITAL=0"
      - name: Focused alert clock gate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          "$PY" -m pytest -q tests/test_alert_clock.py
          "$PY" -m ruff check src/crypto_signal/alerts/clock.py tests/test_alert_clock.py
          "$PY" -m mypy src/crypto_signal/alerts/clock.py
          echo "ALERT_CLOCK_SNAPSHOT_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"
      - name: Whole-repository regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          "$PY" -m pytest -q
          "$PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "ALERT_CLOCK_SNAPSHOT_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"
      - name: Prove production checkouts remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          DEV_BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/alert-clock-snapshot-prestate")"
          PRODUCT_BEFORE="$(sed -n 's/^PRODUCT_HEAD_BEFORE=//p' "$RUNNER_TEMP/alert-clock-snapshot-prestate")"
          test "$DEV_BEFORE" = "$(git -C "$DEV" rev-parse HEAD)"
          test "$PRODUCT_BEFORE" = "$(git -C "$PRODUCT" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "ALERT_CLOCK_SNAPSHOT_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
