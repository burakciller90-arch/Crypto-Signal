name: Crypto Observed Rolling Wake TEMP

on:
  push:
    branches: [fix/continuity-observed-receipt-watchdog-v2]
    paths:
      - ".github/workflows/crypto-observed-rolling-wake-temp.yml"
      - ".github/workflows/crypto-20m-continuity-wake.yml"
      - ".github/workflows/crypto-mac-command.yml"
      - "ops/continuity/interval_wake_daemon.py"
      - "ops/continuity/relay_daemon.py"
      - "ops/continuity/relay_submit.py"
      - "tests/test_continuity_hardening.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused continuity gate
        run: |
          python -m py_compile ops/continuity/interval_wake_daemon.py ops/continuity/relay_daemon.py ops/continuity/relay_submit.py
          python -m pytest -q tests/test_continuity_hardening.py tests/test_continuity_contracts.py
          python -m ruff check ops/continuity/interval_wake_daemon.py ops/continuity/relay_daemon.py ops/continuity/relay_submit.py tests/test_continuity_hardening.py
          python -m mypy ops/continuity/interval_wake_daemon.py ops/continuity/relay_daemon.py ops/continuity/relay_submit.py
          grep -F "rollingstate" .github/workflows/crypto-mac-command.yml
          echo "OBSERVED_ROLLING_WAKE_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "OBSERVED_ROLLING_WAKE_FULL_PASS=YES"
