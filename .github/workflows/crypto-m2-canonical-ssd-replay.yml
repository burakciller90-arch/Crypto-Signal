name: Crypto M2 Canonical SSD Replay Acceptance

on:
  push:
    branches:
      - v1.1-liquidity-dynamics-v1
    paths:
      - ".github/workflows/crypto-m2-canonical-ssd-replay.yml"

permissions:
  contents: read

jobs:
  replay:
    name: M2 canonical SSD persisted replay
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare branch source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crypto-m2-canonical-replay
          mkdir -p /tmp/crypto-m2-canonical-replay
          cp -R src /tmp/crypto-m2-canonical-replay/
          chmod -R a+rX /tmp/crypto-m2-canonical-replay

      - name: Replay persisted Market Tape read-only as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          sudo -n -H -u crypto-signal-agent /usr/bin/env \
            PYTHONPATH=/tmp/crypto-m2-canonical-replay/src \
            /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python - <<'PY'
          import sqlite3
          from pathlib import Path

          from crypto_signal.data.market_tape import _orderbook_from_payload
          from crypto_signal.intelligence.liquidity_dynamics import (
              LiquidityDynamicsConfig,
              LiquidityDynamicsStatus,
              build_liquidity_dynamics_evidence_freeze,
          )

          db = Path(
              "/Volumes/Crypto-504/Crypto-Signal/Development/runtime/"
              "market_tape/market_tape.sqlite3"
          )
          connection = sqlite3.connect(f"file:{db}?mode=ro", uri=True, timeout=5.0)
          connection.execute("PRAGMA query_only=ON")
          assert connection.execute("PRAGMA query_only").fetchone()[0] == 1
          assert connection.execute("PRAGMA quick_check").fetchone()[0] == "ok"

          for symbol in ("BTCUSDT", "ETHUSDT", "SOLUSDT"):
              rows = connection.execute(
                  """
                  SELECT payload_json
                  FROM market_tape_orderbooks
                  WHERE exchange='bybit'
                    AND market_type='spot'
                    AND symbol=?
                  ORDER BY event_at_ms ASC, rowid ASC
                  """,
                  (symbol,),
              ).fetchall()
              books = tuple(_orderbook_from_payload(str(row[0])) for row in rows)
              print(f"M2_SSD_BOOKS symbol={symbol} count={len(books)}")
              assert len(books) >= 3
              as_of_ms = max(
                  max(
                      item.event_at_ms,
                      item.source_timestamp_ms,
                      item.response_time_ms,
                      item.ingested_at_ms,
                  )
                  for item in books
              )
              freeze = build_liquidity_dynamics_evidence_freeze(
                  books,
                  as_of_ms=as_of_ms,
                  config=LiquidityDynamicsConfig(
                      depth_levels=10,
                      lookback_ms=300_000,
                      minimum_snapshots=3,
                      max_snapshot_age_ms=30_000,
                      max_snapshot_gap_ms=120_000,
                  ),
              )
              a = freeze.analysis
              print(
                  "M2_SSD_REPLAY "
                  f"symbol={symbol} status={a.status.value} "
                  f"quality={a.source_quality.value} "
                  f"snapshots={a.consumed_snapshot_count} "
                  f"age_ms={a.latest_snapshot_age_ms} "
                  f"flags={','.join(a.uncertainty_flags) or '-'} "
                  f"evidence={a.evidence_identity} "
                  f"freeze={freeze.freeze_identity}"
              )
              assert a.status is LiquidityDynamicsStatus.MEASURED
              assert a.metrics is not None

          connection.close()
          print("M2_CANONICAL_SSD_REPLAY_PASS=YES")
          print("REAL_CAPITAL=0")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/crypto-m2-canonical-replay
