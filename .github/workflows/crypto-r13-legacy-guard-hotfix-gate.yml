name: Crypto R13 Legacy Guard Hotfix Gate

on:
  push:
    branches:
      - fix/r13-legacy-runtime-payload-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full R13 hotfix gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py ops/r13_integrated_acceptance.py
          python -m mypy src ops/verify_stage10_integrated.py ops/r13_integrated_acceptance.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R13_LEGACY_GUARD_HOTFIX_GATE_PASS=YES"
