name: Crypto Stream Final F3 Live Wiring UID504

on:
  push:
    branches:
      - 'stream/final-f3-live-intelligence'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f3-live-wiring
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Focused F3 runtime regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          "$PY" -m pytest -q             tests/test_intelligence_stream_family.py             tests/test_wc2_live_clock_wiring.py             tests/test_wc2_ssd_supervisor_single_owner.py             tests/test_wc1_ssd_supervisor_market_tape_single_owner.py
          "$PY" -m ruff check             src/crypto_signal/product/intelligence_stream_family.py             src/crypto_signal/product/intelligence_stream_family_sources.py             src/crypto_signal/product/intelligence_stream_policy.py             src/crypto_signal/product/intelligence_stream_production_projector.py             src/crypto_signal/product/intelligence_stream_read_model.py             ops/run_live_evidence_clock.py             tests/test_intelligence_stream_family.py             tests/test_wc2_live_clock_wiring.py             tests/test_wc2_ssd_supervisor_single_owner.py
          "$PY" -m mypy             src/crypto_signal/product/intelligence_stream_family.py             src/crypto_signal/product/intelligence_stream_family_sources.py             src/crypto_signal/product/intelligence_stream_production_projector.py
          bash -n ops/ssd_runtime_supervisor.sh
          echo "F3_FOCUSED_RUNTIME_GATE_PASS=YES"

      - name: Exact persisted-source dry run
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src"
          SOURCE_ROOT="/Volumes/Crypto-504/Crypto-Signal/Development/runtime"
          SIGNAL="$SOURCE_ROOT/ledger/live_signal_ledger.sqlite3"
          MARKET="$SOURCE_ROOT/market_tape/market_tape.sqlite3"
          STREAM="$SOURCE_ROOT/stream/intelligence_stream.sqlite3"
          for required in "$SIGNAL" "$MARKET" "$STREAM"; do
            test -f "$required"
          done
          TMP="$RUNNER_TEMP/f3-live-wiring-$GITHUB_RUN_ID"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          "$PY" - "$MARKET" "$TMP" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          from crypto_signal.data.market_tape import MarketTapeStore

          market = Path(sys.argv[1])
          root = Path(sys.argv[2])
          target_market = root / "market.sqlite3"
          MarketTapeStore(target_market).initialize()
          source = sqlite3.connect(
              f"file:{market.resolve()}?mode=ro",
              uri=True,
          )
          source.row_factory = sqlite3.Row
          target = sqlite3.connect(target_market)
          try:
              source.execute("PRAGMA query_only=ON")
              for table, limit_per_symbol in (
                  ("market_tape_orderbooks", 180),
                  ("market_tape_trades", 1200),
                  ("market_tape_derivatives", 64),
              ):
                  columns = [
                      row[1]
                      for row in target.execute(
                          f"PRAGMA table_info({table})"
                      ).fetchall()
                  ]
                  placeholders = ",".join("?" for _ in columns)
                  column_sql = ",".join(columns)
                  for symbol in ("BTCUSDT", "ETHUSDT", "SOLUSDT"):
                      if table == "market_tape_derivatives":
                          rows = source.execute(
                              f"""
                              SELECT {column_sql}
                              FROM {table}
                              WHERE exchange='bybit'
                                AND instrument_type='linear_perpetual'
                                AND symbol=?
                              ORDER BY event_at_ms DESC, rowid DESC
                              LIMIT ?
                              """,
                              (symbol, limit_per_symbol),
                          ).fetchall()
                      else:
                          rows = source.execute(
                              f"""
                              SELECT {column_sql}
                              FROM {table}
                              WHERE exchange='bybit'
                                AND market_type='spot'
                                AND symbol=?
                              ORDER BY event_at_ms DESC, rowid DESC
                              LIMIT ?
                              """,
                              (symbol, limit_per_symbol),
                          ).fetchall()
                      target.executemany(
                          f"INSERT OR IGNORE INTO {table} ({column_sql}) "
                          f"VALUES ({placeholders})",
                          [
                              tuple(row[column] for column in columns)
                              for row in rows
                          ],
                      )
              target.commit()
          finally:
              target.close()
              source.close()
          PY

          echo "F3_PERSISTED_SOURCE_ONLY_DRY_RUN=YES"

          "$PY" - "$SIGNAL" "$TMP" <<'PY'
          import sqlite3
          import time
          from pathlib import Path
          import sys

          from crypto_signal.ledger.store import ImmutableSignalLedger
          from crypto_signal.product.intelligence_stream_family import (
              StreamFamilyProjectionDisposition,
          )
          from crypto_signal.product.intelligence_stream_family_sources import (
              build_geometry_family_snapshot,
              build_market_tape_family_snapshots,
          )
          from crypto_signal.product.intelligence_stream_forward_runtime import (
              IntelligenceStreamForwardRuntime,
          )
          from crypto_signal.product.intelligence_stream_production_projector import (
              IntelligenceStreamProductionProjector,
          )

          source_signal = Path(sys.argv[1])
          root = Path(sys.argv[2])
          market = root / "market.sqlite3"
          stream = root / "stream.sqlite3"

          uri = f"file:{source_signal.resolve()}?mode=ro"
          with sqlite3.connect(uri, uri=True) as connection:
              connection.execute("PRAGMA query_only=ON")
              row = connection.execute(
                  """
                  SELECT signal_freeze_identity
                  FROM signal_freezes
                  ORDER BY frozen_at_ms DESC, bundle_identity DESC
                  LIMIT 1
                  """
              ).fetchone()
          if row is None:
              raise SystemExit("F3_EXACT_GEOMETRY_SOURCE_MISSING")
          freeze = ImmutableSignalLedger(source_signal).read_freeze_by_signal(
              str(row[0])
          )
          if freeze is None:
              raise SystemExit("F3_EXACT_GEOMETRY_SOURCE_LOST")
          geometry = build_geometry_family_snapshot(freeze)

          IntelligenceStreamForwardRuntime(stream).ensure_activated(
              activated_at_ms=geometry.event_at_ms,
          )
          projector = IntelligenceStreamProductionProjector(stream)
          geometry_result = projector.project_family(
              geometry,
              activated_at_ms=geometry.event_at_ms,
          )
          if geometry_result.disposition not in {
              StreamFamilyProjectionDisposition.INSERTED,
              StreamFamilyProjectionDisposition.UNCHANGED,
          }:
              raise SystemExit(
                  f"F3_GEOMETRY_DRY_RUN_BAD={geometry_result.disposition.value}"
              )

          now_ms = time.time_ns() // 1_000_000
          snapshots = build_market_tape_family_snapshots(
              market,
              symbols=("BTCUSDT", "ETHUSDT", "SOLUSDT"),
              as_of_ms=now_ms,
          )
          projectors = {item.projector_id for item in snapshots}
          required_now = {
              "liquidity_change",
              "order_flow_change",
          }
          missing_now = required_now - projectors
          if missing_now:
              raise SystemExit(
                  "F3_LIVE_FAMILY_SOURCE_MISSING="
                  + ",".join(sorted(missing_now))
              )
          derivatives_present = "derivatives_change" in projectors
          results = [
              projector.project_family(item, activated_at_ms=now_ms)
              for item in snapshots
          ]
          if not results:
              raise SystemExit("F3_FAMILY_DRY_RUN_EMPTY")
          if any(result.real_capital != 0 for result in results):
              raise SystemExit("F3_REAL_CAPITAL_VIOLATION")
          print(
              "F3_EXACT_SOURCE_DRY_RUN_PASS=YES "
              f"geometry={geometry_result.disposition.value} "
              f"market_family_snapshots={len(snapshots)} "
              f"projectors={','.join(sorted(projectors))} "
              "DERIVATIVES_PREMERGE_SOURCE="
              f"{'PRESENT' if derivatives_present else 'PENDING_RUNTIME_ACTIVATION'} "
              "ONCHAIN_STANDALONE=DEFERRED_SOURCE "
              "HISTORICAL_BACKFILL=NO REAL_CAPITAL=0"
          )
          PY
