name: Crypto R15 Orphan Detector Diagnostic V3

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-orphan-detector-diagnostic-v3.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose current orphan and runner service
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: UID504 process state
        shell: bash
        run: |
          set +e
          echo "=== UID504 ID ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/id
          echo "=== ORPHAN SERVICE ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -p 65425 -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
          echo "=== ORPHAN SERVICE CWD ==="
          sudo -n -H -u crypto-signal-agent /usr/sbin/lsof -a -p 65425 -d cwd -Fn
          echo "=== ORPHAN WRAPPER ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -p 65421 -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
          echo "=== ORPHAN WRAPPER CWD ==="
          sudo -n -H -u crypto-signal-agent /usr/sbin/lsof -a -p 65421 -d cwd -Fn
          echo "=== UID504 RUNNER PROCESSES ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E 'crypto-signal-agent.*(RunnerService\.js|Runner\.Listener|Runner\.Worker|[.]\/runsvc\.sh)' || true

      - name: R15 service and logs
        shell: bash
        run: |
          set +e
          echo "=== R15 RUNNER SERVICE ==="
          sudo -n -H -u crypto-signal-agent /bin/launchctl print gui/504/com.cryptosignal.r15-runner-service 2>&1 | /usr/bin/head -180
          echo "=== WATCHDOG ERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -220 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" 2>&1
          echo "=== WATCHDOG LOG ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log" 2>&1
          echo "=== R15 SERVICE STDERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -160 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/runner-service-launchagent.err.log" 2>&1
          echo "=== RUNNER STDERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -160 "/Volumes/Crypto-504/Crypto-Signal/RunnerLogs/r15-runner-service.err.log" 2>&1
          echo "R15_ORPHAN_DETECTOR_DIAGNOSTIC_V3_DONE=YES"
