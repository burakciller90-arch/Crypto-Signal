name: RDP1 Direct Candle Cache UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/store.py"
      - "src/crypto_signal/ledger/live_coverage.py"
      - "tests/test_rdp1_direct_candle_cache.py"
      - ".github/workflows/crypto-rdp1-direct-candle-cache-uid504.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1
      - name: Verify exact PR source
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP1_DIRECT_CACHE_EXACT_SOURCE_PASS=YES"
      - name: Focused tests and static checks
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q             tests/test_rdp1_direct_candle_cache.py             tests/test_candle_store.py             tests/test_live_freeze_clock.py             tests/test_higher_timeframe_live_history.py
          "$PY" -m ruff check             src/crypto_signal/data/store.py             src/crypto_signal/ledger/live_coverage.py             tests/test_rdp1_direct_candle_cache.py
          "$PY" -m mypy             src/crypto_signal/data/store.py             src/crypto_signal/ledger/live_coverage.py             tests/test_rdp1_direct_candle_cache.py
          echo "RDP1_DIRECT_CANDLE_CACHE_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"
