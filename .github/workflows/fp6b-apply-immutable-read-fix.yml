name: FP6-B apply bounded immutable-read repair

on:
  push:
    branches: [fp6b/trade-passport-frozen-proof]
    paths:
      - ".github/workflows/fp6b-apply-immutable-read-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fp6b/trade-passport-frozen-proof
          fetch-depth: 0

      - name: Apply exact bounded repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_method_uri(path: str, method_name: str) -> None:
              target = Path(path)
              text = target.read_text()
              marker = f"    def {method_name}("
              start = text.index(marker)
              end = text.find("\n    def ", start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              old = '?mode=ro'
              new = '?mode=ro&immutable=1'
              if block.count(old) != 1:
                  raise SystemExit(f"expected exactly one {old!r} in {method_name}, found {block.count(old)}")
              target.write_text(text[:start] + block.replace(old, new, 1) + text[end:])

          def replace_function_uri(path: str, function_name: str) -> None:
              target = Path(path)
              text = target.read_text()
              marker = f"\ndef {function_name}("
              start = text.index(marker)
              end = text.find("\ndef ", start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              old = '?mode=ro'
              new = '?mode=ro&immutable=1'
              if block.count(old) != 1:
                  raise SystemExit(f"expected exactly one {old!r} in {function_name}, found {block.count(old)}")
              target.write_text(text[:start] + block.replace(old, new, 1) + text[end:])

          replace_method_uri(
              "src/crypto_signal/ledger/store.py",
              "read_freeze_by_signal",
          )
          replace_function_uri(
              "src/crypto_signal/product/intelligence_stream_exact_evidence.py",
              "_resolve_signal_objects",
          )

          workflow = Path(".github/workflows/fp6b-trade-passport-frozen-proof-uid504.yml")
          workflow_text = workflow.read_text()
          anchor = '      - "src/crypto_signal/product/trade_passport_frozen_proof.py"\n'
          additions = (
              '      - "src/crypto_signal/ledger/store.py"\n'
              '      - "src/crypto_signal/product/intelligence_stream_exact_evidence.py"\n'
          )
          if '      - "src/crypto_signal/ledger/store.py"\n' not in workflow_text:
              if anchor not in workflow_text:
                  raise SystemExit("FP6-B workflow source-path anchor missing")
              workflow_text = workflow_text.replace(anchor, anchor + additions, 1)
              workflow.write_text(workflow_text)
          PY

          rm .github/workflows/fp6b-apply-immutable-read-fix.yml

          git diff --check
          git diff -- src/crypto_signal/ledger/store.py \
            src/crypto_signal/product/intelligence_stream_exact_evidence.py \
            .github/workflows/fp6b-trade-passport-frozen-proof-uid504.yml

          git config user.name "crypto-signal-agent"
          git config user.email "crypto-signal-agent@users.noreply.github.com"
          git add src/crypto_signal/ledger/store.py \
            src/crypto_signal/product/intelligence_stream_exact_evidence.py \
            .github/workflows/fp6b-trade-passport-frozen-proof-uid504.yml \
            .github/workflows/fp6b-apply-immutable-read-fix.yml
          git commit -m "fix: make FP6-B frozen signal reads SQLite-immutable"
          git push origin HEAD:fp6b/trade-passport-frozen-proof
