name: Crypto Stream S7 Shell UID504

on:
  push:
    branches:
      - 'stream/s7-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-s7-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-s7-shell:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-s7-shell-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-s7-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "STREAM_S7_EXACT_SOURCE_PASS=YES"

      - name: Focused Stream S7 shell acceptance
        run: |
          "$TEST_PY" -m pytest -q             tests/test_intelligence_stream_ui.py             tests/test_intelligence_stream_read_model.py             tests/test_wc0_runtime_wiring.py             tests/test_dashboard_web.py
          "$TEST_PY" -m ruff check             src/crypto_signal/product/web.py             ops/run_dashboard.py             tests/test_intelligence_stream_ui.py             tests/test_wc0_runtime_wiring.py
          "$TEST_PY" -m mypy src/crypto_signal/product/web.py ops/run_dashboard.py
          node --check src/crypto_signal/product/stream/app.js
          echo "STREAM_S7_SHELL_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        run: |
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node --check src/crypto_signal/product/stream/app.js
          node tests/js/test_product_freshness.js
          echo "STREAM_S7_SHELL_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Render exact-head Stream fixtures with accepted Chromium path
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PORT=48706
          BASE_URL="http://127.0.0.1:$PORT"
          OUT="$RUNNER_TEMP/stream-s7-visual-snapshot"
          mkdir -p "$OUT"

          cleanup() {
            if [ -n "${PREVIEW_PID:-}" ]; then
              kill "$PREVIEW_PID" >/dev/null 2>&1 || true
            fi
            pkill -TERM -f -- '--headless=new' 2>/dev/null || true
            sleep 1
            pkill -KILL -f -- '--headless=new' 2>/dev/null || true
          }
          trap cleanup EXIT

          (
            unset RUNNER_TRACKING_ID
            export PYTHONPATH="$GITHUB_WORKSPACE/src"
            cd "$GITHUB_WORKSPACE"
            exec /usr/bin/nice -n 15 "$TEST_PY" "$GITHUB_WORKSPACE/ops/run_dashboard.py"               --host 127.0.0.1               --port "$PORT"               --ledger "$DEV/runtime/ledger/live_signal_ledger.sqlite3"               --alert-outbox "$DEV/runtime/alerts/alert_outbox.sqlite3"               --paper-ledger "$DEV/runtime/paper/paper_fund.sqlite3"               --candle-cache "$DEV/runtime/data/live_base_15m_cache.sqlite3"               --stream-ledger "$DEV/runtime/stream/intelligence_stream.sqlite3"
          ) >"$OUT/preview.out.log" 2>"$OUT/preview.err.log" < /dev/null &
          PREVIEW_PID="$!"

          ready=0
          for i in {1..30}; do
            if curl -fsS --max-time 3 "$BASE_URL/api/health" > "$OUT/health.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            tail -120 "$OUT/preview.err.log" || true
            exit 70
          fi

          curl -fsS "$BASE_URL/stream-preview?fixture=mixed" > "$OUT/stream-preview.html"
          grep -F 'data-ui-version="crypto-signal-stream-v1-s7"' "$OUT/stream-preview.html" >/dev/null
          grep -F 'GÖRSEL TEST FIXTURE' "$OUT/stream-preview.html" >/dev/null

          {
            echo "URL=$BASE_URL/stream-preview"
            echo "CAPTURED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "SOURCE_HEAD=$GITHUB_SHA"
            echo "VISUAL_SNAPSHOT_REUSE_CONTRACT=UID504_CHROMIUM_HEADLESS_NEW"
            echo "REAL_CAPITAL=0"
            echo "READ_ONLY_CAPTURE=YES"
          } > "$OUT/metadata.txt"

          BROWSER=""
          for candidate in             "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"             "/Applications/Chromium.app/Contents/MacOS/Chromium"             "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"             "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary"; do
            if [ -x "$candidate" ]; then
              BROWSER="$candidate"
              break
            fi
          done
          test -n "$BROWSER"
          echo "BROWSER_CAPTURE_BACKEND=HEADLESS_CHROMIUM" >> "$OUT/metadata.txt"
          echo "BROWSER_BINARY=$BROWSER" >> "$OUT/metadata.txt"

          capture_headless() {
            local name="$1"
            local width="$2"
            local height="$3"
            local url="$4"
            BROWSER="$BROWSER" URL="$url" OUTFILE="$OUT/$name.png" NAME="$name" WIDTH="$width" HEIGHT="$height"               /usr/bin/python3 - <<'PY'
          import os
          import signal
          import subprocess
          from pathlib import Path

          browser = os.environ["BROWSER"]
          url = os.environ["URL"]
          outfile = os.environ["OUTFILE"]
          name = os.environ["NAME"]
          width = os.environ["WIDTH"]
          height = os.environ["HEIGHT"]
          log_path = Path("/tmp") / f"stream-s7-visual-{name}.log"
          cmd = [
              browser,
              "--headless=new",
              "--disable-gpu",
              "--disable-extensions",
              "--disable-background-networking",
              "--disable-component-update",
              "--disable-sync",
              "--hide-scrollbars",
              "--metrics-recording-only",
              "--no-default-browser-check",
              "--no-first-run",
              "--renderer-process-limit=2",
              f"--window-size={width},{height}",
              "--virtual-time-budget=8000",
              f"--screenshot={outfile}",
              url,
          ]
          with log_path.open("wb") as log:
              proc = subprocess.Popen(
                  cmd,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  rc = proc.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  os.killpg(proc.pid, signal.SIGKILL)
                  proc.wait(timeout=5)
                  raise SystemExit("HEADLESS_BROWSER_TIMEOUT")
          if rc != 0:
              raise SystemExit(f"HEADLESS_BROWSER_EXIT={rc}")
          PY
            test -s "$OUT/$name.png"
            /usr/bin/sips -g pixelWidth -g pixelHeight "$OUT/$name.png" || true
          }

          capture_headless desktop-mixed 1440 950 "$BASE_URL/stream-preview?fixture=mixed"
          capture_headless desktop-incoming 1440 950 "$BASE_URL/stream-preview?fixture=incoming"
          capture_headless desktop-history 1440 950 "$BASE_URL/stream-preview?fixture=history"
          capture_headless desktop-filters 1440 950 "$BASE_URL/stream-preview?fixture=filters"
          capture_headless desktop-degraded 1440 950 "$BASE_URL/stream-preview?fixture=degraded"
          capture_headless mobile-mixed 430 860 "$BASE_URL/stream-preview?fixture=mixed"

          echo "STREAM_S7_RENDERED_VISUAL_ACCEPTANCE_PASS=YES"

      - name: Upload Stream S7 visual snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-s7-visual-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-s7-visual-snapshot
          if-no-files-found: error
          retention-days: 7

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-s7-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_S7_UID504_NON_MUTATING_PASS=YES"
