name: Crypto R12 Launchd Optional Branch Gate

on:
  push:
    branches:
      - fix/r12-launchd-optional-runtime-v1

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Validate R12 fallback contracts
        run: |
          python -m pip install "pytest>=8.4"
          python -m py_compile ops/continuity/*.py
          python -m pytest -q tests/test_continuity_contracts.py tests/test_continuity_hardening.py
          echo "R12_LAUNCHD_OPTIONAL_BRANCH_GATE_PASS=YES"
