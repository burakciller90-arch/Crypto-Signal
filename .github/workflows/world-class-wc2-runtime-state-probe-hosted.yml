name: World-Class WC2 Runtime State Probe Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-command.yml"
      - "tests/test_wc2_runtime_state_workflow.py"
      - ".github/workflows/world-class-wc2-runtime-state-probe-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-runtime-state-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 runtime probe acceptance
        run: |
          python -m pytest -q tests/test_wc2_runtime_state_workflow.py tests/test_wc2_untouched_forward_policy.py tests/test_wc2_untouched_forward_journal.py
          python -m ruff check tests/test_wc2_runtime_state_workflow.py
          echo "WC2_RUNTIME_STATE_READONLY_CONTRACT_PASS=YES"
          echo "WC2_RUNTIME_STATE_EXACT_SOURCE_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_RUNTIME_STATE_FULL_PASS=YES"
