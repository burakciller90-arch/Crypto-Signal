name: Crypto Stream Final F8 Filter After Evidence Diagnosis UID504

on:
  push:
    branches:
      - 'accept/f8-filter-after-evidence-diagnosis'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Diagnose filter after evidence window
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          BROWSER="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/ops"
          "$PY" - "$BROWSER" <<'PY'
          import json,sys,os,signal,subprocess
          from pathlib import Path
          from capture_chromium_viewport import CdpSession,_free_port,_wait_target

          browser=Path(sys.argv[1])
          identity="292fff32aef2df8a30eea66069f2a36c9c8ccfcd8042d1518f0b7e7526271d74"
          search="SOLUSDT 4h: Market/Geometry için ilk forward state kaydedildi — watch:bullish:no_geometry. Yön: bullish."
          port=_free_port(); profile=Path("/tmp")/f"f8-after-evidence-{os.getpid()}"
          url=f"http://127.0.0.1:48700/stream-preview?message={identity}"
          p=subprocess.Popen([
              str(browser),"--headless=new","--disable-gpu","--no-first-run",
              "--no-default-browser-check","--remote-allow-origins=*",
              f"--remote-debugging-port={port}",f"--user-data-dir={profile}","about:blank"
          ],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
          session=None
          try:
              target=_wait_target(port,url); session=CdpSession(target["webSocketDebuggerUrl"])
              session.command("Page.enable"); session.command("Runtime.enable")
              session.command("Page.navigate",{"url":url})
              expr=f"""(async()=>{{
                const identity={json.dumps(identity)};
                const searchText={json.dumps(search)};
                const find=()=>[...document.querySelectorAll('.message')].find(n=>n.dataset.identity===identity)||null;
                for(let i=0;i<100;i++){{
                  const node=find();
                  if(node && node.querySelectorAll('[data-evidence-kind]').length) break;
                  await new Promise(r=>setTimeout(r,100));
                }}
                let node=find();
                const evidenceButtons=node?[...node.querySelectorAll('[data-evidence-kind]')]:[];
                if(evidenceButtons.length)evidenceButtons[0].click();
                await new Promise(r=>setTimeout(r,450));

                window.__f8Fetches=[];
                const originalFetch=window.fetch.bind(window);
                window.fetch=async (...args)=>{{
                  const u=String(args[0] instanceof Request?args[0].url:args[0]);
                  try{{
                    const response=await originalFetch(...args);
                    if(u.includes('/api/stream/messages?')){{
                      const clone=response.clone(); let count=null; let bodyStatus=null;
                      try{{const body=await clone.json(); count=body?.page?.items?.length??null; bodyStatus=body?.status??null;}}catch{{}}
                      window.__f8Fetches.push({{url:u,http:response.status,count,status:bodyStatus}});
                    }}
                    return response;
                  }}catch(error){{window.__f8Fetches.push({{url:u,error:String(error)}});throw error;}}
                }};

                document.getElementById('searchButton')?.click();
                await new Promise(r=>setTimeout(r,80));
                const input=document.getElementById('searchInput');
                if(input){{input.value=searchText;input.dispatchEvent(new Event('input',{{bubbles:true}}));}}
                const select=document.getElementById('categoryFilter');
                if(select){{select.value='market';select.dispatchEvent(new Event('change',{{bubbles:true}}));}}
                document.getElementById('applyFiltersButton')?.click();

                for(let i=0;i<120;i++){{
                  if(window.__f8Fetches.length && window.__cryptoSignalStreamS12?.discoverySnapshot?.().messageCount>0) break;
                  await new Promise(r=>setTimeout(r,100));
                }}
                node=find();
                return {{
                  evidenceWindowCount:document.querySelectorAll('.evidence-window').length,
                  discovery:window.__cryptoSignalStreamS12?.discoverySnapshot?.()||null,
                  fetches:window.__f8Fetches,
                  controls:{{text:input?.value||'',category:select?.value||''}},
                  domCount:document.querySelectorAll('.message').length,
                  domIds:[...document.querySelectorAll('.message')].map(n=>n.dataset.identity),
                  retained:Boolean(node),
                  connection:document.getElementById('connectionLabel')?.textContent||''
                }};
              }})()"""
              result=session.command("Runtime.evaluate",{"expression":expr,"awaitPromise":True,"returnByValue":True},timeout_seconds=30)
              value=result.get("result",{}).get("value")
              print("F8_AFTER_EVIDENCE_FILTER_DIAG="+json.dumps(value,sort_keys=True,ensure_ascii=False))
              print("REAL_CAPITAL=0")
          finally:
              if session: session.close()
              if p.poll() is None:
                  os.killpg(p.pid,signal.SIGTERM)
                  try:p.wait(timeout=3)
                  except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL)
          PY
