name: RDP1 Candle Cache Focused UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/ledger/live_clock.py"
      - "src/crypto_signal/ledger/live_coverage.py"
      - "tests/test_rdp1_candle_cache_persistence.py"
      - ".github/workflows/crypto-rdp1-candle-cache-focused-uid504.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact PR source
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP1_CANDLE_CACHE_EXACT_SOURCE_PASS=YES"

      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q             tests/test_rdp1_candle_cache_persistence.py             tests/test_live_coverage.py
          "$PY" -m ruff check             src/crypto_signal/ledger/live_clock.py             src/crypto_signal/ledger/live_coverage.py             tests/test_rdp1_candle_cache_persistence.py
          "$PY" -m mypy             src/crypto_signal/ledger/live_clock.py             src/crypto_signal/ledger/live_coverage.py
          echo "RDP1_CANDLE_CACHE_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"
