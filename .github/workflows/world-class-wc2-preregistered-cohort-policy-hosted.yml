name: World-Class WC2 Preregistered Cohort Policy Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_policy.py"
      - "tests/test_wc2_untouched_forward_policy.py"
      - "docs/WC2_UNTOUCHED_FORWARD_EVIDENCE_POLICY_V1.md"
      - ".github/workflows/world-class-wc2-preregistered-cohort-policy-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-preregistered-cohort-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 preregistration acceptance
        run: |
          python -m pytest -q tests/test_wc2_untouched_forward_policy.py tests/test_performance_trust_center.py tests/test_alpha_factory_probability_calibration_gate.py
          python -m ruff check src/crypto_signal/evaluation/untouched_forward_policy.py tests/test_wc2_untouched_forward_policy.py
          python -m mypy src/crypto_signal/evaluation/untouched_forward_policy.py
          echo "WC2_PREREGISTERED_POLICY_FOCUSED_PASS=YES"
          echo "WC2_LIVE_UNTOUCHED_FORWARD_ONLY_PASS=YES"
          echo "WC2_NO_PERFORMANCE_SELECTION_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_PREREGISTERED_POLICY_FULL_PASS=YES"
