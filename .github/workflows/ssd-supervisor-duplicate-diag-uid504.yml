name: SSD Supervisor Duplicate Diagnostic UID504

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ssd-supervisor-duplicate-diag-uid504.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1
      - name: Inspect exact supervisor ownership without mutation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          SUP="$ROOT/ssd-service-supervisor.sh"
          echo "DIAG_HEAD=$(git rev-parse HEAD)"
          echo "PIDFILE=$(cat "$ROOT/ssd-service-supervisor.pid" 2>/dev/null || true)"
          echo "ROOT_SUP_SHA=$(shasum -a 256 "$SUP" | awk '{print $1}')"
          echo "DEV_SUP_SHA=$(shasum -a 256 "$ROOT/Development/ops/ssd_runtime_supervisor.sh" | awk '{print $1}')"
          echo "=== SUPERVISORS ==="
          /bin/ps -axo pid=,ppid=,lstart=,etime=,comm=,args= |             /usr/bin/awk -v needle="$SUP" '($8 == "bash" || $8 == "/bin/bash") && index($0, needle) > 0 {print}'
          echo "=== EXACT PID DETAIL ==="
          for pid in $(/bin/ps -axo pid=,comm=,args= | /usr/bin/awk -v needle="$SUP" '($2 == "bash" || $2 == "/bin/bash") && index($0, needle) > 0 {print $1}'); do
            /bin/ps -p "$pid" -o pid=,ppid=,user=,%cpu=,%mem=,lstart=,etime=,command=
            echo "CHILDREN_OF_$pid"
            /bin/ps -axo pid=,ppid=,user=,etime=,command= | /usr/bin/awk -v p="$pid" '$2 == p {print}'
          done
          echo "=== RUNTIME WATCHDOG LOG ==="
          tail -160 "$HOME/Library/Logs/CryptoSignalRuntime/runtime-terminal-watchdog.log" 2>/dev/null || true
          echo "=== RUNTIME WATCHDOG ERR ==="
          tail -160 "$HOME/Library/Logs/CryptoSignalRuntime/runtime-terminal-watchdog.err.log" 2>/dev/null || true
          echo "=== HOTPLUG LOG ==="
          tail -160 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log" 2>/dev/null || true
          echo "=== HOTPLUG ERR ==="
          tail -160 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" 2>/dev/null || true
          echo "=== HEALTH ==="
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health
          echo
          echo "REAL_CAPITAL=0"
