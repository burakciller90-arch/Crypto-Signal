name: Crypto R15 UID501 Admin Reinstall

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-uid501-admin-reinstall.yml"

permissions:
  contents: read

jobs:
  reinstall:
    name: Reinstall R15 as UID504 with local admin authorization
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact installer
        shell: bash
        run: |
          set -euo pipefail
          cp ops/install_ssd_hotplug_recovery.sh /tmp/crypto-r15-current-installer.sh
          chmod 755 /tmp/crypto-r15-current-installer.sh
          shasum -a 256 /tmp/crypto-r15-current-installer.sh
          bash -n /tmp/crypto-r15-current-installer.sh
      - name: Run installer as UID504 through macOS admin authorization
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/crypto-r15-admin-wrapper.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -f /tmp/crypto-r15-current-installer.sh
          /usr/bin/sudo -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash /tmp/crypto-r15-current-installer.sh
          SH
          chmod 700 /tmp/crypto-r15-admin-wrapper.sh
          CMD='do shell script "/bin/bash /tmp/crypto-r15-admin-wrapper.sh" with administrator privileges'
          /bin/launchctl asuser 501 /usr/bin/osascript -e "$CMD"
      - name: Verify UID504 recovery
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          ok=0
          for _ in {1..75}; do
            count="$(ps -axo command= | awk -v expected="$EXPECTED" '$0 == expected {n++} END{print n+0}')"
            if [ "$count" = "1" ] && curl -fsS --max-time 3 http://127.0.0.1:48700/api/health >/tmp/r15-recovered-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          echo "=== UID504 RUNNER-LIKE PROCESSES ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=             | awk '$3=="crypto-signal-agent" && ($0 ~ /RunnerService\.js/ || $0 ~ /Runner\.Listener/ || $0 ~ /Runner\.Worker/ || $0 ~ /\.\/runsvc\.sh/ || $0 ~ /Crypto-504\/Crypto-Signal\/Runner/) {print}'
          echo "=== HEALTH ==="
          cat /tmp/r15-recovered-health.json 2>/dev/null || true
          test "$ok" = "1"
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-recovered-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY
          echo "R15_UID501_ADMIN_REINSTALL_RECOVERY_PASS=YES"
          echo "REAL_CAPITAL=0"
      - name: Cleanup temp files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/crypto-r15-current-installer.sh /tmp/crypto-r15-admin-wrapper.sh
