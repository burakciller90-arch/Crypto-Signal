name: Crypto R15 Final Read Only Acceptance

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-final-readonly-acceptance.yml"

permissions:
  contents: read

jobs:
  accept:
    name: Final read-only physical-remount acceptance
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Verify live R15 state without mutation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"

          echo "=== MOUNT ==="
          /sbin/mount | /usr/bin/grep -F " on /Volumes/Crypto-504 "

          echo "=== EXACT LISTENER ==="
          listener="$(/bin/ps -axo pid=,command= | /usr/bin/awk -v expected="$EXPECTED" '{pid=$1; sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0); if ($0 == expected) print pid}')"
          count="$(printf '%s\n' "$listener" | /usr/bin/awk 'NF{n++} END{print n+0}')"
          echo "LISTENER_COUNT=$count"
          echo "LISTENER_PID=$listener"
          test "$count" = "1"

          service="$(/bin/ps -p "$listener" -o ppid= | /usr/bin/tr -d ' ')"
          wrapper="$(/bin/ps -p "$service" -o ppid= | /usr/bin/tr -d ' ')"
          /bin/ps -p "$wrapper","$service","$listener" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
          test "$(/bin/ps -p "$listener" -o user= | /usr/bin/tr -d ' ')" = "crypto-signal-agent"
          test "$(/bin/ps -p "$service" -o command=)" = "./externals/node20/bin/node ./bin/RunnerService.js"
          test "$(/bin/ps -p "$wrapper" -o command=)" = "/bin/bash ./runsvc.sh"

          echo "=== OLD ORPHAN ==="
          ! /bin/kill -0 65421 2>/dev/null
          ! /bin/kill -0 65425 2>/dev/null
          echo "OLD_ORPHAN_TREE_ABSENT=YES"

          echo "=== R15 WATCHDOG ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/launchctl print "gui/504/com.cryptosignal.ssd-hotplug-recovery" | /usr/bin/head -120

          echo "=== STATE ==="
          state="$(/usr/bin/sudo -n -H -u crypto-signal-agent /bin/cat "/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery/ssd-state")"
          echo "SSD_STATE=$state"
          test "$state" = "ready"

          echo "=== HEALTH ==="
          /usr/bin/curl -fsS --max-time 5 http://127.0.0.1:48700/api/health >/tmp/r15-final-health.json
          /bin/cat /tmp/r15-final-health.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-final-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY

          echo "=== SQLITE ==="
          for db in             "$ROOT/Development/runtime/ledger/live_signal_ledger.sqlite3"             "$ROOT/Development/runtime/data/live_base_15m_cache.sqlite3"             "$ROOT/Development/runtime/paper/paper_fund.sqlite3"             "$ROOT/Development/runtime/alerts/alert_outbox.sqlite3"
          do
            result="$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/sqlite3 "$db" 'PRAGMA quick_check;')"
            echo "$db $result"
            test "$result" = "ok"
          done

          echo "=== TRANSPORT EVIDENCE ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -80 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/terminal-runner.log" || true
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -100 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log" || true

          echo "R15_FINAL_READONLY_PHYSICAL_REMOUNT_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
