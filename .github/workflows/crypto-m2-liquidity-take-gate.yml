name: Crypto M2 Liquidity Take Gate

on:
  push:
    branches:
      - m2-liquidity-take-gate-temp
    paths:
      - ".github/workflows/crypto-m2-liquidity-take-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    name: M2 liquidity-take exact-head regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e7f6ead1a0faeaf2bcf91f644bffe999ab0b872
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.1" "ruff>=0.13" "mypy>=1.18"
      - name: Full regression
        run: |
          python -m pytest -q tests/test_liquidity_dynamics_engine.py
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_LIQUIDITY_TAKE_EXACT_HEAD_GATE_PASS=YES"
          echo "M2_EXACT_HEAD=9e7f6ead1a0faeaf2bcf91f644bffe999ab0b872"
