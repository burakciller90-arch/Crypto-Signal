name: Crypto Exact Main Hosted Acceptance TEMP

on:
  push:
    branches: [v1.1-exact-main-hosted-acceptance-20260922]
    paths:
      - ".github/workflows/crypto-exact-main-hosted-acceptance-temp.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Exact main full regression
        run: |
          echo "ACCEPTANCE_BASE_MAIN_SHA=5c4dd5b17dcddb344a3892f78d8f26c8ac314dce"
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "EXACT_MAIN_HOSTED_ACCEPTANCE_PASS=YES"
