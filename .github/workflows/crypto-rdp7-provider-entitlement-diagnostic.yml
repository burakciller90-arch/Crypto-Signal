name: RDP7 Provider Entitlement Diagnostic UID504

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-rdp7-provider-entitlement-diagnostic.yml"

permissions:
  contents: read

jobs:
  entitlement:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    env:
      GH_GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
      GH_CQ_API_KEY: ${{ secrets.CQ_API_KEY }}
      GH_CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          echo "RDP7_PROVIDER_DIAG_WORKBENCH_EXACT_MAIN_PASS=YES"

      - name: Check provider entitlement presence without reading secrets
        shell: bash
        run: |
          set -euo pipefail

          glassnode_env=NO
          cryptoquant_env=NO
          glassnode_keychain=NO
          cryptoquant_keychain=NO

          if [ -n "${GH_GLASSNODE_API_KEY:-}" ] || [ -n "${GLASSNODE_API_KEY:-}" ]; then
            glassnode_env=YES
          fi
          if [ -n "${GH_CQ_API_KEY:-}" ] || [ -n "${GH_CRYPTOQUANT_API_KEY:-}" ] || [ -n "${CQ_API_KEY:-}" ] || [ -n "${CRYPTOQUANT_API_KEY:-}" ]; then
            cryptoquant_env=YES
          fi

          for service in glassnode GLASSNODE glassnode-api glassnode_api; do
            if security find-generic-password -s "$service" >/dev/null 2>&1; then
              glassnode_keychain=YES
              break
            fi
          done
          for service in cryptoquant CRYPTOQUANT cryptoquant-api cryptoquant_api; do
            if security find-generic-password -s "$service" >/dev/null 2>&1; then
              cryptoquant_keychain=YES
              break
            fi
          done

          echo "RDP7_GLASSNODE_ENV_CREDENTIAL_PRESENT=$glassnode_env"
          echo "RDP7_GLASSNODE_KEYCHAIN_CREDENTIAL_PRESENT=$glassnode_keychain"
          echo "RDP7_CRYPTOQUANT_ENV_CREDENTIAL_PRESENT=$cryptoquant_env"
          echo "RDP7_CRYPTOQUANT_KEYCHAIN_CREDENTIAL_PRESENT=$cryptoquant_keychain"
          echo "SECRET_VALUES_READ=NO"
          echo "REAL_CAPITAL=0"
