name: GALACTECH Preview Lifecycle UID504

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-command.yml"
      - "tests/test_galactech_preview_lifecycle.py"
      - ".github/workflows/galactech-preview-lifecycle-uid504.yml"

permissions:
  contents: read

concurrency:
  group: galactech-preview-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-lifecycle:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and immutable Development checkout
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test -x "$DEV/.venv/bin/python"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/preview-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "GALACTECH_PREVIEW_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/galactech-preview-lifecycle-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "ruff>=0.13"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused preview lifecycle acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_galactech_preview_lifecycle.py
          "$TEST_PY" -m ruff check tests/test_galactech_preview_lifecycle.py
          bash -n <(python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/crypto-mac-command.yml").read_text()
          start = text.index("      - name: GALACTECH EXACT MAIN PREVIEW")
          end = text.index("      - name: STATUS", start)
          block = text[start:end]
          lines = []
          in_run = False
          for line in block.splitlines():
              if line.strip() == "run: |":
                  in_run = True
                  continue
              if in_run:
                  if line.startswith("          "):
                      lines.append(line[10:])
                  elif line.strip():
                      break
          print("\n".join(lines))
          PY
          )
          echo "GALACTECH_PREVIEW_LIFECYCLE_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pip install "pytest-asyncio>=1.2" "mypy>=1.18"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "GALACTECH_PREVIEW_LIFECYCLE_FULL_PASS=YES"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/preview-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "GALACTECH_PREVIEW_UID504_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
