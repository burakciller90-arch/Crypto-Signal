name: Install Crypto Local 20m Wake

on:
  push:
    branches: [main]
    paths:
      - "ops/continuity/recurring_wake.py"
      - "ops/continuity/relay_submit.py"
      - "ops/continuity/relay_daemon.py"
      - "ops/continuity/continuity_contracts.py"
      - "ops/continuity/launchd/com.cryptosignal.autowake20m.plist"
      - ".github/workflows/crypto-install-local-20m-wake.yml"
      - ".github/workflows/crypto-20m-continuity-wake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install exact :00/:20/:40 Crypto timer
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"

          INSTALL="$HOME/Library/Application Support/CryptoSignal/continuity20m"
          AGENTS="$HOME/Library/LaunchAgents"
          DOMAIN="user/$(id -u)"
          LABEL="com.cryptosignal.autowake20m"
          PLIST="$AGENTS/$LABEL.plist"

          STATE="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/continuity"
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          LOCKED_CURRENT_CHAT="https://chatgpt.com/c/6ab2c3c1-30c8-83ed-b1ad-2aa35cc891c9"
          mkdir -p "$INSTALL" "$AGENTS" "$STATE" "$STATE/wake" "$SHARED"

          install -m 700 ops/continuity/recurring_wake.py "$INSTALL/recurring_wake.py"
          install -m 700 ops/continuity/relay_submit.py "$INSTALL/relay_submit.py"
          install -m 600 ops/continuity/continuity_contracts.py "$INSTALL/continuity_contracts.py"
          install -m 660 ops/continuity/relay_daemon.py "$SHARED/relay_daemon.py"
          install -m 660 ops/continuity/continuity_contracts.py "$SHARED/continuity_contracts.py"
          install -m 600             ops/continuity/launchd/com.cryptosignal.autowake20m.plist             "$PLIST"

          printf '%s\n' "$LOCKED_CURRENT_CHAT" > "$STATE/wake/current_chat_url"
          printf '%s\n' "$LOCKED_CURRENT_CHAT" > "$STATE/wake/expected_chat_url"
          printf '%s\n' "$LOCKED_CURRENT_CHAT" > "$SHARED/current_chat_url"
          printf '%s\n' "$LOCKED_CURRENT_CHAT" > "$SHARED/expected_chat_url"
          rm -f "$STATE/user_pause" "$SHARED/user_pause"
          touch "$SHARED/restart_requested"
          echo "EXACT_CHAT_BOUND=$LOCKED_CURRENT_CHAT"

          /usr/bin/plutil -lint "$PLIST"
          /usr/bin/python3 -m py_compile             "$INSTALL/recurring_wake.py"             "$INSTALL/relay_submit.py"             "$INSTALL/continuity_contracts.py"

          for old in             com.cryptosignal.autowake30m             com.cryptosignal.continuity30m; do
            launchctl bootout "$DOMAIN/$old" 2>/dev/null || true
            launchctl disable "$DOMAIN/$old" 2>/dev/null || true
            rm -f "$AGENTS/$old.plist"
          done

          launchctl bootout "$DOMAIN/$LABEL" 2>/dev/null || true
          set +e
          launchctl bootstrap "$DOMAIN" "$PLIST"
          BOOTSTRAP_RC=$?
          set -e

          echo "=== TIMER SCHEDULE ==="
          /usr/libexec/PlistBuddy -c "Print :StartCalendarInterval" "$PLIST"

          if [ "$BOOTSTRAP_RC" = "0" ]; then
            launchctl enable "$DOMAIN/$LABEL"
            echo "=== INSTALLED TIMER ==="
            launchctl print "$DOMAIN/$LABEL" |               egrep 'state =|last exit code =|program =|arguments =' |               head -100

            MARKER="$STATE/recurring_wake_last_local_attempt"
            rm -f "$MARKER"
            launchctl kickstart -k "$DOMAIN/$LABEL"
            ok=0
            for _ in {1..15}; do
              if [ -s "$MARKER" ]; then
                ok=1
                break
              fi
              sleep 1
            done
            test "$ok" = "1"
            grep -F 'trigger_event_id=' "$MARKER" >/dev/null
            echo "LOCAL_20M_WAKE_MODE=launchd"
            echo "LOCAL_20M_WAKE_RUNTIME_PASS=YES"
          else
            echo "LOCAL_20M_LAUNCHD_UNAVAILABLE=YES rc=$BOOTSTRAP_RC"
            launchctl bootout "$DOMAIN/$LABEL" 2>/dev/null || true
            FALLBACK="$GITHUB_WORKSPACE/.github/workflows/crypto-20m-continuity-wake.yml"
            test -f "$FALLBACK"
            grep -F 'cron: "0,20,40 * * * *"' "$FALLBACK" >/dev/null
            grep -F 'runs-on: [self-hosted, crypto-signal, uid504]' "$FALLBACK" >/dev/null
            grep -F 'recurring_wake.py' "$FALLBACK" >/dev/null
            echo "LOCAL_20M_WAKE_MODE=github-fallback"
            echo "LOCAL_20M_WAKE_FALLBACK_PASS=YES"
          fi
          echo "LOCAL_20M_WAKE_INSTALL_PASS=YES"
