name: Integrate Cursor Education 25

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  integrate:
    if: github.actor == 'burakciller90-arch' && github.event.issue.title == '[CURSOR-INTEGRATE] EDUCATION25'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - name: Integrate reviewed Stage 6B education core
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          WT="$HOME/.cursor/worktrees/crypto-signal/supervisor-25"
          SRC1="src/crypto_signal/product/education.py"
          SRC2="tests/test_product_education.py"

          test -d "$WT"
          test -f "$WT/$SRC1"
          test -f "$WT/$SRC2"

          echo "=== WORKTREE SCOPE ==="
          ACTUAL="$(git -C "$WT" status --porcelain | LC_ALL=C sort)"
          EXPECTED="$(printf '?? %s\n?? %s\n' "$SRC1" "$SRC2" | LC_ALL=C sort)"
          printf '%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          echo "=== CANONICAL PRECONDITION ==="
          test -z "$(git -C "$REPO" status --porcelain)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          git -C "$REPO" merge --ff-only FETCH_HEAD
          test ! -e "$REPO/$SRC1"
          test ! -e "$REPO/$SRC2"

          mkdir -p "$REPO/src/crypto_signal/product" "$REPO/tests"
          cp "$WT/$SRC1" "$REPO/$SRC1"
          cp "$WT/$SRC2" "$REPO/$SRC2"

          echo "=== VALIDATION ==="
          cd "$REPO"
          PYTHONPATH=src ./.venv/bin/python -m pytest -q tests/test_product_education.py
          ./.venv/bin/python -m ruff check "$SRC1" "$SRC2"
          ./.venv/bin/python -m mypy "$SRC1"

          echo "=== EXACT DIFF SCOPE ==="
          CHANGED="$(git status --porcelain | LC_ALL=C sort)"
          EXPECTED_ADDED="$(printf '?? %s\n?? %s\n' "$SRC1" "$SRC2" | LC_ALL=C sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED_ADDED"

          git add -- "$SRC1" "$SRC2"
          git -c user.name="Crypto Signal Supervisor" -c user.email="supervisor@local.invalid" commit -m "feat(product): add deterministic beginner education core"
          git -c http.extraheader="AUTHORIZATION: Basic $BASIC" push origin HEAD:main
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)"
