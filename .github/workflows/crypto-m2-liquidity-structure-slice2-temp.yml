name: Crypto M2 Liquidity Structure Slice2 TEMP

on:
  push:
    branches: [v1.1-liquidity-structure-v2-slice2]
    paths:
      - ".github/workflows/crypto-m2-liquidity-structure-slice2-temp.yml"
      - "src/crypto_signal/intelligence/liquidity_*.py"
      - "tests/test_liquidity_*"
      - "docs/M2_LIQUIDITY_STRUCTURE_SLICE2.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: M2 Slice2 focused
        run: |
          python -m pytest -q tests/test_liquidity_dynamics_engine.py tests/test_liquidity_structure_engine.py
          python -m ruff check src/crypto_signal/intelligence/liquidity_dynamics.py src/crypto_signal/intelligence/liquidity_structure.py tests/test_liquidity_dynamics_engine.py tests/test_liquidity_structure_engine.py
          python -m mypy src/crypto_signal/intelligence/liquidity_dynamics.py src/crypto_signal/intelligence/liquidity_structure.py
          echo "M2_LIQUIDITY_STRUCTURE_SLICE2_FOCUSED_PASS=YES"
      - name: Full regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_LIQUIDITY_STRUCTURE_SLICE2_FULL_PASS=YES"
