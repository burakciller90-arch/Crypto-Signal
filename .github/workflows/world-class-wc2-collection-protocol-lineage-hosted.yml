name: World-Class WC2 Collection Protocol Lineage Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/forecast_stream.py"
      - "src/crypto_signal/unified_decision_runtime.py"
      - "src/crypto_signal/exact_decision_composition.py"
      - "src/crypto_signal/evaluation/live_untouched_forward_operational.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py"
      - "ops/run_live_evidence_clock.py"
      - "tests/test_wc2_live_source_adapter.py"
      - "tests/test_wc2_prepared_cycle.py"
      - "tests/test_wc2_prepared_live_runtime.py"
      - "tests/test_wc2_live_clock_wiring.py"
      - ".github/workflows/world-class-wc2-collection-protocol-lineage-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-collection-protocol-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 protocol-lineage acceptance
        run: |
          python -m pytest -q             tests/test_wc2_live_source_adapter.py             tests/test_wc2_prepared_cycle.py             tests/test_wc2_prepared_live_runtime.py             tests/test_wc2_live_clock_wiring.py             tests/test_wc2_collection_protocol.py             tests/test_immutable_forecast_stream.py             tests/test_unified_decision_runtime.py
          python -m ruff check             src/crypto_signal/forecast_stream.py             src/crypto_signal/unified_decision_runtime.py             src/crypto_signal/exact_decision_composition.py             src/crypto_signal/evaluation/live_untouched_forward_operational.py             src/crypto_signal/evaluation/untouched_forward_prepared.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py             ops/run_live_evidence_clock.py             tests/test_wc2_live_source_adapter.py             tests/test_wc2_prepared_cycle.py             tests/test_wc2_prepared_live_runtime.py             tests/test_wc2_live_clock_wiring.py
          python -m mypy             src/crypto_signal/forecast_stream.py             src/crypto_signal/unified_decision_runtime.py             src/crypto_signal/exact_decision_composition.py             src/crypto_signal/evaluation/live_untouched_forward_operational.py             src/crypto_signal/evaluation/untouched_forward_prepared.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py             ops/run_live_evidence_clock.py
          echo "WC2_PROTOCOL_RECEIPT_LINEAGE_PASS=YES"
          echo "WC2_PROTOCOL_R20_SOURCE_LINEAGE_PASS=YES"
          echo "WC2_PROTOCOL_COHORT_LINEAGE_PASS=YES"
          echo "WC2_PROTOCOL_REPLAY_ISOLATION_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_PROTOCOL_LINEAGE_FULL_PASS=YES"
