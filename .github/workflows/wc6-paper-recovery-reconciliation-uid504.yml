name: WC6 Paper Recovery Reconciliation UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/paper/**"
      - "tests/test_paper_*.py"
      - "tests/test_wc6_execution_lab.py"
      - "src/crypto_signal/product/final_product_read_model.py"
      - "tests/test_fp6a_trade_passport_lifecycle.py"
      - "src/crypto_signal/product/trade_passport_frozen_proof.py"
      - "tests/test_fp6b_trade_passport_frozen_proof.py"
      - "docs/agent/checkpoints/2026-09-30-fp6b-trade-passport-frozen-proof-start.md"
      - ".github/workflows/fp6b-trade-passport-frozen-proof-uid504.yml"
      - ".github/workflows/wc6-paper-recovery-reconciliation-uid504.yml"
  push:
    branches: [main]
    paths:
      - "src/crypto_signal/paper/**"
      - "tests/test_paper_*.py"
      - "tests/test_wc6_execution_lab.py"
      - "src/crypto_signal/product/trade_passport_frozen_proof.py"
      - "tests/test_fp6b_trade_passport_frozen_proof.py"
      - ".github/workflows/fp6b-trade-passport-frozen-proof-uid504.yml"
      - ".github/workflows/wc6-paper-recovery-reconciliation-uid504.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc6-paper-recovery-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: WC6 exact-head paper execution-lab acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and clean Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC6_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc6-paper-execution-lab-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused WC6 recovery reconciliation acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q \
            tests/test_wc6_execution_lab.py \
            tests/test_paper_execution.py \
            tests/test_paper_commit.py \
            tests/test_paper_pipeline.py \
            tests/test_paper_write_authority.py \
            tests/test_paper_activation.py \
            tests/test_paper_venue_rules.py
          "$TEST_PY" -m ruff check \
            src/crypto_signal/paper/execution_lab.py \
            src/crypto_signal/paper/execution_lab_lifecycle.py \
            src/crypto_signal/paper/execution_lab_sandbox.py \
            tests/test_wc6_execution_lab.py
          "$TEST_PY" -m mypy \
            src/crypto_signal/paper/execution_lab.py \
            src/crypto_signal/paper/execution_lab_lifecycle.py \
            src/crypto_signal/paper/execution_lab_sandbox.py
          echo "WC6_FOCUSED_PASS=YES"

      - name: Full paper subsystem regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_paper_*.py tests/test_wc6_execution_lab.py
          "$TEST_PY" -m ruff check src/crypto_signal/paper tests/test_paper_*.py tests/test_wc6_execution_lab.py
          "$TEST_PY" -m mypy src/crypto_signal/paper
          echo "WC6_PAPER_REGRESSION_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC6_FULL_REGRESSION_PASS=YES"

      - name: Prove Development remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC6_DEVELOPMENT_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
