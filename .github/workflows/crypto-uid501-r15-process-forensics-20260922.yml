name: Crypto UID501 R15 Process Forensics 20260922

on:
  push:
    branches:
      - diag-uid501-r15-process-forensics-20260922
    paths:
      - ".github/workflows/crypto-uid501-r15-process-forensics-20260922.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 5
    steps:
      - name: Read-only SSD runner process forensics
        shell: bash
        run: |
          set -u
          test "$(id -u)" = "501"
          echo "=== UID504 SSD RUNNER PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,lstart=,etime=,state=,command=             | /usr/bin/awk '$3=="crypto-signal-agent" && ($0 ~ /Crypto-Signal\/Runner/ || $0 ~ /runsvc\.sh/ || $0 ~ /Runner\.(Listener|Worker)/) {print}'
          echo
          echo "=== TARGET PID CHAINS ==="
          for pid in 99399 86923 65425 65421 65405; do
            echo "--- target=$pid"
            /bin/ps -p "$pid" -o pid=,ppid=,user=,%cpu=,%mem=,lstart=,etime=,state=,command= 2>/dev/null || echo "ABSENT"
          done
          echo
          echo "=== ALL UID504 RUNNER LISTENERS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,lstart=,etime=,state=,command=             | /usr/bin/awk '$3=="crypto-signal-agent" && $0 ~ /Runner\.Listener run --startuptype service/ {print}'
          echo
          echo "=== ALL UID504 RUNNER WORKERS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,lstart=,etime=,state=,command=             | /usr/bin/awk '$3=="crypto-signal-agent" && $0 ~ /Runner\.Worker/ {print}'
          echo
          echo "=== CHILDREN OF LIVE UID504 LISTENERS ==="
          for p in $(/bin/ps -axo pid=,user=,command= | /usr/bin/awk '$2=="crypto-signal-agent" && $0 ~ /Runner\.Listener run --startuptype service/ {print $1}'); do
            echo "--- listener=$p"
            children="$(/usr/bin/pgrep -P "$p" 2>/dev/null || true)"
            if [ -z "$children" ]; then
              echo "NO_CHILDREN"
            else
              for child in $children; do
                /bin/ps -p "$child" -o pid=,ppid=,user=,%cpu=,%mem=,lstart=,etime=,state=,command=
              done
            fi
          done
          echo "UID501_R15_PROCESS_FORENSICS_PASS=YES"
