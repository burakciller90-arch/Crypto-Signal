name: Validate Crypto 20m Isolated Continuity

on:
  push:
    branches:
      - feature/continuity-20m-isolated-exact-chat
    paths:
      - "ops/continuity/**"
      - ".github/workflows/crypto-20m-continuity-wake.yml"
      - ".github/workflows/crypto-install-local-20m-wake.yml"
      - ".github/workflows/crypto-rebind-chat.yml"
      - ".github/workflows/crypto-mac-command.yml"
      - ".github/workflows/validate-crypto-20m-isolated-continuity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cadence, exact target and namespace isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             ops/continuity/recurring_wake.py             ops/continuity/relay_submit.py             ops/continuity/relay_daemon.py

          python - <<'PY'
          from pathlib import Path
          import plistlib

          expected = "https://chatgpt.com/c/6ab0debd-49a8-83eb-8b33-a7ce2ef826d0"

          recurring = Path("ops/continuity/recurring_wake.py").read_text()
          submit = Path("ops/continuity/relay_submit.py").read_text()
          daemon = Path("ops/continuity/relay_daemon.py").read_text()
          rebind = Path(".github/workflows/crypto-rebind-chat.yml").read_text()
          mac = Path(".github/workflows/crypto-mac-command.yml").read_text()
          fallback = Path(".github/workflows/crypto-20m-continuity-wake.yml").read_text()

          for source in (recurring, submit, daemon):
              assert "(now.minute // 20) * 20" in source
              assert "crypto-20m-continuity:" in source

          assert expected in recurring
          assert expected in daemon
          assert expected in rebind
          assert 'PROJECT_NAMESPACE = "crypto-signal"' in daemon
          assert 'Path("/Users/Shared/.crypto-signal-wake-relay")' in daemon
          assert "target_url != EXPECTED_TARGET_URL" in daemon
          assert "AUTONOMOUS_TTL_SECONDS = 15 * 60" in daemon
          assert "AUTONOMOUS_COOLDOWN_SECONDS = 10 * 60" in daemon
          assert "wake20bootstrap" in mac

          assert 'cron: "0,20,40 * * * *"' in fallback
          assert "LOCAL_20M_TIMER_RECENT=YES" in fallback
          assert not Path(
              ".github/workflows/crypto-30m-continuity-wake.yml"
          ).exists()

          plist = plistlib.loads(
              Path(
                  "ops/continuity/launchd/com.cryptosignal.autowake20m.plist"
              ).read_bytes()
          )
          assert plist["Label"] == "com.cryptosignal.autowake20m"
          assert plist["StartCalendarInterval"] == [
              {"Minute": 0},
              {"Minute": 20},
              {"Minute": 40},
          ]

          isolation_files = (
              recurring,
              submit,
              daemon,
              rebind,
              fallback,
          )
          joined = "\n".join(isolation_files).lower()
          assert "durdurulmaz" not in joined
          assert "quantum" not in joined

          print("CRYPTO_20M_ISOLATED_CONTINUITY_VALIDATION_PASS=YES")
          PY
