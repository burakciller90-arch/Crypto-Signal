name: World-Class WC2 Live Runtime Index Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/forecast_stream.py"
      - "src/crypto_signal/unified_decision_runtime.py"
      - "src/crypto_signal/exact_decision_composition.py"
      - "src/crypto_signal/decision_ledger.py"
      - "src/crypto_signal/ledger/store.py"
      - "src/crypto_signal/evaluation/live_untouched_forward_operational.py"
      - "src/crypto_signal/evaluation/live_untouched_forward_runtime.py"
      - "src/crypto_signal/evaluation/untouched_forward_journal.py"
      - "tests/test_wc2_live_runtime_index.py"
      - ".github/workflows/world-class-wc2-live-runtime-index-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-live-runtime-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 live runtime index acceptance
        run: |
          python -m pytest -q             tests/test_wc2_live_runtime_index.py             tests/test_wc2_live_source_adapter.py             tests/test_wc2_untouched_forward_journal.py             tests/test_immutable_forecast_stream.py             tests/test_unified_decision_runtime.py             tests/test_decision_evidence_ledger.py
          python -m ruff check             src/crypto_signal/forecast_stream.py             src/crypto_signal/unified_decision_runtime.py             src/crypto_signal/exact_decision_composition.py             src/crypto_signal/decision_ledger.py             src/crypto_signal/ledger/store.py             src/crypto_signal/evaluation/live_untouched_forward_operational.py             src/crypto_signal/evaluation/live_untouched_forward_runtime.py             src/crypto_signal/evaluation/untouched_forward_journal.py             tests/test_wc2_live_runtime_index.py
          python -m mypy             src/crypto_signal/forecast_stream.py             src/crypto_signal/unified_decision_runtime.py             src/crypto_signal/exact_decision_composition.py             src/crypto_signal/decision_ledger.py             src/crypto_signal/ledger/store.py             src/crypto_signal/evaluation/live_untouched_forward_operational.py             src/crypto_signal/evaluation/live_untouched_forward_runtime.py             src/crypto_signal/evaluation/untouched_forward_journal.py
          echo "WC2_LIVE_RUNTIME_INDEX_FOCUSED_PASS=YES"
          echo "WC2_CRASH_RECOVERY_NO_REISSUANCE_PASS=YES"
          echo "WC2_NO_HISTORICAL_FORECAST_BACKFILL_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_LIVE_RUNTIME_INDEX_FULL_PASS=YES"
