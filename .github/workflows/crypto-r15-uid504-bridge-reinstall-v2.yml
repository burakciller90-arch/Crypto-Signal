name: Crypto R15 UID504 Bridge Reinstall V2

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-uid504-bridge-reinstall-v2.yml"

permissions:
  contents: read

jobs:
  reinstall:
    name: Reinstall exact current R15 through UID504 bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15-ssd-hotplug-recovery-v1
          fetch-depth: 1
      - name: Prove exact recovery code
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          grep -F 'cwd|rtd info error: No such file or directory' ops/install_ssd_hotplug_recovery.sh
          grep -F "/usr/bin/awk 'NF {n++} END {print n+0}'" ops/install_ssd_hotplug_recovery.sh
          grep -F 'RUNNER_ORPHAN_PARENT_DETECTED=YES' ops/install_ssd_hotplug_recovery.sh
          bash -n ops/install_ssd_hotplug_recovery.sh
          echo "R15_EXACT_RECOVERY_CODE_PROVED=YES"

      - name: Install as UID504 without password
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash ops/install_ssd_hotplug_recovery.sh
          echo "R15_UID504_EXACT_INSTALL_PASS=YES"

      - name: Run bounded recovery cycle
        shell: bash
        run: |
          set -euo pipefail
          WATCH="/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery/hotplug-watchdog.sh"
          for _ in {1..3}; do
            /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash "$WATCH" || true
            sleep 3
          done

      - name: Verify physical-remount recovery
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          ok=0
          for _ in {1..90}; do
            listener_count="$(ps -axo command= | awk -v expected="$EXPECTED" '$0 == expected {n++} END{print n+0}')"
            if [ "$listener_count" = "1" ] \
              && ! kill -0 65421 2>/dev/null \
              && ! kill -0 65425 2>/dev/null \
              && curl -fsS --max-time 3 http://127.0.0.1:48700/api/health >/tmp/r15-v2-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          echo "=== EXACT LISTENER ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -F "$EXPECTED" | grep -v grep || true
          echo "=== UID504 RUNNER TREE ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | awk '$3=="crypto-signal-agent" && ($0 ~ /RunnerService\.js/ || $0 ~ /Runner\.Listener/ || $0 ~ /Runner\.Worker/ || $0 ~ /\.\/runsvc\.sh/) {print}'
          echo "=== OLD ORPHAN ==="
          for p in 65421 65425; do
            if kill -0 "$p" 2>/dev/null; then echo "OLD_ORPHAN_ALIVE=$p"; else echo "OLD_ORPHAN_GONE=$p"; fi
          done
          echo "=== R15 STATE ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/cat "/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery/ssd-state"
          echo "=== R15 LOG ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -160 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log"
          echo "=== R15 ERR ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -160 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" || true
          echo "=== HEALTH ==="
          cat /tmp/r15-v2-health.json 2>/dev/null || true
          test "$ok" = "1"
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-v2-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY
          echo "=== SQLITE ==="
          for db in \
            "$ROOT/Development/runtime/ledger/live_signal_ledger.sqlite3" \
            "$ROOT/Development/runtime/data/live_base_15m_cache.sqlite3" \
            "$ROOT/Development/runtime/paper/paper_fund.sqlite3" \
            "$ROOT/Development/runtime/alerts/alert_outbox.sqlite3"
          do
            result="$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/sqlite3 "$db" 'PRAGMA quick_check;')"
            echo "$db $result"
            test "$result" = "ok"
          done
          echo "R15_PHYSICAL_REMOUNT_RECOVERY_PASS=YES"
          echo "REAL_CAPITAL=0"
