name: Crypto Stage10 Hosted Gate

on:
  push:
    branches:
      - main
      - feature/stage10-integrated-acceptance
      - fp1/human-read-model-contract

permissions:
  contents: read

jobs:
  test:
    name: Hosted Stage10 full gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Full test gate
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "STAGE10_HOSTED_FULL_GATE_PASS=YES"
