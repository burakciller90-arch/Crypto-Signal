name: Crypto R24 Performance Trust Center Hosted Acceptance

on:
  push:
    branches:
      - v1.1-r24-performance-trust-center-slice1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r24-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: R24 focused
        run: |
          python -m pytest tests/test_performance_trust_center.py -q
          python -m ruff check \
            src/crypto_signal/product/performance_trust_center.py \
            tests/test_performance_trust_center.py
          python -m mypy src/crypto_signal/product/performance_trust_center.py
      - name: Complete quality and product regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R24_PERFORMANCE_TRUST_CENTER_HOSTED_FULL_PASS=YES"
