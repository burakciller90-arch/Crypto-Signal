name: Crypto R15 Orphan Identity Deep Probe

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-orphan-identity-deep-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Probe orphan runner identity through UID504
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Probe orphan identity
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set +e
          for p in 65421 65425; do
            echo "=== PID $p PS ==="
            ps -p "$p" -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command=
            echo "=== PID $p LSOF ==="
            /usr/sbin/lsof -nP -p "$p" 2>&1 | head -120
            echo "=== PID $p ENV ==="
            ps eww -p "$p" -o command= 2>&1 | head -40
          done
          echo "=== WRAPPER PARENT ==="
          p=65405
          ps -p "$p" -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command= 2>&1
          /usr/sbin/lsof -nP -p "$p" 2>&1 | head -80
          echo "R15_ORPHAN_IDENTITY_DEEP_PROBE_DONE=YES"
          SH
