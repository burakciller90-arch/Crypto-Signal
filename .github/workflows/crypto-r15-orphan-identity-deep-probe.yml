name: Crypto R15 Orphan Identity Deep Probe\n\non:\n  push:\n    branches:\n      - r15-ssd-hotplug-recovery-v1\n    paths:\n      - ".github/workflows/crypto-r15-orphan-identity-deep-probe.yml"\n\npermissions:\n  contents: read\n\njobs:\n  probe:\n    name: Probe orphan runner identity through UID504\n    runs-on: [self-hosted, crypto-signal, uid501]\n    timeout-minutes: 10\n    steps:\n      - name: Probe orphan identity\n        shell: bash\n        run: |\n          set -euo pipefail\n          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'\n          set +e\n          for p in 65421 65425; do\n            echo "=== PID $p PS ==="\n            ps -p "$p" -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command=\n            echo "=== PID $p LSOF ==="\n            /usr/sbin/lsof -nP -p "$p" 2>&1 | head -120\n            echo "=== PID $p ENV ==="\n            ps eww -p "$p" -o command= 2>&1 | head -40\n          done\n          echo "=== WRAPPER PARENT ==="\n          p=65405\n          ps -p "$p" -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command= 2>&1\n          /usr/sbin/lsof -nP -p "$p" 2>&1 | head -80\n          echo "R15_ORPHAN_IDENTITY_DEEP_PROBE_DONE=YES"\n          SH\n