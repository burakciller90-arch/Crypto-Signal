name: Crypto Stream Final F10 Authority Freeze UID504

on:
  push:
    branches:
      - 'stream/final-f10-final'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_ready:
        description: 'Fail unless F0-F9 are all finally accepted and authority mutation may begin'
        required: true
        default: false
        type: boolean
      require_complete:
        description: 'Fail unless the final F10 authority freeze is fully complete'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f10-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout-contract:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and preserve canonical checkouts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          PY="$DEV/.venv/bin/python"

          test "$(id -u)" = "504"
          test -x "$PY"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"

          {
            echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)"
            echo "PRODUCT_HEAD_BEFORE=$(git -C "$PRODUCT" rev-parse HEAD)"
            echo "PY=$PY"
          } > "$RUNNER_TEMP/stream-f10-checkout-state"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "F10_UID504_EXACT_SOURCE_PASS=YES"

      - name: Focused F10 contract tests
        shell: bash
        run: |
          set -euo pipefail
          "$PY" -m py_compile ops/audit_stream_f10_final_closeout.py
          "$PY" -m pytest -q tests/test_stream_f10_final_closeout_audit.py
          "$PY" -m ruff check             ops/audit_stream_f10_final_closeout.py             tests/test_stream_f10_final_closeout_audit.py
          echo "F10_PREP_TEST_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Read-only repository authority audit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stream-final-f10-closeout"
          mkdir -p "$OUT"

          ARGS=(
            --repo-root "$GITHUB_WORKSPACE"
            --mode prep
            --output "$OUT/f10-readiness.json"
          )

          ARGS+=(--require-ready)

          "$PY" ops/audit_stream_f10_final_closeout.py "${ARGS[@]}"             | tee "$OUT/f10-readiness.log"

          echo "F10_REPOSITORY_READ_ONLY_AUDIT_COMPLETE=YES"
          echo "HISTORICAL_BACKFILL=NO"
          echo "SYNTHETIC_ACTIVITY=NO"
          echo "POLICY_LOOSENING=NO"
          echo "REAL_CAPITAL=0"

      - name: Final closeout gate when authority freeze is present
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stream-final-f10-closeout"
          FINAL_ACCEPTANCE="docs/CRYPTO_SIGNAL_STREAM_V1_FINAL_ACCEPTANCE.md"
          if [ -f "$FINAL_ACCEPTANCE" ] && grep -q "INTELLIGENCE_STREAM_V1_FINAL_COMPLETION_ACCEPTED" "$FINAL_ACCEPTANCE"; then
            "$PY" ops/audit_stream_f10_final_closeout.py               --repo-root "$GITHUB_WORKSPACE"               --mode closeout               --require-complete               --output "$OUT/f10-closeout.json"               | tee "$OUT/f10-closeout.log"
            echo "F10_FINAL_AUTHORITY_FREEZE_PASS=YES"
          else
            echo "F10_AUTHORITY_MUTATION_PENDING=YES"
          fi
          echo "REAL_CAPITAL=0"

      - name: Prove canonical checkouts remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          STATE="$RUNNER_TEMP/stream-f10-checkout-state"

          DEV_BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$STATE")"
          PRODUCT_BEFORE="$(sed -n 's/^PRODUCT_HEAD_BEFORE=//p' "$STATE")"

          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$DEV_BEFORE"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_BEFORE"

          echo "F10_UID504_NON_MUTATING_PASS=YES"

      - name: Upload F10 preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f10-closeout-prep-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-final-f10-closeout
          if-no-files-found: warn
          retention-days: 14
