name: Crypto R15 Terminal Transport Live Acceptance

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-live-bridge-install.yml"

permissions:
  contents: read

jobs:
  accept:
    name: Accept R15 Terminal transport through UID504 bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prove gated Terminal transport code
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          grep -F 'RUNNER_TERMINAL_START="$LOCAL_ROOT/start-ssd-runner.command"' ops/install_ssd_hotplug_recovery.sh
          grep -F '/usr/bin/open -gj -a Terminal "$RUNNER_TERMINAL_START"' ops/install_ssd_hotplug_recovery.sh
          grep -F 'R15_SSD_HOTPLUG_RECOVERY_RUNNER_TERMINAL_TRANSPORT=YES' ops/install_ssd_hotplug_recovery.sh
          grep -F '"com.cryptosignal.github-runner-r15-service"' ops/install_ssd_hotplug_recovery.sh
          bash -n ops/install_ssd_hotplug_recovery.sh
          echo "R15_TERMINAL_TRANSPORT_CODE_PROVED=YES"

      - name: Install current R15 as UID504 without password
        shell: bash
        run: |
          set -euo pipefail
          test "$(sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash ops/install_ssd_hotplug_recovery.sh
          echo "R15_TERMINAL_TRANSPORT_INSTALL_PASS=YES"

      - name: Wait for canonical recovery and always emit evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          LOCAL="/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery"
          LLOG="/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery"
          ok=0

          for _ in {1..120}; do
            count="$(ps -axo command= | awk -v expected="$EXPECTED" '$0 == expected {n++} END {print n+0}')"
            if [ "$count" = "1" ]               && ! kill -0 65421 2>/dev/null               && ! kill -0 65425 2>/dev/null               && curl -fsS --max-time 3 http://127.0.0.1:48700/api/health >/tmp/r15-terminal-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "=== EXACT LISTENER ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -F "$EXPECTED" | grep -v grep || true

          echo "=== UID504 RUNNER TREE ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=             | awk '$3=="crypto-signal-agent" && ($0 ~ /RunnerService\.js/ || $0 ~ /Runner\.Listener/ || $0 ~ /Runner\.Worker/ || $0 ~ /\.\/runsvc\.sh/) {print}' || true

          echo "=== OLD ORPHAN ==="
          for p in 65421 65425; do
            if kill -0 "$p" 2>/dev/null; then echo "OLD_ORPHAN_ALIVE=$p"; else echo "OLD_ORPHAN_GONE=$p"; fi
          done

          echo "=== R15 STATE ==="
          sudo -n -H -u crypto-signal-agent /bin/cat "$LOCAL/ssd-state" 2>&1 || true

          echo "=== R15 WATCHDOG LOG ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -180 "$LLOG/hotplug-watchdog.log" 2>&1 || true
          echo "=== R15 WATCHDOG ERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -180 "$LLOG/hotplug-watchdog.err.log" 2>&1 || true

          echo "=== TERMINAL TRANSPORT LOG ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "$LLOG/terminal-runner.log" 2>&1 || true
          echo "=== TERMINAL TRANSPORT ERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "$LLOG/terminal-runner.err.log" 2>&1 || true
          echo "=== TERMINAL OPEN ERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "$LLOG/terminal-open.err.log" 2>&1 || true

          echo "=== RUNNER TERMINAL OUT ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "$ROOT/RunnerLogs/r15-terminal-runner.out.log" 2>&1 || true
          echo "=== RUNNER TERMINAL ERR ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "$ROOT/RunnerLogs/r15-terminal-runner.err.log" 2>&1 || true

          echo "=== HEALTH ==="
          cat /tmp/r15-terminal-health.json 2>/dev/null || true

          echo "RECOVERY_READY=$ok"
          test "$ok" = "1"

      - name: Verify tree health state SQLite and retired owners
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          LOCAL="/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery"

          listener="$(ps -axo pid=,command= | awk -v expected="$EXPECTED" '{pid=$1; sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0); if ($0 == expected) print pid}')"
          listener_count="$(printf '%s\n' "$listener" | awk 'NF{n++} END{print n+0}')"
          echo "LISTENER_COUNT=$listener_count"
          echo "LISTENER_PID=$listener"
          test "$listener_count" = "1"

          service="$(ps -p "$listener" -o ppid= | tr -d ' ')"
          wrapper="$(ps -p "$service" -o ppid= | tr -d ' ')"
          ps -p "$wrapper","$service","$listener" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
          test "$(ps -p "$listener" -o user= | tr -d ' ')" = "crypto-signal-agent"
          test "$(ps -p "$service" -o command=)" = "./externals/node20/bin/node ./bin/RunnerService.js"
          test "$(ps -p "$wrapper" -o command=)" = "/bin/bash ./runsvc.sh"

          ! kill -0 65421 2>/dev/null
          ! kill -0 65425 2>/dev/null
          echo "OLD_ORPHAN_TREE_ABSENT=YES"

          state="$(sudo -n -H -u crypto-signal-agent /bin/cat "$LOCAL/ssd-state")"
          echo "SSD_STATE=$state"
          test "$state" = "ready"

          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-terminal-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY

          echo "=== SQLITE ==="
          for db in             "$ROOT/Development/runtime/ledger/live_signal_ledger.sqlite3"             "$ROOT/Development/runtime/data/live_base_15m_cache.sqlite3"             "$ROOT/Development/runtime/paper/paper_fund.sqlite3"             "$ROOT/Development/runtime/alerts/alert_outbox.sqlite3"
          do
            result="$(sudo -n -H -u crypto-signal-agent /usr/bin/sqlite3 "$db" 'PRAGMA quick_check;')"
            echo "$db $result"
            test "$result" = "ok"
          done

          echo "=== LEGACY RUNNER OWNERS ==="
          for legacy in             com.cryptosignal.github-runner-terminal-watchdog             com.cryptosignal.github-runner-ssd             actions.runner.burakciller90-arch-Crypto-Signal.crypto-signal-uid504             com.cryptosignal.github-runner-r15-service
          do
            if sudo -n -H -u crypto-signal-agent /bin/launchctl print "gui/504/$legacy" >/dev/null 2>&1; then
              echo "LEGACY_STILL_LOADED=$legacy"
              exit 71
            fi
            echo "LEGACY_UNLOADED=$legacy"
          done

          echo "R15_PHYSICAL_REMOUNT_TERMINAL_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
