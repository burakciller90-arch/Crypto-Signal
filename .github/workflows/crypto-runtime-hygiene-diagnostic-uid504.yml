name: Crypto Runtime Hygiene Diagnostic UID504

on:
  push:
    branches:
      - 'runtime/hygiene-diagnostics'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-hygiene-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Capture immutable pre-state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          test "$(id -u)" = "504"
          git -C "$DEV" rev-parse --git-dir >/dev/null
          git -C "$PRODUCT" rev-parse --git-dir >/dev/null
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          mkdir -p "$RUNNER_TEMP/runtime-hygiene"
          {
            echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)"
            echo "PRODUCT_HEAD_BEFORE=$(git -C "$PRODUCT" rev-parse HEAD)"
          } > "$RUNNER_TEMP/runtime-hygiene-prestate"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
          echo "REAL_CAPITAL=0"

      - name: Read-only signal ledger reference audit
        shell: bash
        run: |
          set -euo pipefail
          DB="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/ledger/live_signal_ledger.sqlite3"
          OUT="$RUNNER_TEMP/runtime-hygiene"
          test -f "$DB"
          DB="$DB" OUT="$OUT" /usr/bin/python3 - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          db = Path(os.environ["DB"])
          out = Path(os.environ["OUT"])
          connection = sqlite3.connect(f"file:{db}?mode=ro", uri=True, timeout=10)
          connection.row_factory = sqlite3.Row
          connection.execute("PRAGMA query_only=ON")
          try:
              tables = {
                  str(row[0])
                  for row in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              required = {
                  "signal_freezes",
                  "lifecycle_evaluations",
                  "outcome_evaluations",
              }
              missing = sorted(required - tables)
              if missing:
                  raise SystemExit(f"LEDGER_REQUIRED_TABLES_MISSING:{missing!r}")

              counts = {}
              for table in sorted(required):
                  counts[table] = int(
                      connection.execute(
                          f"SELECT COUNT(*) FROM {table}"
                      ).fetchone()[0]
                  )

              lifecycle_orphans = int(
                  connection.execute(
                      """
                      SELECT COUNT(*)
                      FROM lifecycle_evaluations AS l
                      LEFT JOIN signal_freezes AS s
                        ON s.signal_freeze_identity = l.signal_freeze_identity
                      WHERE s.signal_freeze_identity IS NULL
                      """
                  ).fetchone()[0]
              )
              outcome_orphans = int(
                  connection.execute(
                      """
                      SELECT COUNT(*)
                      FROM outcome_evaluations AS o
                      LEFT JOIN signal_freezes AS s
                        ON s.signal_freeze_identity = o.signal_freeze_identity
                      WHERE s.signal_freeze_identity IS NULL
                      """
                  ).fetchone()[0]
              )

              lifecycle_fk = [
                  dict(row)
                  for row in connection.execute(
                      "PRAGMA foreign_key_list(lifecycle_evaluations)"
                  )
              ]
              outcome_fk = [
                  dict(row)
                  for row in connection.execute(
                      "PRAGMA foreign_key_list(outcome_evaluations)"
                  )
              ]

              samples = [
                  {
                      "evaluation_identity": str(row["evaluation_identity"]),
                      "signal_freeze_identity": str(row["signal_freeze_identity"]),
                      "evaluated_as_of_ms": int(row["evaluated_as_of_ms"]),
                      "appended_at_ms": int(row["appended_at_ms"]),
                  }
                  for row in connection.execute(
                      """
                      SELECT
                        l.evaluation_identity,
                        l.signal_freeze_identity,
                        l.evaluated_as_of_ms,
                        l.appended_at_ms
                      FROM lifecycle_evaluations AS l
                      LEFT JOIN signal_freezes AS s
                        ON s.signal_freeze_identity = l.signal_freeze_identity
                      WHERE s.signal_freeze_identity IS NULL
                      ORDER BY l.appended_at_ms, l.evaluation_identity
                      LIMIT 12
                      """
                  )
              ]

              payload = {
                  "counts": counts,
                  "lifecycle_orphans": lifecycle_orphans,
                  "outcome_orphans": outcome_orphans,
                  "lifecycle_foreign_keys": lifecycle_fk,
                  "outcome_foreign_keys": outcome_fk,
                  "lifecycle_orphan_samples": samples,
                  "read_only": True,
                  "real_capital": 0,
              }
              (out / "ledger-reference-audit.json").write_text(
                  json.dumps(payload, sort_keys=True, indent=2),
                  encoding="utf-8",
              )
              print(
                  "RUNTIME_HYGIENE_LEDGER "
                  + json.dumps(payload, sort_keys=True, separators=(",", ":"))
              )
          finally:
              connection.close()
          PY

      - name: Safe runtime error signature audit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/runtime-hygiene"
          OUT="$OUT" /usr/bin/python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          out = Path(os.environ["OUT"])
          candidates = [
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/live.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/live.out.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/market-tape.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/market-tape.out.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/alert.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/alert.out.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/ledger/live_clock.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/ledger/live_clock.out.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/alerts/alert_clock.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/alerts/alert_clock.out.log"),
          ]
          patterns = {
              "ssl_wrong_version": re.compile(r"WRONG_VERSION_NUMBER", re.I),
              "certificate_verify": re.compile(r"CERTIFICATE_VERIFY_FAILED", re.I),
              "name_resolution": re.compile(
                  r"NameResolutionError|name or service not known|"
                  r"nodename nor servname|temporary failure in name resolution",
                  re.I,
              ),
              "connect_error": re.compile(r"ConnectError", re.I),
              "connect_timeout": re.compile(r"ConnectTimeout|TimeoutError", re.I),
              "alert_orphan": re.compile(
                  r"lifecycle evaluation references missing signal",
                  re.I,
              ),
              "alert_clock_error": re.compile(r"ALERT_CLOCK_ERROR", re.I),
          }
          report = {}
          for path in candidates:
              if not path.is_file():
                  continue
              with path.open("rb") as handle:
                  try:
                      handle.seek(-2_000_000, 2)
                  except OSError:
                      handle.seek(0)
                  text = handle.read().decode("utf-8", errors="replace")
              report[str(path)] = {
                  key: len(pattern.findall(text))
                  for key, pattern in patterns.items()
              }
          payload = {
              "files": report,
              "window_bytes_per_file": 2_000_000,
              "raw_log_content_emitted": False,
              "real_capital": 0,
          }
          (out / "error-signatures.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(
              "RUNTIME_HYGIENE_ERROR_SIGNATURES "
              + json.dumps(payload, sort_keys=True, separators=(",", ":"))
          )
          PY

      - name: Safe last-occurrence timing audit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/runtime-hygiene"
          OUT="$OUT" /usr/bin/python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path(os.environ["OUT"])
          candidates = [
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/live.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/ServiceLogs/alert.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/ledger/live_clock.err.log"),
              Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/alerts/alert_clock.err.log"),
          ]
          patterns = {
              "ssl_wrong_version": re.compile(r"WRONG_VERSION_NUMBER", re.I),
              "name_resolution": re.compile(
                  r"NameResolutionError|name or service not known|"
                  r"nodename nor servname|temporary failure in name resolution",
                  re.I,
              ),
              "connect_error": re.compile(r"ConnectError", re.I),
              "alert_orphan": re.compile(
                  r"lifecycle evaluation references missing signal",
                  re.I,
              ),
          }
          timestamp = re.compile(
              r"(20\d{2}-\d{2}-\d{2}[T ][0-2]\d:[0-5]\d:[0-5]\d"
              r"(?:\.\d+)?(?:Z|[+-]\d{2}:?\d{2})?)"
          )
          report = {}
          for path in candidates:
              if not path.is_file():
                  continue
              with path.open("rb") as handle:
                  try:
                      handle.seek(-4_000_000, 2)
                  except OSError:
                      handle.seek(0)
                  text = handle.read().decode("utf-8", errors="replace")
              last_context_ts = None
              found = {key: None for key in patterns}
              counts = {key: 0 for key in patterns}
              for line in text.splitlines():
                  ts = timestamp.search(line)
                  if ts:
                      last_context_ts = ts.group(1)
                  for key, pattern in patterns.items():
                      if pattern.search(line):
                          counts[key] += 1
                          found[key] = last_context_ts
              report[str(path)] = {
                  "file_mtime_utc": datetime.fromtimestamp(
                      path.stat().st_mtime, tz=timezone.utc
                  ).isoformat(),
                  "signature_counts": counts,
                  "last_context_timestamp": found,
              }
          payload = {
              "files": report,
              "raw_log_content_emitted": False,
              "real_capital": 0,
          }
          (out / "last-occurrence-timing.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(
              "RUNTIME_HYGIENE_LAST_OCCURRENCE "
              + json.dumps(payload, sort_keys=True, separators=(",", ":"))
          )
          PY

      - name: Alert clock service state summary
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/runtime-hygiene/alert-clock-state.txt"
          LABEL="com.cryptosignal.alertclock"
          TARGET="gui/$(id -u)/$LABEL"
          {
            echo "ALERT_CLOCK_LAUNCHCTL_PRESENT=$(
              launchctl print "$TARGET" >/dev/null 2>&1 && echo YES || echo NO
            )"
            launchctl print "$TARGET" 2>/dev/null               | egrep 'state =|runs =|pid =|last exit code =|run interval ='               | head -40 || true
            echo "ALERT_CLOCK_PROCESS_COUNT=$(pgrep -f 'run_alert_clock.py' 2>/dev/null | wc -l | tr -d ' ')"
            echo "RAW_LOG_CONTENT_EMITTED=NO"
            echo "REAL_CAPITAL=0"
          } | tee "$OUT"

      - name: Alert source parity against same canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          ALERTS="$ROOT/Alerts"
          DB="$DEV/runtime/ledger/live_signal_ledger.sqlite3"
          OUT="$RUNNER_TEMP/runtime-hygiene"
          test -f "$DB"
          test -x "$DEV/.venv/bin/python"
          test -x "$ALERTS/.venv/bin/python"

          {
            echo "DEV_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
            echo "ALERTS_HEAD=$(git -C "$ALERTS" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
            echo "DEV_DIRTY=$([ -n "$(git -C "$DEV" status --porcelain 2>/dev/null)" ] && echo YES || echo NO)"
            echo "ALERTS_DIRTY=$([ -n "$(git -C "$ALERTS" status --porcelain 2>/dev/null)" ] && echo YES || echo NO)"
            for rel in src/crypto_signal/alerts/clock.py src/crypto_signal/alerts/store.py ops/run_alert_clock.py; do
              if [ -f "$DEV/$rel" ]; then
                echo "DEV_SHA256 $rel $(shasum -a 256 "$DEV/$rel" | awk '{print $1}')"
              else
                echo "DEV_SHA256 $rel MISSING"
              fi
              if [ -f "$ALERTS/$rel" ]; then
                echo "ALERTS_SHA256 $rel $(shasum -a 256 "$ALERTS/$rel" | awk '{print $1}')"
              else
                echo "ALERTS_SHA256 $rel MISSING"
              fi
            done
            echo "WRAPPER_SHA256=$(shasum -a 256 "$ROOT/ssd-clock-wrapper.py" | awk '{print $1}')"
            echo "WRAPPER_SAFE_ROUTE_LINES_BEGIN"
            grep -nE 'alert|run_alert_clock|signal-ledger|outbox|Development|Alerts' "$ROOT/ssd-clock-wrapper.py" || true
            echo "WRAPPER_SAFE_ROUTE_LINES_END"
            echo "REAL_CAPITAL=0"
          } | tee "$OUT/alert-source-parity.txt"

          run_probe() {
            local label="$1"
            local py="$2"
            local src="$3"
            local temp_outbox="$OUT/${label}-temp-alert-outbox.sqlite3"
            rm -f "$temp_outbox"
            LABEL="$label" DB="$DB" TEMP_OUTBOX="$temp_outbox" PYTHONPATH="$src" "$py" - <<'PY'
          import os
          from pathlib import Path

          from crypto_signal.alerts.clock import materialize_alert_events
          from crypto_signal.alerts.store import AlertOutbox

          label = os.environ["LABEL"]
          try:
              result = materialize_alert_events(
                  Path(os.environ["DB"]),
                  AlertOutbox(Path(os.environ["TEMP_OUTBOX"])),
              )
          except Exception as exc:
              print(
                  f"ALERT_SOURCE_PROBE label={label} status=ERROR "
                  f"error_type={type(exc).__name__} error={exc}"
              )
          else:
              print(
                  f"ALERT_SOURCE_PROBE label={label} status=PASS "
                  f"signals={result.signal_rows} lifecycle={result.lifecycle_rows} "
                  f"eligible={result.eligible_events} inserted={result.inserted_events} "
                  f"unchanged={result.unchanged_events}"
              )
          print("ALERT_SOURCE_PROBE_PRODUCTION_MUTATION=NO")
          print("REAL_CAPITAL=0")
          PY
          }

          run_probe development "$DEV/.venv/bin/python" "$DEV/src"             | tee "$OUT/alert-source-probe-development.txt"
          run_probe alerts "$ALERTS/.venv/bin/python" "$ALERTS/src"             | tee "$OUT/alert-source-probe-alerts.txt"

      - name: Proxy presence audit without values
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/runtime-hygiene/proxy-presence.txt"
          ROOT="/Volumes/Crypto-504/Crypto-Signal"

          check_launchctl() {
            local key="$1"
            if [ -n "$(launchctl getenv "$key" 2>/dev/null || true)" ]; then
              echo "LAUNCHCTL_${key}=SET"
            else
              echo "LAUNCHCTL_${key}=UNSET"
            fi
          }

          check_process() {
            local label="$1"
            local pid="$2"
            local key="$3"
            if [ -z "$pid" ] || ! kill -0 "$pid" >/dev/null 2>&1; then
              echo "${label}_${key}=PROCESS_UNAVAILABLE"
              return 0
            fi
            if ps eww -p "$pid" -o command= 2>/dev/null | grep -qE "(^|[[:space:]])${key}="; then
              echo "${label}_${key}=SET"
            else
              echo "${label}_${key}=UNSET"
            fi
          }

          {
            for key in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
              check_launchctl "$key"
            done

            SUP="$(cat "$ROOT/ssd-service-supervisor.pid" 2>/dev/null || true)"
            MARKET="$(cat "$ROOT/market-tape-stream.pid" 2>/dev/null || true)"
            for key in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
              check_process SUPERVISOR "$SUP" "$key"
              check_process MARKET_TAPE "$MARKET" "$key"
            done
            echo "PROXY_VALUES_EMITTED=NO"
            echo "REAL_CAPITAL=0"
          } | tee "$OUT"

      - name: Read-only REST and WebSocket direct-vs-environment probe
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          OUT="$RUNNER_TEMP/runtime-hygiene/network-probe.txt"
          test -x "$DEV/.venv/bin/python"
          "$DEV/.venv/bin/python" - <<'PY' | tee "$OUT"
          import asyncio
          import httpx
          from websockets.asyncio.client import connect

          def error_chain(exc: BaseException) -> str:
              names = []
              current = exc
              seen = set()
              while current is not None and id(current) not in seen and len(names) < 6:
                  seen.add(id(current))
                  names.append(type(current).__name__)
                  current = current.__cause__ or current.__context__
              return ">".join(names)

          async def rest_probe(label: str, url: str, trust_env: bool) -> None:
              try:
                  async with httpx.AsyncClient(
                      timeout=8.0,
                      follow_redirects=True,
                      trust_env=trust_env,
                  ) as client:
                      response = await client.get(url)
                  print(
                      f"REST_PROBE label={label} trust_env={trust_env} "
                      f"status={response.status_code} error=NONE"
                  )
              except Exception as exc:
                  print(
                      f"REST_PROBE label={label} trust_env={trust_env} "
                      f"status=ERROR error_chain={error_chain(exc)}"
                  )

          async def ws_probe(label: str, url: str, proxy) -> None:
              mode = "environment" if proxy is True else "direct"
              try:
                  async with connect(
                      url,
                      open_timeout=8,
                      close_timeout=2,
                      ping_interval=None,
                      proxy=proxy,
                  ):
                      print(
                          f"WS_PROBE label={label} mode={mode} "
                          "status=CONNECTED error=NONE"
                      )
              except Exception as exc:
                  print(
                      f"WS_PROBE label={label} mode={mode} "
                      f"status=ERROR error_chain={error_chain(exc)}"
                  )

          async def main() -> None:
              rest_targets = (
                  ("binance", "https://api.binance.com/api/v3/time"),
                  ("bybit", "https://api.bybit.com/v5/market/time"),
              )
              for label, url in rest_targets:
                  await rest_probe(label, url, True)
                  await rest_probe(label, url, False)

              ws_targets = (
                  ("binance", "wss://stream.binance.com:9443/ws"),
                  ("bybit", "wss://stream.bybit.com/v5/public/spot"),
              )
              for label, url in ws_targets:
                  await ws_probe(label, url, True)
                  await ws_probe(label, url, None)

              print("NETWORK_PROBE_READONLY=YES")
              print("PROXY_VALUES_EMITTED=NO")
              print("REAL_CAPITAL=0")

          asyncio.run(main())
          PY

      - name: Capture wrapper topology and redacted error contexts
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/runtime-hygiene"
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          OUT="$OUT" ROOT="$ROOT" /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          out = Path(os.environ["OUT"])
          root = Path(os.environ["ROOT"])
          wrapper = root / "ssd-clock-wrapper.py"
          paths = {
              "wrapper": wrapper,
              "development_alert_runner": root / "Development/ops/run_alert_clock.py",
              "alerts_alert_runner": root / "Alerts/ops/run_alert_clock.py",
              "development_live_runner": root / "Development/ops/run_live_evidence_clock.py",
          }

          topology = {}
          for label, path in paths.items():
              if not path.is_file():
                  topology[label] = {"exists": False}
                  continue
              raw = path.read_bytes()
              entry = {
                  "exists": True,
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              }
              if label == "wrapper":
                  text = raw.decode("utf-8", errors="replace")
                  safe_lines = []
                  for line in text.splitlines():
                      lowered = line.lower()
                      if any(token in lowered for token in (
                          "alert", "live", "signal-ledger", "outbox",
                          "development", "alerts", "run_alert_clock",
                          "run_live_evidence_clock",
                      )):
                          safe_lines.append(line[:1200])
                  entry["relevant_lines"] = safe_lines[:160]
              topology[label] = entry

          (out / "wrapper-topology.json").write_text(
              json.dumps(topology, sort_keys=True, indent=2),
              encoding="utf-8",
          )

          patterns = {
              "alert_orphan": re.compile(
                  r"lifecycle evaluation references missing signal", re.I
              ),
              "ssl_wrong_version": re.compile(r"WRONG_VERSION_NUMBER", re.I),
              "name_resolution": re.compile(
                  r"nodename nor servname|name resolution|NameResolutionError", re.I
              ),
              "connect_error": re.compile(r"ConnectError", re.I),
          }
          log_paths = [
              root / "ServiceLogs/alert.err.log",
              root / "ServiceLogs/live.err.log",
              root / "Development/runtime/alerts/alert_clock.err.log",
              root / "Development/runtime/ledger/live_clock.err.log",
          ]
          contexts = {}
          sensitive = re.compile(
              r"(?i)(authorization|token|secret|password|api[_-]?key|cookie)\s*[:=]\s*\S+"
          )
          for path in log_paths:
              if not path.is_file():
                  continue
              with path.open("rb") as handle:
                  try:
                      handle.seek(-4_000_000, 2)
                  except OSError:
                      handle.seek(0)
                  text = handle.read().decode("utf-8", errors="replace")
              lines = text.splitlines()
              file_context = {}
              for key, pattern in patterns.items():
                  indices = [i for i, line in enumerate(lines) if pattern.search(line)]
                  if not indices:
                      continue
                  i = indices[-1]
                  start = max(0, i - 10)
                  end = min(len(lines), i + 11)
                  block = []
                  for line in lines[start:end]:
                      line = sensitive.sub(r"\1=<REDACTED>", line)
                      if len(line) > 1800:
                          line = line[:1800] + "...<TRUNCATED>"
                      block.append(line)
                  file_context[key] = {
                      "match_count_in_window": len(indices),
                      "last_context": block,
                  }
              contexts[str(path)] = file_context

          (out / "error-contexts-redacted.json").write_text(
              json.dumps(contexts, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print("RUNTIME_HYGIENE_WRAPPER_TOPOLOGY_CAPTURED=YES")
          print("RUNTIME_HYGIENE_REDACTED_ERROR_CONTEXTS_CAPTURED=YES")
          print("RAW_SECRETS_EMITTED=NO")
          print("REAL_CAPITAL=0")
          PY

      - name: Upload runtime hygiene artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-hygiene-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-hygiene
          if-no-files-found: error
          retention-days: 7

      - name: Prove production checkouts remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          DEV_BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/runtime-hygiene-prestate")"
          PRODUCT_BEFORE="$(sed -n 's/^PRODUCT_HEAD_BEFORE=//p' "$RUNNER_TEMP/runtime-hygiene-prestate")"
          DEV_AFTER="$(git -C "$DEV" rev-parse HEAD)"
          PRODUCT_AFTER="$(git -C "$PRODUCT" rev-parse HEAD)"
          test "$DEV_BEFORE" = "$DEV_AFTER"
          test "$PRODUCT_BEFORE" = "$PRODUCT_AFTER"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "RUNTIME_HYGIENE_NON_MUTATING_PASS=YES"
          echo "DEV_HEAD=$DEV_AFTER"
          echo "PRODUCT_HEAD=$PRODUCT_AFTER"
          echo "REAL_CAPITAL=0"
