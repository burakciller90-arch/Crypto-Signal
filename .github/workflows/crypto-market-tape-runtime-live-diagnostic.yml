name: Crypto Market Tape Runtime Live Diagnostic

on:
  push:
    branches:
      - v1.1-market-tape-runtime-v1
    paths:
      - ".github/workflows/crypto-market-tape-runtime-live-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only Market Tape live diagnostic
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Inspect runtime as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          USER504="crypto-signal-agent"
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          STABLE="$ROOT/MarketTape"
          DIR="$ROOT/Development/runtime/market_tape"
          LABEL="com.cryptosignal.markettape"

          echo "=== STABLE ROOT ==="
          sudo -n -H -u "$USER504" /bin/ls -la "$STABLE" 2>&1 || true
          sudo -n -H -u "$USER504" /bin/ls -la "$STABLE/.venv/bin" 2>&1 | /usr/bin/head -80 || true
          sudo -n -H -u "$USER504" /bin/ls -l "$STABLE/.venv/bin/python" "$STABLE/ops/run_market_tape_runtime.py" 2>&1 || true
          echo "=== DEPLOY MARKERS ==="
          sudo -n -H -u "$USER504" /bin/cat "$STABLE/.deployed_git_commit" 2>&1 || true
          sudo -n -H -u "$USER504" /bin/cat "$STABLE/.deployed_git_tree" 2>&1 || true
          echo "=== INSTALLED PLIST ==="
          sudo -n -H -u "$USER504" /bin/ls -l "/Users/crypto-signal-agent/Library/LaunchAgents/$LABEL.plist" 2>&1 || true
          sudo -n -H -u "$USER504" /usr/bin/plutil -p "/Users/crypto-signal-agent/Library/LaunchAgents/$LABEL.plist" 2>&1 || true
          echo "=== SERVICE LOG DIR ==="
          sudo -n -H -u "$USER504" /bin/ls -la "$ROOT/ServiceLogs" 2>&1 | /usr/bin/tail -80 || true

          echo "=== EXACT PATHS ==="
          sudo -n -H -u "$USER504" /bin/ls -ldeO             "$ROOT" "$ROOT/Development" "$ROOT/Development/.venv"             "$ROOT/Development/.venv/bin"             "$ROOT/Development/.venv/bin/python"             "$STABLE" "$STABLE/ops" "$STABLE/ops/run_market_tape_runtime.py"             "$ROOT/ServiceLogs" 2>&1 || true
          sudo -n -H -u "$USER504" /usr/bin/readlink "$ROOT/Development/.venv/bin/python" 2>&1 || true
          sudo -n -H -u "$USER504" /usr/bin/file "$ROOT/Development/.venv/bin/python" 2>&1 || true

          echo "=== EXACT PYTHON PROBE ==="
          sudo -n -H -u "$USER504" /usr/bin/env             HOME=/Users/crypto-signal-agent             PYTHONPATH="$STABLE/src"             "$ROOT/Development/.venv/bin/python"             "$STABLE/ops/run_market_tape_runtime.py" --help 2>&1 || true

          echo "=== PLIST LINT ==="
          sudo -n -H -u "$USER504" /usr/bin/plutil -lint             "/Users/crypto-signal-agent/Library/LaunchAgents/$LABEL.plist" 2>&1 || true

          echo "=== LAUNCHCTL FULL ==="
          sudo -n -H -u "$USER504" /bin/launchctl print "gui/504/$LABEL" 2>&1 | /usr/bin/head -260 || true
          sudo -n -H -u "$USER504" /bin/launchctl print-disabled "gui/504" 2>&1 | /usr/bin/grep -F "$LABEL" || true

          echo "=== LAUNCHD LOG ==="
          /usr/bin/log show --last 8m --style compact             --predicate 'process == "launchd" AND eventMessage CONTAINS "com.cryptosignal.markettape"'             2>&1 | /usr/bin/tail -120 || true

          echo "=== PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,etime=,%cpu=,%mem=,command= |             /usr/bin/grep '[r]un_market_tape_runtime.py' || true

          echo "=== STATUS ==="
          sudo -n -H -u "$USER504" /bin/ls -lT "$DIR/runtime_status.json" 2>&1 || true
          sudo -n -H -u "$USER504" /bin/cat "$DIR/runtime_status.json" 2>&1 || true

          echo "=== ROWS/CHECKS ==="
          sudo -n -H -u "$USER504" /usr/bin/sqlite3 "$DIR/raw_market_tape.sqlite3"             'SELECT COUNT(*),MIN(event_at_ms),MAX(event_at_ms) FROM raw_market_events;' 2>&1 || true
          sudo -n -H -u "$USER504" /usr/bin/sqlite3 "$DIR/market_tape.sqlite3"             'SELECT COUNT(*) FROM market_tape_orderbooks; SELECT COUNT(*) FROM market_tape_trades; PRAGMA quick_check;' 2>&1 || true

          echo "=== STDOUT ==="
          sudo -n -H -u "$USER504" /usr/bin/tail -80 "$ROOT/ServiceLogs/market-tape.out.log" 2>&1 || true
          echo "=== STDERR ==="
          sudo -n -H -u "$USER504" /usr/bin/tail -120 "$ROOT/ServiceLogs/market-tape.err.log" 2>&1 || true

          echo "MARKET_TAPE_LIVE_DIAGNOSTIC_DONE=YES"
