name: World-Class WC2 Paper Execution Journal UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_execution_journal.py"
      - "tests/test_wc2_paper_execution_journal.py"
      - ".github/workflows/world-class-wc2-paper-execution-journal-hosted.yml"
      - ".github/workflows/world-class-wc2-paper-execution-journal-uid504.yml"

permissions:
  contents: read

concurrency:
  group: wc2-execution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wc2-paper-execution-journal-uid504:
    name: WC2 paper execution journal exact-source UID504 acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and immutable Development checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          test -x "$PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/wc2-journal-dev-state"
          WORKSPACE_HEAD="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "WC2_EXECUTION_JOURNAL_WORKSPACE_HEAD=$WORKSPACE_HEAD"
          echo "WC2_EXECUTION_JOURNAL_WORKFLOW_SHA=$GITHUB_SHA"
          test "$WORKSPACE_HEAD" = "$GITHUB_SHA"
          echo "WC2_EXECUTION_JOURNAL_EXACT_SOURCE_PASS=YES"

      - name: Create isolated exact-source test environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc2-journal-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install \
            "pytest>=8.4" \
            "pytest-asyncio>=1.2" \
            "ruff>=0.13" \
            "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused WC2 paper execution journal acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_wc2_paper_execution_journal.py
          "$TEST_PY" -m ruff check \
            src/crypto_signal/evaluation/untouched_forward_execution_journal.py \
            tests/test_wc2_paper_execution_journal.py
          "$TEST_PY" -m mypy \
            src/crypto_signal/evaluation/untouched_forward_execution_journal.py
          echo "WC2_EXECUTION_JOURNAL_APPEND_ONLY_PASS=YES"
          echo "WC2_EXECUTION_JOURNAL_FORWARD_BOUNDARY_PASS=YES"
          echo "WC2_EXECUTION_JOURNAL_EXPLICIT_COST_PASS=YES"
          echo "WC2_EXECUTION_JOURNAL_PROVIDER_LINEAGE_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_EXECUTION_JOURNAL_FULL_PASS=YES"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/wc2-journal-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          echo "WC2_EXECUTION_JOURNAL_DEV_HEAD_BEFORE=$BEFORE"
          echo "WC2_EXECUTION_JOURNAL_DEV_HEAD_AFTER=$AFTER"
          test "$BEFORE" = "$AFTER"
          echo "WC2_EXECUTION_JOURNAL_UID504_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
