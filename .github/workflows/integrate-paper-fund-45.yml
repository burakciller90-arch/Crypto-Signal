name: Integrate Paper Fund 45

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  integrate:
    if: github.actor == 'burakciller90-arch' && github.event.issue.title == '[CURSOR-INTEGRATE] PAPER45'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - name: Integrate reviewed Stage 6C paper fund foundation
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          WT="$HOME/.cursor/worktrees/crypto-signal/supervisor-45"
          FILES=(
            "src/crypto_signal/paper/__init__.py"
            "src/crypto_signal/paper/models.py"
            "src/crypto_signal/paper/ledger.py"
            "tests/test_paper_fund.py"
          )

          test -d "$WT"
          echo "=== WORKTREE SCOPE ==="
          git -C "$WT" status --short --branch
          ACTUAL_STATUS="$(git -C "$WT" status --porcelain | LC_ALL=C sort)"
          EXPECTED_STATUS="$(printf '?? src/crypto_signal/paper/\n?? tests/test_paper_fund.py\n' | LC_ALL=C sort)"
          test "$ACTUAL_STATUS" = "$EXPECTED_STATUS"

          for path in "${FILES[@]}"; do
            test -f "$WT/$path"
            test ! -L "$WT/$path"
          done
          EXTRA="$(find "$WT/src/crypto_signal/paper" -type f ! -path '*/__pycache__/*'             ! -name '__init__.py' ! -name 'models.py' ! -name 'ledger.py' -print)"
          test -z "$EXTRA"

          echo "=== CANONICAL PRECONDITION ==="
          test -z "$(git -C "$REPO" status --porcelain)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          git -C "$REPO" merge --ff-only FETCH_HEAD

          for path in "${FILES[@]}"; do
            test ! -e "$REPO/$path"
          done
          mkdir -p "$REPO/src/crypto_signal/paper"
          cp "$WT/src/crypto_signal/paper/__init__.py" "$REPO/src/crypto_signal/paper/__init__.py"
          cp "$WT/src/crypto_signal/paper/models.py" "$REPO/src/crypto_signal/paper/models.py"
          cp "$WT/src/crypto_signal/paper/ledger.py" "$REPO/src/crypto_signal/paper/ledger.py"
          cp "$WT/tests/test_paper_fund.py" "$REPO/tests/test_paper_fund.py"

          echo "=== FOCUSED VALIDATION ==="
          cd "$REPO"
          PYTHONPATH=src ./.venv/bin/python -m pytest -q tests/test_paper_fund.py
          ./.venv/bin/python -m ruff check src/crypto_signal/paper tests/test_paper_fund.py
          ./.venv/bin/python -m mypy src/crypto_signal/paper

          echo "=== EXACT CANONICAL DIFF ==="
          ACTUAL="$(git status --porcelain | LC_ALL=C sort)"
          EXPECTED="$(printf '?? src/crypto_signal/paper/\n?? tests/test_paper_fund.py\n' | LC_ALL=C sort)"
          printf '%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          git add -- "${FILES[@]}"
          git -c user.name="Crypto Signal Supervisor" -c user.email="supervisor@local.invalid"             commit -m "feat(paper): add immutable 100 USDT fund foundation"
          git -c http.extraheader="AUTHORIZATION: Basic $BASIC" push origin HEAD:main
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)"
