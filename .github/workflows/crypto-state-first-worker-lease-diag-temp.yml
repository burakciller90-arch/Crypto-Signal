name: Crypto State First Worker Lease DIAG TEMP

on:
  push:
    branches: [diag/state-first-worker-lease-20260922]
    paths:
      - ".github/workflows/crypto-state-first-worker-lease-diag-temp.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read-only worker lease state
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          LOCAL="$DEV/runtime/continuity"
          SHARED="/Users/Shared/.crypto-signal-wake-relay"

          echo "=== GIT ==="
          echo "WORKFLOW_HEAD=$(git rev-parse HEAD)"
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"
          git -C "$DEV" status --short --branch || true

          echo "=== PAUSE / LEASE / QUEUES ==="
          test -f "$LOCAL/user_pause" && echo "LOCAL_PAUSED=YES" || echo "LOCAL_PAUSED=NO"
          test -f "$SHARED/user_pause" && echo "SHARED_PAUSED=YES" || echo "SHARED_PAUSED=NO"
          echo "ACTIVE_LEASES=$(find "$LOCAL/leases/active" -maxdepth 1 -type f -name '*.lease' 2>/dev/null | wc -l | tr -d ' ')"
          find "$LOCAL/leases/active" -maxdepth 1 -type f -name '*.lease' -print 2>/dev/null || true
          echo "LOCAL_WAKE_QUEUE=$(find "$LOCAL/wake/queue" -maxdepth 1 -type f -name '*.wake' 2>/dev/null | wc -l | tr -d ' ')"
          echo "RELAY_WAKE_QUEUE=$(find "$SHARED/queue" -maxdepth 1 -type f -name '*.wake' 2>/dev/null | wc -l | tr -d ' ')"

          echo "=== CURSOR/AGENT PROCESSES ==="
          ps -axo pid=,ppid=,uid=,user=,etime=,command= |             egrep -i '(/agent( |$)|Cursor\.app|\.cursor/|cursor-agent|supervisor-[0-9]+)' |             egrep -v 'egrep|grep' || true

          echo "=== CURSOR WORKTREES ==="
          git -C "$DEV" worktree list --porcelain || true
          echo "=== CURSOR SUPERVISOR DIRS ==="
          find "$HOME/.cursor/worktrees/crypto-signal" -maxdepth 1 -mindepth 1 -type d -name 'supervisor-*' -print 2>/dev/null || true

          echo "=== RUNNER ==="
          ps -axo pid=,ppid=,uid=,user=,etime=,command= |             egrep -i 'actions-runner|Runner\.Listener|Runner\.Worker' |             egrep -v 'egrep|grep' || true

          echo "STATE_FIRST_WORKER_LEASE_DIAG_PASS=YES"
