name: Crypto Local 30m Continuity Timer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/local-30m-continuity-timer-v2
    paths:
      - "ops/continuity/recurring_wake.py"
      - "ops/continuity/launchd/com.cryptosignal.continuity30m.plist"
      - ".github/workflows/crypto-30m-continuity-wake.yml"
      - ".github/workflows/crypto-local-30m-continuity-timer.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact half-hour timer and fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/continuity/recurring_wake.py
          python - <<'PY'
          from pathlib import Path
          import plistlib

          plist = plistlib.loads(
              Path("ops/continuity/launchd/com.cryptosignal.continuity30m.plist").read_bytes()
          )
          assert plist["Label"] == "com.cryptosignal.continuity30m"
          assert plist["StartCalendarInterval"] == [{"Minute": 0}, {"Minute": 30}]
          assert plist["ProgramArguments"] == [
              "/usr/bin/python3",
              "/Users/crypto-signal-agent/Crypto-Signal/ops/continuity/recurring_wake.py",
          ]

          source = Path("ops/continuity/recurring_wake.py").read_text()
          assert "scheduled_slot_event_id" in source
          assert "crypto-30m-continuity:" in source
          assert "recurring_wake_last_local_attempt" in source

          fallback = Path(".github/workflows/crypto-30m-continuity-wake.yml").read_text()
          assert "github.event_name" in fallback
          assert "LOCAL_30M_TIMER_RECENT=YES" in fallback
          assert "GITHUB_FALLBACK_SKIPPED=YES" in fallback
          assert "600" in fallback
          print("LOCAL_30M_CONTINUITY_VALIDATION_PASS=YES")
          PY

  deploy:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sync canonical continuity code
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          test "$(id -u)" = "504"
          test -z "$(git -C "$REPO" status --porcelain)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          git -C "$REPO" merge --ff-only FETCH_HEAD
          test "$(git -C "$REPO" rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/python3 -m py_compile "$REPO/ops/continuity/recurring_wake.py"
          echo "CANONICAL_HEAD=$(git -C "$REPO" rev-parse HEAD)"

      - name: Install exact :00/:30 launchd timer
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          SRC="$REPO/ops/continuity/launchd/com.cryptosignal.continuity30m.plist"
          DEST="$HOME/Library/LaunchAgents/com.cryptosignal.continuity30m.plist"
          LABEL="com.cryptosignal.continuity30m"
          DOMAIN="gui/$(id -u)"

          mkdir -p "$HOME/Library/LaunchAgents"
          cp "$SRC" "$DEST"
          chmod 600 "$DEST"
          /usr/bin/plutil -lint "$DEST"
          launchctl bootout "$DOMAIN/$LABEL" 2>/dev/null || true
          launchctl bootstrap "$DOMAIN" "$DEST"
          launchctl enable "$DOMAIN/$LABEL"

          echo "=== LOCAL TIMER STATE ==="
          /usr/libexec/PlistBuddy -c "Print :StartCalendarInterval" "$DEST"
          launchctl print "$DOMAIN/$LABEL" | egrep 'state =|last exit code =|program =|Minute|path =|arguments =|stdout path|stderr path' | head -80
          echo "LOCAL_30M_CONTINUITY_TIMER_DEPLOY_PASS=YES"
