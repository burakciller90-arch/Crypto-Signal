name: Crypto R22 Slice1 Hosted Acceptance

on:
  push:
    branches:
      - v1.1-r22-transaction-decision-tape-slice1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r22-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: R22 focused
        run: |
          python -m pytest tests/test_transaction_tape.py -q
          python -m ruff check src/crypto_signal/paper/transaction_tape.py tests/test_transaction_tape.py
          python -m mypy src/crypto_signal/paper/transaction_tape.py
      - name: Complete quality and product regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R22_SLICE1_HOSTED_FULL_PASS=YES"
