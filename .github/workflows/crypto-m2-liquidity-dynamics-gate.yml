name: Crypto M2 Liquidity Dynamics Gate

on:
  push:
    branches:
      - v1.1-liquidity-dynamics-v1
    paths:
      - "src/crypto_signal/intelligence/liquidity_dynamics.py"
      - "tests/test_liquidity_dynamics_engine.py"
      - ".github/workflows/crypto-m2-liquidity-dynamics-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    name: M2 liquidity dynamics full gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.1" "ruff>=0.13" "mypy>=1.18"
      - name: Focused tests
        run: python -m pytest -q tests/test_liquidity_dynamics_engine.py
      - name: Full quality gate
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_LIQUIDITY_DYNAMICS_FULL_GATE_PASS=YES"
