name: Crypto Forecast Ruff Diff

on:
  push:
    branches:
      - v1.1-forecast-decision-proof-v1
    paths:
      - ".github/workflows/crypto-forecast-ruff-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.13"
      - name: Show exact Ruff fix diff
        shell: bash
        run: |
          set +e
          python -m ruff check --fix src/crypto_signal/forecast/builders.py src/crypto_signal/forecast/store.py tests/test_forecast_decision_proof.py
          git diff -- src/crypto_signal/forecast/builders.py src/crypto_signal/forecast/store.py tests/test_forecast_decision_proof.py
          exit 0
