name: World-Class WC2 Paper Execution Journal UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_execution_journal.py"
      - "tests/test_wc2_paper_execution_journal.py"
      - ".github/workflows/world-class-wc2-paper-execution-journal-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-paper-execution-journal:
    if: >
      github.actor == 'burakciller90-arch' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    env:
      PY: /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$PY"
          "$PY" --version
          "$PY" -m pytest --version
          "$PY" -m ruff --version
          "$PY" -m mypy --version
          node --version
          echo "WC2_EXECUTION_JOURNAL_UID504_TOOLCHAIN_PASS=YES"
      - name: Focused WC2 paper execution journal acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$PY" -m pytest -q tests/test_wc2_paper_execution_journal.py
          "$PY" -m ruff check \
            src/crypto_signal/evaluation/untouched_forward_execution_journal.py \
            tests/test_wc2_paper_execution_journal.py
          "$PY" -m mypy \
            src/crypto_signal/evaluation/untouched_forward_execution_journal.py
          echo "WC2_EXECUTION_JOURNAL_APPEND_ONLY_PASS=YES"
          echo "WC2_EXECUTION_JOURNAL_FORWARD_BOUNDARY_PASS=YES"
          echo "WC2_EXECUTION_JOURNAL_EXPLICIT_COST_PASS=YES"
          echo "WC2_EXECUTION_JOURNAL_PROVIDER_LINEAGE_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          "$PY" -m pytest -q
          "$PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_EXECUTION_JOURNAL_FULL_PASS=YES"
