name: Crypto Final Product FP1-A Human Read Model UID504

on:
  push:
    branches:
      - 'fp1/human-read-model-contract'
  pull_request:
    branches:
      - main
    paths:
      - 'src/crypto_signal/product/final_product_read_model.py'
      - 'tests/test_final_product_read_model.py'
      - 'docs/CRYPTO_SIGNAL_FP1_HUMAN_READ_MODEL_CAPABILITY_MATRIX.md'
      - 'docs/agent/CURRENT_FRONTIER.md'
      - 'docs/agent/HANDOFF_LOG.md'
      - '.github/workflows/crypto-final-product-fp1a-read-model-uid504.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-final-product-fp1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fp1a-read-model:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2

      - name: Verify exact source and create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/fp1a-read-model-venv"

          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"

          {
            echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)"
            echo "PRODUCT_HEAD_BEFORE=$(git -C "$PRODUCT" rev-parse HEAD)"
          } > "$RUNNER_TEMP/fp1a-checkout-state"

          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "FP1A_EXACT_SOURCE_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: FP1-A focused truth and regression acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q             tests/test_final_product_read_model.py             tests/test_intelligence_stream_system_view.py             tests/test_intelligence_stream_read_model.py             2>&1 | tee "$RUNNER_TEMP/fp1a-pytest.log"

          "$TEST_PY" -m ruff check             src/crypto_signal/product/final_product_read_model.py             tests/test_final_product_read_model.py             2>&1 | tee "$RUNNER_TEMP/fp1a-ruff.log"

          "$TEST_PY" -m mypy             src/crypto_signal/product/final_product_read_model.py             2>&1 | tee "$RUNNER_TEMP/fp1a-mypy.log"

          echo "FP1A_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove canonical checkouts remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          STATE="$RUNNER_TEMP/fp1a-checkout-state"

          DEV_BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$STATE")"
          PRODUCT_BEFORE="$(sed -n 's/^PRODUCT_HEAD_BEFORE=//p' "$STATE")"

          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$DEV_BEFORE"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_BEFORE"
          echo "FP1A_CANONICAL_NON_MUTATING_PASS=YES"
          echo "RDP11_SOAK_RUNTIME_MUTATED=NO"
          echo "REAL_CAPITAL=0"

      - name: Guard project boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "$ZERO_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          else
            CHANGED_FILES="$(git show --format= --name-only "$GITHUB_SHA")"
          fi

          printf '%s\n' "$CHANGED_FILES" | tee "$RUNNER_TEMP/fp1a-changed-files.log"
          if printf '%s\n' "$CHANGED_FILES" | grep -Eiq 'durdurulmaz|quantum-capital'; then
            echo "PROJECT_ISOLATION_PASS=NO"
            exit 1
          fi
          echo "PROJECT_ISOLATION_PASS=YES"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"

      - name: Upload FP1-A acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp1a-read-model-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fp1a-pytest.log
            ${{ runner.temp }}/fp1a-ruff.log
            ${{ runner.temp }}/fp1a-mypy.log
            ${{ runner.temp }}/fp1a-changed-files.log
          if-no-files-found: warn
          retention-days: 7
