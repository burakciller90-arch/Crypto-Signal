name: Crypto Signal Agent Memory Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/agent/**"
      - "scripts/crypto_signal_agent_bootstrap.sh"
      - ".github/workflows/crypto-agent-memory-bootstrap.yml"
      - ".github/workflows/crypto-ssd504-workbench-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: crypto-signal-agent-memory-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    env:
      REAL_CAPITAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          clean: true

      - name: Rebuild durable agent context
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          test "$REAL_CAPITAL" = "0"
          bash scripts/crypto_signal_agent_bootstrap.sh

      - name: Exact-main RDP9 focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_CAPITAL" = "0"
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          test -x "$PY"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q             tests/test_rdp9_cross_venue_quality.py             tests/test_rdp9_evidence_overlap.py             tests/test_rdp9_cross_venue_decision.py             tests/test_confluence_matrix_v2.py             tests/test_unified_decision_runtime.py             tests/test_exact_decision_composition.py
          echo "RDP9_BOOTSTRAP_FOCUSED_TESTS=PASS"
          echo "REAL_CAPITAL=0"

      - name: Current live cross-venue read-only classification
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          DB="$DEV/runtime/data/provider_divergence.sqlite3"
          test -r "$DB"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          export RDP9_DIVERGENCE_DB="$DB"
          "$PY" -B - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          from crypto_signal.data.models import MarketType
          from crypto_signal.data.provider_divergence import ProviderDivergenceStore
          from crypto_signal.intelligence.cross_venue_quality import (
              CrossVenueQualityState,
              CrossVenueScope,
              assess_cross_venue_quality,
          )

          path=Path(os.environ["RDP9_DIVERGENCE_DB"])
          assert path.is_file(), path
          store=ProviderDivergenceStore(path)
          assert store.quick_check()

          seen=0
          for symbol in ("BTCUSDT","ETHUSDT","SOLUSDT"):
              snapshot=store.latest(
                  market_type=MarketType.SPOT,
                  symbol=symbol,
                  timeframe="15m",
              )
              assert snapshot is not None, symbol
              assessment=assess_cross_venue_quality(snapshot)
              assert assessment.score_authority is False
              assert assessment.directional_authority is False
              assert assessment.production_authority is False
              assert assessment.real_capital == 0
              if assessment.state is CrossVenueQualityState.MATERIAL_PRICE_DISAGREEMENT:
                  assert assessment.scope is CrossVenueScope.VENUE_LOCAL
                  assert assessment.material_conflict_identities
              if assessment.scope is CrossVenueScope.BROAD_TWO_VENUE:
                  assert assessment.state is CrossVenueQualityState.TWO_VENUE_CONFIRMED
                  assert not assessment.material_conflict_identities
              seen += 1
              print(
                  "AGENT_BOOTSTRAP_RDP9_LIVE "
                  f"symbol={symbol} "
                  f"scope={assessment.scope.value} "
                  f"state={assessment.state.value} "
                  f"assessment={assessment.assessment_identity} "
                  f"conflicts={len(assessment.material_conflict_identities)}",
                  flush=True,
              )

          assert seen == 3
          print("RDP9_BOOTSTRAP_LIVE_READ_ONLY=PASS")
          print("PRODUCTION_RUNTIME_MUTATED=NO")
          print("REAL_CAPITAL=0")
          PY
