name: RDP6 Options Source Store UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/options.py"
      - "src/crypto_signal/data/adapters/bybit_options.py"
      - "src/crypto_signal/data/options_surface_store.py"
      - "src/crypto_signal/data/options_source_contract.py"
      - "tests/test_rdp6_options_contract.py"
      - "tests/test_rdp6_options_source_store.py"
      - "tests/fixtures/rdp6/**"
      - ".github/workflows/crypto-rdp6-options-source-store.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test -d "$WB/.git"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP6_B_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP6_B_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused options source/store acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q             tests/test_rdp6_options_contract.py             tests/test_rdp6_options_source_store.py             tests/test_rdp5_liquidation_heatmap_crowding_family.py             tests/test_rdp5_derivatives_dynamics_family.py
          "$PY" -m ruff check             src/crypto_signal/data/options.py             src/crypto_signal/data/adapters/bybit_options.py             src/crypto_signal/data/options_surface_store.py             src/crypto_signal/data/options_source_contract.py             tests/test_rdp6_options_contract.py             tests/test_rdp6_options_source_store.py
          "$PY" -m mypy             src/crypto_signal/data/options.py             src/crypto_signal/data/adapters/bybit_options.py             src/crypto_signal/data/options_surface_store.py             src/crypto_signal/data/options_source_contract.py
          "$PY" -m py_compile             src/crypto_signal/data/options.py             src/crypto_signal/data/adapters/bybit_options.py             src/crypto_signal/data/options_surface_store.py             src/crypto_signal/data/options_source_contract.py             tests/test_rdp6_options_source_store.py
          echo "RDP6_B_OPTIONS_SOURCE_STORE_PASS=YES"
          echo "EMPTY_OPTION_RESPONSE_ZERO_EVIDENCE=FORBIDDEN"
          echo "OPTIONS_RUNTIME_ACTIVATION=NO"
          echo "REAL_CAPITAL=0"
