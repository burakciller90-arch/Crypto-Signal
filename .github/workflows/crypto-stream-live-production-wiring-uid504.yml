name: Crypto Stream Live Production Wiring UID504

on:
  push:
    branches:
      - 'stream/live-production-wiring-postcutover'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-live-production-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-live-production-wiring:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Prepare isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-live-production-wiring-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-live-production-wiring-dev-state"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused production Stream wiring acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q \
            tests/test_intelligence_stream_forward_runtime.py \
            tests/test_wc2_prepared_live_runtime.py \
            tests/test_wc2_live_clock_wiring.py \
            tests/test_wc2_ssd_supervisor_single_owner.py \
            tests/test_intelligence_stream_read_model.py \
            tests/test_wc2_outcome_resolution_runtime.py \
            tests/test_decision_proof_live_feed.py
          "$TEST_PY" -m ruff check \
            src/crypto_signal/product/intelligence_stream_forward_runtime.py \
            src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py \
            src/crypto_signal/evaluation/untouched_forward_resolution_runtime.py \
            src/crypto_signal/product/decision_proof.py \
            ops/run_live_evidence_clock.py \
            tests/test_intelligence_stream_forward_runtime.py \
            tests/test_wc2_prepared_live_runtime.py \
            tests/test_wc2_live_clock_wiring.py \
            tests/test_wc2_ssd_supervisor_single_owner.py
          "$TEST_PY" -m mypy \
            src/crypto_signal/product/intelligence_stream_forward_runtime.py \
            src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py \
            src/crypto_signal/evaluation/untouched_forward_resolution_runtime.py \
            src/crypto_signal/product/decision_proof.py \
            ops/run_live_evidence_clock.py
          bash -n ops/ssd_runtime_supervisor.sh
          echo "STREAM_FORWARD_ACTIVATION_PASS=YES"
          echo "STREAM_FORWARD_NO_BACKFILL_PASS=YES"
          echo "STREAM_FORWARD_REPLAY_IDEMPOTENCE_PASS=YES"
          echo "STREAM_LIVE_CLOCK_WIRING_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node --check src/crypto_signal/product/stream/app.js
          node --check src/crypto_signal/product/stream/evidence.js
          node --check src/crypto_signal/product/stream/visual_proof.js
          node --check src/crypto_signal/product/stream/notifications.js
          node tests/js/test_product_freshness.js
          echo "STREAM_LIVE_WIRING_FULL_REPOSITORY_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-live-production-wiring-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_LIVE_WIRING_UID504_NON_MUTATING_PASS=YES"
