name: World-Class WC2 Paper Execution Protocol Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_execution_protocol.py"
      - "ops/register_wc2_paper_execution_protocol.py"
      - ".github/workflows/crypto-mac-command.yml"
      - ".github/workflows/world-class-wc2-paper-execution-protocol-hosted.yml"
      - "tests/test_wc2_paper_execution_protocol.py"
      - "tests/test_wc2_paper_execution_protocol_registration.py"
      - "tests/test_wc2_paper_execution_protocol_registration_workflow.py"
      - "tests/test_wc2_runtime_state_workflow.py"
      - "tests/test_wc2_collection_protocol_registration_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-paper-execution-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 paper execution protocol acceptance
        run: |
          python -m pytest -q \
            tests/test_wc2_paper_execution_protocol.py \
            tests/test_wc2_paper_execution_protocol_registration.py \
            tests/test_wc2_paper_execution_protocol_registration_workflow.py \
            tests/test_wc2_runtime_state_workflow.py \
            tests/test_wc2_collection_protocol_registration_workflow.py
          python -m ruff check \
            src/crypto_signal/evaluation/untouched_forward_execution_protocol.py \
            ops/register_wc2_paper_execution_protocol.py \
            tests/test_wc2_paper_execution_protocol.py \
            tests/test_wc2_paper_execution_protocol_registration.py \
            tests/test_wc2_paper_execution_protocol_registration_workflow.py \
            tests/test_wc2_runtime_state_workflow.py \
            tests/test_wc2_collection_protocol_registration_workflow.py
          python -m mypy \
            src/crypto_signal/evaluation/untouched_forward_execution_protocol.py \
            ops/register_wc2_paper_execution_protocol.py
          echo "WC2_EXECUTION_PROTOCOL_PREREGISTRATION_PASS=YES"
          echo "WC2_EXECUTION_PROTOCOL_EXISTING_LINEAGE_BYTE_STABLE_PASS=YES"
          echo "WC2_EXECUTION_PROTOCOL_ZERO_TRADE_ECONOMIC_CLAIM_FORBIDDEN_PASS=YES"
          echo "WC2_EXECUTION_PROTOCOL_REAL_ORDER_AUTHORITY_CLOSED_PASS=YES"
          echo "REAL_CAPITAL=0"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_EXECUTION_PROTOCOL_FULL_PASS=YES"
