name: Crypto Stream Final F8 Live Acceptance UID504

on:
  push:
    branches:
      - 'accept/f8-live-pass-final'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f8-live-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Verify exact accepted F8 source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="babd91393eaceffc2e4631b1a29f14c1ac7a4063"
          test "$(id -u)" = "504"
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          git diff --quiet "$EXPECTED_MAIN"...HEAD -- .             ':(exclude).github/workflows/crypto-stream-final-f8-live-acceptance-uid504.yml'
          echo "F8_EXACT_MERGED_SOURCE_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Fast-forward Development and Product to exact F8 main
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          EXPECTED_MAIN="babd91393eaceffc2e4631b1a29f14c1ac7a4063"

          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          DEV_BEFORE="$(git -C "$DEV" rev-parse HEAD)"
          PRODUCT_BEFORE="$(git -C "$PRODUCT" rev-parse HEAD)"
          SUP_BEFORE="$(cat "$ROOT/ssd-service-supervisor.pid")"

          git -C "$DEV" fetch origin main --quiet
          git -C "$PRODUCT" fetch origin main --quiet
          test "$(git -C "$DEV" rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git -C "$PRODUCT" rev-parse origin/main)" = "$EXPECTED_MAIN"
          git -C "$DEV" merge-base --is-ancestor "$DEV_BEFORE" "$EXPECTED_MAIN"
          git -C "$PRODUCT" merge-base --is-ancestor "$PRODUCT_BEFORE" "$EXPECTED_MAIN"
          git -C "$DEV" merge --ff-only "$EXPECTED_MAIN"
          git -C "$PRODUCT" merge --ff-only "$EXPECTED_MAIN"

          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test "$(cat "$ROOT/ssd-service-supervisor.pid")" = "$SUP_BEFORE"
          kill -0 "$SUP_BEFORE"

          echo "F8_DEV_BEFORE=$DEV_BEFORE" >> "$GITHUB_ENV"
          echo "F8_PRODUCT_BEFORE=$PRODUCT_BEFORE" >> "$GITHUB_ENV"
          echo "F8_SUPERVISOR_PID=$SUP_BEFORE" >> "$GITHUB_ENV"
          echo "F8_DEVELOPMENT_EXACT_MAIN_PASS=YES before=$DEV_BEFORE after=$EXPECTED_MAIN"
          echo "F8_PRODUCT_EXACT_MAIN_PASS=YES before=$PRODUCT_BEFORE after=$EXPECTED_MAIN"
          echo "REAL_CAPITAL=0"

      - name: Restart only Product dashboard under existing F7 supervisor
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED_MAIN="babd91393eaceffc2e4631b1a29f14c1ac7a4063"
          OLD="$(cat "$ROOT/dashboard.pid" 2>/dev/null || true)"
          test -n "$OLD"
          kill -0 "$OLD"
          kill -TERM "$OLD"

          for _ in {1..30}; do
            NEW="$(cat "$ROOT/dashboard.pid" 2>/dev/null || true)"
            if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && kill -0 "$NEW" >/dev/null 2>&1; then
              if ps -p "$NEW" -o command= | grep -F "$ROOT/Product/ops/run_dashboard.py" >/dev/null; then
                break
              fi
            fi
            sleep 1
          done

          NEW="$(cat "$ROOT/dashboard.pid")"
          test -n "$NEW"
          test "$NEW" != "$OLD"
          kill -0 "$NEW"
          test "$(cat "$ROOT/ssd-service-supervisor.pid")" = "$F8_SUPERVISOR_PID"
          kill -0 "$F8_SUPERVISOR_PID"

          for _ in {1..30}; do
            if curl -fsS --max-time 5 http://127.0.0.1:48700/api/health > "$RUNNER_TEMP/f8-health.json"; then
              break
            fi
            sleep 1
          done
          /usr/bin/python3 - "$RUNNER_TEMP/f8-health.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["status"]=="ok", p
          assert p["read_only"] is True, p
          assert p["real_capital"]==0, p
          assert p["stream_root_active"] is True, p
          PY

          MARKER="$(grep 'stream_rewrite status=ENABLED transport=loopback' "$ROOT/ServiceLogs/live.out.log" | tail -1 || true)"
          test -n "$MARKER"
          echo "$MARKER" | grep -F 'DETERMINISTIC_FALLBACK=YES' >/dev/null
          echo "$MARKER" | grep -F 'REAL_CAPITAL=0' >/dev/null

          echo "F8_DASHBOARD_RESTART_PASS=YES old=$OLD new=$NEW"
          echo "F8_F7_SUPERVISOR_PRESERVED_PASS=YES pid=$F8_SUPERVISOR_PID"
          echo "REAL_CAPITAL=0"

      - name: Run canonical genuine-production audit and classify unavailable sources
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          OUT="$RUNNER_TEMP/stream-final-f8-live-acceptance"
          mkdir -p "$OUT"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/ops"

          "$PY" "$GITHUB_WORKSPACE/ops/audit_stream_f8_production_e2e.py"             --base-url http://127.0.0.1:48700             --output "$OUT/audit.json"             --stream-ledger "$DEV/runtime/stream/intelligence_stream.sqlite3"

          "$PY" - "$OUT/audit.json" "$OUT/classification.json" "$OUT/browser.env" <<'PY'
          import json,shlex,sys
          from pathlib import Path

          audit=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          groups={g["name"]:g for g in audit.get("groups",[])}

          for required in ("market_or_intelligence","risk_or_system"):
              group=groups.get(required)
              assert isinstance(group,dict), (required,group)
              assert group.get("status")=="ACCEPTED_CANDIDATE", group

          for deferred in ("decision","outcome"):
              group=groups.get(deferred)
              assert isinstance(group,dict), (deferred,group)
              assert group.get("status")=="OPEN_NO_ACCEPTABLE_REAL_EVENT", group
              counts=group.get("observed_counts")
              assert isinstance(counts,dict), group
              assert sum(int(v) for v in counts.values())==0, group

          capital=groups.get("capital")
          assert isinstance(capital,dict), capital
          assert capital.get("required") is False, capital

          sse=audit.get("sse")
          assert isinstance(sse,dict) and sse.get("status")=="PASS", sse
          ledger=audit.get("stream_ledger_negative_acceptance")
          assert isinstance(ledger,dict) and ledger.get("status")=="PASS", ledger

          market=groups["market_or_intelligence"]["representative"]
          assert isinstance(market,dict), market

          classification={
              "status":"PASS_CURRENT_LIVE_SCOPE",
              "accepted_live_groups":[
                  "market_or_intelligence",
                  "risk_or_system",
              ],
              "operational_evidence_deferred":{
                  "decision":{
                      "reason":"zero genuine production Stream messages; projector implementation retained but F8 does not claim live evidence",
                      "observed_count":0,
                  },
                  "outcome":{
                      "reason":"zero genuine production Stream messages; projector implementation retained but F8 does not claim live evidence",
                      "observed_count":0,
                  },
                  "capital":{
                      "reason":"dedicated Portfolio/Capital live behavior deferred by current frontend scope",
                      "required":False,
                  },
              },
              "historical_backfill":False,
              "synthetic_activity":False,
              "production_authority":False,
              "real_capital":0,
          }
          Path(sys.argv[2]).write_text(json.dumps(classification,indent=2,sort_keys=True)+"\n")
          env={
              "F8_BROWSER_ID":market["narrative_identity"],
              "F8_BROWSER_CATEGORY":market["category"],
              "F8_BROWSER_SEARCH":market["search_text"],
          }
          Path(sys.argv[3]).write_text(
              "".join(f"{k}={shlex.quote(str(v))}\n" for k,v in env.items())
          )

          print("F8_AUDIT_MARKET_OR_INTELLIGENCE=PASS")
          print("F8_AUDIT_RISK_OR_SYSTEM=PASS")
          print("F8_DECISION_OPERATIONAL_EVIDENCE=DEFERRED_ZERO_GENUINE_EVENTS")
          print("F8_OUTCOME_OPERATIONAL_EVIDENCE=DEFERRED_ZERO_GENUINE_EVENTS")
          print("F8_CAPITAL_OPERATIONAL_EVIDENCE=DEFERRED_PORTFOLIO_WORKSTREAM")
          print("F8_SSE_DUPLICATE_AUDIT=PASS")
          print("F8_LEDGER_NEGATIVE_ACCEPTANCE=PASS")
          print("HISTORICAL_BACKFILL=NO")
          print("SYNTHETIC_ACTIVITY=NO")
          print("REAL_CAPITAL=0")
          PY
          cat "$OUT/browser.env" >> "$GITHUB_ENV"

      - name: Probe genuine production message in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          OUT="$RUNNER_TEMP/stream-final-f8-live-acceptance"
          BROWSER=""
          for candidate in             "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"             "/Applications/Chromium.app/Contents/MacOS/Chromium"             "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"             "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary"; do
            if [ -x "$candidate" ]; then BROWSER="$candidate"; break; fi
          done
          test -n "$BROWSER"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/ops"

          "$PY" "$GITHUB_WORKSPACE/ops/probe_stream_f8_browser.py"             --browser "$BROWSER"             --base-url http://127.0.0.1:48700             --narrative-identity "$F8_BROWSER_ID"             --category "$F8_BROWSER_CATEGORY"             --search-text "$F8_BROWSER_SEARCH"             --output "$OUT/browser.json"             --screenshot "$OUT/browser.png"             --width 1440             --height 1000

          echo "F8_REAL_BROWSER_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Verify exact deployed checkouts and no mutation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED_MAIN="babd91393eaceffc2e4631b1a29f14c1ac7a4063"
          test "$(git -C "$ROOT/Development" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C "$ROOT/Product" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$ROOT/Development" status --porcelain)"
          test -z "$(git -C "$ROOT/Product" status --porcelain)"
          test "$(cat "$ROOT/ssd-service-supervisor.pid")" = "$F8_SUPERVISOR_PID"
          kill -0 "$F8_SUPERVISOR_PID"
          echo "F8_NON_MUTATING_DEPLOY_PASS=YES"
          echo "F8_PHYSICAL_LIVE_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Upload F8 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f8-live-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-final-f8-live-acceptance
          if-no-files-found: warn
          retention-days: 14
