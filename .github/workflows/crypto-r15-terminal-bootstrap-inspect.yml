name: Crypto R15 Proven Terminal Bootstrap Inspect

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-terminal-bootstrap-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect proven UID504 terminal bootstrap
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Read proven scripts through UID504 bridge
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set +e
          BASE="$HOME/Library/Application Support/CryptoSignalRunner"
          for f in             "$BASE/runner-terminal-watchdog.sh"             "$BASE/start-ssd-runner.command"             "$BASE/runner-ssd-bootstrap.sh"             "$BASE/watchdog.sh"
          do
            echo "=== FILE $f ==="
            ls -lOe "$f" 2>&1
            sed -n '1,260p' "$f" 2>&1
          done
          echo "R15_PROVEN_TERMINAL_BOOTSTRAP_INSPECT_DONE=YES"
          SH
