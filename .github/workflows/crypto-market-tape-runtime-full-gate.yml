name: Crypto Market Tape Runtime Full Gate

on:
  push:
    branches:
      - v1.1-market-tape-runtime-v1
    paths:
      - ".github/workflows/crypto-market-tape-runtime-full-gate.yml"
      - "src/crypto_signal/data/market_tape_runtime.py"
      - "src/crypto_signal/data/market_tape_retention.py"
      - "src/crypto_signal/data/market_tape_wire_collection.py"
      - "ops/run_market_tape_runtime.py"
      - "ops/install_market_tape_runtime.sh"
      - "ops/market_tape/launchd/com.cryptosignal.markettape.plist"
      - "tests/test_market_tape_runtime.py"
      - "tests/test_market_tape_retention.py"
      - "tests/test_market_tape_runtime_service.py"
      - "tests/test_market_tape_wire_collection.py"

permissions:
  contents: read

jobs:
  gate:
    name: Market Tape runtime hosted full gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.1" "ruff>=0.13" "mypy>=1.18"
      - name: Shell syntax
        run: bash -n ops/install_market_tape_runtime.sh
      - name: Focused runtime tests
        run: |
          python -m pytest -q             tests/test_market_tape_runtime.py             tests/test_market_tape_retention.py             tests/test_market_tape_runtime_service.py             tests/test_market_tape_wire_collection.py
      - name: Full repository gate
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py ops/run_market_tape_runtime.py
          python -m mypy src ops/verify_stage10_integrated.py ops/run_market_tape_runtime.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "MARKET_TAPE_RUNTIME_HOSTED_FULL_GATE_PASS=YES"
