name: RDP7 DefiLlama Stablecoin Capital Flow UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/adapters/defillama_stablecoins.py"
      - "src/crypto_signal/data/onchain_capital_flow.py"
      - "src/crypto_signal/data/onchain_capital_flow_store.py"
      - "src/crypto_signal/data/stablecoin_source_contract.py"
      - "src/crypto_signal/intelligence/stablecoin_capital_flow.py"
      - "tests/test_rdp7_defillama_stablecoin_source.py"
      - "tests/test_rdp7_stablecoin_capital_flow.py"
      - "tests/test_rdp7_onchain_capital_flow_contract.py"
      - "tests/test_rdp7_onchain_capital_flow_store.py"
      - ".github/workflows/crypto-rdp7-defillama-stablecoin-c.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP7_C_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP7_C_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused DefiLlama stablecoin acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp7_defillama_stablecoin_source.py \
            tests/test_rdp7_stablecoin_capital_flow.py \
            tests/test_rdp7_onchain_capital_flow_contract.py \
            tests/test_rdp7_onchain_capital_flow_store.py \
            tests/test_exchange_flow_engine.py \
            tests/test_large_transfer_clusters.py \
            tests/test_wallet_cohort_registry.py
          "$PY" -m ruff check \
            src/crypto_signal/data/adapters/defillama_stablecoins.py \
            src/crypto_signal/data/onchain_capital_flow.py \
            src/crypto_signal/data/onchain_capital_flow_store.py \
            src/crypto_signal/data/stablecoin_source_contract.py \
            src/crypto_signal/intelligence/stablecoin_capital_flow.py \
            tests/test_rdp7_defillama_stablecoin_source.py \
            tests/test_rdp7_stablecoin_capital_flow.py
          "$PY" -m mypy \
            src/crypto_signal/data/adapters/defillama_stablecoins.py \
            src/crypto_signal/data/onchain_capital_flow.py \
            src/crypto_signal/data/onchain_capital_flow_store.py \
            src/crypto_signal/data/stablecoin_source_contract.py \
            src/crypto_signal/intelligence/stablecoin_capital_flow.py
          "$PY" -m py_compile \
            src/crypto_signal/data/adapters/defillama_stablecoins.py \
            src/crypto_signal/data/stablecoin_source_contract.py \
            src/crypto_signal/intelligence/stablecoin_capital_flow.py
          echo "RDP7_C_DEFILLAMA_STABLECOIN_PASS=YES"
          echo "PROVIDER_TIMESTAMP_INVENTED=NO"
          echo "COLLECTOR_RECEIPT_SEMANTIC=EXPLICIT"
          echo "MISSING_SNAPSHOT_AS_ZERO_DELTA=FORBIDDEN"
          echo "STABLECOIN_SUPPLY_IS_DESCRIPTIVE_NOT_DIRECTIONAL=YES"
          echo "LIVE_RUNTIME_ACTIVATION=NO"
          echo "NO_NEW_FAMILY_OR_DIRECTION=YES"
          echo "REAL_CAPITAL=0"
