name: FP6 execution lineage patch helper

on:
  push:
    branches:
      - "fp6/execution-funding-r22-passport-lineage-20261001"
    paths:
      - ".github/workflows/fp6-execution-lineage-patch.yml"
      - ".github/scripts/patch_fp6_execution_lineage.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fp6/execution-funding-r22-passport-lineage-20261001"
          fetch-depth: 0
          clean: true
      - name: Persist FP6 lineage acceptance checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_fp6_execution_lineage.py
          git diff --check
          git config user.name "crypto-signal-agent"
          git config user.email "crypto-signal-agent@users.noreply.github.com"
          git add docs/agent/CURRENT_FRONTIER.md docs/agent/HANDOFF_LOG.md
          if git diff --cached --quiet; then
            echo "CHECKPOINT_ALREADY_PRESENT=YES"
          else
            git commit -m "chore: checkpoint FP6 lineage acceptance start"
            git push origin HEAD:fp6/execution-funding-r22-passport-lineage-20261001
          fi
          echo "FP6_LINEAGE_ACCEPTANCE_CHECKPOINT=PASS"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"
