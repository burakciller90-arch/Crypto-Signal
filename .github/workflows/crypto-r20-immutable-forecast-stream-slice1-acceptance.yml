name: Crypto R20 Immutable Forecast Stream Slice1 Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-r20-immutable-forecast-stream-v1-slice1
    paths:
      - "src/crypto_signal/forecast_stream.py"
      - "tests/test_immutable_forecast_stream.py"
      - "docs/R20_IMMUTABLE_FORECAST_STREAM_SLICE1.md"
      - ".github/workflows/crypto-r20-immutable-forecast-stream-slice1-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: R20 focused acceptance
        run: |
          python -m pytest -q tests/test_immutable_forecast_stream.py tests/test_alpha_factory_probability_calibration_gate.py tests/test_confluence_matrix_v2.py tests/test_event_risk_circuit_breaker.py tests/test_signal_lifecycle.py tests/test_signal_semantics.py tests/test_outcome_evaluator.py
          python -m ruff check src/crypto_signal/forecast_stream.py tests/test_immutable_forecast_stream.py
          python -m mypy src/crypto_signal/forecast_stream.py
          echo "R20_IMMUTABLE_FORECAST_STREAM_SLICE1_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests research ops/verify_stage10_integrated.py
          python -m mypy src research ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R20_IMMUTABLE_FORECAST_STREAM_SLICE1_FULL_PASS=YES"
