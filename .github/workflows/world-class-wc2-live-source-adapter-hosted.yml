name: World-Class WC2 Live Source Adapter Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/ledger/live_clock.py"
      - "src/crypto_signal/evaluation/live_untouched_forward_operational.py"
      - "tests/test_live_freeze_clock.py"
      - "tests/test_wc2_live_source_adapter.py"
      - ".github/workflows/world-class-wc2-live-source-adapter-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-live-source-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 live-source acceptance
        run: |
          python -m pytest -q tests/test_wc2_live_source_adapter.py tests/test_live_freeze_clock.py tests/test_exact_decision_composition.py tests/test_unified_decision_runtime.py
          python -m ruff check src/crypto_signal/ledger/live_clock.py src/crypto_signal/evaluation/live_untouched_forward_operational.py tests/test_live_freeze_clock.py tests/test_wc2_live_source_adapter.py
          python -m mypy src/crypto_signal/ledger/live_clock.py src/crypto_signal/evaluation/live_untouched_forward_operational.py
          echo "WC2_LIVE_SOURCE_SAME_CYCLE_PASS=YES"
          echo "WC2_LIVE_SOURCE_NO_BACKFILL_PASS=YES"
          echo "WC2_LIVE_SOURCE_MISSING_EVIDENCE_FAIL_CLOSED_PASS=YES"
          echo "WC2_LIVE_SOURCE_NOT_CALIBRATED_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_LIVE_SOURCE_FULL_PASS=YES"
