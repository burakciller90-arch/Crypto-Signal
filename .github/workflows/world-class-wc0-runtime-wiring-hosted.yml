name: World Class WC0 Runtime Wiring Hosted

on:
  push:
    branches:
      - world-class-wc0-runtime-wiring-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc0-runtime-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC0 runtime wiring acceptance
        run: |
          python -m pytest -q             tests/test_wc0_runtime_wiring.py             tests/test_galactech_production_cutover.py             tests/test_r25_operational_truth.py             tests/test_market_data_runtime_product.py             tests/test_runtime_replay_product_truth.py
          python -m ruff check ops/run_dashboard.py tests/test_wc0_runtime_wiring.py
          python -m mypy ops/run_dashboard.py
          node --check src/crypto_signal/product/galactech/app.js
          echo "WC0_RUNTIME_WIRING_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py ops/run_dashboard.py
          python -m mypy src ops/verify_stage10_integrated.py ops/run_dashboard.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC0_RUNTIME_WIRING_FULL_PASS=YES"
          echo "WC0_REAL_CAPITAL_ZERO_PASS=YES"
