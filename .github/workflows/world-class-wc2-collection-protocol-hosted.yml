name: World-Class WC2 Collection Protocol Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_collection_protocol.py"
      - "tests/test_wc2_collection_protocol.py"
      - "docs/WC2_UNTOUCHED_FORWARD_COLLECTION_PROTOCOL_V1.md"
      - ".github/workflows/world-class-wc2-collection-protocol-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-collection-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 collection protocol acceptance
        run: |
          python -m pytest -q             tests/test_wc2_collection_protocol.py             tests/test_wc2_untouched_forward_policy.py             tests/test_epoch2_accounting.py             tests/test_wc2_prepared_cycle.py
          python -m ruff check             src/crypto_signal/evaluation/untouched_forward_collection_protocol.py             tests/test_wc2_collection_protocol.py
          python -m mypy             src/crypto_signal/evaluation/untouched_forward_collection_protocol.py
          echo "WC2_COLLECTION_PROTOCOL_FOCUSED_PASS=YES"
          echo "WC2_COLLECTION_PROTOCOL_PREREGISTRATION_PASS=YES"
          echo "WC2_COLLECTION_PROTOCOL_NO_PERFORMANCE_SELECTION_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_COLLECTION_PROTOCOL_FULL_PASS=YES"
