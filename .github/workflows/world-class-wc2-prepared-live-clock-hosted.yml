name: World-Class WC2 Prepared Live Clock Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/run_live_evidence_clock.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py"
      - "tests/test_wc2_live_clock_wiring.py"
      - "tests/test_wc2_prepared_live_runtime.py"
      - ".github/workflows/world-class-wc2-prepared-live-clock-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-prepared-live-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused prepared live-clock acceptance
        run: |
          python -m pytest -q             tests/test_wc2_prepared_live_runtime.py             tests/test_wc2_live_clock_wiring.py             tests/test_wc2_prepared_cycle.py             tests/test_wc2_same_cycle_paper.py             tests/test_live_evidence_provider_divergence.py
          python -m ruff check             ops/run_live_evidence_clock.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py             tests/test_wc2_live_clock_wiring.py             tests/test_wc2_prepared_live_runtime.py
          python -m mypy             ops/run_live_evidence_clock.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py
          echo "WC2_PREPARED_BEFORE_R20_PASS=YES"
          echo "WC2_REPLAY_NO_BACKFILL_PASS=YES"
          echo "WC2_POST_ACTIVATION_GAP_FAIL_STOP_PASS=YES"
          echo "WC2_PRE_NETWORK_PREREQUISITE_GATE_PASS=YES"
          echo "WC2_NO_NUMERIC_SIZING_POLICY_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_PREPARED_LIVE_CLOCK_FULL_PASS=YES"
