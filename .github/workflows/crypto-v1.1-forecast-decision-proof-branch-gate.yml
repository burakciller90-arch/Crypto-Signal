name: Crypto v1.1 Forecast Decision Proof Branch Gate

on:
  push:
    branches:
      - v1.1-forecast-decision-proof-v1

permissions:
  contents: read

jobs:
  gate:
    name: Hosted v1.1 forecast Decision Proof full gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.1" "ruff>=0.13" "mypy>=1.18"
      - name: Full gate
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "V1_1_FORECAST_DECISION_PROOF_HOSTED_FULL_GATE_PASS=YES"
