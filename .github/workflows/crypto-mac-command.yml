          echo "=== HELPER LAUNCHCTL ==="; launchctl print "gui/504/com.cryptosignal.runnercutover.helper" 2>&1 | head -160
          echo "=== RUNNER LAUNCHCTL ==="; launchctl print "gui/504/$LABEL" 2>&1 | head -180
