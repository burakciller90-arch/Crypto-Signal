          done
          echo "=== RUNNER PROCESSES ==="
          ps -axo pid=,ppid=,user=,etime=,state=,command=             | grep -E '[V]olumes/Crypto-504/Crypto-Signal/Runner/(runsvc.sh|bin/Runner.Listener|bin/Runner.Worker)'             | head -120
          echo "RUNNER_PERSIST_DIAG_DONE=YES"
          exit 0

      - name: DASHBOARD OPEN UID504
        if: steps.parse.outputs.command == 'dashboardopen504'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          PRODUCT="$ROOT/Product"
          LEDGER="$ROOT/Development/runtime/ledger/live_signal_ledger.sqlite3"
          LOG="$ROOT/ServiceLogs"
          PIDFILE="$ROOT/dashboard-manual-504.pid"
          URL="http://127.0.0.1:48700"
          HEALTH="$URL/api/health"

          test "$(id -u)" = "504"
          test -x "$PRODUCT/.venv/bin/python"
          test -f "$PRODUCT/ops/run_dashboard.py"
          test -f "$LEDGER"
          mkdir -p "$LOG"

          if curl -fsS --max-time 3 "$HEALTH" > /tmp/crypto-dashboard-health-504.json 2>/dev/null; then
            echo "DASHBOARD_ALREADY_HEALTHY=YES"
          else
            echo "DASHBOARD_ALREADY_HEALTHY=NO"
            if /usr/sbin/lsof -nP -iTCP:48700 -sTCP:LISTEN >/tmp/crypto-port48700.txt 2>/dev/null; then
              cat /tmp/crypto-port48700.txt
              echo "PORT_48700_OCCUPIED_WHILE_HEALTH_FAILED"
              exit 81
            fi

            (
              unset RUNNER_TRACKING_ID
              export PYTHONPATH="$PRODUCT/src"
              /usr/bin/nohup "$PRODUCT/.venv/bin/python" "$PRODUCT/ops/run_dashboard.py" \
                --host 127.0.0.1 --port 48700 --ledger "$LEDGER" \
                --alert-outbox "$ROOT/Development/runtime/alerts/alert_outbox.sqlite3" \
                --paper-ledger "$ROOT/Development/runtime/paper/paper_fund.sqlite3" \
                --candle-cache "$ROOT/Development/runtime/data/live_base_15m_cache.sqlite3" \
                >>"$LOG/dashboard-manual-504.out.log" \
                2>>"$LOG/dashboard-manual-504.err.log" </dev/null &
              echo $! > "$PIDFILE"
            )

            ok=0
            for _ in {1..30}; do
              if curl -fsS --max-time 3 "$HEALTH" > /tmp/crypto-dashboard-health-504.json 2>/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" != "1" ]; then
              echo "=== DASHBOARD ERR ==="
              tail -160 "$LOG/dashboard-manual-504.err.log" 2>/dev/null || true
              echo "=== DASHBOARD OUT ==="
              tail -160 "$LOG/dashboard-manual-504.out.log" 2>/dev/null || true
              exit 82
            fi
          fi

          echo "=== HEALTH ==="
          cat /tmp/crypto-dashboard-health-504.json
          echo
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/crypto-dashboard-health-504.json").read_text())
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          print("DASHBOARD_SAFETY_CONTRACT_PASS=YES")
          PY

          echo "=== PROCESS ==="
          ps -axo pid=,ppid=,user=,etime=,command= \
            | grep -E '[C]rypto-504/Crypto-Signal/Product/.*run_dashboard.py' \
            | head -40 || true

          /usr/bin/open "$URL/"
          echo "CRYPTO_DASHBOARD_OPENED_UID504=YES"
          echo "CRYPTO_DASHBOARD_HEALTH_UID504=PASS"

      - name: RUNNER TERMINAL WATCHDOG INSTALL
        if: steps.parse.outputs.command == 'runnerterminalwatchdoginstall'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          LOCAL_ROOT="$HOME/Library/Application Support/CryptoSignalRunner"
          LOCAL_LOG="$HOME/Library/Logs/CryptoSignalRunner"
          START="$LOCAL_ROOT/start-ssd-runner.command"
          WATCH="$LOCAL_ROOT/runner-terminal-watchdog.sh"
          LABEL="com.cryptosignal.github-runner-terminal-watchdog"
          PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
          TARGET="gui/$(id -u)/$LABEL"
          OLD_LABEL="com.cryptosignal.github-runner-ssd"
          OLD_TARGET="gui/$(id -u)/$OLD_LABEL"

          test "$(id -u)" = "504"
          mkdir -p "$LOCAL_ROOT" "$LOCAL_LOG" "$HOME/Library/LaunchAgents"

          cat > "$START" <<'SH'
          #!/bin/bash
          set -u
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          RUNNER="$ROOT/Runner"
          LOG="$ROOT/RunnerLogs"
          LOCAL_LOG="$HOME/Library/Logs/CryptoSignalRunner"
          mkdir -p "$LOCAL_LOG"

          if /bin/ps -axo command= 2>/dev/null             | /usr/bin/grep -F '/Volumes/Crypto-504/Crypto-Signal/Runner/bin/Runner.Listener run --startuptype service'             | /usr/bin/grep -v grep >/dev/null 2>&1; then
            printf '%s RUNNER_ALREADY_ALIVE=YES\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" >>"$LOCAL_LOG/terminal-watchdog.log"
            exit 0
          fi

          if [ ! -x "$RUNNER/runsvc.sh" ]; then
            printf '%s SSD_RUNNER_NOT_READY=YES\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" >>"$LOCAL_LOG/terminal-watchdog.err.log"
            exit 75
          fi

          mkdir -p "$LOG"
          cd "$RUNNER" || exit 75
          unset RUNNER_TRACKING_ID
          export HOME="/Users/crypto-signal-agent"
          export ACTIONS_RUNNER_SVC=1
          nohup ./runsvc.sh             >>"$LOG/terminal-watchdog-runner.out.log"             2>>"$LOG/terminal-watchdog-runner.err.log"             </dev/null &
          pid=$!
          echo "$pid" > "$ROOT/ssd-runner-terminal-watchdog.pid"
          printf '%s STARTED_RUNSVC_PID=%s\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" "$pid" >>"$LOCAL_LOG/terminal-watchdog.log"
          sleep 5
          exit 0
          SH
          chmod 700 "$START"

          cat > "$WATCH" <<'SH'
          #!/bin/bash
          set -u
          LOCAL_ROOT="$HOME/Library/Application Support/CryptoSignalRunner"
          LOCAL_LOG="$HOME/Library/Logs/CryptoSignalRunner"
          START="$LOCAL_ROOT/start-ssd-runner.command"
          LOCK="$LOCAL_ROOT/terminal-watchdog.lock"
          mkdir -p "$LOCAL_LOG"

          if /bin/ps -axo command= 2>/dev/null             | /usr/bin/grep -F '/Volumes/Crypto-504/Crypto-Signal/Runner/bin/Runner.Listener run --startuptype service'             | /usr/bin/grep -v grep >/dev/null 2>&1; then
            exit 0
          fi

          if [ -f "$LOCK" ]; then
            now="$(date +%s)"
            then="$(stat -f %m "$LOCK" 2>/dev/null || echo 0)"
            if [ $((now-then)) -lt 90 ]; then
              exit 0
            fi
          fi

          date > "$LOCK"
          printf '%s REQUESTING_TERMINAL_START=YES\n' "$(date '+%Y-%m-%d %H:%M:%S %z')" >>"$LOCAL_LOG/terminal-watchdog.log"
          /usr/bin/open -gj -a Terminal "$START"
          sleep 12
          rm -f "$LOCK"
          exit 0
          SH
          chmod 700 "$WATCH"

          cat > "$PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>$LABEL</string>
            <key>ProgramArguments</key>
            <array>
              <string>/bin/bash</string>
              <string>$WATCH</string>
            </array>
            <key>RunAtLoad</key>
            <true/>
            <key>StartInterval</key>
            <integer>30</integer>
            <key>ProcessType</key>
            <string>Background</string>
            <key>StandardOutPath</key>
            <string>$LOCAL_LOG/terminal-watchdog-launchagent.out.log</string>
            <key>StandardErrorPath</key>
            <string>$LOCAL_LOG/terminal-watchdog-launchagent.err.log</string>
          </dict>
          </plist>
          PLIST

          chmod 644 "$PLIST"
          plutil -lint "$PLIST"

          launchctl bootout "$OLD_TARGET" >/dev/null 2>&1 || true
          launchctl bootout "$TARGET" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$(id -u)" "$PLIST"
          sleep 3

          echo "=== TERMINAL WATCHDOG ==="
          launchctl print "$TARGET" 2>&1 | egrep 'state =|runs =|last exit code =|run interval =|program =|path =' | head -100 || true
          echo "=== CURRENT SSD LISTENER ==="
          ps -axo pid=,ppid=,user=,etime=,command=             | grep -E '[V]olumes/Crypto-504/Crypto-Signal/Runner/(runsvc.sh|bin/Runner.Listener)'             | head -40
          launchctl print "$TARGET" >/dev/null
          ps -axo command=             | grep -F '/Volumes/Crypto-504/Crypto-Signal/Runner/bin/Runner.Listener run --startuptype service'             | grep -v grep >/dev/null
          echo "CRYPTO_UID504_TERMINAL_WATCHDOG_INSTALLED=YES"

