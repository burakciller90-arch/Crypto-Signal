name: Crypto Mac Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  command:
    if: github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[MAC] ')
    name: UID504 Allowlisted Command
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - name: Parse allowlisted command
        id: parse
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="command" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          case "$cmd" in
            status|services|logs|disk|sync|producttest|fulltest|productstate|productdeploy|paperreview|paperinspect|paperfixlint|paperharden|cursorreview|cursorreviewtail|cursorcleanup|bridgecheck|bridgestate|wakeresume|waketest|cursorcheck|cursorauthdiag|cursorttycheck)
              ;;
            *)
              echo "Unsupported command: $cmd"
              exit 2
              ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: STATUS
        if: steps.parse.outputs.command == 'status'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          echo "=== IDENTITY ==="
          id
          echo "=== REPO ==="
          git -C "$REPO" status --short --branch
          echo "HEAD=$(git -C "$REPO" rev-parse HEAD)"
          echo "=== DASHBOARD ==="
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health
          echo

      - name: SERVICES
        if: steps.parse.outputs.command == 'services'
        shell: bash
        run: |
          set +e
          for svc in com.cryptosignal.dashboard com.cryptosignal.liveevidenceclock com.cryptosignal.alertclock; do
            echo "=== $svc ==="
            launchctl print "gui/$(id -u)/$svc" 2>&1 | egrep 'state =|runs =|pid =|last exit code =|run interval =' | head -20
          done
          exit 0

      - name: LOGS
        if: steps.parse.outputs.command == 'logs'
        shell: bash
        run: |
          set +e
          for f in             /Users/crypto-signal-agent/Crypto-Signal/runtime/dashboard/dashboard.err.log             /Users/crypto-signal-agent/Crypto-Signal/runtime/dashboard/dashboard.out.log             /Users/crypto-signal-agent/Crypto-Signal/runtime/ledger/live_clock.err.log             /Users/crypto-signal-agent/Crypto-Signal/runtime/ledger/live_clock.out.log             /Users/crypto-signal-agent/Crypto-Signal/runtime/alerts/alert_clock.err.log             /Users/crypto-signal-agent/Crypto-Signal/runtime/alerts/alert_clock.out.log
          do
            echo "=== $f ==="
            if [ -f "$f" ]; then tail -80 "$f"; else echo "MISSING"; fi
          done
          exit 0

      - name: DISK
        if: steps.parse.outputs.command == 'disk'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          du -sh /Users/crypto-signal-agent/Crypto-Signal                  /Users/crypto-signal-agent/Crypto-Signal-Live                  /Users/crypto-signal-agent/Crypto-Signal-Product                  /Users/crypto-signal-agent/Crypto-Signal-Alerts                  /Users/crypto-signal-agent/actions-runner-crypto 2>/dev/null || true

      - name: SYNC
        if: steps.parse.outputs.command == 'sync'
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          echo "=== BEFORE ==="
          git -C "$REPO" status --short --branch
          test -z "$(git -C "$REPO" status --porcelain)"
          BEFORE="$(git -C "$REPO" rev-parse HEAD)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          git -C "$REPO" merge --ff-only FETCH_HEAD
          AFTER="$(git -C "$REPO" rev-parse HEAD)"
          echo "BEFORE=$BEFORE"
          echo "AFTER=$AFTER"
          git -C "$REPO" status --short --branch

      - name: PRODUCT TEST
        if: steps.parse.outputs.command == 'producttest'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          cd "$REPO"
          echo "=== DASHBOARD TESTS ==="
          ./.venv/bin/python -m pytest -q tests/test_dashboard_web.py tests/test_dashboard_alert_center.py tests/test_product_education.py
          echo "=== JAVASCRIPT SYNTAX ==="
          node --check src/crypto_signal/product/static/app.js
          echo "=== RUFF ==="
          ./.venv/bin/python -m ruff check src/crypto_signal/product tests/test_dashboard_web.py tests/test_dashboard_alert_center.py tests/test_product_education.py
          echo "=== MYPY EDUCATION ==="
          ./.venv/bin/python -m mypy src/crypto_signal/product/education.py

      - name: FULL TEST
        if: steps.parse.outputs.command == 'fulltest'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          cd "$REPO"
          test -z "$(git status --porcelain)"
          echo "=== PYTEST ==="
          ./.venv/bin/python -m pytest -q
          echo "=== RUFF ==="
          ./.venv/bin/python -m ruff check src tests
          echo "=== MYPY ==="
          ./.venv/bin/python -m mypy src
          echo "=== JAVASCRIPT ==="
          node --check src/crypto_signal/product/static/app.js
          echo "FULL_TEST_PASS=YES"

      - name: PRODUCT STATE
        if: steps.parse.outputs.command == 'productstate'
        shell: bash
        run: |
          set +e
          PRODUCT="/Users/crypto-signal-agent/Crypto-Signal-Product"
          echo "=== PRODUCT GIT ==="
          git -C "$PRODUCT" status --short --branch
          echo "HEAD=$(git -C "$PRODUCT" rev-parse HEAD 2>/dev/null)"
          echo "=== DASHBOARD SERVICE ==="
          launchctl print "gui/$(id -u)/com.cryptosignal.dashboard" 2>&1 | egrep 'state =|runs =|pid =|last exit code =' | head -30
          echo "=== HEALTH ==="
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health
          echo
          exit 0

      - name: PRODUCT DEPLOY
        if: steps.parse.outputs.command == 'productdeploy'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*([0-9a-f]{40})\s*$", body)
          if not m:
              raise SystemExit("INVALID_PRODUCT_DEPLOY_TARGET")
          print(m.group(1))
          PY
          )"
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PRODUCT="/Users/crypto-signal-agent/Crypto-Signal-Product"
          UID_NOW="$(id -u)"
          LABEL="com.cryptosignal.dashboard"
          test "$UID_NOW" = "504"
          test -z "$(git -C "$REPO" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          ORIGIN_MAIN="$(git -C "$REPO" rev-parse origin/main)"
          test "$TARGET" = "$ORIGIN_MAIN"
          git -C "$REPO" cat-file -e "$TARGET^{commit}"
          PREVIOUS="$(git -C "$PRODUCT" rev-parse HEAD)"
          echo "PREVIOUS=$PREVIOUS"
          echo "TARGET=$TARGET"

          rollback() {
            echo "ROLLBACK_TO=$PREVIOUS"
            git -C "$PRODUCT" checkout --detach "$PREVIOUS"
            launchctl kickstart -k "gui/$UID_NOW/$LABEL" || true
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback; fi; exit "$rc"' EXIT

          git -C "$PRODUCT" checkout --detach "$TARGET"
          launchctl kickstart -k "gui/$UID_NOW/$LABEL"
          ok=0
          for i in {1..30}; do
            if curl -fsS --max-time 3 http://127.0.0.1:48700/api/health > /tmp/crypto-product-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"
          cat /tmp/crypto-product-health.json
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/crypto-product-health.json").read_text())
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          trap - EXIT
          echo "PRODUCT_DEPLOY_PASS=YES"

      - name: PAPER INSPECT
        if: steps.parse.outputs.command == 'paperinspect'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          eval "$(/usr/bin/python3 - <<'PY'
          import os, re, shlex
          body = os.environ.get("ISSUE_BODY", "")
          mt = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          mp = re.search(r"(?im)^part:\s*(models_tail|ledger|tests)\s*$", body)
          if not mt or not mp:
              raise SystemExit("INVALID_PAPER_INSPECT_REQUEST")
          print("TARGET=" + shlex.quote(mt.group(1)))
          print("PART=" + shlex.quote(mp.group(1)))
          PY
          )"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          test -d "$WT"
          case "$PART" in
            models_tail)
              sed -n '180,620p' "$WT/src/crypto_signal/paper/models.py"
              ;;
            ledger)
              sed -n '1,700p' "$WT/src/crypto_signal/paper/ledger.py"
              ;;
            tests)
              sed -n '1,760p' "$WT/tests/test_paper_fund.py"
              ;;
          esac

      - name: PAPER FIX LINT
        if: steps.parse.outputs.command == 'paperfixlint'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          if not m:
              raise SystemExit("INVALID_PAPER_FIX_TARGET")
          print(m.group(1))
          PY
          )"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          test -d "$WT"
          BEFORE="$(git -C "$WT" status --porcelain | LC_ALL=C sort)"
          EXPECTED="$(printf '?? src/crypto_signal/paper/\n?? tests/test_paper_fund.py\n' | LC_ALL=C sort)"
          test "$BEFORE" = "$EXPECTED"
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check --fix "$WT/tests/test_paper_fund.py"
          AFTER="$(git -C "$WT" status --porcelain | LC_ALL=C sort)"
          test "$AFTER" = "$EXPECTED"
          PYTHONPATH="$WT/src" /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m pytest -q "$WT/tests/test_paper_fund.py"
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check "$WT/src/crypto_signal/paper" "$WT/tests/test_paper_fund.py"
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m mypy "$WT/src/crypto_signal/paper"
          echo "PAPER_LINT_FIX_PASS=YES"

      - name: PAPER HARDEN
        if: steps.parse.outputs.command == 'paperharden'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          if not m:
              raise SystemExit("INVALID_PAPER_HARDEN_TARGET")
          print(m.group(1))
          PY
          )"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          test -d "$WT"
          EXPECTED="$(printf '?? src/crypto_signal/paper/\n?? tests/test_paper_fund.py\n' | LC_ALL=C sort)"
          test "$(git -C "$WT" status --porcelain | LC_ALL=C sort)" = "$EXPECTED"

          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check --fix "$WT/tests/test_paper_fund.py"

          WT="$WT" /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path

          wt = Path(os.environ["WT"])
          models = wt / "src/crypto_signal/paper/models.py"
          tests = wt / "tests/test_paper_fund.py"

          text = models.read_text()
          nav_marker = "class NavSnapshotRecord:"
          benchmark_marker = "        expected_benchmarks = tuple("
          nav_hardening = '''        mark_price_by_symbol = dict(self.mark_prices)
                  missing_mark_symbols = {
                      position.symbol
                      for position in self.positions
                      if position.symbol not in mark_price_by_symbol
                  }
                  if missing_mark_symbols:
                      raise ValueError("every held position requires a mark price")
                  expected_nav_usdt = self.cash_usdt + sum(
                      (
                          position.quantity * mark_price_by_symbol[position.symbol]
                          for position in self.positions
                      ),
                      start=Decimal(0),
                  )
                  if self.nav_usdt != expected_nav_usdt:
                      raise ValueError(
                          "nav_usdt must equal cash plus marked position value"
                      )
          
          '''
          if "nav_usdt must equal cash plus marked position value" not in text:
              nav_start = text.find(nav_marker)
              if nav_start < 0:
                  raise SystemExit("NAV_CLASS_NOT_FOUND")
              insert_at = text.find(benchmark_marker, nav_start)
              if insert_at < 0:
                  raise SystemExit("NAV_BENCHMARK_ANCHOR_NOT_FOUND")
              text = text[:insert_at] + nav_hardening + text[insert_at:]
              models.write_text(text)

          t = tests.read_text()
          marker = "def test_append_replay_ordering_and_idempotency"
          new_test = '''def test_nav_snapshot_rejects_inconsistent_or_unmarked_state() -> None:
              fund = build_fund_creation(created_at_ms=1)
              with pytest.raises(ValueError, match="cash plus marked position value"):
                  build_nav_snapshot(
                      fund_identity=fund.record_identity,
                      snapshot_at_ms=2,
                      cash_usdt=Decimal("50.00"),
                      positions={PaperSymbol.BTCUSDT: Decimal("0.001")},
                      mark_prices={PaperSymbol.BTCUSDT: Decimal(50000)},
                      nav_usdt=Decimal("99.99"),
                  )

              with pytest.raises(ValueError, match="requires a mark price"):
                  build_nav_snapshot(
                      fund_identity=fund.record_identity,
                      snapshot_at_ms=3,
                      cash_usdt=Decimal("50.00"),
                      positions={PaperSymbol.BTCUSDT: Decimal("0.001")},
                      mark_prices={},
                      nav_usdt=Decimal("50.00"),
                  )


          '''
          if "test_nav_snapshot_rejects_inconsistent_or_unmarked_state" not in t:
              if marker not in t:
                  raise SystemExit("NAV_TEST_ANCHOR_NOT_FOUND")
              t = t.replace(marker, new_test + marker, 1)
              tests.write_text(t)
          PY

          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check --fix "$WT/src/crypto_signal/paper" "$WT/tests/test_paper_fund.py"
          PYTHONPATH="$WT/src" /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m pytest -q "$WT/tests/test_paper_fund.py"
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check "$WT/src/crypto_signal/paper" "$WT/tests/test_paper_fund.py"
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m mypy "$WT/src/crypto_signal/paper"
          test "$(git -C "$WT" status --porcelain | LC_ALL=C sort)" = "$EXPECTED"
          echo "PAPER_HARDEN_PASS=YES"

      - name: PAPER REVIEW
        if: steps.parse.outputs.command == 'paperreview'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          if not m:
              raise SystemExit("INVALID_PAPER_REVIEW_TARGET")
          print(m.group(1))
          PY
          )"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          test -d "$WT"
          echo "=== WORKTREE STATUS ==="
          git -C "$WT" status --short --branch
          ACTUAL="$(git -C "$WT" status --porcelain | LC_ALL=C sort)"
          EXPECTED="$(printf '?? src/crypto_signal/paper/\n?? tests/test_paper_fund.py\n' | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED"
          echo "=== PACKAGE INIT ==="
          sed -n '1,260p' "$WT/src/crypto_signal/paper/__init__.py"
          echo "=== MODELS ==="
          sed -n '1,520p' "$WT/src/crypto_signal/paper/models.py"
          echo "=== LEDGER ==="
          sed -n '1,620p' "$WT/src/crypto_signal/paper/ledger.py"
          echo "=== TESTS ==="
          sed -n '1,760p' "$WT/tests/test_paper_fund.py"
          echo "=== FORBIDDEN SURFACE GREP ==="
          if grep -REni 'requests|httpx|urllib|websocket|api[_-]?key|secret|credential|launchctl|subprocess|os\.system|real[_ -]?order|place[_ -]?order|leverage|short|martingale'               "$WT/src/crypto_signal/paper" "$WT/tests/test_paper_fund.py"; then
            echo "REVIEW_NOTE=matched_terms_above"
          else
            echo "REVIEW_NOTE=no_forbidden_terms"
          fi
          echo "=== FOCUSED TEST ==="
          PYTHONPATH="$WT/src" /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m pytest -q "$WT/tests/test_paper_fund.py"
          echo "=== RUFF ==="
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check "$WT/src/crypto_signal/paper" "$WT/tests/test_paper_fund.py"
          echo "=== MYPY ==="
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m mypy "$WT/src/crypto_signal/paper"
          echo "PAPER_REVIEW_PASS=YES"

      - name: CURSOR REVIEW
        if: steps.parse.outputs.command == 'cursorreview'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          if not m:
              raise SystemExit("INVALID_CURSOR_REVIEW_TARGET")
          print(m.group(1))
          PY
          )"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          test -d "$WT"
          echo "=== WORKTREE STATUS ==="
          git -C "$WT" status --short --branch
          echo "=== EDUCATION MODULE ==="
          sed -n '1,260p' "$WT/src/crypto_signal/product/education.py"
          echo "=== EDUCATION TESTS ==="
          sed -n '1,320p' "$WT/tests/test_product_education.py"
          echo "=== FOCUSED TEST ==="
          PYTHONPATH="$WT/src" /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m pytest -q "$WT/tests/test_product_education.py"
          echo "=== RUFF ==="
          /Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python -m ruff check "$WT/src/crypto_signal/product/education.py" "$WT/tests/test_product_education.py"
          echo "CURSOR_REVIEW_PASS=YES"

      - name: CURSOR REVIEW TAIL
        if: steps.parse.outputs.command == 'cursorreviewtail'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          if not m:
              raise SystemExit("INVALID_CURSOR_REVIEW_TARGET")
          print(m.group(1))
          PY
          )"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          test -d "$WT"
          echo "=== EDUCATION MODULE TAIL ==="
          sed -n '220,420p' "$WT/src/crypto_signal/product/education.py"
          echo "=== FILE COUNTS ==="
          wc -l "$WT/src/crypto_signal/product/education.py" "$WT/tests/test_product_education.py"

      - name: CURSOR CLEANUP
        if: steps.parse.outputs.command == 'cursorcleanup'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          TARGET="$(/usr/bin/python3 - <<'PY'
          import os, re
          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"(?im)^target:\s*(supervisor-[0-9]+)\s*$", body)
          if not m:
              raise SystemExit("INVALID_CURSOR_CLEANUP_TARGET")
          print(m.group(1))
          PY
          )"
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          WT="$HOME/.cursor/worktrees/crypto-signal/$TARGET"
          echo "TARGET=$TARGET"
          if [ -d "$WT" ]; then
            git -C "$REPO" worktree remove --force "$WT"
          fi
          git -C "$REPO" worktree prune
          test ! -e "$WT"
          echo "CURSOR_WORKTREE_CLEANED=YES"

      - name: WAKE RESUME
        if: steps.parse.outputs.command == 'wakeresume'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 /Users/crypto-signal-agent/Crypto-Signal/ops/continuity/resume_continuity.py

      - name: WAKE TEST
        if: steps.parse.outputs.command == 'waketest'
        shell: bash
        run: |
          set +e
          EVENT_ID="github-wake-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MESSAGE="CRYPTO_SIGNAL_TERMINAL_BRIDGE_TEST_V1 — Bu mesaj UID504 terminal/GitHub runner → UID502 Safari relay → mevcut ChatGPT sohbeti zincirinden otomatik gönderildi. Bu mesaj görünüyorsa terminalden bu sohbete geri yazma kanalı çalışıyor."
          /usr/bin/python3 /Users/crypto-signal-agent/Crypto-Signal/ops/continuity/relay_submit.py "$EVENT_ID" "$MESSAGE" 5
          rc=$?
          echo "RELAY_SUBMIT_RC=$rc"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
            exit 0
          fi
          exit "$rc"

      - name: CURSOR TTY CHECK
        if: steps.parse.outputs.command == 'cursorttycheck'
        shell: bash
        run: |
          set +e
          OUT="$HOME/.cursor/crypto-tty-auth-test.txt"
          PROBE="$HOME/.cursor/crypto-tty-auth-probe.sh"
          rm -f "$OUT"
          printf '%s\n' '#!/bin/zsh' 'export PATH="$HOME/.local/bin:$PATH"' 'agent status > "$HOME/.cursor/crypto-tty-auth-test.txt" 2>&1' 'exit' > "$PROBE"
          chmod 700 "$PROBE"
          /usr/bin/osascript -e 'tell application "Terminal" to do script "/bin/zsh /Users/crypto-signal-agent/.cursor/crypto-tty-auth-probe.sh"' >/dev/null 2>&1
          osa_rc=$?
          echo "OSASCRIPT_RC=$osa_rc"
          for i in {1..20}; do
            if [ -s "$OUT" ]; then break; fi
            sleep 1
          done
          echo "=== TTY AGENT STATUS ==="
          if [ -f "$OUT" ]; then cat "$OUT"; else echo "NO_OUTPUT"; fi
          exit 0

      - name: CURSOR AUTH DIAG
        if: steps.parse.outputs.command == 'cursorauthdiag'
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "=== IDENTITY/ENV ==="
          id
          printf 'HOME=%s\nUSER=%s\nLOGNAME=%s\nSHELL=%s\n' "$HOME" "$USER" "$LOGNAME" "$SHELL"
          echo "=== AGENT STATUS ==="
          agent status 2>&1
          echo "=== LOGIN HELP ==="
          agent login --help 2>&1 | head -120
          echo "=== ROOT HELP AUTH LINES ==="
          agent --help 2>&1 | egrep -i 'auth|api-key|login|token|status|config|sandbox|mode|workspace|worktree' | head -120
          echo "=== RECENT CURSOR AUTH/CONFIG FILE METADATA ==="
          for root in "$HOME/.cursor" "$HOME/.config" "$HOME/Library/Application Support/Cursor"; do
            if [ -d "$root" ]; then
              echo "--- $root"
              find "$root" -maxdepth 4 -type f -mmin -60 -print 2>/dev/null | head -120
            fi
          done
          echo "=== USER KEYCHAINS ==="
          security list-keychains -d user 2>&1
          echo "=== LOGIN KEYCHAIN INFO ==="
          security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" 2>&1
          exit 0

      - name: CURSOR CHECK
        if: steps.parse.outputs.command == 'cursorcheck'
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "=== CURSOR APP ==="
          ls -ld /Applications/Cursor.app "$HOME/Applications/Cursor.app" 2>/dev/null || true
          echo "=== AGENT PATH ==="
          command -v agent || true
          echo "=== AGENT VERSION ==="
          agent --version 2>&1 || true
          echo "=== AGENT AUTH STATUS ==="
          agent status 2>&1 || true
          echo "=== CURSOR CLI CANDIDATES ==="
          ls -l "$HOME/.local/bin/agent" "$HOME/.cursor/bin/agent" 2>/dev/null || true
          exit 0

      - name: BRIDGESTATE
        if: steps.parse.outputs.command == 'bridgestate'
        shell: bash
        run: |
          set +e
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          LOCAL="/Users/crypto-signal-agent/Crypto-Signal/runtime/continuity"
          echo "=== SHARED CURRENT CHAT ==="
          [ -f "$SHARED/current_chat_url" ] && cat "$SHARED/current_chat_url" || echo "MISSING"
          echo
          echo "=== SHARED RELAY STATUS ==="
          [ -f "$SHARED/relay_status" ] && cat "$SHARED/relay_status" || echo "MISSING"
          echo
          echo "=== SHARED HEARTBEAT MTIME ==="
          stat -f '%Sm %N' -t '%Y-%m-%d %H:%M:%S %z' "$SHARED/relay_heartbeat" 2>&1
          echo
          echo "=== LOCAL CURRENT CHAT ==="
          [ -f "$LOCAL/wake/current_chat_url" ] && cat "$LOCAL/wake/current_chat_url" || echo "MISSING"
          echo
          echo "=== USER PAUSE MARKERS ==="
          find "$LOCAL" -maxdepth 3 -type f \( -name '.user_pause' -o -path '*/wake/paused/*' \) -print 2>/dev/null | tail -20
          echo
          echo "=== BRIDGE LOG TAIL ==="
          tail -60 "$LOCAL/bridge.log" 2>/dev/null
          echo
          echo "=== RELAY LOG TAIL ==="
          tail -60 "$SHARED/relay.log" 2>/dev/null
          echo
          echo "=== TRANSPORT LOG TAIL ==="
          tail -60 "$SHARED/transport.log" 2>/dev/null
          exit 0

      - name: BRIDGECHECK
        if: steps.parse.outputs.command == 'bridgecheck'
        shell: bash
        run: |
          set +e
          echo "=== SHARED RELAY PATHS ==="
          for p in             /Users/Shared/.crypto-signal-wake-relay             /Users/Shared/Crypto-Signal-Wake-Bridge             /Users/Shared/Crypto-Signal-Wake-Bridge-Requests             /Users/Shared/.chatgpt-host-gui.lockfile
          do
            echo "--- $p"
            ls -lad "$p" 2>&1
            if [ -d "$p" ]; then
              find "$p" -maxdepth 2 -type f -print 2>/dev/null | head -100
            fi
          done
          echo "=== CRYPTO CONTINUITY FILES ==="
          find /Users/crypto-signal-agent/Crypto-Signal/runtime                /Users/crypto-signal-agent/Crypto-Signal                -maxdepth 4 -type f                \( -iname '*wake*' -o -iname '*lease*' -o -iname '*bridge*' -o -iname '*chat*' \)                -print 2>/dev/null | head -150
          echo "=== UID504 LAUNCH AGENTS MATCHING BRIDGE/WAKE ==="
          launchctl print "gui/$(id -u)" 2>/dev/null | egrep -i 'crypto|wake|bridge|chatgpt|lease' | head -120
          exit 0
