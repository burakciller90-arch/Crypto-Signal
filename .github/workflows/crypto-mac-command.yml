          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" - "$RUNTIME" "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import shutil
          import sqlite3
          import sys
          import tempfile
          import time
          from collections import Counter
          from pathlib import Path

          runtime = Path(sys.argv[1])
          runner_temp = Path(sys.argv[2])
          sources = {
              "execution_protocol": runtime / "wc2" / "wc2_paper_execution.wc2-paper-execution-protocol.sqlite3",
              "execution_runtime": runtime / "wc2" / "wc2_paper_execution.wc2-paper-execution-runtime.sqlite3",
              "execution_journal": runtime / "wc2" / "wc2_paper_execution.wc2-paper-execution.sqlite3",
              "epoch2": runtime / "paper" / "paper_fund_epoch2.sqlite3",
          }

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def snapshot(path: Path) -> dict[str, str | None]:
              return {
                  "main": digest(path),
                  "wal": digest(Path(str(path) + "-wal")),
                  "shm": digest(Path(str(path) + "-shm")),
              }

          temp_root = Path(tempfile.mkdtemp(prefix="wc2executionstate-", dir=runner_temp))
          copies: dict[str, Path | None] = {}
          accepted: dict[str, dict[str, str | None]] = {}
          try:
              for name, source in sources.items():
                  if not source.is_file():
                      copies[name] = None
                      print(f"WC2_EXECUTION_STATE_{name.upper()}_PRESENT=NO")
                      continue
                  target = temp_root / f"{name}.sqlite3"
                  stable = False
                  for attempt in range(1, 6):
                      before = snapshot(source)
                      for suffix in ("", "-wal", "-shm"):
                          src = Path(str(source) + suffix)
                          dst = Path(str(target) + suffix)
                          if src.is_file():
                              shutil.copy2(src, dst)
                          elif dst.exists():
                              dst.unlink()
                      after = snapshot(source)
                      if before == after:
                          copies[name] = target
                          accepted[name] = after
                          stable = True
                          print(
                              f"WC2_EXECUTION_STATE_{name.upper()}_PRESENT=YES "
                              f"snapshot_attempt={attempt} main_sha256={after['main']} "
                              f"wal_sha256={after['wal'] or 'MISSING'} "
                              f"shm_sha256={after['shm'] or 'MISSING'}"
                          )
                          break
                      time.sleep(0.05)
                  if not stable:
                      raise SystemExit(f"WC2_EXECUTION_STATE_{name.upper()}_SOURCE_UNSTABLE")

              protocol_id = None
              protocol = copies["execution_protocol"]
              if protocol is None:
                  print("WC2_EXECUTION_PROTOCOL_STATUS=NOT_REGISTERED")
              else:
                  with sqlite3.connect(protocol) as db:
                      quick = db.execute("PRAGMA quick_check").fetchone()
                      if quick is None or str(quick[0]).lower() != "ok":
                          raise SystemExit("WC2_EXECUTION_PROTOCOL_QUICK_CHECK_FAILED")
                      row = db.execute(
                          """
                          SELECT protocol_identity, execution_start_ms
                          FROM wc2_paper_execution_protocols
                          ORDER BY sequence_id DESC LIMIT 1
                          """
                      ).fetchone()
                  if row is None:
                      raise SystemExit("WC2_EXECUTION_PROTOCOL_RECORD_MISSING")
                  protocol_id = str(row[0])
                  print(
                      "WC2_EXECUTION_PROTOCOL_STATUS=REGISTERED "
                      f"protocol_identity={protocol_id} execution_start_ms={int(row[1])}"
                  )

              activation_id = None
              activation = copies["execution_runtime"]
              if activation is None:
                  print("WC2_EXECUTION_RUNTIME_STATUS=NOT_REGISTERED")
              else:
                  with sqlite3.connect(activation) as db:
                      quick = db.execute("PRAGMA quick_check").fetchone()
                      if quick is None or str(quick[0]).lower() != "ok":
                          raise SystemExit("WC2_EXECUTION_RUNTIME_QUICK_CHECK_FAILED")
                      row = db.execute(
                          """
                          SELECT activation_identity, execution_protocol_identity,
                                 registered_at_ms, collection_start_ms, payload_json
                          FROM wc2_paper_execution_runtime_activation
                          WHERE singleton=1
                          """
                      ).fetchone()
                  if row is None:
                      raise SystemExit("WC2_EXECUTION_RUNTIME_RECORD_MISSING")
                  activation_id = str(row[0])
                  if protocol_id is not None and str(row[1]) != protocol_id:
                      raise SystemExit("WC2_EXECUTION_RUNTIME_PROTOCOL_BINDING_MISMATCH")
                  payload = json.loads(str(row[4]))
                  if bool(payload.get("historical_backfill_authority")):
                      raise SystemExit("WC2_EXECUTION_RUNTIME_BACKFILL_AUTHORITY_MISMATCH")
                  if bool(payload.get("production_authority")) or int(payload.get("real_capital", -1)) != 0:
                      raise SystemExit("WC2_EXECUTION_RUNTIME_AUTHORITY_MISMATCH")
                  print(
                      "WC2_EXECUTION_RUNTIME_STATUS=REGISTERED "
                      f"activation_identity={activation_id} "
                      f"execution_protocol_identity={row[1]} "
                      f"registered_at_ms={int(row[2])} "
                      f"collection_start_ms={int(row[3])}"
                  )

              journal = copies["execution_journal"]
              if journal is None:
                  print("WC2_EXECUTION_JOURNAL_STATUS=EMPTY_OR_NOT_CREATED decisions=0")
              else:
                  with sqlite3.connect(journal) as db:
                      quick = db.execute("PRAGMA quick_check").fetchone()
                      if quick is None or str(quick[0]).lower() != "ok":
                          raise SystemExit("WC2_EXECUTION_JOURNAL_QUICK_CHECK_FAILED")
                      rows = db.execute(
                          """
                          SELECT status, payload_json
                          FROM wc2_paper_execution_events
                          ORDER BY sequence_id
                          """
                      ).fetchall()
                  counts = Counter(str(row[0]) for row in rows)
                  explicit_cost = 0
                  for status, payload_json in rows:
                      payload = json.loads(str(payload_json))
                      if activation_id is not None and payload.get("runtime_activation_identity") != activation_id:
                          raise SystemExit("WC2_EXECUTION_JOURNAL_RUNTIME_BINDING_MISMATCH")
                      if protocol_id is not None and payload.get("execution_protocol_identity") != protocol_id:
                          raise SystemExit("WC2_EXECUTION_JOURNAL_PROTOCOL_BINDING_MISMATCH")
                      if bool(payload.get("historical_backfill_performed")):
                          raise SystemExit("WC2_EXECUTION_JOURNAL_BACKFILL_MISMATCH")
                      if bool(payload.get("production_authority")) or int(payload.get("real_capital", -1)) != 0:
                          raise SystemExit("WC2_EXECUTION_JOURNAL_AUTHORITY_MISMATCH")
                      if str(status) == "EXECUTED":
                          required = (
                              payload.get("fill_identity"),
                              payload.get("cost_evidence_identity"),
                              payload.get("quantity"),
                              payload.get("reference_price"),
                              payload.get("simulated_fill_price"),
                          )
                          if any(value in (None, "") for value in required):
                              raise SystemExit("WC2_EXECUTION_JOURNAL_EXECUTION_ECONOMICS_MISSING")
                          explicit_cost += 1
                  print(
                      "WC2_EXECUTION_JOURNAL_STATUS=PERSISTED "
                      f"decisions={len(rows)} "
                      f"hold_cash={counts['HOLD_CASH']} "
                      f"sizing_rejected={counts['SIZING_REJECTED']} "
                      f"pretrade_rejected={counts['PRETRADE_REJECTED']} "
                      f"executed={counts['EXECUTED']} "
                      f"explicit_cost_executed={explicit_cost}"
                  )

              print("WC2_EXECUTION_STATE_SOURCE_BYTE_STABLE_PASS=YES")
              print("WC2_EXECUTION_STATE_READONLY_PASS=YES")
              print("REAL_CAPITAL=0")
          finally:
              shutil.rmtree(temp_root, ignore_errors=True)
          PY

      - name: WC2 STATE
        if: steps.parse.outputs.command == 'wc2state'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          RUNTIME="$DEV/runtime"
          PY="$DEV/.venv/bin/python"

          test "$(id -u)" = "504"
          test -x "$PY"

          echo "=== WC2 RUNTIME STATE ==="
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"
          echo "WORKFLOW_SHA=$GITHUB_SHA"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" - "$RUNTIME" "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import shutil
          import sqlite3
          import sys
          import tempfile
          import time
          from pathlib import Path

          runtime = Path(sys.argv[1])
          runner_temp = Path(sys.argv[2])
          sources = {
              "policy": runtime / "wc2" / "wc2_forward_policy.sqlite3",
              "protocol": (
                  runtime
                  / "wc2"
                  / "wc2_collection_protocol.wc2-collection-protocol.sqlite3"
              ),
              "execution_protocol": (
                  runtime
                  / "wc2"
                  / "wc2_paper_execution.wc2-paper-execution-protocol.sqlite3"
              ),
              "decision": runtime / "decision" / "decision_evidence.sqlite3",
              "shadow_cycle": runtime / "r25" / "r25.shadow-cycle.sqlite3",
              "epoch2": runtime / "paper" / "paper_fund_epoch2.sqlite3",
              "cohort": runtime / "wc2" / "wc2_untouched_forward.sqlite3",
          }

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              hasher = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      hasher.update(chunk)
              return hasher.hexdigest()

          def source_snapshot(path: Path) -> dict[str, str | None]:
              return {
                  "main": digest(path),
                  "wal": digest(Path(str(path) + "-wal")),
                  "shm": digest(Path(str(path) + "-shm")),
              }

          temp_root = Path(
              tempfile.mkdtemp(prefix="wc2state-", dir=runner_temp)
          )
          accepted: dict[str, dict[str, str | None]] = {}
          copies: dict[str, Path | None] = {}
          try:
              for name, source in sources.items():
                  if not source.is_file():
                      copies[name] = None
                      print(f"WC2_STATE_{name.upper()}_PRESENT=NO")
                      continue
                  target = temp_root / f"{name}.sqlite3"
                  stable = False
                  for attempt in range(1, 6):
                      before = source_snapshot(source)
                      for suffix in ("", "-wal", "-shm"):
                          src = Path(str(source) + suffix)
                          dst = Path(str(target) + suffix)
                          if src.is_file():
                              shutil.copy2(src, dst)
                          elif dst.exists():
                              dst.unlink()
                      after = source_snapshot(source)
                      if before == after:
                          accepted[name] = after
                          copies[name] = target
                          stable = True
                          print(
                              f"WC2_STATE_{name.upper()}_PRESENT=YES "
                              f"snapshot_attempt={attempt} "
                              f"main_sha256={after['main']} "
                              f"wal_sha256={after['wal'] or 'MISSING'} "
                              f"shm_sha256={after['shm'] or 'MISSING'}"
                          )
                          break
                      time.sleep(0.05)
                  if not stable:
                      raise SystemExit(
                          f"WC2_STATE_{name.upper()}_SOURCE_UNSTABLE"
                      )

              policy = copies["policy"]
              policy_identity = None
              review_collection_start_ms = None
              if policy is None:
                  print("WC2_POLICY_STATUS=NOT_REGISTERED")
              else:
                  with sqlite3.connect(policy) as db:
                      quick = db.execute("PRAGMA quick_check").fetchone()
                      if quick is None or str(quick[0]).lower() != "ok":
                          raise SystemExit("WC2_POLICY_QUICK_CHECK_FAILED")
                      row = db.execute(
                          """
                          SELECT policy_identity, preregistered_at_ms,
                                 collection_start_ms
                          FROM wc2_forward_policies
                          ORDER BY sequence_id DESC
                          LIMIT 1
                          """
                      ).fetchone()
                  if row is None:
                      raise SystemExit("WC2_POLICY_RECORD_MISSING")
                  policy_identity = str(row[0])
                  review_collection_start_ms = int(row[2])
                  print(
                      "WC2_POLICY_STATUS=REGISTERED "
                      f"policy_identity={policy_identity} "
                      f"preregistered_at_ms={int(row[1])} "
                      f"collection_start_ms={review_collection_start_ms}"
                  )

              protocol = copies["protocol"]
              protocol_identity = None
              protocol_epoch2_activation_identity = None
              collection_start_ms = None
              if protocol is None:
                  print("WC2_PROTOCOL_STATUS=NOT_REGISTERED")
              else:
                  with sqlite3.connect(protocol) as db:
                      quick = db.execute("PRAGMA quick_check").fetchone()
                      if quick is None or str(quick[0]).lower() != "ok":
                          raise SystemExit("WC2_PROTOCOL_QUICK_CHECK_FAILED")
                      row = db.execute(
                          """
                          SELECT protocol_identity, review_policy_identity,
                                 epoch2_activation_identity,
                                 preregistered_at_ms, collection_start_ms
                          FROM wc2_collection_protocols
                          ORDER BY sequence_id DESC
                          LIMIT 1
                          """
                      ).fetchone()
                  if row is None:
                      raise SystemExit("WC2_PROTOCOL_RECORD_MISSING")
                  if (
                      policy_identity is not None
                      and str(row[1]) != policy_identity
                  ):
                      raise SystemExit("WC2_PROTOCOL_POLICY_BINDING_MISMATCH")
                  protocol_identity = str(row[0])
                  protocol_epoch2_activation_identity = str(row[2])
                  collection_start_ms = int(row[4])
                  print(
                      "WC2_PROTOCOL_STATUS=REGISTERED "
                      f"protocol_identity={row[0]} "
                      f"review_policy_identity={row[1]} "
                      f"epoch2_activation_identity={row[2]} "
                      f"preregistered_at_ms={int(row[3])} "
                      f"collection_start_ms={collection_start_ms}"
                  )

              execution_protocol = copies["execution_protocol"]
              execution_start_ms = None
              if execution_protocol is None:
                  print("WC2_EXECUTION_PROTOCOL_STATUS=NOT_REGISTERED")
              else:
                  with sqlite3.connect(execution_protocol) as db:
                      quick = db.execute("PRAGMA quick_check").fetchone()
                      if quick is None or str(quick[0]).lower() != "ok":
                          raise SystemExit(
                              "WC2_EXECUTION_PROTOCOL_QUICK_CHECK_FAILED"
                          )
                      row = db.execute(
                          """
                          SELECT protocol_identity, review_policy_identity,
                                 collection_protocol_identity,
                                 epoch2_activation_identity,
                                 preregistered_at_ms, execution_start_ms,
                                 payload_json
                          FROM wc2_paper_execution_protocols
                          ORDER BY sequence_id DESC
                          LIMIT 1
                          """
                      ).fetchone()
                  if row is None:
                      raise SystemExit(
                          "WC2_EXECUTION_PROTOCOL_RECORD_MISSING"
                      )
                  if (
                      policy_identity is not None
                      and str(row[1]) != policy_identity
                  ):
                      raise SystemExit(
                          "WC2_EXECUTION_PROTOCOL_POLICY_BINDING_MISMATCH"
                      )
                  if (
                      protocol_identity is not None
                      and str(row[2]) != protocol_identity
                  ):
                      raise SystemExit(
                          "WC2_EXECUTION_PROTOCOL_COLLECTION_BINDING_MISMATCH"
                      )
                  if (
                      protocol_epoch2_activation_identity is not None
                      and str(row[3])
                      != protocol_epoch2_activation_identity
                  ):
                      raise SystemExit(
                          "WC2_EXECUTION_PROTOCOL_EPOCH2_BINDING_MISMATCH"
                      )
                  payload = json.loads(str(row[6]))
                  execution_start_ms = int(row[5])
                  print(
                      "WC2_EXECUTION_PROTOCOL_STATUS=REGISTERED "
                      f"protocol_identity={row[0]} "
                      f"review_policy_identity={row[1]} "
                      f"collection_protocol_identity={row[2]} "
                      f"epoch2_activation_identity={row[3]} "
                      f"preregistered_at_ms={int(row[4])} "
                      f"execution_start_ms={execution_start_ms} "
                      f"decision_mode={payload['decision_mode']} "
                      f"cost_policy={payload['simulated_cost_policy_version']} "
                      f"fee_rate={payload['simulated_fee_rate']} "
                      f"spread_rate={payload['simulated_spread_rate']} "
                      f"slippage_rate={payload['simulated_slippage_rate']} "
                      f"economic_claim_rule={payload['economic_claim_rule']} "
                      f"real_order_authority={payload['real_order_authority']} "
                      f"real_capital={payload['real_capital']}"
                  )

              def quick_ok(path: Path) -> sqlite3.Connection:
                  db = sqlite3.connect(path)
                  quick = db.execute("PRAGMA quick_check").fetchone()
                  if quick is None or str(quick[0]).lower() != "ok":
                      db.close()
                      raise SystemExit(f"WC2_COPY_QUICK_CHECK_FAILED:{path.name}")
                  return db

              decision = copies["decision"]
              if decision is not None:
                  with quick_ok(decision) as db:
                      forecast_total = int(
                          db.execute("SELECT COUNT(*) FROM r20_forecasts").fetchone()[0]
                      )
                      proof_total = int(
                          db.execute(
                              "SELECT COUNT(*) FROM r20_5_decision_proofs"
                          ).fetchone()[0]
                      )
                      resolution_total = int(
                          db.execute(
                              "SELECT COUNT(*) FROM r20_resolutions"
                          ).fetchone()[0]
                      )
                      feed_total = int(
                          db.execute(
                              "SELECT COUNT(*) FROM r20_5_live_feed_events"
                          ).fetchone()[0]
                      )
                      if collection_start_ms is None:
                          post_start_forecasts = -1
                          post_start_resolutions = -1
                      else:
                          post_start_forecasts = int(
                              db.execute(
                                  """
                                  SELECT COUNT(*) FROM r20_forecasts
                                  WHERE issued_at_ms >= ?
                                  """,
                                  (collection_start_ms,),
                              ).fetchone()[0]
                          )
                          post_start_resolutions = int(
                              db.execute(
                                  """
                                  SELECT COUNT(*)
                                  FROM r20_resolutions AS r
                                  JOIN r20_forecasts AS f
                                    ON f.forecast_identity=r.forecast_identity
                                  WHERE f.issued_at_ms >= ?
                                  """,
                                  (collection_start_ms,),
                              ).fetchone()[0]
                          )
                  print(
                      "WC2_DECISION_EVIDENCE "
                      f"forecasts={forecast_total} proofs={proof_total} "
                      f"resolutions={resolution_total} feed_events={feed_total} "
                      f"post_start_forecasts={post_start_forecasts} "
                      f"post_start_resolutions={post_start_resolutions}"
                  )

              shadow = copies["shadow_cycle"]
              if shadow is not None:
                  with quick_ok(shadow) as db:
                      total = int(
                          db.execute(
                              "SELECT COUNT(*) FROM r25_shadow_cycle_manifest"
                          ).fetchone()[0]
                      )
                      post = (
                          -1
                          if collection_start_ms is None
                          else int(
                              db.execute(
                                  """
                                  SELECT COUNT(*)
                                  FROM r25_shadow_cycle_manifest
                                  WHERE event_at_ms >= ?
                                  """,
                                  (collection_start_ms,),
                              ).fetchone()[0]
                          )
                      )
                  print(
                      "WC2_SHADOW_CYCLE "
                      f"manifests={total} post_start_manifests={post}"
                  )

              epoch2 = copies["epoch2"]
              if epoch2 is not None:
                  with quick_ok(epoch2) as db:
                      tables = {
                          str(row[0])
                          for row in db.execute(
                              """
                              SELECT name FROM sqlite_master
                              WHERE type='table'
                              """
                          ).fetchall()
                      }
                      counts = {}
                      for table in (
                          "r22_epoch2_intents",
                          "r22_epoch2_fills",
                          "r22_epoch2_bundles",
                      ):
                          if table in tables:
                              total = int(
                                  db.execute(
                                      f"SELECT COUNT(*) FROM {table}"
                                  ).fetchone()[0]
                              )
                              post = (
                                  -1
                                  if collection_start_ms is None
                                  else int(
                                      db.execute(
                                          f"""
                                          SELECT COUNT(*) FROM {table}
                                          WHERE event_at_ms >= ?
                                          """,
                                          (collection_start_ms,),
                                      ).fetchone()[0]
                                  )
                              )
                          else:
                              total = 0
                              post = 0
                          counts[table] = (total, post)
                  print(
                      "WC2_EPOCH2_R22 "
                      f"intents={counts['r22_epoch2_intents'][0]} "
                      f"post_start_intents={counts['r22_epoch2_intents'][1]} "
                      f"fills={counts['r22_epoch2_fills'][0]} "
                      f"post_start_fills={counts['r22_epoch2_fills'][1]} "
                      f"bundles={counts['r22_epoch2_bundles'][0]} "
                      f"post_start_bundles={counts['r22_epoch2_bundles'][1]}"
                  )

              cohort = copies["cohort"]
              if cohort is None:
                  print("WC2_COHORT_STATUS=NOT_PERSISTED")
              else:
                  with quick_ok(cohort) as db:
                      counts = {
                          table: int(
                              db.execute(
                                  f"SELECT COUNT(*) FROM {table}"
                              ).fetchone()[0]
                          )
                          for table in (
                              "wc2_cohort_forecasts",
                              "wc2_cohort_intents",
                              "wc2_cohort_executions",
                              "wc2_cohort_resolutions",
                          )
                      }
                      regime_rows = db.execute(
                          """
                          SELECT regime, COUNT(*)
                          FROM wc2_cohort_forecasts
                          GROUP BY regime
                          ORDER BY regime
                          """
                      ).fetchall()
                      latest_forecast = db.execute(
                          """
                          SELECT forecast_identity, regime, issued_at_ms
                          FROM wc2_cohort_forecasts
                          ORDER BY issued_at_ms DESC, sequence_id DESC
                          LIMIT 1
                          """
                      ).fetchone()
                      post_execution_start_executions = (
                          -1
                          if execution_start_ms is None
                          else int(
                              db.execute(
                                  """
                                  SELECT COUNT(*)
                                  FROM wc2_cohort_executions
                                  WHERE indexed_at_ms >= ?
                                  """,
                                  (execution_start_ms,),
                              ).fetchone()[0]
                          )
                      )
                  print(
                      "WC2_COHORT_STATUS=PERSISTED "
                      f"forecasts={counts['wc2_cohort_forecasts']} "
                      f"intents={counts['wc2_cohort_intents']} "
                      f"executions={counts['wc2_cohort_executions']} "
                      f"resolutions={counts['wc2_cohort_resolutions']} "
                      f"post_execution_start_executions="
                      f"{post_execution_start_executions}"
                  )
                  regimes = ",".join(
                      f"{str(row[0])}:{int(row[1])}"
                      for row in regime_rows
                  )
                  print(
                      "WC2_COHORT_REGIMES "
                      f"counts={regimes or 'EMPTY'}"
                  )
                  if latest_forecast is not None:
                      print(
                          "WC2_COHORT_LATEST_FORECAST "
                          f"forecast_identity={latest_forecast[0]} "
                          f"regime={latest_forecast[1]} "
                          f"issued_at_ms={int(latest_forecast[2])}"
                      )

              for name, source in sources.items():
                  if name not in accepted:
                      continue
                  if source_snapshot(source) != accepted[name]:
                      raise SystemExit(
                          f"WC2_STATE_{name.upper()}_SOURCE_CHANGED"
                      )

              print("WC2_STATE_SOURCE_BYTE_STABLE_PASS=YES")
              print("WC2_STATE_READONLY_PASS=YES")
              print("REAL_CAPITAL=0")
          finally:
              shutil.rmtree(temp_root, ignore_errors=True)
          PY

      - name: BLS SOURCE PROBE
        if: steps.parse.outputs.command == 'blsprobe'
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          test "$(id -u)" = "504"
          test -x "$PY"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" - <<'PY'
          import hashlib

          import httpx

          from ops.run_event_source_snapshot import USER_AGENT

          urls = (
              ("ics", "https://www.bls.gov/schedule/news_release/bls.ics"),
              ("html", "https://www.bls.gov/schedule/2026/"),
          )
          with httpx.Client(
              timeout=20.0,
              follow_redirects=True,
              headers={
                  "User-Agent": USER_AGENT,
                  "Accept": "text/calendar,text/html,application/xhtml+xml",
              },
          ) as client:
              for label, url in urls:
                  response = client.get(url)
                  payload = response.content
                  print(
                      "BLS_PROBE "
                      f"label={label} "
                      f"status={response.status_code} "
                      f"content_type={response.headers.get('content-type', 'MISSING')} "
                      f"bytes={len(payload)} "
                      f"sha256={hashlib.sha256(payload).hexdigest()}"
                  )
          print("BLS_PROBE_READONLY_PASS=YES")
          print("REAL_CAPITAL=0")
          PY

