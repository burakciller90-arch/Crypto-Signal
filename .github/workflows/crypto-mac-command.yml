                  "Consumer Price Index",
              ),
              (
                  "employment",
                  f"https://fred.stlouisfed.org/releases/calendar?rid=50&y={year}",
                  "Employment Situation",
              ),
          )
          with httpx.Client(
              timeout=20.0,
              follow_redirects=True,
              headers={
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml",
              },
          ) as client:
              for label, url, expected in probes:
                  response = client.get(url)
                  payload = response.content
                  text = response.text
                  print(
                      "FRED_PROBE "
                      f"label={label} "
                      f"status={response.status_code} "
                      f"content_type={response.headers.get('content-type', 'MISSING')} "
                      f"bytes={len(payload)} "
                      f"sha256={hashlib.sha256(payload).hexdigest()} "
                      f"contains_expected_title={'YES' if expected in text else 'NO'}"
                  )
          print("FRED_PROBE_READONLY_PASS=YES")
          print("REAL_CAPITAL=0")
