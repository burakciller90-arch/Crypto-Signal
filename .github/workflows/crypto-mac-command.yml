name: Crypto Mac Command

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  command:
    if: github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[MAC] ')
    name: UID504 Allowlisted Command
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - name: Parse allowlisted command
        id: parse
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="command" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          case "$cmd" in
            status|eventsourcestate|eventsourcesnapshot|blsprobe|fredprobe|wc2epoch2activate|wc2policyregister|wc2protocolregister|wc2executionprotocolregister|wc2executionruntimeregister|wc2executiononce|wc2executionstate|wc2collectonce|wc2state|services|logs|disk|sync|producttest|fulltest|productstate|productdeploy|paperreview|paperinspect|paperfixlint|paperharden|stateplanreview|stateplaninspect|stateplanharden|cursorreview|cursorreviewtail|cursorcleanup|bridgecheck|bridgestate|rollingstate|pausecheck|wakepause|wakeresume|wakearm|waketest|wakeheartbeat|chatbusyprobe|cursorcheck|cursorauthdiag|cursorttycheck|alertclockstate|alertclockpause|alertclockresume|migrationinspect|migrationinventory|ssddashboarddiag|productcrashlogs|ssddashboardwrappertest|ssdtcclaunchtest|ssdbackgroundteststart|ssdbackgroundtestcheck|ssdleftover|runnerpersistinstall|runnerpersistdiag|runnercutoverdiag|dashboardstart504|galactechpreview|runnerterminalwatchdoginstall)
              ;;
            *)
              echo "Unsupported command: $cmd"
              exit 2
              ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: CHECKOUT EXACT EVENT SOURCE COMMAND SOURCE
        if: >-
          steps.parse.outputs.command == 'eventsourcestate' ||
          steps.parse.outputs.command == 'eventsourcesnapshot' ||
          steps.parse.outputs.command == 'blsprobe' ||
          steps.parse.outputs.command == 'fredprobe'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: VERIFY EXACT EVENT SOURCE COMMAND SOURCE
        if: >-
          steps.parse.outputs.command == 'eventsourcestate' ||
          steps.parse.outputs.command == 'eventsourcesnapshot' ||
          steps.parse.outputs.command == 'blsprobe' ||
          steps.parse.outputs.command == 'fredprobe'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_HEAD="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "EVENT_SOURCE_WORKSPACE_HEAD=$WORKSPACE_HEAD"
          echo "EVENT_SOURCE_WORKFLOW_SHA=$GITHUB_SHA"
          test "$WORKSPACE_HEAD" = "$GITHUB_SHA"
          echo "EVENT_SOURCE_EXACT_WORKFLOW_SOURCE_PASS=YES"

      - name: CHECKOUT EXACT WC2 POLICY COMMAND SOURCE
        if: >-
          steps.parse.outputs.command == 'wc2policyregister' ||
          steps.parse.outputs.command == 'wc2epoch2activate' ||
          steps.parse.outputs.command == 'wc2protocolregister' ||
          steps.parse.outputs.command == 'wc2executionprotocolregister' ||
          steps.parse.outputs.command == 'wc2executionruntimeregister' ||
          steps.parse.outputs.command == 'wc2executiononce' ||
          steps.parse.outputs.command == 'wc2executionstate' ||
          steps.parse.outputs.command == 'wc2collectonce' ||
          steps.parse.outputs.command == 'wc2state'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: VERIFY EXACT WC2 POLICY COMMAND SOURCE
        if: >-
          steps.parse.outputs.command == 'wc2policyregister' ||
          steps.parse.outputs.command == 'wc2epoch2activate' ||
          steps.parse.outputs.command == 'wc2protocolregister' ||
          steps.parse.outputs.command == 'wc2executionprotocolregister' ||
          steps.parse.outputs.command == 'wc2executionruntimeregister' ||
          steps.parse.outputs.command == 'wc2executiononce' ||
          steps.parse.outputs.command == 'wc2executionstate' ||
          steps.parse.outputs.command == 'wc2state'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_HEAD="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "WC2_POLICY_WORKSPACE_HEAD=$WORKSPACE_HEAD"
          echo "WC2_POLICY_WORKFLOW_SHA=$GITHUB_SHA"
          test "$WORKSPACE_HEAD" = "$GITHUB_SHA"
          echo "WC2_POLICY_EXACT_WORKFLOW_SOURCE_PASS=YES"

      - name: CHECKOUT EXACT GALACTECH PREVIEW SOURCE
        if: steps.parse.outputs.command == 'galactechpreview'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: VERIFY EXACT GALACTECH PREVIEW SOURCE
        if: steps.parse.outputs.command == 'galactechpreview'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_HEAD="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "GALACTECH_PREVIEW_WORKSPACE_HEAD=$WORKSPACE_HEAD"
          echo "GALACTECH_PREVIEW_WORKFLOW_SHA=$GITHUB_SHA"
          test "$WORKSPACE_HEAD" = "$GITHUB_SHA"
          grep -F 'data-ui-version="galactech-v2-intelligence-first-tr"' "$GITHUB_WORKSPACE/src/crypto_signal/product/galactech/index.html" >/dev/null
          echo "GALACTECH_PREVIEW_EXACT_SOURCE_PASS=YES"

      - name: GALACTECH EXACT MAIN PREVIEW
        if: steps.parse.outputs.command == 'galactechpreview'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PY="$DEV/.venv/bin/python"
          PORT=48705
          PREVIEW_TTL_SECONDS=900
          URL="http://127.0.0.1:$PORT"
          PIDFILE="$ROOT/galactech-preview.pid"
          OUT="$ROOT/ServiceLogs/galactech-preview.out.log"
          ERR="$ROOT/ServiceLogs/galactech-preview.err.log"

          test "$(id -u)" = "504"
          test -x "$PY"
          test -f "$GITHUB_WORKSPACE/ops/run_dashboard.py"
          test -f "$DEV/runtime/ledger/live_signal_ledger.sqlite3"
          mkdir -p "$ROOT/ServiceLogs"

          listener="$(/usr/sbin/lsof -nP -iTCP:$PORT -sTCP:LISTEN -t 2>/dev/null | head -1 || true)"
          if [ -n "$listener" ]; then
            kill "$listener" >/dev/null 2>&1 || true
            for i in {1..10}; do
              listener="$(/usr/sbin/lsof -nP -iTCP:$PORT -sTCP:LISTEN -t 2>/dev/null | head -1 || true)"
              [ -z "$listener" ] && break
              sleep 1
            done
          fi
          listener="$(/usr/sbin/lsof -nP -iTCP:$PORT -sTCP:LISTEN -t 2>/dev/null | head -1 || true)"
          if [ -n "$listener" ]; then
            kill -KILL "$listener" >/dev/null 2>&1 || true
            sleep 1
          fi

          (
            unset RUNNER_TRACKING_ID
            export PYTHONPATH="$GITHUB_WORKSPACE/src"
            cd "$GITHUB_WORKSPACE"
            exec /usr/bin/nice -n 15 "$PY" "$GITHUB_WORKSPACE/ops/run_dashboard.py" \
              --host 127.0.0.1 \
              --port "$PORT" \
              --ledger "$DEV/runtime/ledger/live_signal_ledger.sqlite3" \
              --alert-outbox "$DEV/runtime/alerts/alert_outbox.sqlite3" \
              --paper-ledger "$DEV/runtime/paper/paper_fund.sqlite3" \
              --candle-cache "$DEV/runtime/data/live_base_15m_cache.sqlite3"
          ) >>"$OUT" 2>>"$ERR" < /dev/null &
          preview_pid="$!"
          echo "$preview_pid" > "$PIDFILE"

          ready=0
          for i in {1..30}; do
            if curl -fsS --max-time 3 "$URL/api/health" >/tmp/galactech-preview-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "GALACTECH_PREVIEW_HEALTH_FAIL"
            tail -120 "$ERR" 2>/dev/null || true
            exit 70
          fi

          curl -fsS --max-time 5 "$URL/" >/tmp/galactech-preview-index.html
          grep -F 'data-ui-version="galactech-v2-intelligence-first-tr"' /tmp/galactech-preview-index.html >/dev/null
          grep -F 'R25 / OPERASYONEL DOĞRULUK' /tmp/galactech-preview-index.html >/dev/null
          grep -F 'REAL_CAPITAL=0' /tmp/galactech-preview-index.html >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 5 "$URL/")" = "405"

          listener="$(/usr/sbin/lsof -nP -iTCP:$PORT -sTCP:LISTEN -t 2>/dev/null | head -1 || true)"
          test -n "$listener"
          echo "$listener" > "$PIDFILE"
          echo "GALACTECH_PREVIEW_PID=$listener"
          echo "GALACTECH_PREVIEW_URL=$URL/"
          echo "GALACTECH_PREVIEW_TTL_SECONDS=$PREVIEW_TTL_SECONDS"
          echo "GALACTECH_PREVIEW_READ_ONLY_PASS=YES"
          echo "REAL_CAPITAL=0"
          /usr/bin/open "$URL/" || true

          (
            unset RUNNER_TRACKING_ID
            sleep "$PREVIEW_TTL_SECONDS"
            current="$(/usr/sbin/lsof -nP -iTCP:$PORT -sTCP:LISTEN -t 2>/dev/null | head -1 || true)"
            if [ "$current" = "$listener" ]; then
              cmd="$(ps -p "$current" -o command= 2>/dev/null || true)"
              if printf '%s\n' "$cmd" | grep -F 'ops/run_dashboard.py' >/dev/null \
                && printf '%s\n' "$cmd" | grep -F -- '--port 48705' >/dev/null; then
                kill "$current" >/dev/null 2>&1 || true
                sleep 1
                kill -0 "$current" >/dev/null 2>&1 \
                  && kill -KILL "$current" >/dev/null 2>&1 || true
              fi
            fi
            if [ "$(cat "$PIDFILE" 2>/dev/null || true)" = "$listener" ]; then
              rm -f "$PIDFILE"
            fi
          ) >>"$OUT" 2>>"$ERR" < /dev/null &

      - name: STATUS
        if: steps.parse.outputs.command == 'status'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Volumes/Crypto-504/Crypto-Signal/Development"
          echo "=== IDENTITY ==="
          id
          echo "=== REPO ==="
          git -C "$REPO" status --short --branch
          echo "HEAD=$(git -C "$REPO" rev-parse HEAD)"
          echo "=== DASHBOARD ==="
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health
          echo

      - name: EVENT SOURCE STATE
        if: steps.parse.outputs.command == 'eventsourcestate'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          WRAPPER="$ROOT/ssd-clock-wrapper.py"
          EVENT_DB="$DEV/runtime/events/event_source.sqlite3"
          PY="$DEV/.venv/bin/python"

          test "$(id -u)" = "504"
          test -d "$DEV"
          test -x "$PY"

          echo "=== GIT STATE ==="
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"
          echo "DEVELOPMENT_STATUS_BEGIN"
          git -C "$DEV" status --short --branch || true
          echo "DEVELOPMENT_STATUS_END"
          echo "PRODUCT_HEAD=$(git -C "$PRODUCT" rev-parse HEAD 2>/dev/null || true)"
          echo "PRODUCT_STATUS_BEGIN"
          git -C "$PRODUCT" status --short --branch || true
          echo "PRODUCT_STATUS_END"

          echo "=== SINGLE OWNER SUPERVISOR ==="
          SUP_PIDS="$(ps -axo pid=,comm=,args= | awk -v needle="$ROOT/ssd-service-supervisor.sh" '($2 == "bash" || $2 == "/bin/bash") && index($0, needle) > 0 {print $1}')"
          SUP_COUNT="$(printf '%s\n' "$SUP_PIDS" | awk 'NF {n++} END {print n+0}')"
          echo "SSD_SUPERVISOR_COUNT=$SUP_COUNT"
          printf '%s\n' "$SUP_PIDS" | awk 'NF {print "SSD_SUPERVISOR_PID=" $1}'
          echo "DASHBOARD_PID=$(cat "$ROOT/dashboard.pid" 2>/dev/null || true)"

          echo "=== CLOCK WRAPPER ==="
          if [ -f "$WRAPPER" ]; then
            echo "SSD_CLOCK_WRAPPER_PRESENT=YES"
            shasum -a 256 "$WRAPPER" | awk '{print "SSD_CLOCK_WRAPPER_SHA256=" $1}'
            stat -f 'SSD_CLOCK_WRAPPER_MODE=%Sp SIZE=%z MTIME=%Sm' -t '%Y-%m-%dT%H:%M:%S%z' "$WRAPPER"
            echo "SSD_CLOCK_WRAPPER_CONTENT_BEGIN"
            sed -n '1,320p' "$WRAPPER"
            echo "SSD_CLOCK_WRAPPER_CONTENT_END"
          else
            echo "SSD_CLOCK_WRAPPER_PRESENT=NO"
          fi

          echo "=== EVENT SOURCE RUNTIME ==="
          if [ ! -f "$EVENT_DB" ]; then
            echo "EVENT_SOURCE_DB_PRESENT=NO"
            echo "EVENT_SOURCE_RUNTIME_STATUS=NOT_EXPOSED"
            echo "EVENT_SOURCE_ONLINE_STATUS=NOT_ASSERTED"
            echo "EVENT_SOURCE_STATE_READONLY_PASS=YES"
            exit 0
          fi

          echo "EVENT_SOURCE_DB_PRESENT=YES"
          before_main="$(shasum -a 256 "$EVENT_DB" | awk '{print $1}')"
          before_wal="MISSING"
          before_shm="MISSING"
          [ -f "$EVENT_DB-wal" ] && before_wal="$(shasum -a 256 "$EVENT_DB-wal" | awk '{print $1}')"
          [ -f "$EVENT_DB-shm" ] && before_shm="$(shasum -a 256 "$EVENT_DB-shm" | awk '{print $1}')"
          echo "EVENT_SOURCE_DB_SHA256_BEFORE=$before_main"
          echo "EVENT_SOURCE_WAL_SHA256_BEFORE=$before_wal"
          echo "EVENT_SOURCE_SHM_SHA256_BEFORE=$before_shm"
          echo "EVENT_SOURCE_LSOF_BEFORE_BEGIN"
          lsof "$EVENT_DB" "$EVENT_DB-wal" "$EVENT_DB-shm" 2>/dev/null || true
          echo "EVENT_SOURCE_LSOF_BEFORE_END"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" - "$EVENT_DB" <<'PY'
          import json
          import sqlite3
          import sys
          import time
          from dataclasses import asdict
          from pathlib import Path

          import crypto_signal.product.event_source_runtime as event_runtime

          path = Path(sys.argv[1])
          print("EVENT_SOURCE_READER_MODULE=" + str(event_runtime.__file__))
          print("EVENT_SOURCE_SQLITE_VERSION=" + sqlite3.sqlite_version)

          original_connect = event_runtime.sqlite3.connect

          def traced_connect(database, *args, **kwargs):
              print("EVENT_SOURCE_SQLITE_CONNECT_TARGET=" + str(database))
              return original_connect(database, *args, **kwargs)

          event_runtime.sqlite3.connect = traced_connect
          snapshot = event_runtime.read_event_source_runtime_truth(
              path,
              observed_at_ms=time.time_ns() // 1_000_000,
          )
          print("EVENT_SOURCE_PRODUCT_TRUTH=" + json.dumps(
              asdict(snapshot),
              sort_keys=True,
              separators=(",", ":"),
          ))
          print(
              "EVENT_SOURCE_RUNTIME_STATUS="
              + snapshot.runtime_status
          )
          print(
              "EVENT_SOURCE_ONLINE_STATUS="
              + snapshot.online_status
          )
          print(
              "EVENT_SOURCE_PROCESS_STATUS="
              + snapshot.process_status
          )
          print(
              "EVENT_SOURCE_COVERAGE_CLAIM="
              + snapshot.coverage_claim
          )
          print("EVENT_SOURCE_REAL_CAPITAL=" + str(snapshot.real_capital))
          PY

          after_main="$(shasum -a 256 "$EVENT_DB" | awk '{print $1}')"
          after_wal="MISSING"
          after_shm="MISSING"
          [ -f "$EVENT_DB-wal" ] && after_wal="$(shasum -a 256 "$EVENT_DB-wal" | awk '{print $1}')"
          [ -f "$EVENT_DB-shm" ] && after_shm="$(shasum -a 256 "$EVENT_DB-shm" | awk '{print $1}')"
          echo "EVENT_SOURCE_DB_SHA256_AFTER=$after_main"
          echo "EVENT_SOURCE_WAL_SHA256_AFTER=$after_wal"
          echo "EVENT_SOURCE_SHM_SHA256_AFTER=$after_shm"
          echo "EVENT_SOURCE_LSOF_AFTER_BEGIN"
          lsof "$EVENT_DB" "$EVENT_DB-wal" "$EVENT_DB-shm" 2>/dev/null || true
          echo "EVENT_SOURCE_LSOF_AFTER_END"
          test "$before_main" = "$after_main"
          test "$before_wal" = "$after_wal"
          test "$before_shm" = "$after_shm"
          echo "EVENT_SOURCE_STATE_BYTE_STABLE_PASS=YES"
          echo "EVENT_SOURCE_STATE_READONLY_PASS=YES"

      - name: ROLLING WAKE STATE
        if: steps.parse.outputs.command == 'rollingstate'
        shell: bash
        run: |
          set -euo pipefail
          INSTALL="$HOME/Library/Application Support/CryptoSignal/continuity20m"
          RUNTIME="$INSTALL/runtime"
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          LOCAL_STATE="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/continuity"
          PIDFILE="$RUNTIME/rolling_wake.pid"
          STATUS_FILE="$RUNTIME/rolling_wake_status"
          STATE_FILE="$RUNTIME/rolling_wake_state.json"
          HEARTBEAT_FILE="$RUNTIME/rolling_wake_heartbeat"

          echo "=== ROLLING TIMER PROCESS ==="
          PID="$(cat "$PIDFILE" 2>/dev/null || true)"
          echo "ROLLING_PID=$PID"
          if [ -n "$PID" ] && kill -0 "$PID" >/dev/null 2>&1; then
            echo "ROLLING_PID_ALIVE=YES"
            ps -p "$PID" -o pid=,ppid=,uid=,etime=,command=
          else
            echo "ROLLING_PID_ALIVE=NO"
          fi

          echo "=== ROLLING TIMER STATUS ==="
          if [ -f "$STATUS_FILE" ]; then
            cat "$STATUS_FILE"
          else
            echo "ROLLING_STATUS_MISSING=YES"
          fi

          echo "=== ROLLING TIMER STATE JSON ==="
          if [ -f "$STATE_FILE" ]; then
            cat "$STATE_FILE"
          else
            echo "ROLLING_STATE_MISSING=YES"
          fi

          NOW="$(date +%s)"
          HB="$(cat "$HEARTBEAT_FILE" 2>/dev/null || true)"
          if [[ "$HB" =~ ^[0-9]+$ ]]; then
            echo "ROLLING_HEARTBEAT_AGE_SECONDS=$((NOW-HB))"
          else
            echo "ROLLING_HEARTBEAT_MISSING=YES"
          fi

          echo "=== PAUSE AUTHORITY ==="
          [ -f "$LOCAL_STATE/user_pause" ] && echo "LOCAL_PAUSED=YES" || echo "LOCAL_PAUSED=NO"
          [ -f "$SHARED/user_pause" ] && echo "SHARED_PAUSED=YES" || echo "SHARED_PAUSED=NO"

          echo "=== RELAY ==="
          if [ -f "$SHARED/relay_status" ]; then
            cat "$SHARED/relay_status"
          else
            echo "RELAY_STATUS_MISSING=YES"
          fi

          echo "ROLLING_STATE_READONLY_PASS=YES"

      - name: EVENT SOURCE SNAPSHOT
        if: steps.parse.outputs.command == 'eventsourcesnapshot'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          EVENT_DB="$DEV/runtime/events/event_source.sqlite3"
          PY="$DEV/.venv/bin/python"
          SNAPSHOT="$GITHUB_WORKSPACE/ops/run_event_source_snapshot.py"

          test "$(id -u)" = "504"
          test -x "$PY"
          test -f "$SNAPSHOT"

          echo "=== EVENT SOURCE SNAPSHOT PRE-STATE ==="
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"
          echo "MAIN_SHA="$GITHUB_SHA
          before="MISSING"
          [ -f "$EVENT_DB" ] && before="$(shasum -a 256 "$EVENT_DB" | awk '{print $1}')"
          echo "EVENT_SOURCE_DB_SHA256_BEFORE=$before"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" "$SNAPSHOT" \
            --db "$EVENT_DB" \
            --timeout-seconds 20

          test -f "$EVENT_DB"
          after="$(shasum -a 256 "$EVENT_DB" | awk '{print $1}')"
          echo "EVENT_SOURCE_DB_SHA256_AFTER=$after"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" - "$EVENT_DB" <<'PY'
          import json
          import sys
          import time
          from dataclasses import asdict
          from pathlib import Path

          from crypto_signal.product.event_source_runtime import (
              read_event_source_runtime_truth,
          )

          snapshot = read_event_source_runtime_truth(
              Path(sys.argv[1]),
              observed_at_ms=time.time_ns() // 1_000_000,
          )
          print(
              "EVENT_SOURCE_PRODUCT_TRUTH="
              + json.dumps(
                  asdict(snapshot),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          print("EVENT_SOURCE_RUNTIME_STATUS=" + snapshot.runtime_status)
          print("EVENT_SOURCE_ONLINE_STATUS=" + snapshot.online_status)
          print("EVENT_SOURCE_PROCESS_STATUS=" + snapshot.process_status)
          print("EVENT_SOURCE_COVERAGE_CLAIM=" + snapshot.coverage_claim)
          print("EVENT_SOURCE_REAL_CAPITAL=" + str(snapshot.real_capital))
          if snapshot.real_capital != 0:
              raise SystemExit("REAL_CAPITAL_MISMATCH")
          if snapshot.online_status != "NOT_ASSERTED":
              raise SystemExit("ONLINE_STATUS_MISMATCH")
          PY

          echo "EVENT_SOURCE_SNAPSHOT_BOUNDED_PASS=YES"
          echo "EVENT_SOURCE_SNAPSHOT_APPEND_ONLY_EVIDENCE=YES"
          echo "EVENT_SOURCE_ONLINE_NOT_ASSERTED_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: WC2 POLICY REGISTER
        if: steps.parse.outputs.command == 'wc2policyregister'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          POLICY_DB="$DEV/runtime/wc2/wc2_forward_policy.sqlite3"
          PY="$DEV/.venv/bin/python"
          REGISTER="$GITHUB_WORKSPACE/ops/register_wc2_forward_policy.py"

          test "$(id -u)" = "504"
          test -x "$PY"
          test -f "$REGISTER"

          echo "=== WC2 POLICY REGISTER PRE-STATE ==="
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
          before="MISSING"
          [ -f "$POLICY_DB" ] && before="$(shasum -a 256 "$POLICY_DB" | awk '{print $1}')"
          echo "WC2_POLICY_DB_SHA256_BEFORE=$before"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" "$REGISTER" \
            --db "$POLICY_DB"

          test -f "$POLICY_DB"
          after="$(shasum -a 256 "$POLICY_DB" | awk '{print $1}')"
          echo "WC2_POLICY_DB_SHA256_AFTER=$after"
          echo "WC2_POLICY_REGISTER_BOUNDED_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: WC2 EPOCH2 ACTIVATE
        if: steps.parse.outputs.command == 'wc2epoch2activate'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          EPOCH1="$DEV/runtime/paper/paper_fund.sqlite3"
          EPOCH2="$DEV/runtime/paper/paper_fund_epoch2.sqlite3"
          PY="$DEV/.venv/bin/python"
          ACTIVATE="$GITHUB_WORKSPACE/ops/activate_wc2_epoch2.py"

          test "$(id -u)" = "504"
          test -x "$PY"
          test -f "$ACTIVATE"
          test -f "$EPOCH1"

          echo "=== WC2 EPOCH2 PRE-STATE ==="
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
          epoch1_before="$(shasum -a 256 "$EPOCH1" | awk '{print $1}')"
          epoch2_before="MISSING"
          [ -f "$EPOCH2" ] && epoch2_before="$(shasum -a 256 "$EPOCH2" | awk '{print $1}')"
          echo "WC2_EPOCH1_SHA256_BEFORE=$epoch1_before"
          echo "WC2_EPOCH2_SHA256_BEFORE=$epoch2_before"

          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" "$ACTIVATE" \
            --epoch1 "$EPOCH1" \
            --epoch2 "$EPOCH2" \
            | tee "$RUNNER_TEMP/wc2-epoch2-activation.log"

          test -f "$EPOCH2"
          epoch1_after="$(shasum -a 256 "$EPOCH1" | awk '{print $1}')"
          epoch2_after="$(shasum -a 256 "$EPOCH2" | awk '{print $1}')"
          echo "WC2_EPOCH1_SHA256_AFTER=$epoch1_after"
