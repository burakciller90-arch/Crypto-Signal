          echo "=== LOCAL CURRENT CHAT ==="
          [ -f "$LOCAL/wake/current_chat_url" ] && cat "$LOCAL/wake/current_chat_url" || echo "MISSING"
          echo
          echo "=== USER PAUSE MARKERS ==="
          find "$LOCAL" -maxdepth 3 -type f \( -name '.user_pause' -o -path '*/wake/paused/*' \) -print 2>/dev/null | tail -20
          echo
          echo "=== BRIDGE LOG TAIL ==="
          tail -60 "$LOCAL/bridge.log" 2>/dev/null
          echo
          echo "=== RELAY LOG TAIL ==="
          tail -60 "$SHARED/relay.log" 2>/dev/null
          echo
          echo "=== TRANSPORT LOG TAIL ==="
          tail -60 "$SHARED/transport.log" 2>/dev/null
          exit 0

      - name: BRIDGECHECK
        if: steps.parse.outputs.command == 'bridgecheck'
        shell: bash
        run: |
          set +e
          echo "=== SHARED RELAY PATHS ==="
          for p in             /Users/Shared/.crypto-signal-wake-relay             /Users/Shared/Crypto-Signal-Wake-Bridge             /Users/Shared/Crypto-Signal-Wake-Bridge-Requests             /Users/Shared/.chatgpt-host-gui.lockfile
          do
            echo "--- $p"
            ls -lad "$p" 2>&1
            if [ -d "$p" ]; then
              find "$p" -maxdepth 2 -type f -print 2>/dev/null | head -100
            fi
          done
          echo "=== CRYPTO CONTINUITY FILES ==="
          find /Users/crypto-signal-agent/Crypto-Signal/runtime                /Users/crypto-signal-agent/Crypto-Signal                -maxdepth 4 -type f                \( -iname '*wake*' -o -iname '*lease*' -o -iname '*bridge*' -o -iname '*chat*' \)                -print 2>/dev/null | head -150
          echo "=== UID504 LAUNCH AGENTS MATCHING BRIDGE/WAKE ==="
          launchctl print "gui/$(id -u)" 2>/dev/null | egrep -i 'crypto|wake|bridge|chatgpt|lease' | head -120
          exit 0




      - name: MIGRATION INVENTORY
        if: steps.parse.outputs.command == 'migrationinventory'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HOME CRYPTO PATHS ==="
          find "$HOME" -maxdepth 2 \( -iname 'Crypto-Signal*' -o -iname '*cryptosignal*' -o -iname 'actions-runner-crypto*' \) -print 2>/dev/null | sort
          echo "=== HOME TOP LEVEL SIZES ==="
          for p in "$HOME"/Crypto-Signal* "$HOME"/actions-runner-crypto*; do
            [ -e "$p" ] || continue
            du -sh "$p" 2>/dev/null || true
          done
          echo "=== LAUNCH AGENT CRYPTO PLISTS ==="
          for p in "$HOME"/Library/LaunchAgents/*crypto* "$HOME"/Library/LaunchAgents/*Crypto*; do
            [ -e "$p" ] || continue
            echo "--- $p"
            plutil -p "$p" || true
          done
          echo "=== LAUNCHD CRYPTO SERVICES ==="
          launchctl print "gui/$(id -u)" 2>/dev/null | grep -E 'com\.cryptosignal|actions\.runner.*Crypto-Signal' | head -200 || true
          echo "MIGRATION_INVENTORY_PASS=YES"

      - name: MIGRATION INSPECT
        if: steps.parse.outputs.command == 'migrationinspect'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ID ==="
          id
          echo "=== SOURCE DIRS ==="
          for p in             /Users/crypto-signal-agent/Crypto-Signal             /Users/crypto-signal-agent/Crypto-Signal-Live             /Users/crypto-signal-agent/Crypto-Signal-Product             /Users/crypto-signal-agent/Crypto-Signal-Alerts             /Users/crypto-signal-agent/actions-runner-crypto; do
            echo "--- $p"
            if [ -e "$p" ]; then
              ls -ld "$p"
              du -sh "$p" 2>/dev/null || true
              if [ -d "$p/.git" ]; then
                git -C "$p" status --short --branch || true
                git -C "$p" rev-parse HEAD || true
              fi
            else
              echo "MISSING"
            fi
          done
          echo "=== TARGET ==="
          diskutil info /Volumes/Crypto-504
          ls -la /Volumes/Crypto-504
          echo "=== LAUNCH AGENTS ==="
          for plist in             "$HOME/Library/LaunchAgents/com.cryptosignal.dashboard.plist"             "$HOME/Library/LaunchAgents/com.cryptosignal.liveevidenceclock.plist"             "$HOME/Library/LaunchAgents/com.cryptosignal.alertclock.plist"; do
            echo "--- $plist"
            if [ -f "$plist" ]; then plutil -p "$plist"; else echo "MISSING"; fi
          done
          echo "=== RUNNER SERVICE ==="
          find "$HOME/Library/LaunchAgents" -maxdepth 1 -type f -name '*actions.runner*crypto*' -print -exec plutil -p {} \; 2>/dev/null || true
          echo "=== HARD-CODED CRYPTO PATHS ==="
          grep -RIl --exclude='*.log' '/Users/crypto-signal-agent/Crypto-Signal' "$HOME/Library/LaunchAgents" 2>/dev/null || true
          echo "MIGRATION_INSPECT_PASS=YES"

      - name: ALERT CLOCK STATE
        if: steps.parse.outputs.command == 'alertclockstate'
        shell: bash
        run: |
          set +e
          LABEL="com.cryptosignal.alertclock"
          TARGET="gui/$(id -u)/$LABEL"
          echo "=== ALERT CLOCK STATE ==="
          launchctl print "$TARGET" 2>&1 | egrep 'state =|runs =|pid =|last exit code =|run interval =' | head -40
          pgrep -af 'run_alert_clock.py' || true
          echo "ALERT_CLOCK_STATE_PASS=YES"
          exit 0

      - name: ALERT CLOCK PAUSE
        if: steps.parse.outputs.command == 'alertclockpause'
        shell: bash
        run: |
          set -euo pipefail
          test -f "/Users/crypto-signal-agent/Crypto-Signal/runtime/continuity/user_pause"
          test -f "/Users/Shared/.crypto-signal-wake-relay/user_pause"
          LABEL="com.cryptosignal.alertclock"
          TARGET="gui/$(id -u)/$LABEL"
          PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
          test -f "$PLIST"
          echo "=== BEFORE ==="
          launchctl print "$TARGET" 2>&1 | egrep 'state =|runs =|pid =|last exit code =|run interval =' | head -40 || true
          launchctl disable "$TARGET"
          launchctl bootout "$TARGET" >/dev/null 2>&1 || true
          sleep 2
          if launchctl print "$TARGET" >/dev/null 2>&1; then
            echo "ALERT_CLOCK_STILL_LOADED"
            exit 79
          fi
          if pgrep -f 'run_alert_clock.py' >/dev/null 2>&1; then
            echo "ALERT_CLOCK_PROCESS_STILL_RUNNING"
            pgrep -af 'run_alert_clock.py' || true
            exit 79
          fi
          echo "ALERT_CLOCK_PAUSED_FOR_USER_BREAK=YES"

      - name: ALERT CLOCK RESUME
        if: steps.parse.outputs.command == 'alertclockresume'
        shell: bash
        run: |
          set -euo pipefail
          LABEL="com.cryptosignal.alertclock"
          TARGET="gui/$(id -u)/$LABEL"
          PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
          test -f "$PLIST"
          launchctl enable "$TARGET"
          launchctl bootstrap "gui/$(id -u)" "$PLIST" >/dev/null 2>&1 || true
          launchctl kickstart "$TARGET" >/dev/null 2>&1 || true
          sleep 2
          launchctl print "$TARGET" 2>&1 | egrep 'state =|runs =|pid =|last exit code =|run interval =' | head -40
          echo "ALERT_CLOCK_RESUME_PASS=YES"