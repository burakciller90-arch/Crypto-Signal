          echo "=== ID ==="
          id
          echo "=== SOURCE DIRS ==="
          for p in             /Volumes/Crypto-504/Crypto-Signal/Development             /Volumes/Crypto-504/Crypto-Signal/Live             /Volumes/Crypto-504/Crypto-Signal/Product             /Volumes/Crypto-504/Crypto-Signal/Alerts             /Users/crypto-signal-agent/actions-runner-crypto; do
