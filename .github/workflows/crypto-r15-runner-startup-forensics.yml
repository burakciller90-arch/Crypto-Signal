name: Crypto R15 Runner Startup Forensics

on:
  push:
    branches: [r15-ssd-hotplug-recovery-v1]
    paths: [".github/workflows/crypto-r15-runner-startup-forensics.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Inspect UID504 startup failure read-only
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set +e
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          LOCAL="$HOME/Library/Application Support/CryptoSignalRecovery"
          echo "=== STATE ==="
          cat "$LOCAL/ssd-state" 2>&1
          echo "=== R15 WATCHDOG LOG ==="
          tail -220 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log" 2>&1
          echo "=== R15 WATCHDOG ERR ==="
          tail -220 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" 2>&1
          echo "=== HOTPLUG RUNNER OUT ==="
          tail -220 "$ROOT/RunnerLogs/hotplug-runner.out.log" 2>&1
          echo "=== HOTPLUG RUNNER ERR ==="
          tail -220 "$ROOT/RunnerLogs/hotplug-runner.err.log" 2>&1
          echo "=== PIDFILES ==="
          for p in "$ROOT"/ssd-runner*.pid; do echo "--- $p"; cat "$p" 2>&1; done
          echo "=== UID504 RUNNER-LIKE PROCS ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | awk '$3=="crypto-signal-agent" && ($0 ~ /RunnerService\.js/ || $0 ~ /Runner\.Listener/ || $0 ~ /Runner\.Worker/ || $0 ~ /\.\/runsvc\.sh/ || $0 ~ /Crypto-504\/Crypto-Signal\/Runner/) {print}'
          echo "=== R15 LAUNCHAGENT ==="
          launchctl print "gui/504/com.cryptosignal.ssd-hotplug-recovery" 2>&1 | head -180
          echo "R15_RUNNER_STARTUP_FORENSICS_DONE=YES"
          SH