name: World-Class WC1 Event Source Product Truth Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/product/event_source_runtime.py"
      - "src/crypto_signal/product/web.py"
      - "ops/run_dashboard.py"
      - "src/crypto_signal/product/galactech/index.html"
      - "src/crypto_signal/product/galactech/app.js"
      - "tests/test_event_source_product.py"
      - "tests/test_wc0_runtime_wiring.py"
      - "tests/test_galactech_production_cutover.py"
      - ".github/workflows/world-class-wc1-event-source-product-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc1-event-source-product:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC1 Event Source Product acceptance
        run: |
          python -m pytest -q tests/test_event_source_product.py tests/test_event_source_runtime.py tests/test_event_source_snapshot.py tests/test_wc0_runtime_wiring.py tests/test_galactech_production_cutover.py
          python -m ruff check src/crypto_signal/data/event_source_runtime.py src/crypto_signal/product/event_source_runtime.py src/crypto_signal/product/web.py ops/run_dashboard.py tests/test_event_source_product.py tests/test_wc0_runtime_wiring.py
          python -m mypy src/crypto_signal/data/event_source_runtime.py src/crypto_signal/product/event_source_runtime.py src/crypto_signal/product/web.py ops/run_dashboard.py
          node --check src/crypto_signal/product/galactech/app.js
          echo "WC1_EVENT_SOURCE_PRODUCT_FOCUSED_PASS=YES"
          echo "WC1_EVENT_SOURCE_PERSISTED_ONLY_PASS=YES"
          echo "WC1_EVENT_SOURCE_ONLINE_NOT_ASSERTED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_EVENT_SOURCE_PRODUCT_FULL_PASS=YES"
          echo "WC1_REAL_CAPITAL_ZERO_PASS=YES"
