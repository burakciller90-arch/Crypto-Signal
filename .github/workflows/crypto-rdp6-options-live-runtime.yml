name: RDP6 Options Live Runtime UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/run_market_tape_snapshot.py"
      - "ops/run_live_evidence_clock.py"
      - "ops/ssd_runtime_supervisor.sh"
      - "tests/test_rdp6_options_live_runtime_wiring.py"
      - ".github/workflows/crypto-rdp6-options-live-runtime.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP6_E_RUNTIME_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP6_E_RUNTIME_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused options runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp6_options_live_runtime_wiring.py \
            tests/test_wc2_live_clock_wiring.py \
            tests/test_wc1_ssd_supervisor_market_tape_single_owner.py \
            tests/test_rdp6_options_derivatives_family.py \
            tests/test_rdp6_options_volatility.py \
            tests/test_rdp6_options_source_store.py \
            tests/test_rdp6_options_contract.py \
            tests/test_rdp5_liquidation_heatmap_crowding_family.py \
            tests/test_rdp5_derivatives_dynamics_family.py
          "$PY" -m ruff check \
            ops/run_market_tape_snapshot.py \
            ops/run_live_evidence_clock.py \
            tests/test_rdp6_options_live_runtime_wiring.py
          "$PY" -m mypy \
            ops/run_market_tape_snapshot.py \
            ops/run_live_evidence_clock.py
          "$PY" -m py_compile \
            ops/run_market_tape_snapshot.py \
            ops/run_live_evidence_clock.py \
            tests/test_rdp6_options_live_runtime_wiring.py
          bash -n ops/ssd_runtime_supervisor.sh
          echo "RDP6_E_OPTIONS_LIVE_RUNTIME_PASS=YES"
          echo "BYBIT_OPTIONS_REGIONAL_SOURCE=https://api.bybit.tr"
          echo "OPTIONS_REFRESH_CADENCE_SECONDS=60"
          echo "OPTIONS_FRESHNESS_BUDGET_SECONDS=120"
          echo "NO_NEW_FAMILY_OR_DIRECTION=YES"
          echo "REAL_CAPITAL=0"
