name: Crypto Watchdog Delivery Progress Hosted TEMP
on:
  push:
    branches: [fix/rolling-watchdog-delivery-progress-v1]
    paths:
      - ".github/workflows/crypto-watchdog-delivery-progress-temp.yml"
      - ".github/workflows/crypto-20m-continuity-wake.yml"
      - "ops/continuity/watchdog_delivery_health.py"
      - "tests/test_watchdog_delivery_health.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: Focused watchdog and rolling invariants
        run: |
          python -m pytest -q tests/test_watchdog_delivery_health.py tests/test_continuity_hardening.py
          python -m ruff check ops/continuity/watchdog_delivery_health.py tests/test_watchdog_delivery_health.py
          python -m mypy ops/continuity/watchdog_delivery_health.py
          echo "WATCHDOG_DELIVERY_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "WATCHDOG_DELIVERY_FULL_PASS=YES"
