name: Crypto Read Surface Perf Branch

on:
  push:
    branches:
      - fix/stage10-command-center-read-performance
    paths:
      - ".github/workflows/crypto-command-center-perf-branch.yml"

permissions:
  contents: read

jobs:
  probe:
    name: UID504 live read-surface latency
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe branch against live read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          PY="/Users/crypto-signal-agent/Crypto-Signal/.venv/bin/python"
          test -x "$PY"
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" - <<'PY'
          from time import perf_counter

          from fastapi.testclient import TestClient

          from crypto_signal.product.web import create_app

          client = TestClient(create_app())
          endpoints = (
              ("/api/health", 3.0),
              ("/api/command-center?recent_limit=8", 3.0),
              ("/api/market-radar", 3.0),
              ("/api/navigation", 3.0),
              ("/api/signals?limit=20&offset=0", 3.0),
              ("/api/performance", 8.0),
              ("/api/alerts?limit=20", 3.0),
              ("/api/education", 3.0),
              ("/api/paper/mission-control", 8.0),
          )

          for path, threshold in endpoints:
              samples = []
              for sample in range(2):
                  started = perf_counter()
                  response = client.get(path)
                  duration = perf_counter() - started
                  if response.status_code != 200:
                      raise RuntimeError(
                          f"{path} HTTP {response.status_code}: {response.text}"
                      )
                  samples.append(duration)
                  print(
                      "READ_SURFACE_LATENCY "
                      f"path={path} "
                      f"sample={sample + 1} "
                      f"seconds={duration:.6f}"
                  )
              worst = max(samples)
              if worst >= threshold:
                  raise RuntimeError(
                      f"{path} latency regression: "
                      f"worst={worst:.6f}s threshold={threshold:.1f}s"
                  )
              print(
                  "READ_SURFACE_PASS "
                  f"path={path} "
                  f"worst_seconds={worst:.6f}"
              )

          print("LIVE_READ_SURFACE_PERF_PASS=YES")
          PY
