name: Crypto R15 UID504 Bridge Forensics

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-uid504-bridge-forensics.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect R15 state through UID504 bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Read UID504 R15 state
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set +e
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          LOCAL="$HOME/Library/Application Support/CryptoSignalRecovery"
          LABEL="com.cryptosignal.ssd-hotplug-recovery"

          echo "=== ID ==="
          id
          echo "=== STATE ==="
          cat "$LOCAL/ssd-state" 2>&1
          echo "=== HANG STATE ==="
          cat "$LOCAL/runner-hang-state" 2>&1
          echo "=== LAUNCHAGENT ==="
          launchctl print "gui/$(id -u)/$LABEL" 2>&1 | head -180
          echo "=== WATCHDOG LOG ==="
          tail -220 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log" 2>&1
          echo "=== WATCHDOG ERR ==="
          tail -220 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" 2>&1
          echo "=== RUNNER PROCS ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -E '[R]unnerService\.js|[R]unner\.Listener|[R]unner\.Worker|[.]\/runsvc\.sh' | head -160
          echo "=== ORPHAN CWD ==="
          for p in $(ps -axo pid=,user=,command= | awk '$2=="crypto-signal-agent" && $0 ~ /RunnerService\.js/ {print $1}'); do
            echo "--- service=$p"
            ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            /usr/sbin/lsof -a -p "$p" -d cwd -Fn 2>&1
            parent="$(ps -p "$p" -o ppid= | tr -d " ")"
            echo "parent=$parent"
            ps -p "$parent" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            /usr/sbin/lsof -a -p "$parent" -d cwd -Fn 2>&1
          done
          echo "R15_UID504_BRIDGE_FORENSICS_DONE=YES"
          SH
