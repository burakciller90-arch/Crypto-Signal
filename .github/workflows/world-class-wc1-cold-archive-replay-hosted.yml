name: World-Class WC1 Cold Archive Canonical Replay Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/product/market_tape_runtime.py"
      - "src/crypto_signal/product/web.py"
      - "src/crypto_signal/product/galactech/app.js"
      - "tests/test_market_data_runtime_product.py"
      - "tests/test_cold_archive_product_replay.py"
      - ".github/workflows/world-class-wc1-cold-archive-replay-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc1-cold-archive-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y pyarrow || true
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Whole-repository base-policy regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_COLD_ARCHIVE_BASE_POLICY_FULL_PASS=YES"
      - name: Install optional PyArrow runtime dependency
        run: |
          python -m pip install "pyarrow>=18,<24"
      - name: Focused PyArrow-enabled canonical replay acceptance
        run: |
          python -m pytest -q tests/test_cold_archive_product_replay.py tests/test_market_tape_cold_archive.py tests/test_liquidation_cold_archive.py tests/test_market_data_runtime_product.py
          python -m ruff check src/crypto_signal/product/market_tape_runtime.py src/crypto_signal/product/web.py tests/test_cold_archive_product_replay.py tests/test_market_data_runtime_product.py
          python -m mypy src/crypto_signal/product/market_tape_runtime.py src/crypto_signal/product/web.py
          node --check src/crypto_signal/product/galactech/app.js
          echo "WC1_COLD_ARCHIVE_CANONICAL_REPLAY_VERIFIED_PASS=YES"
          echo "WC1_COLD_ARCHIVE_FILE_SHA_PRESERVED_PASS=YES"
          echo "WC1_REAL_CAPITAL_ZERO_PASS=YES"
