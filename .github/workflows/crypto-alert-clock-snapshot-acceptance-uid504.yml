name: Crypto Alert Clock Snapshot Acceptance UID504

on:
  push:
    branches:
      - 'runtime/alert-clock-consistent-snapshot'

permissions:
  contents: read

concurrency:
  group: alert-clock-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Prepare isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          VENV="$RUNNER_TEMP/alert-clock-snapshot-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" > "$RUNNER_TEMP/alert-clock-snapshot-prestate"
          rm -rf "$VENV"
          "$BASE_PY" -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused Alert Clock acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q tests/test_alert_clock.py
          "$TEST_PY" -m ruff check             src/crypto_signal/alerts/clock.py             tests/test_alert_clock.py
          "$TEST_PY" -m mypy src/crypto_signal/alerts/clock.py
          echo "ALERT_CLOCK_CONSISTENT_SNAPSHOT_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Read-only canonical ledger snapshot acceptance
        shell: bash
        run: |
          set -euo pipefail
          DB="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/ledger/live_signal_ledger.sqlite3"
          test -f "$DB"
          DB="$DB" "$TEST_PY" - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          db = Path(os.environ["DB"])
          connection = sqlite3.connect(
              f"file:{db}?mode=ro",
              uri=True,
              timeout=10,
          )
          connection.execute("PRAGMA query_only=ON")
          try:
              connection.execute("BEGIN")
              signal_ids = {
                  str(row[0])
                  for row in connection.execute(
                      "SELECT signal_freeze_identity FROM signal_freezes"
                  ).fetchall()
              }
              lifecycle_rows = connection.execute(
                  """
                  SELECT signal_freeze_identity
                  FROM lifecycle_evaluations
                  ORDER BY appended_at_ms, evaluation_identity
                  """
              ).fetchall()
              missing = sorted(
                  {
                      str(row[0])
                      for row in lifecycle_rows
                      if str(row[0]) not in signal_ids
                  }
              )
              assert not missing, missing[:10]
              print(
                  "ALERT_CLOCK_CANONICAL_SNAPSHOT_PASS=YES "
                  f"signals={len(signal_ids)} "
                  f"lifecycle={len(lifecycle_rows)} "
                  "missing_parent=0"
              )
              print("PRODUCTION_MUTATION=NO")
              print("REAL_CAPITAL=0")
          finally:
              connection.rollback()
              connection.close()
          PY

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          echo "ALERT_CLOCK_CONSISTENT_SNAPSHOT_FULL_REPOSITORY_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/alert-clock-snapshot-prestate")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test "$BEFORE" = "$AFTER"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "ALERT_CLOCK_SNAPSHOT_UID504_NON_MUTATING_PASS=YES"
          echo "DEV_HEAD=$AFTER"
          echo "REAL_CAPITAL=0"
