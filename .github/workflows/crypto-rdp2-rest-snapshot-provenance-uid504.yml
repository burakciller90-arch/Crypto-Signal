name: RDP2 REST Snapshot Provenance UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/source_contract.py"
      - "src/crypto_signal/data/market_tape.py"
      - "src/crypto_signal/data/market_tape_collection.py"
      - "src/crypto_signal/data/market_tape_rest_source_contract.py"
      - "src/crypto_signal/data/adapters/bybit_microstructure.py"
      - "src/crypto_signal/data/adapters/bybit_derivatives.py"
      - "ops/run_market_tape_snapshot.py"
      - "tests/test_rdp2_rest_snapshot_source_contract.py"
      - ".github/workflows/crypto-rdp2-rest-snapshot-provenance-uid504.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test -d "$WB/.git"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP2_C_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP2_C_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused REST provenance acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp2_rest_snapshot_source_contract.py \
            tests/test_rdp2_source_contract.py \
            tests/test_rdp2_market_tape_source_contract.py \
            tests/test_market_tape_store.py \
            tests/test_bybit_microstructure_adapter.py \
            tests/test_bybit_derivatives_adapter.py
          "$PY" -m ruff check \
            src/crypto_signal/data/source_contract.py \
            src/crypto_signal/data/market_tape.py \
            src/crypto_signal/data/market_tape_collection.py \
            src/crypto_signal/data/market_tape_rest_source_contract.py \
            src/crypto_signal/data/adapters/bybit_microstructure.py \
            src/crypto_signal/data/adapters/bybit_derivatives.py \
            ops/run_market_tape_snapshot.py \
            tests/test_rdp2_rest_snapshot_source_contract.py
          "$PY" -m mypy \
            src/crypto_signal/data/source_contract.py \
            src/crypto_signal/data/market_tape.py \
            src/crypto_signal/data/market_tape_collection.py \
            src/crypto_signal/data/market_tape_rest_source_contract.py \
            src/crypto_signal/data/adapters/bybit_microstructure.py \
            src/crypto_signal/data/adapters/bybit_derivatives.py
          "$PY" -m py_compile ops/run_market_tape_snapshot.py
          echo "RDP2_C_REST_SNAPSHOT_PROVENANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
