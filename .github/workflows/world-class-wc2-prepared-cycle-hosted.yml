name: World-Class WC2 Prepared Cycle Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/live_untouched_forward_operational.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py"
      - "tests/test_wc2_prepared_cycle.py"
      - ".github/workflows/world-class-wc2-prepared-cycle-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-prepared-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 prepared-cycle acceptance
        run: |
          python -m pytest -q             tests/test_wc2_prepared_cycle.py             tests/test_wc2_same_cycle_paper.py             tests/test_wc2_live_source_adapter.py             tests/test_wc2_live_runtime_index.py             tests/test_wc2_untouched_forward_journal.py
          python -m ruff check             src/crypto_signal/evaluation/live_untouched_forward_operational.py             src/crypto_signal/evaluation/untouched_forward_prepared.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py             tests/test_wc2_prepared_cycle.py
          python -m mypy             src/crypto_signal/evaluation/live_untouched_forward_operational.py             src/crypto_signal/evaluation/untouched_forward_prepared.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py
          echo "WC2_PREISSUANCE_RECEIPT_PASS=YES"
          echo "WC2_CRASH_AFTER_R20_RECOVERY_PASS=YES"
          echo "WC2_CRASH_AFTER_COHORT_RECOVERY_PASS=YES"
          echo "WC2_HISTORICAL_MARKET_READ_ON_RECOVERY=NO"
          echo "WC2_HISTORICAL_BACKFILL_AUTHORITY=NO"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_PREPARED_CYCLE_FULL_PASS=YES"
