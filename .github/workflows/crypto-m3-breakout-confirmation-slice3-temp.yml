name: Crypto M3 Breakout Confirmation Slice3 TEMP

on:
  push:
    branches: [v1.1-m3-breakout-confirmation-v1]
    paths:
      - ".github/workflows/crypto-m3-breakout-confirmation-slice3-temp.yml"
      - "src/crypto_signal/intelligence/breakout_confirmation.py"
      - "tests/test_breakout_confirmation.py"
      - "docs/M3_BREAKOUT_CONFIRMATION_SLICE3.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: M3 Slice3 focused
        run: |
          python -m pytest -q tests/test_temporal_order_flow.py tests/test_order_flow_patterns.py tests/test_breakout_confirmation.py
          python -m ruff check src/crypto_signal/intelligence/temporal_order_flow.py src/crypto_signal/intelligence/order_flow_patterns.py src/crypto_signal/intelligence/breakout_confirmation.py tests/test_temporal_order_flow.py tests/test_order_flow_patterns.py tests/test_breakout_confirmation.py
          python -m mypy src/crypto_signal/intelligence/temporal_order_flow.py src/crypto_signal/intelligence/order_flow_patterns.py src/crypto_signal/intelligence/breakout_confirmation.py
          echo "M3_BREAKOUT_CONFIRMATION_SLICE3_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M3_BREAKOUT_CONFIRMATION_SLICE3_FULL_PASS=YES"
