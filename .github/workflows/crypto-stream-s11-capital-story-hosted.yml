name: Crypto Stream S11 Capital Story UID504

on:
  push:
    branches:
      - 'stream/s11-capital-story-runtime'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-s11-capital-story-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-s11-capital-story:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-s11-capital-story-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-s11-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "STREAM_S11_EXACT_SOURCE_PASS=YES"

      - name: Focused S11 capital runtime acceptance
        run: |
          "$TEST_PY" -m pytest -q \
            tests/test_canonical_paper_sizing.py \
            tests/test_canonical_vault_eligibility.py \
            tests/test_canonical_capital_runtime.py \
            tests/test_intelligence_stream_capital.py \
            tests/test_intelligence_stream_read_model.py \
            tests/test_transaction_tape.py \
            tests/test_transaction_tape_atomic.py \
            tests/test_epoch2_accounting.py
          "$TEST_PY" -m ruff check \
            src/crypto_signal/paper/canonical_sizing.py \
            src/crypto_signal/paper/canonical_vault_eligibility.py \
            src/crypto_signal/paper/canonical_capital_runtime.py \
            src/crypto_signal/paper/transaction_tape.py \
            src/crypto_signal/paper/transaction_tape_atomic.py \
            src/crypto_signal/product/intelligence_stream_capital.py \
            src/crypto_signal/product/intelligence_stream_read_model.py \
            tests/test_canonical_paper_sizing.py \
            tests/test_canonical_vault_eligibility.py \
            tests/test_canonical_capital_runtime.py \
            tests/test_intelligence_stream_capital.py
          "$TEST_PY" -m mypy \
            src/crypto_signal/paper/canonical_sizing.py \
            src/crypto_signal/paper/canonical_vault_eligibility.py \
            src/crypto_signal/paper/canonical_capital_runtime.py \
            src/crypto_signal/paper/transaction_tape.py \
            src/crypto_signal/paper/transaction_tape_atomic.py \
            src/crypto_signal/product/intelligence_stream_capital.py \
            src/crypto_signal/product/intelligence_stream_read_model.py
          echo "STREAM_S11_CAPITAL_CORE_PASS=YES"

      - name: Whole-repository regression
        run: |
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node --check src/crypto_signal/product/stream/app.js
          node --check src/crypto_signal/product/stream/evidence.js
          node --check src/crypto_signal/product/stream/visual_proof.js
          node tests/js/test_product_freshness.js
          echo "STREAM_S11_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-s11-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_S11_UID504_NON_MUTATING_PASS=YES"
