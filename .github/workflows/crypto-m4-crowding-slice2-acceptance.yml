name: Crypto M4 Crowding Slice2 Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-m4-derivatives-crowding-v1-slice2
    paths:
      - "src/crypto_signal/intelligence/derivatives_crowding.py"
      - "tests/test_derivatives_crowding_engine.py"
      - "docs/M4_DERIVATIVES_CROWDING_SLICE2.md"
      - ".github/workflows/crypto-m4-crowding-slice2-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: M4 focused acceptance
        run: |
          python -m pytest -q tests/test_derivatives_crowding_engine.py tests/test_derivatives_dynamics_engine.py tests/test_liquidation_heatmap_engine.py
          python -m ruff check src/crypto_signal/intelligence/derivatives_crowding.py tests/test_derivatives_crowding_engine.py
          python -m mypy src/crypto_signal/intelligence/derivatives_crowding.py
          echo "M4_DERIVATIVES_CROWDING_SLICE2_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M4_DERIVATIVES_CROWDING_SLICE2_FULL_PASS=YES"
