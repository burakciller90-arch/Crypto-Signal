name: Crypto R15 Orphan Detector Exact Diagnostic

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-orphan-detector-exact-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose orphan detector exact state
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Inspect as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set +e
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          RUNNER="$ROOT/Runner"

          process_cwd() {
            /usr/sbin/lsof -a -p "$1" -d cwd -Fn 2>/dev/null | /usr/bin/sed -n 's/^n//p' | /usr/bin/head -1
          }

          origin_ok() {
            cwd="$(process_cwd "$1")"
            [ "$cwd" = "$RUNNER" ] || [ "$cwd" = "cwd|rtd info error: No such file or directory" ]
          }

          echo "=== RAW SERVICE CANDIDATES ==="
          services="$(/bin/ps -axo pid=,user=,command= | /usr/bin/awk -v expected="./externals/node20/bin/node ./bin/RunnerService.js" -v expected_user="crypto-signal-agent" '
            {
              pid=$1; user=$2;
              sub(/^[[:space:]]*[0-9]+[[:space:]]+[^[:space:]]+[[:space:]]+/, "", $0)
              if (user == expected_user && $0 == expected) print pid
            }')"
          printf 'services_raw=<%s>\n' "$services"

          accepted=""
          for service in $services; do
            scwd="$(process_cwd "$service")"
            wrapper="$(ps -p "$service" -o ppid= | tr -d ' ')"
            wcmd="$(ps -p "$wrapper" -o command= 2>/dev/null || true)"
            wcwd="$(process_cwd "$wrapper")"
            suser="$(ps -p "$service" -o user= | tr -d ' ')"
            wuser="$(ps -p "$wrapper" -o user= | tr -d ' ')"
            echo "candidate=$service scwd=<$scwd> wrapper=$wrapper wcmd=<$wcmd> wcwd=<$wcwd> suser=$suser wuser=$wuser"
            if origin_ok "$service" \
              && [ "$wcmd" = "/bin/bash ./runsvc.sh" ] \
              && [ "$suser" = "crypto-signal-agent" ] \
              && [ "$wuser" = "crypto-signal-agent" ] \
              && origin_ok "$wrapper"; then
              accepted="$accepted$service
"
            fi
          done
          printf 'accepted=<%s>\n' "$accepted"
          count="$(printf '%s\n' "$accepted" | awk 'NF{n++} END{print n+0}')"
          echo "ACCEPTED_COUNT=$count"

          echo "=== WORKERS ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -F "$RUNNER/bin/Runner.Worker" | grep -v grep || true

          echo "=== LISTENERS ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -F "$RUNNER/bin/Runner.Listener" | grep -v grep || true

          echo "=== R15 RUNNER SERVICE ==="
          launchctl print "gui/$(id -u)/com.cryptosignal.r15-runner-service" 2>&1 | head -180 || true

          echo "=== R15 RUNNER SERVICE LOGS ==="
          tail -120 "$HOME/Library/Logs/CryptoSignalRecovery/runner-service-launchagent.out.log" 2>&1 || true
          tail -120 "$HOME/Library/Logs/CryptoSignalRecovery/runner-service-launchagent.err.log" 2>&1 || true
          tail -120 "$ROOT/RunnerLogs/r15-runner-service.out.log" 2>&1 || true
          tail -120 "$ROOT/RunnerLogs/r15-runner-service.err.log" 2>&1 || true

          echo "=== WATCHDOG ERR ==="
          tail -180 "$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" 2>&1 || true
          echo "R15_ORPHAN_DETECTOR_EXACT_DIAGNOSTIC_DONE=YES"
          SH
