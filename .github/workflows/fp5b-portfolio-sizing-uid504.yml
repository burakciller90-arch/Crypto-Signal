name: FP5-B Portfolio-Bounded Canonical Sizing UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/paper/canonical_sizing.py"
      - "tests/test_canonical_paper_sizing.py"
      - ".github/workflows/fp5b-portfolio-sizing-uid504.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp5b-portfolio-sizing-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: FP5-B exact-head portfolio-bounded sizing acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and frozen runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          TARGET="3d9f33db3f1189571d40566125fbeabd00c04930"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$TARGET"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "FP5B_EXACT_SOURCE_PASS=YES"
          echo "FP5B_RDP11_FROZEN_TARGET_EXACT=YES"
          echo "REAL_CAPITAL=0"

      - name: Focused FP5-B acceptance
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$PY" -m pytest -q             tests/test_canonical_paper_sizing.py             tests/test_intelligence_stream_capital_sizing.py             tests/test_canonical_capital_runtime.py
          "$PY" -m ruff check             src/crypto_signal/paper/canonical_sizing.py             tests/test_canonical_paper_sizing.py
          "$PY" -m mypy src/crypto_signal/paper/canonical_sizing.py
          echo "FP5B_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Existing FP3/S11 compatibility
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$PY" -m pytest -q             tests/test_autopilot_forward_sizing.py             tests/test_canonical_paper_sizing.py             tests/test_canonical_capital_runtime.py
          echo "FP5B_V1_COMPATIBILITY_PASS=YES"

      - name: Whole repository regression
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$PY" -m pytest -q
          "$PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "FP5B_FULL_REGRESSION_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove frozen runtime remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          TARGET="3d9f33db3f1189571d40566125fbeabd00c04930"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$TARGET"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "FP5B_DEVELOPMENT_NON_MUTATING_PASS=YES"
          echo "FP5B_PRODUCT_NON_MUTATING_PASS=YES"
          echo "FP5B_RDP11_TARGET_UNCHANGED_PASS=YES"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"
