name: Crypto Market Tape Detached Supervisor Diagnostic

on:
  push:
    branches:
      - v1.1-market-tape-hotcold-v1
    paths:
      - ".github/workflows/crypto-market-tape-detached-supervisor-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect detached UID504 supervisor failure
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 8
    steps:
      - name: Read internal supervisor evidence as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash <<'SH'
          set +e
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          CONTROL="$HOME/.crypto-signal-runtime"
          LOG="$HOME/Library/Logs/CryptoSignal/market-tape-supervisor.log"
          echo "=== CONTROL ==="
          ls -la "$CONTROL" 2>&1 || true
          for f in "$CONTROL/market-tape-supervisor.pid" "$CONTROL/market-tape-supervisor.stop"; do
            echo "--- $f"
            cat "$f" 2>&1 || true
          done
          echo "=== INTERNAL SUPERVISOR LOG ==="
          tail -200 "$LOG" 2>&1 || true
          echo "=== SSD SUPERVISOR STATUS ==="
          cat "$ROOT/Development/runtime/market_tape/supervisor_status.json" 2>&1 || true
          echo "=== PROCESSES ==="
          ps -axo pid=,ppid=,user=,etime=,command= | egrep 'market_tape_(supervisor|runtime)|run_market_tape' | grep -v egrep || true
          echo "=== LEGACY LAUNCHAGENT ==="
          launchctl print-disabled "gui/$(id -u)" 2>&1 | grep -F 'com.cryptosignal.markettape' || true
          echo "DETACHED_SUPERVISOR_DIAGNOSTIC_DONE=YES"
          SH
