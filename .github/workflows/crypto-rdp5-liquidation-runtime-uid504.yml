name: RDP5 Liquidation Runtime UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/liquidation_runtime.py"
      - "src/crypto_signal/data/adapters/bybit_liquidation_ws.py"
      - "src/crypto_signal/data/liquidation_wire_collection.py"
      - "ops/run_liquidation_market_tape_stream.py"
      - "ops/ssd_runtime_supervisor.sh"
      - "tests/test_rdp5_liquidation_runtime.py"
      - ".github/workflows/crypto-rdp5-liquidation-runtime-uid504.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test -d "$WB/.git"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP5_A_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP5_A_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused liquidation runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp5_liquidation_runtime.py \
            tests/test_liquidation_market_tape_persistence.py \
            tests/test_liquidation_heatmap_engine.py \
            tests/test_market_tape_collector_runtime.py \
            tests/test_wc1_ssd_supervisor_market_tape_single_owner.py
          "$PY" -m ruff check \
            src/crypto_signal/data/liquidation_runtime.py \
            src/crypto_signal/data/adapters/bybit_liquidation_ws.py \
            src/crypto_signal/data/liquidation_wire_collection.py \
            ops/run_liquidation_market_tape_stream.py \
            tests/test_rdp5_liquidation_runtime.py
          "$PY" -m mypy \
            src/crypto_signal/data/liquidation_runtime.py \
            src/crypto_signal/data/adapters/bybit_liquidation_ws.py \
            src/crypto_signal/data/liquidation_wire_collection.py
          "$PY" -m py_compile ops/run_liquidation_market_tape_stream.py
          /bin/bash -n ops/ssd_runtime_supervisor.sh
          echo "RDP5_A_LIQUIDATION_RUNTIME_PASS=YES"
          echo "ZERO_EVENT_COVERAGE_INVENTED=NO"
          echo "REAL_CAPITAL=0"
