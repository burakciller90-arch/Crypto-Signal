name: World-Class WC2 Policy-Free Hold Cash Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/paper/position_sizing_bridge.py"
      - "src/crypto_signal/paper/shadow_replay_orchestrator.py"
      - "src/crypto_signal/paper/shadow_cycle_runtime.py"
      - "src/crypto_signal/evaluation/untouched_forward_paper.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared.py"
      - "src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py"
      - "tests/test_position_sizing_bridge.py"
      - "tests/test_wc2_same_cycle_paper.py"
      - "tests/test_wc2_prepared_cycle.py"
      - ".github/workflows/world-class-wc2-policy-free-hold-cash-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-policy-free-hold-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused policy-free HOLD_CASH acceptance
        run: |
          python -m pytest -q             tests/test_position_sizing_bridge.py             tests/test_shadow_replay_orchestrator.py             tests/test_shadow_cycle_runtime.py             tests/test_wc2_same_cycle_paper.py             tests/test_wc2_prepared_cycle.py
          python -m ruff check             src/crypto_signal/paper/position_sizing_bridge.py             src/crypto_signal/paper/shadow_replay_orchestrator.py             src/crypto_signal/paper/shadow_cycle_runtime.py             src/crypto_signal/evaluation/untouched_forward_paper.py             src/crypto_signal/evaluation/untouched_forward_prepared.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py             tests/test_position_sizing_bridge.py             tests/test_wc2_same_cycle_paper.py             tests/test_wc2_prepared_cycle.py
          python -m mypy             src/crypto_signal/paper/position_sizing_bridge.py             src/crypto_signal/paper/shadow_replay_orchestrator.py             src/crypto_signal/paper/shadow_cycle_runtime.py             src/crypto_signal/evaluation/untouched_forward_paper.py             src/crypto_signal/evaluation/untouched_forward_prepared.py             src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py
          echo "WC2_POLICY_FREE_HOLD_CASH_FOCUSED_PASS=YES"
          echo "WC2_NO_INVENTED_SIZING_POLICY_PASS=YES"
          echo "WC2_NO_REVIEWED_EXECUTION_PASS=YES"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_POLICY_FREE_HOLD_CASH_FULL_PASS=YES"
