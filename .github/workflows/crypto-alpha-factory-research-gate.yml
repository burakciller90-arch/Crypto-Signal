name: Crypto Alpha Factory Research Gate

on:
  push:
    paths:
      - "research/**"
      - "tests/test_alpha_factory_*.py"
      - ".github/workflows/crypto-alpha-factory-research-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Alpha Factory research-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"
      - name: Research contract tests
        run: |
          python -m pytest -q tests/test_alpha_factory_*.py
          python -m ruff check research tests/test_alpha_factory_*.py
          python -m mypy research
          echo "ALPHA_FACTORY_RESEARCH_GATE_PASS=YES"
