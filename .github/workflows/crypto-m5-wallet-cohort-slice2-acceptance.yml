name: Crypto M5 Wallet Cohort Slice2 Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-m5-wallet-cohort-registry-v1-slice2
    paths:
      - "src/crypto_signal/data/wallet_cohorts.py"
      - "src/crypto_signal/intelligence/wallet_cohorts.py"
      - "tests/test_wallet_cohort_registry.py"
      - "docs/M5_WALLET_COHORT_REGISTRY_SLICE2.md"
      - ".github/workflows/crypto-m5-wallet-cohort-slice2-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: M5 wallet cohort focused acceptance
        run: |
          python -m pytest -q tests/test_wallet_cohort_registry.py
          python -m ruff check src/crypto_signal/data/wallet_cohorts.py src/crypto_signal/intelligence/wallet_cohorts.py tests/test_wallet_cohort_registry.py
          python -m mypy src/crypto_signal/data/wallet_cohorts.py src/crypto_signal/intelligence/wallet_cohorts.py
          echo "M5_WALLET_COHORT_SLICE2_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M5_WALLET_COHORT_SLICE2_FULL_PASS=YES"
