name: Crypto Stream S13 Sound Notifications UID504

on:
  push:
    branches:
      - 'stream/s13-sound-notifications'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-s13-sound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-s13-sound:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-s13-sound-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-s13-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "STREAM_S13_EXACT_SOURCE_PASS=YES"

      - name: Focused S13 notification acceptance
        run: |
          "$TEST_PY" -m pytest -q \
            tests/test_intelligence_stream_ui.py \
            tests/test_intelligence_stream_read_model.py \
            tests/test_dashboard_web.py
          "$TEST_PY" -m ruff check \
            tests/test_intelligence_stream_ui.py \
            ops/capture_chromium_viewport.py
          "$TEST_PY" -m mypy ops/capture_chromium_viewport.py
          node --check src/crypto_signal/product/stream/notifications.js
          node --check src/crypto_signal/product/stream/app.js
          echo "STREAM_S13_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        run: |
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py ops/capture_chromium_viewport.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node --check src/crypto_signal/product/stream/app.js
          node --check src/crypto_signal/product/stream/evidence.js
          node --check src/crypto_signal/product/stream/visual_proof.js
          node --check src/crypto_signal/product/stream/notifications.js
          node tests/js/test_product_freshness.js
          echo "STREAM_S13_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Render notification UX and prove delivery semantics
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PORT=48713
          BASE_URL="http://127.0.0.1:$PORT"
          OUT="$RUNNER_TEMP/stream-s13-visual-snapshot"
          mkdir -p "$OUT"

          cleanup() {
            if [ -n "${PREVIEW_PID:-}" ]; then
              kill "$PREVIEW_PID" >/dev/null 2>&1 || true
            fi
            pkill -TERM -f -- '--headless=new' 2>/dev/null || true
            sleep 1
            pkill -KILL -f -- '--headless=new' 2>/dev/null || true
          }
          trap cleanup EXIT

          (
            unset RUNNER_TRACKING_ID
            export PYTHONPATH="$GITHUB_WORKSPACE/src"
            cd "$GITHUB_WORKSPACE"
            exec /usr/bin/nice -n 15 "$TEST_PY" "$GITHUB_WORKSPACE/ops/run_dashboard.py" \
              --host 127.0.0.1 \
              --port "$PORT" \
              --ledger "$DEV/runtime/ledger/live_signal_ledger.sqlite3" \
              --alert-outbox "$DEV/runtime/alerts/alert_outbox.sqlite3" \
              --paper-ledger "$DEV/runtime/paper/paper_fund.sqlite3" \
              --candle-cache "$DEV/runtime/data/live_base_15m_cache.sqlite3" \
              --stream-ledger "$DEV/runtime/stream/intelligence_stream.sqlite3"
          ) >"$OUT/preview.out.log" 2>"$OUT/preview.err.log" < /dev/null &
          PREVIEW_PID="$!"

          ready=0
          for i in {1..30}; do
            if curl -fsS --max-time 3 "$BASE_URL/api/health" > "$OUT/health.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            tail -120 "$OUT/preview.err.log" || true
            exit 70
          fi

          curl -fsS "$BASE_URL/stream-preview?fixture=sound" > "$OUT/stream-preview.html"
          grep -F 'data-ui-version="crypto-signal-stream-v1-s13"' "$OUT/stream-preview.html" >/dev/null
          grep -F 'GÖRSEL TEST FIXTURE' "$OUT/stream-preview.html" >/dev/null
          grep -F 'soundEnabledToggle' "$OUT/stream-preview.html" >/dev/null

          BROWSER=""
          for candidate in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/Applications/Chromium.app/Contents/MacOS/Chromium" \
            "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" \
            "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary"; do
            if [ -x "$candidate" ]; then
              BROWSER="$candidate"
              break
            fi
          done
          test -n "$BROWSER"

          URL="$BASE_URL/stream-preview?fixture=sound"
          {
            echo "URL=$URL"
            echo "CAPTURED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "SOURCE_HEAD=$GITHUB_SHA"
            echo "BROWSER_CAPTURE_BACKEND=CHROMIUM_CDP"
            echo "BROWSER_BINARY=$BROWSER"
            echo "REAL_CAPITAL=0"
            echo "READ_ONLY_CAPTURE=YES"
            echo "FIXTURE_NON_LIVE=YES"
          } > "$OUT/metadata.txt"

          "$TEST_PY" "$GITHUB_WORKSPACE/ops/capture_chromium_viewport.py" \
            --browser "$BROWSER" \
            --url "$URL" \
            --output "$OUT/desktop-notifications.png" \
            --metrics-out "$OUT/desktop-notifications.metrics.json" \
            --width 1440 \
            --height 1100 \
            --require-no-horizontal-overflow \
            --probe-notifications
          test -s "$OUT/desktop-notifications.png"

          "$TEST_PY" "$GITHUB_WORKSPACE/ops/capture_chromium_viewport.py" \
            --browser "$BROWSER" \
            --url "$URL" \
            --output "$OUT/mobile-notifications.png" \
            --metrics-out "$OUT/mobile-notifications.metrics.json" \
            --width 430 \
            --height 860 \
            --mobile \
            --require-no-horizontal-overflow \
            --probe-notifications
          test -s "$OUT/mobile-notifications.png"

          grep -F '"notification_probe"' "$OUT/desktop-notifications.metrics.json" >/dev/null
          grep -F '"notification_probe"' "$OUT/mobile-notifications.metrics.json" >/dev/null
          grep -F '"innerWidth": 430' "$OUT/mobile-notifications.metrics.json" >/dev/null
          grep -F '"scrollWidth": 430' "$OUT/mobile-notifications.metrics.json" >/dev/null
          echo "STREAM_S13_RENDERED_NOTIFICATIONS_PASS=YES"

      - name: Upload Stream S13 visual snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-s13-visual-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-s13-visual-snapshot
          if-no-files-found: error
          retention-days: 7

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-s13-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_S13_UID504_NON_MUTATING_PASS=YES"
