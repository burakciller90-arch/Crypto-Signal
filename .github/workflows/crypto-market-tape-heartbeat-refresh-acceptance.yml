name: Crypto Market Tape Heartbeat Refresh Acceptance

on:
  push:
    branches:
      - v1.1-market-tape-hotcold-v1
    paths:
      - ".github/workflows/crypto-market-tape-heartbeat-refresh-acceptance.yml"

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh heartbeat build under existing R11 owner
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stage exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/crypto-market-tape-heartbeat-refresh"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R src ops "$STAGE/"
          printf '%s\n' "$GITHUB_SHA" >"$STAGE/BUILD_COMMIT"
          (
            cd "$STAGE"
            find src ops -type f -print0 | sort -z | xargs -0 shasum -a 256 > BUILD_SHA256SUMS
          )
          chmod -R a+rX "$STAGE"
          test -s "$STAGE/BUILD_SHA256SUMS"
          echo "HEARTBEAT_REFRESH_STAGE_SHA=$GITHUB_SHA"

      - name: Atomically refresh Market Tape stable bundle
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          test "$(sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          sudo -n -H -u crypto-signal-agent /usr/bin/env \
            SOURCE_STAGE=/tmp/crypto-market-tape-heartbeat-refresh \
            EXPECTED_SHA="$GITHUB_SHA" \
            HOME=/Users/crypto-signal-agent \
            /bin/bash <<'SH'
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          STABLE="$ROOT/MarketTape"
          NEXT="$ROOT/MarketTape.next"
          PREVIOUS="$ROOT/MarketTape.previous"
          CONTROL="$HOME/.crypto-signal-runtime"
          ENABLE="$CONTROL/market-tape.enabled"
          PID_FILE="$CONTROL/market-tape-supervisor.pid"
          TOP_PID_FILE="$ROOT/ssd-service-supervisor.pid"
          TOP_SCRIPT="$ROOT/ssd-service-supervisor.sh"
          STAGE="$SOURCE_STAGE"

          test -d "$ROOT"
          test -s "$TOP_PID_FILE"
          top="$(cat "$TOP_PID_FILE")"
          kill -0 "$top"
          ps -p "$top" -o command= | grep -F "$TOP_SCRIPT" >/dev/null

          mkdir -p "$CONTROL"
          chmod 700 "$CONTROL"
          rm -f "$ENABLE"

          if [ -d "$STABLE" ] && [ -f "$STABLE/ops/market_tape/stop_market_tape_supervisor.sh" ]; then
            /bin/bash "$STABLE/ops/market_tape/stop_market_tape_supervisor.sh" || true
          fi

          for _ in {1..40}; do
            pid="$(cat "$PID_FILE" 2>/dev/null || true)"
            if [ -z "$pid" ] || ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          pid="$(cat "$PID_FILE" 2>/dev/null || true)"
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            echo "HEARTBEAT_REFRESH_ERROR=OLD_SUPERVISOR_STILL_ALIVE pid=$pid" >&2
            exit 71
          fi

          rm -rf "$NEXT"
          mkdir -p "$NEXT"
          cp -R "$STAGE/src" "$NEXT/"
          cp -R "$STAGE/ops" "$NEXT/"
          cp "$STAGE/BUILD_COMMIT" "$NEXT/BUILD_COMMIT"
          cp "$STAGE/BUILD_SHA256SUMS" "$NEXT/BUILD_SHA256SUMS"
          (
            cd "$NEXT"
            shasum -a 256 -c BUILD_SHA256SUMS >/dev/null
          )

          rm -rf "$PREVIOUS"
          if [ -d "$STABLE" ]; then
            mv "$STABLE" "$PREVIOUS"
          fi
          mv "$NEXT" "$STABLE"

          if ! MARKET_TAPE_INSTALL_NO_START=1 /bin/bash "$STABLE/ops/install_market_tape_runtime.sh"; then
            rm -rf "$STABLE"
            if [ -d "$PREVIOUS" ]; then
              mv "$PREVIOUS" "$STABLE"
            fi
            echo "HEARTBEAT_REFRESH_ERROR=INSTALLER_FAILED_LATCH_LEFT_DISABLED" >&2
            exit 72
          fi

          test "$(cat "$STABLE/BUILD_COMMIT")" = "$EXPECTED_SHA"
          (
            cd "$STABLE"
            shasum -a 256 -c BUILD_SHA256SUMS >/dev/null
          )
          test "$("$ROOT/RuntimeEnvs/market-tape-cold/bin/python" -c 'import pyarrow; print(pyarrow.__version__)')" = "22.0.0"

          : >"$ENABLE"
          chmod 600 "$ENABLE"
          echo "MARKET_TAPE_HEARTBEAT_STABLE_REFRESH_PASS=YES build=$EXPECTED_SHA"
          echo "REAL_CAPITAL=0"
          SH

      - name: Verify R11 recovery and both 30s heartbeats
        shell: bash
        run: |
          set -euo pipefail
          sudo -n -H -u crypto-signal-agent /usr/bin/env \
            EXPECTED_SHA="$GITHUB_SHA" \
            HOME=/Users/crypto-signal-agent \
            /bin/bash <<'SH'
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          STABLE="$ROOT/MarketTape"
          TAPE="$ROOT/Development/runtime/market_tape"
          RAW="$TAPE/raw_market_tape.sqlite3"
          DB="$TAPE/market_tape.sqlite3"
          STATUS="$TAPE/runtime_status.json"
          SUP_STATUS="$TAPE/supervisor_status.json"
          CONTROL="$HOME/.crypto-signal-runtime"
          ENABLE="$CONTROL/market-tape.enabled"
          PID_FILE="$CONTROL/market-tape-supervisor.pid"
          TOP_PID_FILE="$ROOT/ssd-service-supervisor.pid"
          TOP_SCRIPT="$ROOT/ssd-service-supervisor.sh"
          SUP_SCRIPT="$STABLE/ops/market_tape/run_market_tape_supervisor.py"
          RUN_SCRIPT="$STABLE/ops/run_market_tape_runtime.py"

          before="$(sqlite3 "$RAW" 'SELECT COUNT(*) FROM raw_market_events;')"
          ready=0
          for _ in {1..120}; do
            top="$(cat "$TOP_PID_FILE" 2>/dev/null || true)"
            sup="$(cat "$PID_FILE" 2>/dev/null || true)"
            top_count="$(ps -axo user=,command= | awk -v user="crypto-signal-agent" -v script="$TOP_SCRIPT" '$1==user && index($0,script)>0 {n++} END{print n+0}')"
            sup_count="$(ps -axo user=,command= | awk -v user="crypto-signal-agent" -v script="$SUP_SCRIPT" '$1==user && index($0,script)>0 {n++} END{print n+0}')"
            runtime_count="$(ps -axo user=,command= | awk -v user="crypto-signal-agent" -v script="$RUN_SCRIPT" '$1==user && index($0,script)>0 {n++} END{print n+0}')"
            if [ "$top_count" = "1" ] && [ "$sup_count" = "1" ] && [ "$runtime_count" = "1" ]               && [ -n "$top" ] && kill -0 "$top" 2>/dev/null               && [ -n "$sup" ] && kill -0 "$sup" 2>/dev/null               && [ -s "$STATUS" ] && [ -s "$SUP_STATUS" ]; then
              sup_build="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("build_commit",""))' "$SUP_STATUS")"
              if [ "$sup_build" = "$EXPECTED_SHA" ]; then
                ready=1
                break
              fi
            fi
            sleep 1
          done

          echo "R11_HEARTBEAT_RECOVERY_READY=$ready"
          echo "SSD_SUPERVISOR_COUNT=$top_count PID=$top"
          echo "MARKET_TAPE_SUPERVISOR_COUNT=$sup_count PID=$sup"
          echo "MARKET_TAPE_RUNTIME_COUNT=$runtime_count"
          test "$ready" = "1"
          test -f "$ENABLE"

          runtime_t1="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["updated_at_epoch"]))' "$STATUS")"
          supervisor_t1="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["updated_at_epoch"]))' "$SUP_STATUS")"
          after_start="$(sqlite3 "$RAW" 'SELECT COUNT(*) FROM raw_market_events;')"
          echo "HEARTBEAT_T1 runtime=$runtime_t1 supervisor=$supervisor_t1 raw=$after_start"

          sleep 38

          runtime_t2="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["updated_at_epoch"]))' "$STATUS")"
          supervisor_t2="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["updated_at_epoch"]))' "$SUP_STATUS")"
          after_heartbeat="$(sqlite3 "$RAW" 'SELECT COUNT(*) FROM raw_market_events;')"
          now="$(date +%s)"
          echo "HEARTBEAT_T2 runtime=$runtime_t2 supervisor=$supervisor_t2 raw=$after_heartbeat now=$now"

          test "$runtime_t2" -gt "$runtime_t1"
          test "$supervisor_t2" -gt "$supervisor_t1"
          test $((now-runtime_t2)) -ge 0
          test $((now-runtime_t2)) -le 45
          test $((now-supervisor_t2)) -ge 0
          test $((now-supervisor_t2)) -le 45
          test "$after_heartbeat" -gt "$after_start"
          test "$after_heartbeat" -gt "$before"

          python3 - "$STATUS" "$SUP_STATUS" "$EXPECTED_SHA" <<'PY'
          import json,sys,time
          runtime=json.load(open(sys.argv[1]))
          supervisor=json.load(open(sys.argv[2]))
          expected=sys.argv[3]
          assert runtime["state"] in {"collecting_chunk","collecting"}
          assert runtime["real_capital"] == 0
          assert runtime["capacity_decision"] == "collect"
          assert int(runtime["hot_bytes"]) < 25 * 1024**3
          assert int(runtime["cold_bytes"]) < 600 * 1024**3
          assert int(runtime["free_bytes"]) > 250 * 1024**3
          assert int(time.time()) - int(runtime["updated_at_epoch"]) <= 45
          assert supervisor["state"] == "running"
          assert supervisor["real_capital"] == 0
          assert supervisor["build_commit"] == expected
          assert int(supervisor["child_pid"]) > 0
          assert int(time.time()) - int(supervisor["updated_at_epoch"]) <= 45
          PY

          test "$(sqlite3 "$RAW" 'PRAGMA quick_check;')" = "ok"
          test "$(sqlite3 "$DB" 'PRAGMA quick_check;')" = "ok"
          test "$(cat "$STABLE/BUILD_COMMIT")" = "$EXPECTED_SHA"
          test "$(launchctl print-disabled "gui/$(id -u)" | grep -c '"com.cryptosignal.markettape" => disabled')" -ge 1

          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health             | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok"; assert d["real_capital"]==0; assert d["read_only"] is True'

          echo "MARKET_TAPE_HEARTBEAT_REFRESH_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
          SH

      - name: Cleanup transient stage
        if: always()
        shell: bash
        run: rm -rf /tmp/crypto-market-tape-heartbeat-refresh
