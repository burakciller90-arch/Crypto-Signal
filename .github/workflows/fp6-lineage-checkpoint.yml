name: FP6 lineage checkpoint helper

on:
  push:
    branches:
      - "fp6/execution-funding-r22-passport-lineage-20261001"
    paths:
      - ".github/workflows/fp6-lineage-checkpoint.yml"
      - ".github/scripts/fp6_lineage_checkpoint.py"
      - "docs/agent/checkpoints/2026-10-01-fp6-execution-lineage-start.md"

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fp6/execution-funding-r22-passport-lineage-20261001"
          fetch-depth: 0
          clean: true
      - name: Update durable task state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fp6_lineage_checkpoint.py
          git config user.name "crypto-signal-agent"
          git config user.email "crypto-signal-agent@users.noreply.github.com"
          git add docs/agent/CURRENT_FRONTIER.md docs/agent/HANDOFF_LOG.md
          if git diff --cached --quiet; then
            echo "CHECKPOINT_ALREADY_PRESENT=YES"
          else
            git commit -m "docs: checkpoint FP6 execution lineage start"
            git push origin HEAD:fp6/execution-funding-r22-passport-lineage-20261001
          fi
          echo "REAL_CAPITAL=0"
