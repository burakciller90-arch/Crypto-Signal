name: World-Class WC2 Bounded Paper Execution UID504

on:
  pull_request:
    branches: [main, wc2-execution-runtime-v1]
    paths:
      - ".github/workflows/crypto-mac-command.yml"
      - ".github/workflows/world-class-wc2-paper-execution-bounded-uid504.yml"
      - "tests/test_wc2_paper_execution_runtime_workflow.py"
      - "tests/test_wc2_runtime_state_workflow.py"
      - "tests/test_wc2_bounded_collection_workflow.py"
      - "tests/test_wc2_paper_execution_protocol_registration_workflow.py"

permissions:
  contents: read

concurrency:
  group: wc2-execution-bounded-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wc2-bounded-paper-execution:
    name: WC2 bounded execution command exact-source UID504 acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and immutable Development checkout
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test -x "$DEV/.venv/bin/python"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/wc2-bounded-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "WC2_BOUNDED_EXECUTION_EXACT_SOURCE_PASS=YES"

      - name: Create isolated exact-source test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc2-bounded-execution-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install \
            "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused bounded execution workflow acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q \
            tests/test_wc2_paper_execution_runtime_workflow.py \
            tests/test_wc2_runtime_state_workflow.py \
            tests/test_wc2_bounded_collection_workflow.py \
            tests/test_wc2_paper_execution_protocol_registration_workflow.py
          "$TEST_PY" -m ruff check \
            tests/test_wc2_paper_execution_runtime_workflow.py \
            tests/test_wc2_runtime_state_workflow.py \
            tests/test_wc2_bounded_collection_workflow.py \
            tests/test_wc2_paper_execution_protocol_registration_workflow.py
          echo "WC2_BOUNDED_EXECUTION_WORKFLOW_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_BOUNDED_EXECUTION_WORKFLOW_FULL_PASS=YES"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/wc2-bounded-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "WC2_BOUNDED_EXECUTION_UID504_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
