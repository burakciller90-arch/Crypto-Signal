name: Validate Local 30m Wake v3

on:
  push:
    branches:
      - feature/local-30m-continuity-timer-v3
    paths:
      - "ops/continuity/recurring_wake.py"
      - "ops/continuity/relay_submit.py"
      - "ops/continuity/launchd/com.cryptosignal.autowake30m.plist"
      - ".github/workflows/crypto-install-local-30m-wake.yml"
      - ".github/workflows/crypto-30m-continuity-wake.yml"
      - ".github/workflows/validate-local-30m-wake-v3.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             ops/continuity/recurring_wake.py             ops/continuity/relay_submit.py

          python - <<'PY'
          from pathlib import Path
          import plistlib

          wake = Path("ops/continuity/recurring_wake.py").read_text()
          assert "scheduled_slot_event_id" in wake
          assert "crypto-30m-continuity:" in wake
          assert 'CRYPTO_WAKE_LOCAL_TIMER' in wake
          assert '--scheduled-slot' in wake

          plist = plistlib.loads(
              Path(
                  "ops/continuity/launchd/com.cryptosignal.autowake30m.plist"
              ).read_bytes()
          )
          assert plist["Label"] == "com.cryptosignal.autowake30m"
          assert plist["StartCalendarInterval"] == [{"Minute": 0}, {"Minute": 30}]
          assert plist["EnvironmentVariables"]["CRYPTO_WAKE_LOCAL_TIMER"] == "1"
          assert plist["ProgramArguments"][-1] == "--scheduled-slot"

          fallback = Path(
              ".github/workflows/crypto-30m-continuity-wake.yml"
          ).read_text()
          assert "GITHUB_FALLBACK_SKIPPED=YES" in fallback
          assert "--scheduled-slot" in fallback
          assert "LOCAL_WAKE_AGE_SECONDS" in fallback

          installer = Path(
              ".github/workflows/crypto-install-local-30m-wake.yml"
          ).read_text()
          assert "launchctl bootstrap" in installer
          assert "LOCAL_30M_WAKE_INSTALL_PASS=YES" in installer

          print("LOCAL_30M_WAKE_V3_VALIDATION_PASS=YES")
          PY
