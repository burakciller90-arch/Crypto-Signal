name: Crypto R25 Family Proof Adapters Hosted
on:
  push:
    branches:
      - v1.1-r25-family-proof-adapters-slice3-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r25-family-proof-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused exact-PIT adapter acceptance
        run: |
          python -m pytest -q tests/test_family_proof_adapters.py tests/test_unified_decision_runtime.py tests/test_confluence_matrix_v2.py tests/test_decision_product_bridge.py
          python -m ruff check src/crypto_signal/intelligence/family_proof_adapters.py tests/test_family_proof_adapters.py
          python -m mypy src/crypto_signal/intelligence/family_proof_adapters.py
          echo "R25_FAMILY_PROOF_ADAPTERS_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "R25_FAMILY_PROOF_ADAPTERS_FULL_PASS=YES"
          echo "R25_REAL_CAPITAL_ZERO_PASS=YES"
