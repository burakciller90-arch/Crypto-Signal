name: Crypto M6 Threshold Forward Slice2 Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-m6-threshold-forward-research-v1-slice2
    paths:
      - "research/alpha_factory/confluence_threshold_research.py"
      - "tests/test_confluence_threshold_research.py"
      - "docs/M6_CONFLUENCE_THRESHOLD_FORWARD_SLICE2.md"
      - ".github/workflows/crypto-m6-threshold-forward-slice2-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: M6 threshold-forward focused acceptance
        run: |
          python -m pytest -q tests/test_confluence_threshold_research.py tests/test_confluence_matrix_v2.py
          python -m ruff check research/alpha_factory/confluence_threshold_research.py tests/test_confluence_threshold_research.py
          python -m mypy research/alpha_factory/confluence_threshold_research.py
          echo "M6_THRESHOLD_FORWARD_SLICE2_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests research/alpha_factory/confluence_threshold_research.py ops/verify_stage10_integrated.py
          python -m mypy src research/alpha_factory/confluence_threshold_research.py ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M6_THRESHOLD_FORWARD_SLICE2_FULL_PASS=YES"
