name: Crypto UID504 Passwordless Bridge Install

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-uid504-passwordless-bridge.yml"

permissions:
  contents: read

jobs:
  install:
    name: Install UID501 to UID504 passwordless bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Prepare one-time local installer
        shell: bash
        run: |
          set -euo pipefail
          LAUNCHER="/Users/burakciller/Desktop/Crypto-UID504-Permission-Bridge.command"
          PASS="/tmp/crypto-uid504-bridge.pass"
          FAIL="/tmp/crypto-uid504-bridge.fail"
          rm -f "$PASS" "$FAIL" "$LAUNCHER"
          cat >"$LAUNCHER" <<'SH'
          #!/bin/bash
          set -euo pipefail
          PASS="/tmp/crypto-uid504-bridge.pass"
          FAIL="/tmp/crypto-uid504-bridge.fail"
          TMP="/tmp/crypto-signal-uid504-bridge.sudoers"
          DEST="/etc/sudoers.d/crypto-signal-uid504-bridge"

          fail() {
            rc=$?
            printf 'rc=%s\n' "$rc" >"$FAIL"
            echo
            echo "Yetki koprusu kurulumu durdu. Bu pencereyi kapatma."
            exit "$rc"
          }
          trap fail ERR
          rm -f "$PASS" "$FAIL" "$TMP"

          echo "Crypto Signal UID501 -> UID504 kalici yetki koprusu"
          echo "Bu yetki root ALL DEGILDIR; sadece crypto-signal-agent (UID504) adina komut calistirmaya izin verir."
          echo
          sudo -v
          printf 'burakciller ALL=(crypto-signal-agent) NOPASSWD: ALL\n' >"$TMP"
          sudo /usr/sbin/visudo -cf "$TMP"
          sudo /usr/bin/install -o root -g wheel -m 0440 "$TMP" "$DEST"
          sudo /usr/sbin/visudo -cf /etc/sudoers
          sudo -n -H -u crypto-signal-agent /usr/bin/id

          # Root must remain password-protected.
          if sudo -n /usr/bin/true 2>/dev/null; then
            echo "UNEXPECTED_PASSWORDLESS_ROOT=YES"
            exit 61
          fi
          echo "PASSWORDLESS_ROOT=NO"
          date >"$PASS"
          echo
          echo "CRYPTO_UID504_PASSWORDLESS_BRIDGE_PASS=YES"
          echo "Bundan sonra Crypto Signal UID504 islemleri icin parola gerekmeyecek."
          SH
          chmod 700 "$LAUNCHER"
          /usr/bin/open -a Terminal "$LAUNCHER"
          echo "CRYPTO_UID504_BRIDGE_TERMINAL_LAUNCHED=YES"

      - name: Wait for local install
        shell: bash
        run: |
          set -euo pipefail
          PASS="/tmp/crypto-uid504-bridge.pass"
          FAIL="/tmp/crypto-uid504-bridge.fail"
          outcome=""
          for _ in {1..300}; do
            if [ -f "$PASS" ]; then outcome="PASS"; break; fi
            if [ -f "$FAIL" ]; then outcome="FAIL"; break; fi
            sleep 1
          done
          echo "CRYPTO_UID504_BRIDGE_OUTCOME=${outcome:-TIMEOUT}"
          if [ "$outcome" = "FAIL" ]; then cat "$FAIL"; exit 1; fi
          test "$outcome" = "PASS"

      - name: Verify bridge without password
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID504 NOPASSWD ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/id
          test "$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          echo "UID501_TO_UID504_NOPASSWD_PASS=YES"

          echo "=== ROOT MUST REMAIN PROTECTED ==="
          set +e
          /usr/bin/sudo -n /usr/bin/true
          rc=$?
          set -e
          echo "ROOT_NOPASSWD_RC=$rc"
          test "$rc" -ne 0
          echo "ROOT_REMAINS_PASSWORD_PROTECTED=YES"

      - name: Cleanup local helper
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/crypto-signal-uid504-bridge.sudoers \
            /tmp/crypto-uid504-bridge.pass \
            /tmp/crypto-uid504-bridge.fail \
            /Users/burakciller/Desktop/Crypto-UID504-Permission-Bridge.command
