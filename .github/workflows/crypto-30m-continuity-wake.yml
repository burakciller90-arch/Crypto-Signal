name: Crypto 30m Continuity Wake

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - feature/continuity-30m-autowake-current-chat
    paths:
      - ".github/workflows/crypto-30m-continuity-wake.yml"
      - "ops/continuity/recurring_wake.py"
      - "ops/continuity/bridge_watchdog.py"
      - ".github/workflows/crypto-rebind-chat.yml"
      - ".github/workflows/crypto-mac-command.yml"

permissions:
  contents: read

concurrency:
  group: crypto-30m-continuity-wake
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate recurring wake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate continuity wake code
        run: |
          python -m py_compile             ops/continuity/recurring_wake.py             ops/continuity/bridge_watchdog.py
          grep -q 'CRYPTO_SIGNAL_AUTONOMOUS_CONTINUE_V1' ops/continuity/recurring_wake.py
          grep -q 'REAL_CAPITAL=0' ops/continuity/recurring_wake.py
          grep -q '6ab0debd-49a8-83eb-8b33-a7ce2ef826d0' ops/continuity/recurring_wake.py
          grep -q 'delegated project continuation' ops/continuity/bridge_watchdog.py
          grep -q 'wakeheartbeat' .github/workflows/crypto-mac-command.yml
          test "$(grep -c '6ab0debd-49a8-83eb-8b33-a7ce2ef826d0' .github/workflows/crypto-rebind-chat.yml)" = "2"
          echo "CRYPTO_30M_WAKE_VALIDATION_PASS=YES"

  wake:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: UID504 30m continuity wake
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect terminal state and send exact-chat wake
        shell: bash
        run: |
          set -euo pipefail
          EVENT_ID="crypto-30m-continuity:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          /usr/bin/python3 "$GITHUB_WORKSPACE/ops/continuity/recurring_wake.py" "$EVENT_ID"
