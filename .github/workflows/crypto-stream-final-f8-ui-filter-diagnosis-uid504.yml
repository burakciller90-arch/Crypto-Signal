name: Crypto Stream Final F8 UI Filter Diagnosis UID504

on:
  push:
    branches:
      - 'accept/f8-ui-filter-diagnosis'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Diagnose actual browser filter request and state
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          BROWSER="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$BROWSER"
          export PYTHONPATH="$GITHUB_WORKSPACE/ops:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" - "$BROWSER" <<'PY'
          import json,sys,time
          from argparse import Namespace
          from pathlib import Path
          from capture_chromium_viewport import CdpSession, _free_port, _wait_target
          import subprocess, signal, os

          browser=Path(sys.argv[1])
          identity="292fff32aef2df8a30eea66069f2a36c9c8ccfcd8042d1518f0b7e7526271d74"
          search="SOLUSDT 4h: Market/Geometry için ilk forward state kaydedildi — watch:bullish:no_geometry. Yön: bullish."
          port=_free_port()
          profile=Path("/tmp")/f"f8-ui-filter-diag-{os.getpid()}"
          url=f"http://127.0.0.1:48700/stream-preview?message={identity}"
          command=[
              str(browser),"--headless=new","--disable-gpu","--no-first-run",
              "--no-default-browser-check","--remote-allow-origins=*",
              f"--remote-debugging-port={port}",f"--user-data-dir={profile}","about:blank",
          ]
          process=subprocess.Popen(command,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
          session=None
          try:
              target=_wait_target(port,url)
              ws=target["webSocketDebuggerUrl"]
              session=CdpSession(ws)
              session.command("Page.enable")
              session.command("Runtime.enable")
              session.command("Page.navigate",{"url":url})

              setup=f"""(async()=>{{
                const identity={json.dumps(identity)};
                for(let i=0;i<80;i++){{
                  const node=[...document.querySelectorAll('.message')].find(n=>n.dataset.identity===identity)||null;
                  if(node && document.querySelectorAll('[data-evidence-kind]').length) break;
                  await new Promise(r=>setTimeout(r,100));
                }}
                window.__f8FilterFetches=[];
                const originalFetch=window.fetch.bind(window);
                window.fetch=async (...args)=>{{
                  const u=String(args[0] instanceof Request ? args[0].url : args[0]);
                  try{{
                    const response=await originalFetch(...args);
                    if(u.includes('/api/stream/messages?')){{
                      const clone=response.clone();
                      let count=null; let status=null;
                      try{{
                        const body=await clone.json();
                        status=body?.status||null;
                        count=Array.isArray(body?.page?.items)?body.page.items.length:null;
                      }}catch{{}}
                      window.__f8FilterFetches.push({{url:u,http:response.status,status,count}});
                    }}
                    return response;
                  }}catch(error){{
                    window.__f8FilterFetches.push({{url:u,error:String(error)}});
                    throw error;
                  }}
                }};
                document.getElementById('searchButton')?.click();
                await new Promise(r=>setTimeout(r,80));
                const input=document.getElementById('searchInput');
                const select=document.getElementById('categoryFilter');
                if(input) input.value={json.dumps(search)};
                if(select) select.value='market';
                document.getElementById('applyFiltersButton')?.click();
                for(let i=0;i<100;i++){{
                  if(window.__f8FilterFetches.length) break;
                  await new Promise(r=>setTimeout(r,100));
                }}
                await new Promise(r=>setTimeout(r,600));
                return {{
                  discovery:window.__cryptoSignalStreamS12?.discoverySnapshot?.()||null,
                  fetches:window.__f8FilterFetches,
                  controls:{{
                    text:document.getElementById('searchInput')?.value||'',
                    category:document.getElementById('categoryFilter')?.value||'',
                  }},
                  domCount:document.querySelectorAll('.message').length,
                  domIds:[...document.querySelectorAll('.message')].map(n=>n.dataset.identity),
                  listDataset:document.getElementById('messageList')?.dataset||null,
                  connection:document.getElementById('connectionLabel')?.textContent||'',
                  emptyVisible:document.getElementById('emptyState')?.hidden===false,
                }};
              }})()"""
              result=session.command("Runtime.evaluate",{
                  "expression":setup,"awaitPromise":True,"returnByValue":True
              },timeout_seconds=30)
              value=result.get("result",{}).get("value")
              print("F8_UI_FILTER_DIAG="+json.dumps(value,sort_keys=True,ensure_ascii=False))
              print("REAL_CAPITAL=0")
          finally:
              if session is not None: session.close()
              if process.poll() is None:
                  os.killpg(process.pid,signal.SIGTERM)
                  try: process.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid,signal.SIGKILL)
          PY
