name: Install Crypto Local 30m Wake

on:
  push:
    branches: [main]
    paths:
      - "ops/continuity/recurring_wake.py"
      - "ops/continuity/recurring_wake_launchd.sh"
      - "ops/continuity/relay_submit.py"
      - "ops/continuity/launchd/com.cryptosignal.autowake30m.plist"
      - ".github/workflows/crypto-install-local-30m-wake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install local :00/:30 continuity timer
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          INSTALL="$HOME/Library/Application Support/CryptoSignal/continuity"
          AGENTS="$HOME/Library/LaunchAgents"
          LABEL="com.cryptosignal.autowake30m"
          PLIST="$AGENTS/$LABEL.plist"

          mkdir -p "$INSTALL" "$AGENTS" /Users/crypto-signal-agent/Crypto-Signal/runtime/continuity
          install -m 700 ops/continuity/recurring_wake.py "$INSTALL/recurring_wake.py"
          install -m 700 ops/continuity/relay_submit.py "$INSTALL/relay_submit.py"
          install -m 700 ops/continuity/recurring_wake_launchd.sh "$INSTALL/recurring_wake_launchd.sh"
          install -m 600 ops/continuity/launchd/com.cryptosignal.autowake30m.plist "$PLIST"

          /usr/bin/plutil -lint "$PLIST"
          launchctl bootout "gui/$(id -u)/$LABEL" 2>/dev/null || true
          launchctl bootstrap "gui/$(id -u)" "$PLIST"
          launchctl enable "gui/$(id -u)/$LABEL"

          echo "=== INSTALLED TIMER ==="
          launchctl print "gui/$(id -u)/$LABEL" | egrep 'state =|last exit code =|Minute|program =|arguments =|stdout path =|stderr path =' | head -80
          echo "LOCAL_30M_WAKE_INSTALL_PASS=YES"
