name: World-Class WC1 FRED Calendar Probe Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-command.yml"
      - "tests/test_wc1_fred_calendar_probe_workflow.py"
      - ".github/workflows/world-class-wc1-fred-calendar-probe-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc1-fred-calendar-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused FRED probe contract acceptance
        run: |
          python -m pytest -q tests/test_wc1_fred_calendar_probe_workflow.py tests/test_wc1_bls_source_probe_workflow.py tests/test_wc1_event_source_snapshot_workflow.py tests/test_wc1_event_source_state_workflow.py
          python -m ruff check tests/test_wc1_fred_calendar_probe_workflow.py
          echo "WC1_FRED_PROBE_READONLY_PASS=YES"
          echo "WC1_FRED_PROBE_RELEASE_SCOPED_PASS=YES"
          echo "WC1_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_FRED_PROBE_FULL_PASS=YES"
