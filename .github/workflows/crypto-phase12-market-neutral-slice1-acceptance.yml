name: Crypto Phase12 Market Neutral Slice1 Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-market-neutral-research-v1-slice1
    paths:
      - "research/alpha_factory/market_neutral_research.py"
      - "tests/test_alpha_factory_market_neutral_research.py"
      - "docs/MARKET_NEUTRAL_RESEARCH_SLICE1.md"
      - ".github/workflows/crypto-phase12-market-neutral-slice1-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: Phase12 focused acceptance
        run: |
          python -m pytest -q tests/test_alpha_factory_market_neutral_research.py tests/test_derivatives_context_engine.py tests/test_derivatives_dynamics_engine.py
          python -m ruff check research/alpha_factory/market_neutral_research.py tests/test_alpha_factory_market_neutral_research.py
          python -m mypy research/alpha_factory/market_neutral_research.py
          echo "PHASE12_MARKET_NEUTRAL_SLICE1_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests research ops/verify_stage10_integrated.py
          python -m mypy src research ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "PHASE12_MARKET_NEUTRAL_SLICE1_FULL_PASS=YES"
