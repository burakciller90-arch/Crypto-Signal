name: World-Class WC1 Provider Divergence Live Clock Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/provider_divergence.py"
      - "ops/run_provider_divergence.py"
      - "ops/run_live_evidence_clock.py"
      - "tests/test_provider_divergence_runtime.py"
      - "tests/test_live_evidence_provider_divergence.py"
      - ".github/workflows/world-class-wc1-provider-divergence-live-clock-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc1-provider-divergence-live-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC1 live-clock divergence acceptance
        run: |
          python -m pytest -q tests/test_provider_divergence.py tests/test_provider_divergence_runtime.py tests/test_live_evidence_provider_divergence.py tests/test_live_coverage.py
          python -m ruff check src/crypto_signal/data/provider_divergence.py ops/run_provider_divergence.py ops/run_live_evidence_clock.py tests/test_provider_divergence_runtime.py tests/test_live_evidence_provider_divergence.py
          python -m mypy src/crypto_signal/data/provider_divergence.py ops/run_provider_divergence.py ops/run_live_evidence_clock.py
          echo "WC1_PROVIDER_DIVERGENCE_LIVE_CLOCK_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_PROVIDER_DIVERGENCE_LIVE_CLOCK_FULL_PASS=YES"
          echo "WC1_CONSENSUS_NOT_INFERRED_PASS=YES"
          echo "WC1_REAL_CAPITAL_ZERO_PASS=YES"
