name: Crypto Stream Final F8 Existing Genuine Baseline UID504

on:
  push:
    branches:
      - 'accept/f8-existing-genuine-baseline'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f8-existing-genuine-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Verify exact F8 tooling lineage
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="a6eb98fe75d57b75e7ad3aefc763a6bde5cd0e44"
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          git diff --quiet "$EXPECTED_MAIN"...HEAD -- .             ':(exclude).github/workflows/crypto-stream-final-f8-existing-genuine-baseline-uid504.yml'
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PRODUCT="/Volumes/Crypto-504/Crypto-Signal/Product"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "F8_BASELINE_EXACT_MAIN_PASS=YES"

      - name: Inventory all genuine persisted production messages
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          OUT="$RUNNER_TEMP/stream-f8-existing-genuine"
          mkdir -p "$OUT"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/ops"

          "$PY" "$GITHUB_WORKSPACE/ops/audit_stream_f8_production_e2e.py"             --base-url http://127.0.0.1:48700             --output "$OUT/audit.json"             --stream-ledger "$DEV/runtime/stream/intelligence_stream.sqlite3"

          "$PY" - "$OUT/audit.json" "$OUT/browser-selection.env" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          audit = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("F8_BASELINE_STATUS=" + str(audit.get("status")))
          print("F8_BASELINE_OPEN=" + ",".join(audit.get("open_requirements", [])))
          selected = None
          for group in audit.get("groups", []):
              rep = group.get("representative")
              event_ms = rep.get("event_at_ms") if isinstance(rep, dict) else None
              identity = rep.get("narrative_identity") if isinstance(rep, dict) else None
              print(
                  "F8_BASELINE_GROUP="
                  + str(group.get("name"))
                  + ":"
                  + str(group.get("status"))
                  + ":event_ms="
                  + str(event_ms)
                  + ":id="
                  + str(identity)
              )
              if selected is None and group.get("status") == "ACCEPTED_CANDIDATE" and isinstance(rep, dict) and rep.get("search_text"):
                  selected = rep

          if selected is None:
              raise SystemExit("No genuine persisted production message available for browser baseline")

          values = {
              "F8_BROWSER_ID": selected["narrative_identity"],
              "F8_BROWSER_CATEGORY": selected["category"],
              "F8_BROWSER_SEARCH": selected["search_text"],
          }
          Path(sys.argv[2]).write_text(
              "".join(f"{k}={shlex.quote(str(v))}\n" for k, v in values.items()),
              encoding="utf-8",
          )
          PY
          cat "$OUT/browser-selection.env" >> "$GITHUB_ENV"
          echo "HISTORICAL_BACKFILL=NO"
          echo "SYNTHETIC_ACTIVITY=NO"
          echo "REAL_CAPITAL=0"

      - name: Probe genuine persisted message in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          OUT="$RUNNER_TEMP/stream-f8-existing-genuine"
          BROWSER=""
          for candidate in             "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"             "/Applications/Chromium.app/Contents/MacOS/Chromium"             "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"             "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary"; do
            if [ -x "$candidate" ]; then BROWSER="$candidate"; break; fi
          done
          test -n "$BROWSER"
          export PYTHONPATH="$GITHUB_WORKSPACE/ops:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" "$GITHUB_WORKSPACE/ops/probe_stream_f8_browser.py"             --browser "$BROWSER"             --base-url http://127.0.0.1:48700             --narrative-identity "$F8_BROWSER_ID"             --category "$F8_BROWSER_CATEGORY"             --search-text "$F8_BROWSER_SEARCH"             --output "$OUT/browser.json"             --screenshot "$OUT/browser.png"             --width 1440             --height 1000
          echo "F8_BASELINE_REAL_BROWSER_PASS=YES"

      - name: Verify non-mutation
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PRODUCT="/Volumes/Crypto-504/Crypto-Signal/Product"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "F8_BASELINE_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f8-existing-genuine-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-f8-existing-genuine
          if-no-files-found: warn
          retention-days: 14
