name: Crypto v1.1 Release Candidate Hosted Acceptance

on:
  push:
    branches:
      - v1.1-product-galactech-production-cutover-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-1-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Deterministic evidence and capital acceptance
        run: |
          python -m pytest -q             tests/test_immutable_forecast_stream.py             tests/test_decision_proof_live_feed.py             tests/test_outcome_evaluator.py             tests/test_dashboard_performance_projection.py             tests/test_galactech_archive.py             tests/test_epoch2_accounting.py             tests/test_epoch2_read_only_product.py             tests/test_transaction_tape.py             tests/test_transaction_tape_atomic.py             tests/test_alpha_factory_probability_calibration_gate.py
          echo "V1_1_DETERMINISTIC_EVIDENCE_CAPITAL_PASS=YES"
      - name: Market Tape and runtime-contract acceptance
        run: |
          python -m pytest -q             tests/test_market_tape_store.py             tests/test_market_tape_hotcold.py             tests/test_market_tape_collection.py             tests/test_market_tape_cold_archive.py             tests/test_liquidation_market_tape_persistence.py             tests/test_liquidation_cold_archive.py             tests/test_runtime_recovery.py             tests/test_stage10_runtime_verifier.py
          echo "V1_1_MARKET_TAPE_RUNTIME_CONTRACT_PASS=YES"
      - name: Frontend cutover and accessibility acceptance
        run: |
          python -m pytest -q             tests/test_galactech_production_cutover.py             tests/test_galactech_accessibility_performance.py             tests/test_galactech_learn_system.py             tests/test_galactech_performance.py             tests/test_galactech_archive.py             tests/test_galactech_markets.py             tests/test_galactech_capital_center.py             tests/test_galactech_command_evidence.py             tests/test_galactech_foundation.py
          node --check src/crypto_signal/product/galactech/app.js
          echo "V1_1_FRONTEND_ACCESSIBILITY_CUTOVER_PASS=YES"
      - name: Complete repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "V1_1_HOSTED_FULL_REGRESSION_PASS=YES"
          echo "V1_1_REAL_CAPITAL_ZERO_CONTRACT_PASS=YES"
