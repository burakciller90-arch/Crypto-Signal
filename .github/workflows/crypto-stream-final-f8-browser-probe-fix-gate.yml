name: Crypto Stream Final F8 Browser Probe Fix Gate

on:
  push:
    branches:
      - 'stream/final-f8-browser-probe-fix'

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Static probe gate
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/ops:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m py_compile ops/probe_stream_f8_browser.py
          "$PY" -m ruff check ops/probe_stream_f8_browser.py
          echo "F8_BROWSER_PROBE_STATIC_PASS=YES"

      - name: Real Chromium smoke on genuine market message
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          PY="$DEV/.venv/bin/python"
          OUT="$RUNNER_TEMP/f8-browser-probe-fix"
          mkdir -p "$OUT"
          BROWSER=""
          for candidate in             "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"             "/Applications/Chromium.app/Contents/MacOS/Chromium"             "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"             "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary"; do
            if [ -x "$candidate" ]; then BROWSER="$candidate"; break; fi
          done
          test -n "$BROWSER"
          export PYTHONPATH="$GITHUB_WORKSPACE/ops:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" "$GITHUB_WORKSPACE/ops/probe_stream_f8_browser.py"             --browser "$BROWSER"             --base-url http://127.0.0.1:48700             --narrative-identity 292fff32aef2df8a30eea66069f2a36c9c8ccfcd8042d1518f0b7e7526271d74             --category market             --search-text "SOLUSDT 4h: Market/Geometry için ilk forward state kaydedildi — watch:bullish:no_geometry. Yön: bullish."             --output "$OUT/browser.json"             --screenshot "$OUT/browser.png"             --width 1440             --height 1000
          echo "F8_BROWSER_PROBE_REAL_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Upload browser smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f8-browser-probe-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/f8-browser-probe-fix
          if-no-files-found: warn
          retention-days: 14
