name: Crypto R21 Canonical Paper Fund Hotfix Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-r21-canonical-paper-fund-v1-hotfix1
    paths:
      - "src/crypto_signal/paper/epoch2_accounting.py"
      - "tests/test_epoch2_accounting.py"
      - ".github/workflows/crypto-r21-canonical-paper-fund-hotfix-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: R21 hotfix focused acceptance
        run: |
          python -m pytest -q tests/test_epoch2_accounting.py tests/test_paper_epochs.py tests/test_immutable_ledger.py tests/test_paper_performance.py
          python -m ruff check src/crypto_signal/paper/epoch2_accounting.py tests/test_epoch2_accounting.py
          python -m mypy src/crypto_signal/paper/epoch2_accounting.py
          echo "R21_CANONICAL_PAPER_FUND_HOTFIX_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R21_CANONICAL_PAPER_FUND_HOTFIX_FULL_PASS=YES"
