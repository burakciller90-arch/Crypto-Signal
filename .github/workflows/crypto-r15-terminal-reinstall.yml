name: Crypto R15 Terminal Reinstall

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-terminal-reinstall.yml"

permissions:
  contents: read

jobs:
  reinstall:
    name: Reinstall R15 through local Terminal sudo
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local Terminal recovery
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER="/tmp/crypto-r15-terminal-installer.sh"
          LAUNCHER="/Users/burakciller/Desktop/Crypto-R15-Orphan-Recovery.command"
          PASS="/tmp/crypto-r15-terminal-reinstall.pass"
          FAIL="/tmp/crypto-r15-terminal-reinstall.fail"
          rm -f "$PASS" "$FAIL" "$INSTALLER" "$LAUNCHER"
          cp ops/install_ssd_hotplug_recovery.sh "$INSTALLER"
          chmod 755 "$INSTALLER"
          EXPECTED_SHA="$(shasum -a 256 "$INSTALLER" | awk '{print $1}')"
          cat >"$LAUNCHER" <<SH
          #!/bin/bash
          set -euo pipefail
          INSTALLER="$INSTALLER"
          PASS="$PASS"
          FAIL="$FAIL"
          EXPECTED_SHA="$EXPECTED_SHA"
          rm -f "\$PASS" "\$FAIL"

          fail() {
            rc=\$?
            printf 'rc=%s\\n' "\$rc" >"\$FAIL"
            echo
            echo "R15 recovery durdu. Bu pencereyi acik birakabilirsin."
            exit "\$rc"
          }
          trap fail ERR

          echo "Crypto Signal R15 orphan-parent recovery"
          echo "Yalnizca testten gecmis R15 installer UID504 adina kurulacak."
          echo
          actual="\$(shasum -a 256 "\$INSTALLER" | awk '{print \$1}')"
          test "\$actual" = "\$EXPECTED_SHA"

          sudo -v
          sudo -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash "\$INSTALLER"

          date >"\$PASS"
          echo
          echo "R15 installer tamamlandi. ChatGPT dogrulamayi otomatik yapacak."
          echo "Bu pencereyi acik birakabilirsin."
          SH
          chmod 700 "$LAUNCHER"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          /usr/bin/open -a Terminal "$LAUNCHER"
          echo "R15_TERMINAL_LAUNCHED=YES"
      - name: Wait for local authorization
        shell: bash
        run: |
          set -euo pipefail
          PASS="/tmp/crypto-r15-terminal-reinstall.pass"
          FAIL="/tmp/crypto-r15-terminal-reinstall.fail"
          outcome=""
          for _ in {1..300}; do
            if [ -f "$PASS" ]; then outcome="PASS"; break; fi
            if [ -f "$FAIL" ]; then outcome="FAIL"; break; fi
            sleep 1
          done
          echo "R15_TERMINAL_REINSTALL_OUTCOME=${outcome:-TIMEOUT}"
          if [ "$outcome" = "FAIL" ]; then cat "$FAIL"; exit 1; fi
          test "$outcome" = "PASS"
      - name: Verify recovered UID504 runner and health
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          ok=0
          for _ in {1..90}; do
            count="$(ps -axo command= | awk -v expected="$EXPECTED" '$0 == expected {n++} END{print n+0}')"
            if [ "$count" = "1" ] && curl -fsS --max-time 3 http://127.0.0.1:48700/api/health >/tmp/r15-terminal-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "=== UID504 RUNNER-LIKE PROCESSES ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= \
            | awk '$3=="crypto-signal-agent" && ($0 ~ /RunnerService\\.js/ || $0 ~ /Runner\\.Listener/ || $0 ~ /Runner\\.Worker/ || $0 ~ /\\.\\/runsvc\\.sh/ || $0 ~ /Crypto-504\\/Crypto-Signal\\/Runner/) {print}'
          echo "=== HEALTH ==="
          cat /tmp/r15-terminal-health.json 2>/dev/null || true
          test "$ok" = "1"
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-terminal-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY
          echo "R15_TERMINAL_REINSTALL_RECOVERY_PASS=YES"
          echo "REAL_CAPITAL=0"
      - name: Cleanup local helper
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/crypto-r15-terminal-installer.sh \
            /tmp/crypto-r15-terminal-reinstall.pass \
            /tmp/crypto-r15-terminal-reinstall.fail \
            /Users/burakciller/Desktop/Crypto-R15-Orphan-Recovery.command
