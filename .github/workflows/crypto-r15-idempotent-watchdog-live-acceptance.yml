name: Crypto R15 Idempotent Watchdog Live Acceptance

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-idempotent-watchdog-live-acceptance.yml"

permissions:
  contents: read

jobs:
  accept:
    name: Accept idempotent watchdog reload without runner restart
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15-ssd-hotplug-recovery-v1
          fetch-depth: 1

      - name: Capture healthy listener
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          listener="$(ps -axo pid=,command= | awk -v expected="$EXPECTED" '{pid=$1; sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0); if ($0 == expected) print pid}')"
          count="$(printf '%s\n' "$listener" | awk 'NF{n++} END{print n+0}')"
          echo "BEFORE_LISTENER_COUNT=$count"
          echo "BEFORE_LISTENER_PID=$listener"
          test "$count" = "1"
          echo "$listener" > /tmp/r15-before-listener.pid

      - name: Install current R15 twice through UID504 bridge
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          bash -n ops/install_ssd_hotplug_recovery.sh
          test "$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"

          for pass in 1 2; do
            echo "=== INSTALL PASS $pass ==="
            /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash ops/install_ssd_hotplug_recovery.sh
            /usr/bin/sudo -n -H -u crypto-signal-agent /bin/launchctl print "gui/504/com.cryptosignal.ssd-hotplug-recovery" >/dev/null
            echo "INSTALL_PASS_$pass=YES"
          done

      - name: Accept loaded watchdog and unchanged runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          before="$(cat /tmp/r15-before-listener.pid)"

          ok=0
          for _ in {1..80}; do
            current="$(ps -axo pid=,command= | awk -v expected="$EXPECTED" '{pid=$1; sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0); if ($0 == expected) print pid}')"
            state="$(/usr/bin/sudo -n -H -u crypto-signal-agent /bin/cat "/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery/ssd-state" 2>/dev/null || true)"
            if [ "$current" = "$before" ] \
              && [ "$state" = "ready" ] \
              && /usr/bin/sudo -n -H -u crypto-signal-agent /bin/launchctl print "gui/504/com.cryptosignal.ssd-hotplug-recovery" >/dev/null 2>&1 \
              && curl -fsS --max-time 3 http://127.0.0.1:48700/api/health >/tmp/r15-idempotent-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "ACCEPT_READY=$ok"
          test "$ok" = "1"

          current="$(ps -axo pid=,command= | awk -v expected="$EXPECTED" '{pid=$1; sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0); if ($0 == expected) print pid}')"
          echo "BEFORE_LISTENER_PID=$before"
          echo "AFTER_LISTENER_PID=$current"
          test "$current" = "$before"

          echo "=== WATCHDOG ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/launchctl print "gui/504/com.cryptosignal.ssd-hotplug-recovery" | /usr/bin/head -120

          echo "=== STATE ==="
          state="$(/usr/bin/sudo -n -H -u crypto-signal-agent /bin/cat "/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery/ssd-state")"
          echo "SSD_STATE=$state"
          test "$state" = "ready"

          echo "=== HEALTH ==="
          cat /tmp/r15-idempotent-health.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-idempotent-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY

          echo "=== SQLITE ==="
          for db in \
            "$ROOT/Development/runtime/ledger/live_signal_ledger.sqlite3" \
            "$ROOT/Development/runtime/data/live_base_15m_cache.sqlite3" \
            "$ROOT/Development/runtime/paper/paper_fund.sqlite3" \
            "$ROOT/Development/runtime/alerts/alert_outbox.sqlite3"
          do
            result="$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/sqlite3 "$db" 'PRAGMA quick_check;')"
            echo "$db $result"
            test "$result" = "ok"
          done

          echo "=== INSTALL LAUNCHCTL ERR TAIL ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -80 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/install-launchctl.err.log" || true

          echo "R15_IDEMPOTENT_WATCHDOG_LIVE_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
