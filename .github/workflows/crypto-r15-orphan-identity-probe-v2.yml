name: Crypto R15 Orphan Identity Probe V2

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-orphan-identity-probe-v2.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Probe orphan identity V2
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Probe exact orphan processes
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID504 BRIDGE ==="
          sudo -n -H -u crypto-signal-agent /usr/bin/id
          echo "=== PID 65421 ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -p 65421 -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command= || true
          sudo -n -H -u crypto-signal-agent /usr/sbin/lsof -nP -p 65421 2>&1 | head -160 || true
          echo "=== PID 65425 ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -p 65425 -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command= || true
          sudo -n -H -u crypto-signal-agent /usr/sbin/lsof -nP -p 65425 2>&1 | head -200 || true
          echo "=== PID 65405 ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -p 65405 -o pid=,ppid=,pgid=,sess=,user=,%cpu=,%mem=,etime=,state=,command= || true
          sudo -n -H -u crypto-signal-agent /usr/sbin/lsof -nP -p 65405 2>&1 | head -120 || true
          echo "=== ENV 65421 ==="
          sudo -n -H -u crypto-signal-agent /bin/ps eww -p 65421 -o command= 2>&1 | head -60 || true
          echo "=== ENV 65425 ==="
          sudo -n -H -u crypto-signal-agent /bin/ps eww -p 65425 -o command= 2>&1 | head -60 || true
          echo "R15_ORPHAN_IDENTITY_PROBE_V2_DONE=YES"
