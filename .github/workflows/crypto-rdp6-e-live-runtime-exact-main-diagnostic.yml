name: RDP6-E Exact Main Live Runtime Diagnostic UID504

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-rdp6-e-live-runtime-exact-main-diagnostic.yml"

permissions:
  contents: read

jobs:
  live-diagnostic:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact canonical deployment
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git -C "$DEV" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          echo "RDP6_E_LIVE_WORKBENCH_EXACT_MAIN_PASS=YES"
          echo "RDP6_E_LIVE_DEVELOPMENT_EXACT_MAIN_PASS=YES"

      - name: Read-only live options and Stream proof
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          OPTIONS="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/market_tape/options_surface.sqlite3"
          SOURCE="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/market_tape/source_contract.sqlite3"
          STREAM="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/stream/intelligence_stream.sqlite3"
          test -x "$PY"
          export RDP6_OPTIONS="$OPTIONS"
          export RDP6_SOURCE="$SOURCE"
          export RDP6_STREAM="$STREAM"

          "$PY" - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sqlite3
          import time
          from pathlib import Path

          options_path = Path(os.environ['RDP6_OPTIONS'])
          source_path = Path(os.environ['RDP6_SOURCE'])
          stream_path = Path(os.environ['RDP6_STREAM'])

          def ro(path: Path) -> sqlite3.Connection:
              if not path.is_file():
                  raise AssertionError(f'missing live database: {path}')
              uri = f'{path.resolve().as_uri()}?mode=ro'
              db = sqlite3.connect(uri, uri=True, timeout=5.0)
              db.row_factory = sqlite3.Row
              db.execute('PRAGMA query_only=ON')
              return db

          deadline = time.monotonic() + 150
          last_error: Exception | None = None
          while time.monotonic() < deadline:
              try:
                  now_ms = time.time_ns() // 1_000_000
                  with ro(options_path) as db:
                      option_rows = {}
                      for base_coin in ('BTC', 'ETH'):
                          row = db.execute(
                              '''
                              SELECT payload_json
                              FROM option_surface_snapshots
                              WHERE exchange='bybit' AND base_coin=?
                              ORDER BY source_timestamp_ms DESC,
                                       surface_identity DESC
                              LIMIT 1
                              ''',
                              (base_coin,),
                          ).fetchone()
                          assert row is not None, f'no option surface for {base_coin}'
                          payload = json.loads(str(row['payload_json']))
                          age_ms = now_ms - int(payload['source_timestamp_ms'])
                          assert 0 <= age_ms <= 120_000, (base_coin, age_ms)
                          contracts = payload['contracts']
                          assert isinstance(contracts, list) and contracts
                          mark_iv_n = sum(item.get('mark_iv') is not None for item in contracts)
                          oi_n = sum(item.get('open_interest') is not None for item in contracts)
                          assert mark_iv_n > 0
                          assert oi_n > 0
                          option_rows[base_coin] = (payload, age_ms, mark_iv_n, oi_n)

                  with ro(source_path) as db:
                      coverage_rows = {}
                      for base_coin in ('BTC', 'ETH'):
                          row = db.execute(
                              '''
                              SELECT payload_json
                              FROM source_coverage_events
                              WHERE provider='bybit'
                                AND source='bybit_v5_public_rest'
                                AND channel='option_surface_snapshot'
                                AND symbol=?
                              ORDER BY observed_at_ms DESC,
                                       coverage_event_identity DESC
                              LIMIT 1
                              ''',
                              (base_coin,),
                          ).fetchone()
                          assert row is not None, f'no options coverage for {base_coin}'
                          payload = json.loads(str(row['payload_json']))
                          assert payload['state'] == 'observed'
                          assert payload['source_envelope_identity']
                          age_ms = now_ms - int(payload['observed_at_ms'])
                          assert 0 <= age_ms <= 120_000, (base_coin, age_ms)
                          coverage_rows[base_coin] = (payload, age_ms)

                  with ro(stream_path) as db:
                      facts = {}
                      rows = db.execute(
                          '''
                          SELECT payload_json
                          FROM stream_fact_bundles
                          ORDER BY event_at_ms DESC, fact_bundle_identity DESC
                          LIMIT 500
                          '''
                      ).fetchall()
                      for row in rows:
                          payload = json.loads(str(row['payload_json']))
                          if payload.get('projector_id') != 'derivatives_change':
                              continue
                          symbol = payload.get('symbol')
                          if symbol not in {'BTCUSDT', 'ETHUSDT'} or symbol in facts:
                              continue
                          facts[str(symbol)] = payload
                      assert set(facts) == {'BTCUSDT', 'ETHUSDT'}, facts.keys()
                      for symbol, payload in facts.items():
                          domains = set(payload['available_evidence_domains'])
                          assert {'options_surface', 'options_volatility'} <= domains
                          components = {
                              str(item['name']): str(item['value'])
                              for item in payload['state_components']
                          }
                          assert components['options_status'] in {'measured', 'partial'}
                          assert int(components['options_contract_count']) > 0
                          assert payload['direction'] is None
                          assert payload['production_authority'] is False
                          assert int(payload['real_capital']) == 0
                          assert payload['source_scope'] == (
                              'bybit:linear_perpetual_plus_options:derivatives'
                          )

                  for base_coin, (payload, age_ms, mark_iv_n, oi_n) in option_rows.items():
                      print(
                          'RDP6_E_LIVE_OPTIONS_SURFACE_PASS '
                          f'base_coin={base_coin} '
                          f'contracts={len(payload["contracts"])} '
                          f'mark_iv={mark_iv_n} open_interest={oi_n} '
                          f'age_ms={age_ms}',
                          flush=True,
                      )
                  for base_coin, (_, age_ms) in coverage_rows.items():
                      print(
                          'RDP6_E_LIVE_SOURCE_COVERAGE_PASS '
                          f'base_coin={base_coin} age_ms={age_ms}',
                          flush=True,
                      )
                  for symbol, payload in facts.items():
                      components = {
                          str(item['name']): str(item['value'])
                          for item in payload['state_components']
                      }
                      print(
                          'RDP6_E_LIVE_DERIVATIVES_STREAM_PASS '
                          f'symbol={symbol} '
                          f'options_status={components["options_status"]} '
                          f'contracts={components["options_contract_count"]}',
                          flush=True,
                      )
                  print('RDP6_E_EXACT_MAIN_LIVE_RUNTIME_PASS=YES', flush=True)
                  print('NO_NEW_FAMILY_OR_DIRECTION=YES', flush=True)
                  print('REAL_CAPITAL=0', flush=True)
                  break
              except (AssertionError, KeyError, sqlite3.Error, TypeError, ValueError) as exc:
                  last_error = exc
                  time.sleep(10)
          else:
              raise AssertionError(f'live RDP6-E proof not ready: {last_error}')
          PY
