name: Crypto M4 Derivatives Dynamics Slice1 TEMP

on:
  push:
    branches: [v1.1-m4-derivatives-dynamics-v1-slice1]
    paths:
      - ".github/workflows/crypto-m4-derivatives-dynamics-slice1-temp.yml"
      - "src/crypto_signal/intelligence/derivatives_dynamics.py"
      - "tests/test_derivatives_dynamics_engine.py"
      - "docs/M4_DERIVATIVES_DYNAMICS_SLICE1.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: M4 Slice1 focused
        run: |
          python -m pytest -q tests/test_derivatives_context_engine.py tests/test_derivatives_dynamics_engine.py tests/test_derivatives_observation.py tests/test_bybit_derivatives_adapter.py
          python -m ruff check src/crypto_signal/data/derivatives.py src/crypto_signal/data/adapters/bybit_derivatives.py src/crypto_signal/intelligence/derivatives_context.py src/crypto_signal/intelligence/derivatives_dynamics.py tests/test_derivatives_dynamics_engine.py
          python -m mypy src/crypto_signal/data/derivatives.py src/crypto_signal/data/adapters/bybit_derivatives.py src/crypto_signal/intelligence/derivatives_context.py src/crypto_signal/intelligence/derivatives_dynamics.py
          echo "M4_DERIVATIVES_DYNAMICS_SLICE1_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M4_DERIVATIVES_DYNAMICS_SLICE1_FULL_PASS=YES"
