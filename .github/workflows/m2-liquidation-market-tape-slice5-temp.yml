name: M2 Liquidation Market Tape Slice5 TEMP

on:
  push:
    branches: [v1.1-liquidation-market-tape-v2-slice5]
    paths:
      - ".github/workflows/m2-liquidation-market-tape-slice5-temp.yml"
      - "src/crypto_signal/data/market_tape.py"
      - "src/crypto_signal/data/market_tape_collection.py"
      - "src/crypto_signal/data/liquidations.py"
      - "tests/test_liquidation_market_tape_persistence.py"
      - "tests/test_liquidation_heatmap_engine.py"
      - "tests/test_market_tape_store.py"
      - "tests/test_market_tape_collection.py"
      - "docs/M2_LIQUIDATION_MARKET_TAPE_SLICE5.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused M2 Slice 5 gate
        run: |
          python -m pytest -q             tests/test_liquidation_market_tape_persistence.py             tests/test_liquidation_heatmap_engine.py             tests/test_market_tape_store.py             tests/test_market_tape_collection.py
          python -m ruff check             src/crypto_signal/data/market_tape.py             src/crypto_signal/data/market_tape_collection.py             tests/test_liquidation_market_tape_persistence.py
          python -m mypy             src/crypto_signal/data/market_tape.py             src/crypto_signal/data/market_tape_collection.py
          echo "M2_LIQUIDATION_MARKET_TAPE_SLICE5_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_LIQUIDATION_MARKET_TAPE_SLICE5_FULL_PASS=YES"
