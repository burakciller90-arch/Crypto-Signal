name: Crypto M2 Integrated Main TEMP

on:
  push:
    branches: [v1.1-m2-integrated-main-v1]
    paths:
      - ".github/workflows/crypto-m2-integrated-main-temp.yml"
      - "docs/M2_*.md"
      - "ops/run_market_tape_snapshot.py"
      - "ops/run_market_tape_stream.py"
      - "ops/run_liquidation_market_tape_stream.py"
      - "src/crypto_signal/data/**"
      - "src/crypto_signal/intelligence/**"
      - "tests/test_market_tape*.py"
      - "tests/test_raw_market_tape.py"
      - "tests/test_bybit_microstructure_ws.py"
      - "tests/test_liquidity*.py"
      - "tests/test_liquidation*.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: M2 integrated focused gate
        run: |
          python -m pytest -q             tests/test_bybit_microstructure_ws.py             tests/test_raw_market_tape.py             tests/test_market_tape_wire_collection.py             tests/test_market_tape_collection.py             tests/test_market_tape_store.py             tests/test_market_tape_cold_archive.py             tests/test_market_tape_hotcold.py             tests/test_liquidity_dynamics_engine.py             tests/test_liquidity_structure_engine.py             tests/test_liquidity_sweep_engine.py             tests/test_liquidation_heatmap_engine.py             tests/test_liquidation_market_tape_persistence.py             tests/test_liquidation_wire_collection.py             tests/test_liquidation_cold_archive.py
          python -m ruff check             ops/run_market_tape_snapshot.py             ops/run_market_tape_stream.py             ops/run_liquidation_market_tape_stream.py             src/crypto_signal/data             src/crypto_signal/intelligence             tests/test_bybit_microstructure_ws.py             tests/test_raw_market_tape.py             tests/test_market_tape_wire_collection.py             tests/test_market_tape_collection.py             tests/test_market_tape_store.py             tests/test_market_tape_cold_archive.py             tests/test_market_tape_hotcold.py             tests/test_liquidity_dynamics_engine.py             tests/test_liquidity_structure_engine.py             tests/test_liquidity_sweep_engine.py             tests/test_liquidation_heatmap_engine.py             tests/test_liquidation_market_tape_persistence.py             tests/test_liquidation_wire_collection.py             tests/test_liquidation_cold_archive.py
          python -m mypy             ops/run_market_tape_snapshot.py             ops/run_market_tape_stream.py             ops/run_liquidation_market_tape_stream.py             src/crypto_signal/data             src/crypto_signal/intelligence
          echo "M2_INTEGRATED_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_INTEGRATED_FULL_PASS=YES"
