name: Crypto Stream S6 Live SSE UID504

on:
  push:
    branches:
      - 'stream/s6-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-s6-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-s6-live:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-s6-live-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-s6-live-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "STREAM_S6_LIVE_EXACT_SOURCE_PASS=YES"

      - name: Focused Stream S6 live acceptance
        run: |
          "$TEST_PY" -m pytest -q             tests/test_intelligence_stream_read_model.py             tests/test_intelligence_stream_ledger.py             tests/test_dashboard_web.py
          "$TEST_PY" -m ruff check             src/crypto_signal/product/intelligence_stream_transport.py             src/crypto_signal/product/intelligence_stream_read_model.py             src/crypto_signal/product/web.py             tests/test_intelligence_stream_read_model.py
          "$TEST_PY" -m mypy             src/crypto_signal/product/intelligence_stream_transport.py             src/crypto_signal/product/intelligence_stream_read_model.py             src/crypto_signal/product/web.py
          echo "STREAM_S6_LIVE_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        run: |
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "STREAM_S6_LIVE_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-s6-live-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_S6_LIVE_UID504_NON_MUTATING_PASS=YES"
