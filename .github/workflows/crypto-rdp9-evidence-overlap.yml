name: RDP9 Evidence Overlap UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/intelligence/evidence_overlap.py"
      - "src/crypto_signal/intelligence/confluence_matrix_v2.py"
      - "src/crypto_signal/intelligence/family_proof_adapters.py"
      - "src/crypto_signal/unified_decision_runtime.py"
      - "tests/test_rdp9_evidence_overlap.py"
      - "tests/test_confluence_matrix_v2.py"
      - "tests/test_family_proof_adapters.py"
      - "tests/test_unified_decision_runtime.py"
      - ".github/workflows/crypto-rdp9-evidence-overlap.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP9_A_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP9_A_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused overlap and decision-lineage acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp9_evidence_overlap.py \
            tests/test_confluence_matrix_v2.py \
            tests/test_family_proof_adapters.py \
            tests/test_unified_decision_runtime.py
          "$PY" -m ruff check \
            src/crypto_signal/intelligence/evidence_overlap.py \
            src/crypto_signal/intelligence/confluence_matrix_v2.py \
            src/crypto_signal/intelligence/family_proof_adapters.py \
            src/crypto_signal/unified_decision_runtime.py \
            tests/test_rdp9_evidence_overlap.py \
            tests/test_family_proof_adapters.py \
            tests/test_unified_decision_runtime.py
          "$PY" -m mypy \
            src/crypto_signal/intelligence/evidence_overlap.py \
            src/crypto_signal/intelligence/confluence_matrix_v2.py \
            src/crypto_signal/intelligence/family_proof_adapters.py \
            src/crypto_signal/unified_decision_runtime.py
          "$PY" -m py_compile \
            src/crypto_signal/intelligence/evidence_overlap.py \
            src/crypto_signal/intelligence/confluence_matrix_v2.py \
            src/crypto_signal/intelligence/family_proof_adapters.py \
            src/crypto_signal/unified_decision_runtime.py
          echo "RDP9_A_EXACT_OVERLAP_PASS=YES"
          echo "DUPLICATE_EVIDENCE_WEIGHT_INFLATION=BLOCKED"
          echo "UNIQUE_EVIDENCE_SCORE_REGRESSION=NONE"
          echo "OVERLAP_LINEAGE_IN_DECISION_PROOF=YES"
          echo "REAL_CAPITAL=0"
