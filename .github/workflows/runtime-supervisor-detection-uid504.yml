name: Runtime Supervisor Detection UID504

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-command.yml"
      - "ops/r11/start_ssd_runtime.command"
      - "tests/test_wc1_event_source_state_workflow.py"
      - "tests/test_r11_runtime_supervisor_detection.py"
      - ".github/workflows/runtime-supervisor-detection-uid504.yml"

permissions:
  contents: read

jobs:
  supervisor-detection:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "RUNTIME_SUPERVISOR_DETECTION_EXACT_SOURCE_PASS=YES"
      - name: Focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_wc1_event_source_state_workflow.py \
            tests/test_r11_runtime_supervisor_detection.py
          "$PY" -m ruff check \
            tests/test_wc1_event_source_state_workflow.py \
            tests/test_r11_runtime_supervisor_detection.py
          bash -n ops/r11/start_ssd_runtime.command
          echo "RUNTIME_SUPERVISOR_DETECTION_FOCUSED_PASS=YES"
