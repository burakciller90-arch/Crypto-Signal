name: Continuity Target Open Validation

on:
  push:
    branches:
      - feature/continuity-open-target-stop-send
    paths:
      - "ops/continuity/relay_daemon.py"
      - ".github/workflows/continuity-target-open-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile ops/continuity/relay_daemon.py
          grep -q 'TARGET_OPEN_REQUESTED' ops/continuity/relay_daemon.py
          grep -q 'STOP_CLICKED' ops/continuity/relay_daemon.py
          echo "CONTINUITY_TARGET_OPEN_STOP_SEND_VALIDATION_PASS=YES"
