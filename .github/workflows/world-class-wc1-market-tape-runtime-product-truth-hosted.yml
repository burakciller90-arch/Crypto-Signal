name: World-Class WC1 Market Tape Runtime Product Truth Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/market_tape_collector_runtime.py"
      - "src/crypto_signal/product/market_tape_runtime.py"
      - "src/crypto_signal/product/web.py"
      - "src/crypto_signal/product/galactech/app.js"
      - "ops/run_dashboard.py"
      - "tests/test_market_data_runtime_product.py"
      - "tests/test_galactech_learn_system.py"
      - "tests/test_wc0_runtime_wiring.py"
      - "tests/test_wc0_production_import_isolation.py"
      - ".github/workflows/world-class-wc1-market-tape-runtime-product-truth-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc1-market-tape-runtime-product-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC1 runtime Product Truth acceptance
        run: |
          python -m pytest -q             tests/test_market_data_runtime_product.py             tests/test_galactech_learn_system.py             tests/test_wc0_runtime_wiring.py             tests/test_wc0_production_import_isolation.py
          python -m ruff check             src/crypto_signal/product/market_tape_runtime.py             src/crypto_signal/product/web.py             ops/run_dashboard.py             tests/test_market_data_runtime_product.py             tests/test_galactech_learn_system.py             tests/test_wc0_runtime_wiring.py             tests/test_wc0_production_import_isolation.py
          python -m mypy             src/crypto_signal/product/market_tape_runtime.py             src/crypto_signal/product/web.py             ops/run_dashboard.py
          node --check src/crypto_signal/product/galactech/app.js
          echo "WC1_MARKET_TAPE_RUNTIME_PRODUCT_TRUTH_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_MARKET_TAPE_RUNTIME_PRODUCT_TRUTH_FULL_PASS=YES"
          echo "WC1_REAL_CAPITAL_ZERO_PASS=YES"
