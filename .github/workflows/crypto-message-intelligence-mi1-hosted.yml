name: Crypto Message Intelligence MI1 UID504

on:
  push:
    branches:
      - 'feat/message-intelligence-mi1'
      - 'feat/message-intelligence-mi1-primary-surface'
      - 'fp1d/portfolio-capital-movements'
  pull_request:
    branches:
      - main
    paths:
      - 'src/crypto_signal/product/intelligence_stream_family.py'
      - 'src/crypto_signal/product/intelligence_stream_read_model.py'
      - 'src/crypto_signal/product/intelligence_stream_narrative.py'
      - 'src/crypto_signal/product/web.py'
      - 'src/crypto_signal/product/stream/app.js'
      - 'tests/test_intelligence_stream_family.py'
      - 'tests/test_intelligence_stream_read_model.py'
      - 'tests/test_intelligence_stream_ledger.py'
      - 'tests/test_intelligence_stream_local_rewriter.py'
      - 'tests/test_intelligence_stream_production_projector.py'
      - 'tests/test_intelligence_stream_ui.py'
      - '.github/workflows/crypto-message-intelligence-mi1-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-message-intelligence-mi1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mi1-customer-narrative:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact source and create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/message-intelligence-mi1-venv"

          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"

          {
            echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)"
            echo "PRODUCT_HEAD_BEFORE=$(git -C "$PRODUCT" rev-parse HEAD)"
          } > "$RUNNER_TEMP/mi1-checkout-state"

          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "MESSAGE_INTELLIGENCE_MI1_EXACT_SOURCE_PASS=YES"

      - name: MI1 focused customer-language acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q \
            tests/test_intelligence_stream_family.py \
            tests/test_intelligence_stream_read_model.py \
            tests/test_intelligence_stream_ledger.py \
            tests/test_intelligence_stream_local_rewriter.py \
            tests/test_intelligence_stream_production_projector.py \
            tests/test_intelligence_stream_ui.py \
            tests/test_final_product_read_model.py \
            tests/test_epoch2_accounting.py \
            tests/test_epoch2_read_only_product.py \
            2>&1 | tee "$RUNNER_TEMP/mi1-pytest.log"
          "$TEST_PY" -m ruff check \
            src/crypto_signal/product/intelligence_stream_family.py \
            src/crypto_signal/product/intelligence_stream_read_model.py \
            src/crypto_signal/product/intelligence_stream_narrative.py \
            src/crypto_signal/product/web.py \
            tests/test_intelligence_stream_family.py \
            tests/test_intelligence_stream_read_model.py \
            tests/test_intelligence_stream_ledger.py \
            tests/test_intelligence_stream_ui.py \
            src/crypto_signal/product/final_product_read_model.py \
            tests/test_final_product_read_model.py \
            2>&1 | tee "$RUNNER_TEMP/mi1-ruff.log"
          "$TEST_PY" -m mypy \
            src/crypto_signal/product/intelligence_stream_family.py \
            src/crypto_signal/product/intelligence_stream_read_model.py \
            src/crypto_signal/product/intelligence_stream_narrative.py \
            src/crypto_signal/product/web.py \
            src/crypto_signal/product/final_product_read_model.py \
            2>&1 | tee "$RUNNER_TEMP/mi1-mypy.log"
          node --check src/crypto_signal/product/stream/app.js \
            2>&1 | tee "$RUNNER_TEMP/mi1-node.log"
          echo "MESSAGE_INTELLIGENCE_MI1_PRIMARY_SURFACE_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Upload MI1 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-intelligence-mi1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mi1-pytest.log
            ${{ runner.temp }}/mi1-ruff.log
            ${{ runner.temp }}/mi1-mypy.log
            ${{ runner.temp }}/mi1-node.log
            ${{ runner.temp }}/mi1-changed-files.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prove canonical checkouts remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          STATE="$RUNNER_TEMP/mi1-checkout-state"

          DEV_BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$STATE")"
          PRODUCT_BEFORE="$(sed -n 's/^PRODUCT_HEAD_BEFORE=//p' "$STATE")"

          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$DEV_BEFORE"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_BEFORE"
          echo "MESSAGE_INTELLIGENCE_MI1_NON_MUTATING_PASS=YES"

      - name: Guard project and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "$ZERO_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          else
            CHANGED_FILES="$(git show --format= --name-only "$GITHUB_SHA")"
          fi

          printf '%s\n' "$CHANGED_FILES" | tee "$RUNNER_TEMP/mi1-changed-files.log"
          if printf '%s\n' "$CHANGED_FILES" | grep -Eiq 'durdurulmaz|quantum-capital'; then
            echo "PROJECT_ISOLATION_PASS=NO"
            exit 1
          fi
          echo "PROJECT_ISOLATION_PASS=YES"
          echo "REAL_CAPITAL=0"
