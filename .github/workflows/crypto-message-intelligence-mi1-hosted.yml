name: Crypto Message Intelligence MI1 Hosted

on:
  push:
    branches:
      - 'feat/message-intelligence-mi1'
  pull_request:
    branches:
      - main
    paths:
      - 'src/crypto_signal/product/intelligence_stream_family.py'
      - 'tests/test_intelligence_stream_family.py'
      - '.github/workflows/crypto-message-intelligence-mi1-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-message-intelligence-mi1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mi1-customer-narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"

      - name: MI1 focused customer-language acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_intelligence_stream_family.py \
            tests/test_intelligence_stream_production_projector.py \
            tests/test_intelligence_stream_ui.py \
            2>&1 | tee "$RUNNER_TEMP/mi1-pytest.log"
          python -m ruff check \
            src/crypto_signal/product/intelligence_stream_family.py \
            tests/test_intelligence_stream_family.py \
            2>&1 | tee "$RUNNER_TEMP/mi1-ruff.log"
          python -m mypy \
            src/crypto_signal/product/intelligence_stream_family.py \
            2>&1 | tee "$RUNNER_TEMP/mi1-mypy.log"
          echo "MESSAGE_INTELLIGENCE_MI1_HOSTED_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Upload MI1 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-intelligence-mi1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mi1-pytest.log
            ${{ runner.temp }}/mi1-ruff.log
            ${{ runner.temp }}/mi1-mypy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Guard project and authority boundary
        run: |
          test "$(git status --porcelain)" = ""
          ! git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD^' }}...HEAD | grep -Ei 'durdurulmaz|quantum-capital'
          echo "PROJECT_ISOLATION_PASS=YES"
          echo "REAL_CAPITAL=0"
