name: World-Class WC1 Restart Continuity UID504

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/world-class-wc1-restart-continuity-uid504.yml"

permissions:
  contents: read

concurrency:
  group: wc1-restart-continuity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and clean Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC1_RESTART_CONTINUITY_EXACT_SOURCE_PASS=YES"

      - name: Prove live collector restart and gap continuity read-only
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" - "$RUNNER_TEMP" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import sqlite3
          import sys
          import tempfile
          from pathlib import Path

          temp_parent = Path(sys.argv[1])
          runtime = Path("/Volumes/Crypto-504/Crypto-Signal/Development/runtime/market_tape")
          sources = {
              "collector": runtime / "collector_runtime.sqlite3",
              "gaps": runtime / "market_data_gaps.sqlite3",
          }

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def source_state(path: Path) -> dict[str, str | None]:
              return {
                  "main": digest(path),
                  "wal": digest(Path(str(path) + "-wal")),
                  "shm": digest(Path(str(path) + "-shm")),
              }

          def backup_read_only(source: Path, target: Path) -> None:
              uri = f"{source.resolve().as_uri()}?mode=ro"
              with sqlite3.connect(uri, uri=True) as src, sqlite3.connect(target) as dst:
                  src.execute("PRAGMA query_only=ON")
                  src.backup(dst)

          before = {}
          work = Path(tempfile.mkdtemp(prefix="wc1-restart-", dir=temp_parent))
          try:
              copies = {}
              for name, source in sources.items():
                  if not source.is_file():
                      raise SystemExit(f"WC1_{name.upper()}_DB_MISSING")
                  before[name] = source_state(source)
                  target = work / f"{name}.sqlite3"
                  backup_read_only(source, target)
                  copies[name] = target

              with sqlite3.connect(copies["collector"]) as db:
                  quick = db.execute("PRAGMA quick_check").fetchone()
                  if quick is None or str(quick[0]).lower() != "ok":
                      raise SystemExit("WC1_COLLECTOR_QUICK_CHECK_FAILED")
                  schema = db.execute(
                      "SELECT value FROM collector_runtime_meta WHERE key='schema_version'"
                  ).fetchone()
                  if schema is None:
                      raise SystemExit("WC1_COLLECTOR_SCHEMA_MISSING")
                  rows = db.execute(
                      """
                      SELECT instance_identity, started_at_ms, payload_json
                      FROM collector_instances
                      ORDER BY started_at_ms, instance_identity
                      """
                  ).fetchall()
                  heartbeat_count = int(
                      db.execute("SELECT COUNT(*) FROM collector_heartbeats").fetchone()[0]
                  )
                  orphan_heartbeats = int(
                      db.execute(
                          """
                          SELECT COUNT(*)
                          FROM collector_heartbeats AS h
                          LEFT JOIN collector_instances AS i
                            ON i.instance_identity=h.instance_identity
                          WHERE i.instance_identity IS NULL
                          """
                      ).fetchone()[0]
                  )

              if len(rows) < 2:
                  raise SystemExit("WC1_COLLECTOR_RESTART_LINEAGE_NOT_OBSERVED")
              seen: set[str] = set()
              start_count = 0
              restart_count = 0
              previous_started = -1
              for identity, started_at_ms, payload_json in rows:
                  payload = json.loads(str(payload_json))
                  if payload.get("production_authority") is not False:
                      raise SystemExit("WC1_COLLECTOR_AUTHORITY_MISMATCH")
                  if int(payload.get("real_capital", -1)) != 0:
                      raise SystemExit("WC1_COLLECTOR_REAL_CAPITAL_MISMATCH")
                  if int(started_at_ms) < previous_started:
                      raise SystemExit("WC1_COLLECTOR_TIME_REGRESSION")
                  previous_started = int(started_at_ms)
                  kind = str(payload.get("start_kind"))
                  predecessor = payload.get("previous_instance_identity")
                  if kind == "start":
                      start_count += 1
                      if predecessor is not None:
                          raise SystemExit("WC1_COLLECTOR_START_HAS_PREDECESSOR")
                  elif kind == "restart":
                      restart_count += 1
                      if not isinstance(predecessor, str) or predecessor not in seen:
                          raise SystemExit("WC1_COLLECTOR_RESTART_PREDECESSOR_MISMATCH")
                  else:
                      raise SystemExit("WC1_COLLECTOR_START_KIND_INVALID")
                  seen.add(str(identity))

              if restart_count < 1 or heartbeat_count < 1 or orphan_heartbeats != 0:
                  raise SystemExit("WC1_COLLECTOR_RESTART_EVIDENCE_INSUFFICIENT")

              with sqlite3.connect(copies["gaps"]) as db:
                  quick = db.execute("PRAGMA quick_check").fetchone()
                  if quick is None or str(quick[0]).lower() != "ok":
                      raise SystemExit("WC1_GAP_QUICK_CHECK_FAILED")
                  schema = db.execute(
                      "SELECT value FROM market_data_gap_meta WHERE key='schema_version'"
                  ).fetchone()
                  if schema is None:
                      raise SystemExit("WC1_GAP_SCHEMA_MISSING")
                  gap_rows = db.execute(
                      """
                      SELECT gap_identity, event_identity, previous_event_identity,
                             event_kind, payload_json
                      FROM market_data_gap_events
                      ORDER BY sequence_id
                      """
                  ).fetchall()

              latest_by_gap: dict[str, str] = {}
              terminal: set[str] = set()
              event_kinds: dict[str, int] = {}
              for gap_identity, event_identity, predecessor, kind, payload_json in gap_rows:
                  gap = str(gap_identity)
                  event = str(event_identity)
                  event_kind = str(kind)
                  payload = json.loads(str(payload_json))
                  if payload.get("production_authority") is not False:
                      raise SystemExit("WC1_GAP_AUTHORITY_MISMATCH")
                  if int(payload.get("real_capital", -1)) != 0:
                      raise SystemExit("WC1_GAP_REAL_CAPITAL_MISMATCH")
                  expected = latest_by_gap.get(gap)
                  if expected is None:
                      if event_kind != "observed" or predecessor is not None:
                          raise SystemExit("WC1_GAP_ROOT_MISMATCH")
                  else:
                      if str(predecessor) != expected:
                          raise SystemExit("WC1_GAP_PREDECESSOR_MISMATCH")
                      if gap in terminal:
                          raise SystemExit("WC1_GAP_EVENT_AFTER_TERMINAL")
                  latest_by_gap[gap] = event
                  event_kinds[event_kind] = event_kinds.get(event_kind, 0) + 1
                  if event_kind in {"recovered", "unrecovered"}:
                      terminal.add(gap)

              for name, source in sources.items():
                  after = source_state(source)
                  if after != before[name]:
                      raise SystemExit(f"WC1_{name.upper()}_SOURCE_CHANGED")

              print(
                  "WC1_COLLECTOR_RESTART_LINEAGE "
                  f"instances={len(rows)} starts={start_count} restarts={restart_count} "
                  f"heartbeats={heartbeat_count} orphan_heartbeats={orphan_heartbeats}"
              )
              print(
                  "WC1_GAP_LEDGER_STATE "
                  f"events={len(gap_rows)} gaps={len(latest_by_gap)} kinds="
                  + ",".join(f"{key}:{event_kinds[key]}" for key in sorted(event_kinds))
              )
              print("WC1_COLLECTOR_RESTART_LINEAGE_PASS=YES")
              print("WC1_GAP_LEDGER_CHAIN_PASS=YES")
              print("WC1_SOURCE_BYTE_STABLE_PASS=YES")
              print("WC1_RESTART_CONTINUITY_READONLY_PASS=YES")
              print("REAL_CAPITAL=0")
          finally:
              shutil.rmtree(work, ignore_errors=True)
          PY
