name: World-Class WC1 Market Tape Single Owner UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/ssd_runtime_supervisor.sh"
      - "tests/test_wc1_ssd_supervisor_market_tape_single_owner.py"
      - ".github/workflows/world-class-wc1-restart-continuity-uid504.yml"

permissions:
  contents: read

concurrency:
  group: wc1-market-tape-single-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and immutable Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC1_MARKET_TAPE_SINGLE_OWNER_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc1-market-tape-single-owner-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused Market Tape ownership acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          bash -n ops/ssd_runtime_supervisor.sh
          "$TEST_PY" -m pytest -q \
            tests/test_wc1_ssd_supervisor_market_tape_single_owner.py \
            tests/test_market_tape_collector_runtime.py \
            tests/test_market_tape_gap_runtime_wiring.py \
            tests/test_wc2_ssd_supervisor_single_owner.py
          "$TEST_PY" -m ruff check \
            tests/test_wc1_ssd_supervisor_market_tape_single_owner.py
          echo "WC1_MARKET_TAPE_SINGLE_OWNER_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_MARKET_TAPE_SINGLE_OWNER_FULL_PASS=YES"

      - name: Prove Development remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC1_MARKET_TAPE_SINGLE_OWNER_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
# Ephemeral RDP5-A3 owner-gate trigger; validation branch must not merge.
