name: RDP7 Onchain Family Wiring UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/product/intelligence_stream_onchain_family.py"
      - "src/crypto_signal/product/intelligence_stream_family.py"
      - "src/crypto_signal/product/intelligence_stream_policy.py"
      - "ops/run_live_evidence_clock.py"
      - "ops/ssd_runtime_supervisor.sh"
      - "tests/test_rdp7_onchain_family.py"
      - "tests/test_rdp7_onchain_family_runtime_wiring.py"
      - ".github/workflows/crypto-rdp7-onchain-family-f.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP7_F_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP7_F_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused RDP7-F acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp7_onchain_family.py \
            tests/test_rdp7_onchain_family_runtime_wiring.py \
            tests/test_rdp7_stablecoin_capital_flow.py \
            tests/test_rdp7_defillama_stablecoin_source.py \
            tests/test_rdp7_onchain_capital_flow_store.py \
            tests/test_intelligence_stream_family.py \
            tests/test_rdp6_options_live_runtime_wiring.py
          "$PY" -m ruff check \
            src/crypto_signal/product/intelligence_stream_onchain_family.py \
            src/crypto_signal/product/intelligence_stream_family.py \
            src/crypto_signal/product/intelligence_stream_policy.py \
            ops/run_live_evidence_clock.py \
            tests/test_rdp7_onchain_family.py \
            tests/test_rdp7_onchain_family_runtime_wiring.py
          "$PY" -m mypy \
            src/crypto_signal/product/intelligence_stream_onchain_family.py \
            ops/run_live_evidence_clock.py
          "$PY" -m py_compile \
            src/crypto_signal/product/intelligence_stream_onchain_family.py \
            src/crypto_signal/product/intelligence_stream_family.py \
            src/crypto_signal/product/intelligence_stream_policy.py \
            ops/run_live_evidence_clock.py \
            tests/test_rdp7_onchain_family.py \
            tests/test_rdp7_onchain_family_runtime_wiring.py
          bash -n ops/ssd_runtime_supervisor.sh
          echo "RDP7_F_ONCHAIN_FAMILY_PASS=YES"
          echo "EXISTING_FAMILY=ONCHAIN"
          echo "STABLECOIN_DIRECTION=NONE"
          echo "EXCHANGE_FLOW_PROVIDER=UNAVAILABLE_EXPLICIT"
          echo "LARGE_TRANSFER_PROVIDER=UNAVAILABLE_EXPLICIT"
          echo "WALLET_COHORT_PROVIDER=UNAVAILABLE_EXPLICIT"
          echo "RDP10_EXACT_SOURCE_LINEAGE=PRESERVED"
          echo "REAL_CAPITAL=0"
