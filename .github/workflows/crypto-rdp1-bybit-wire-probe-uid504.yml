name: RDP1 Bybit TR Wire Probe UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/rdp1_bybit_wire_probe.py"
      - "ops/rdp1_market_tape_temp_probe.py"
      - ".github/workflows/crypto-rdp1-bybit-wire-probe-uid504.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-probe:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          echo "RDP1_WIRE_PROBE_EXACT_SOURCE_PASS=YES"

      - name: Probe real Bybit TR wire events
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m py_compile "$GITHUB_WORKSPACE/ops/rdp1_bybit_wire_probe.py"
          "$PY" "$GITHUB_WORKSPACE/ops/rdp1_bybit_wire_probe.py"             --url wss://stream.bybit.tr/v5/public/spot             --timeout-seconds 60             --depth 50             | tee "$RUNNER_TEMP/rdp1-bybit-wire-probe.log"

      - name: Probe temp DB persistence
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m py_compile "$GITHUB_WORKSPACE/ops/rdp1_market_tape_temp_probe.py"
          "$PY" "$GITHUB_WORKSPACE/ops/rdp1_market_tape_temp_probe.py"             --output-dir "$RUNNER_TEMP/rdp1-temp-persistence"             --max-messages 200             --timeout-seconds 60             | tee "$RUNNER_TEMP/rdp1-market-tape-temp-probe.log"

      - name: Probe exact collector with temp runtime state
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/rdp1-exact-collector"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$PY" "$GITHUB_WORKSPACE/ops/run_market_tape_stream.py"             --db "$OUT/market.sqlite3"             --raw-db "$OUT/raw.sqlite3"             --lock-path "$OUT/collector.lock"             --runtime-status-db "$OUT/runtime.sqlite3"             --gap-ledger-db "$OUT/gaps.sqlite3"             --bybit-ws-url wss://stream.bybit.tr/v5/public/spot             --symbols BTCUSDT ETHUSDT SOLUSDT             --depth 50             --orderbook-snapshot-interval-ms 1000             --heartbeat-interval-ms 10000             --max-ingestion-silence-ms 60000             --max-events 200             2>&1 | tee "$RUNNER_TEMP/rdp1-exact-collector.log"
          grep -F "MARKET_TAPE_STREAM_PASS" "$RUNNER_TEMP/rdp1-exact-collector.log"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp1-bybit-wire-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rdp1-bybit-wire-probe.log
            ${{ runner.temp }}/rdp1-market-tape-temp-probe.log
            ${{ runner.temp }}/rdp1-exact-collector.log
          if-no-files-found: warn
          retention-days: 14
