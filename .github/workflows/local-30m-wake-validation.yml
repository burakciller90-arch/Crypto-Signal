name: Local 30m Wake Validation

on:
  push:
    branches:
      - feature/local-30m-continuity-timer-v2
    paths:
      - "ops/continuity/recurring_wake.py"
      - "ops/continuity/recurring_wake_launchd.sh"
      - "ops/continuity/relay_submit.py"
      - "ops/continuity/launchd/com.cryptosignal.autowake30m.plist"
      - ".github/workflows/crypto-install-local-30m-wake.yml"
      - ".github/workflows/crypto-30m-continuity-wake.yml"
      - ".github/workflows/local-30m-wake-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate timer artifacts
        run: |
          python -m py_compile             ops/continuity/recurring_wake.py             ops/continuity/relay_submit.py
          python - <<'PY'
          from pathlib import Path
          import plistlib

          plist_path = Path("ops/continuity/launchd/com.cryptosignal.autowake30m.plist")
          data = plistlib.loads(plist_path.read_bytes())
          assert data["Label"] == "com.cryptosignal.autowake30m"
          assert data["StartCalendarInterval"] == [{"Minute": 0}, {"Minute": 30}]
          args = data["ProgramArguments"]
          assert args[0] == "/bin/zsh"
          assert args[1].endswith("/recurring_wake_launchd.sh")

          wake = Path("ops/continuity/recurring_wake.py").read_text()
          assert "scheduled_slot_event_id" in wake
          assert "crypto-30m-continuity:" in wake

          wrapper = Path("ops/continuity/recurring_wake_launchd.sh").read_text()
          assert "recurring_wake_last_local_attempt" in wrapper
          assert 'recurring_wake.py"' in wrapper
          assert "EVENT_ID=" not in wrapper

          fallback = Path(".github/workflows/crypto-30m-continuity-wake.yml").read_text()
          assert "GITHUB_FALLBACK_SKIPPED=YES" in fallback
          assert "EVENT_ID=" not in fallback
          assert "AGE" in fallback and "600" in fallback

          installer = Path(".github/workflows/crypto-install-local-30m-wake.yml").read_text()
          assert "launchctl bootstrap" in installer
          assert "LOCAL_30M_WAKE_INSTALL_PASS=YES" in installer
          print("LOCAL_30M_WAKE_VALIDATION_PASS=YES")
          PY
