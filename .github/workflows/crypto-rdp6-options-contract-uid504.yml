name: RDP6 Options Contract UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/options.py"
      - "tests/test_rdp6_options_contract.py"
      - ".github/workflows/crypto-rdp6-options-contract-uid504.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: RDP6-A contracts and static acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          DEV="$ROOT/Development"
          PY="$DEV/.venv/bin/python"
          BASE="${{ github.event.pull_request.base.sha }}"

          test "$(id -u)" = "504"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "$BASE"
          test -x "$PY"
          echo "RDP6_A_WORKBENCH_EXACT_BASE_PASS=YES"

          "$PY" -m pytest -q tests/test_rdp6_options_contract.py
          "$PY" -m ruff check src/crypto_signal/data/options.py tests/test_rdp6_options_contract.py
          "$PY" -m mypy src/crypto_signal/data/options.py
          "$PY" -m py_compile src/crypto_signal/data/options.py tests/test_rdp6_options_contract.py

          echo "RDP6_A_OPTIONS_CONTRACT_PASS=YES"
          echo "NO_NEW_FAMILY_OR_DIRECTION=YES"
          echo "DEALER_GAMMA_MAX_PAIN_INFERENCE=FORBIDDEN"
          echo "REAL_CAPITAL=0"
