name: Crypto Paper Stable

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  paper:
    if: github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[PAPER] ')
    name: UID504 Paper Stable
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - name: Parse allowlisted paper command
        id: parse
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="command" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          case "$cmd" in
            state|deploy|rulesrefresh|activationinit|dryrun|dryrunclockdeploy|portfolio|performance)
              ;;
            *)
              echo "Unsupported paper command: $cmd"
              exit 2
              ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: PAPER STATE
        if: steps.parse.outputs.command == 'state'
        shell: bash
        run: |
          set +e
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          DB="/Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_fund.sqlite3"
          echo "=== PAPER GIT ==="
          if git -C "$PAPER" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$PAPER" status --short --branch
            echo "HEAD=$(git -C "$PAPER" rev-parse HEAD)"
          else
            echo "MISSING"
          fi
          echo "=== PAPER CLOCK SERVICE ==="
          launchctl print "gui/$(id -u)/com.cryptosignal.paperclock" 2>&1 | egrep 'state =|runs =|pid =|last exit code =|run interval =' | head -30
          echo "=== PAPER CLOCK LOGS ==="
          tail -40 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_clock.err.log 2>/dev/null
          tail -40 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_clock.out.log 2>/dev/null
          echo "=== PAPER DRY-RUN CLOCK SERVICE ==="
          launchctl print "gui/$(id -u)/com.cryptosignal.paperdryrun" 2>&1 | egrep 'state =|runs =|pid =|last exit code =|run interval =' | head -30
          echo "=== PAPER DRY-RUN CLOCK LOGS ==="
          tail -20 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.err.log 2>/dev/null
          tail -20 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.out.log 2>/dev/null
          echo "=== PAPER DRY-RUN OBSERVATION ==="
          cat /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.out.log.1 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.out.log 2>/dev/null | grep 'PAPER_DRY_RUN_OK' | tail -1
          cat /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.out.log.1 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.out.log 2>/dev/null | grep 'PAPER_DRY_RUN_ATTENTION' | tail -5
          tail -1 /Users/crypto-signal-agent/Crypto-Signal/runtime/paper/paper_dry_run_clock.out.log 2>/dev/null | grep 'PAPER_DRY_RUN_LOG_RETENTION' || true
          echo "=== PAPER DB ==="
          if [ -f "$DB" ]; then
            "$PAPER/.venv/bin/python" -c 'import json,sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); tables=("paper_fund_creations","paper_decision_intents","paper_simulated_fills","paper_position_cash_mutations","paper_nav_snapshots","paper_replay_index"); [print(t+"="+str(c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0])) for t in tables]; exists=c.execute("SELECT 1 FROM sqlite_master WHERE type=\"table\" AND name=\"paper_venue_rule_snapshots\"").fetchone(); print("paper_venue_rule_snapshots="+str(c.execute("SELECT COUNT(*) FROM paper_venue_rule_snapshots").fetchone()[0]) if exists else "paper_venue_rule_snapshots=0"); rows=c.execute("SELECT symbol,observed_at_ms,snapshot_identity FROM paper_venue_rule_snapshots ORDER BY symbol,observed_at_ms DESC").fetchall() if exists else []; seen=set(); [(print("venue_latest_"+str(s)+"="+str(t)+":"+str(i)), seen.add(s)) for s,t,i in rows if s not in seen]; aexists=c.execute("SELECT 1 FROM sqlite_master WHERE type=\"table\" AND name=\"paper_activation_state\"").fetchone(); arow=c.execute("SELECT activation_identity,payload_json,activated_at_ms FROM paper_activation_state WHERE singleton=1").fetchone() if aexists else None; print("paper_activation_state="+("1" if arow else "0")); print("activation_identity="+str(arow[0])) if arow else None; print("activation_activated_at_ms="+str(arow[2])) if arow else None; print("activation_payload="+str(arow[1])) if arow else None; pexists=c.execute("SELECT 1 FROM sqlite_master WHERE type=\"table\" AND name=\"paper_processed_events\"").fetchone(); print("paper_processed_events="+str(c.execute("SELECT COUNT(*) FROM paper_processed_events").fetchone()[0]) if pexists else "paper_processed_events=0"); c.close()' "$DB"
          else
            echo "MISSING"
          fi
          exit 0

      - name: PAPER DEPLOY
        if: steps.parse.outputs.command == 'deploy'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="target" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_PAPER_DEPLOY_TARGET"; exit 2; }

          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          PAPER_DB="$REPO/runtime/paper/paper_fund.sqlite3"
          SIGNAL_DB="$REPO/runtime/ledger/live_signal_ledger.sqlite3"
          LABEL="com.cryptosignal.paperclock"
          PLIST_DEST="$HOME/Library/LaunchAgents/$LABEL.plist"
          DRY_LABEL="com.cryptosignal.paperdryrun"
          DRY_PLIST_DEST="$HOME/Library/LaunchAgents/$DRY_LABEL.plist"
          UV="$HOME/.local/bin/uv"
          UID_NOW="$(id -u)"

          test "$UID_NOW" = "504"
          test -z "$(git -C "$REPO" status --porcelain)"
          test -f "$SIGNAL_DB"
          test -x "$UV"

          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          ORIGIN_MAIN="$(git -C "$REPO" rev-parse origin/main)"
          test "$TARGET" = "$ORIGIN_MAIN"
          git -C "$REPO" cat-file -e "$TARGET^{commit}"

          EXISTED=0
          PREVIOUS=""
          HAD_PLIST=0
          BACKUP="/tmp/$LABEL.plist.backup.$"
          DRY_HAD_PLIST=0
          DRY_BACKUP="/tmp/$DRY_LABEL.plist.backup.$"
          if git -C "$PAPER" rev-parse --git-dir >/dev/null 2>&1; then
            EXISTED=1
            test -z "$(git -C "$PAPER" status --porcelain)"
            PREVIOUS="$(git -C "$PAPER" rev-parse HEAD)"
          fi
          if [ -f "$PLIST_DEST" ]; then
            HAD_PLIST=1
            cp "$PLIST_DEST" "$BACKUP"
          fi
          if [ -f "$DRY_PLIST_DEST" ]; then
            DRY_HAD_PLIST=1
            cp "$DRY_PLIST_DEST" "$DRY_BACKUP"
          fi

          launchctl bootout "gui/$UID_NOW/$LABEL" >/dev/null 2>&1 || true
          launchctl bootout "gui/$UID_NOW/$DRY_LABEL" >/dev/null 2>&1 || true

          rollback() {
            set +e
            echo "PAPER_ROLLBACK=YES"
            launchctl bootout "gui/$UID_NOW/$LABEL" >/dev/null 2>&1
            launchctl bootout "gui/$UID_NOW/$DRY_LABEL" >/dev/null 2>&1
            if [ "$EXISTED" = "1" ] && [ -n "$PREVIOUS" ]; then
              git -C "$PAPER" checkout --detach "$PREVIOUS"
              (cd "$PAPER" && "$UV" sync --frozen --python 3.12) >/dev/null 2>&1
            elif [ -d "$PAPER" ]; then
              git -C "$REPO" worktree remove --force "$PAPER" >/dev/null 2>&1
            fi
            if [ "$HAD_PLIST" = "1" ]; then
              cp "$BACKUP" "$PLIST_DEST"
              launchctl bootstrap "gui/$UID_NOW" "$PLIST_DEST" >/dev/null 2>&1
              launchctl kickstart -k "gui/$UID_NOW/$LABEL" >/dev/null 2>&1
            else
              rm -f "$PLIST_DEST"
            fi
            if [ "$DRY_HAD_PLIST" = "1" ]; then
              cp "$DRY_BACKUP" "$DRY_PLIST_DEST"
              launchctl bootstrap "gui/$UID_NOW" "$DRY_PLIST_DEST" >/dev/null 2>&1
              launchctl kickstart -k "gui/$UID_NOW/$DRY_LABEL" >/dev/null 2>&1
            else
              rm -f "$DRY_PLIST_DEST"
            fi
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback; fi; rm -f "$BACKUP" "$DRY_BACKUP"; exit "$rc"' EXIT

          if [ "$EXISTED" = "1" ]; then
            git -C "$PAPER" checkout --detach "$TARGET"
          else
            git -C "$REPO" worktree add --detach "$PAPER" "$TARGET"
          fi
          test "$(git -C "$PAPER" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$PAPER" status --porcelain)"

          cd "$PAPER"
          "$UV" sync --frozen --python 3.12
          test -x "$PAPER/.venv/bin/python"
          mkdir -p "$REPO/runtime/paper"
          mkdir -p "$HOME/Library/LaunchAgents"

          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python" "$PAPER/ops/run_paper_clock.py" --paper-ledger "$PAPER_DB" --signal-ledger "$SIGNAL_DB" | tee /tmp/crypto-paper-probe-1.txt
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python" "$PAPER/ops/run_paper_clock.py" --paper-ledger "$PAPER_DB" --signal-ledger "$SIGNAL_DB" | tee /tmp/crypto-paper-probe-2.txt
          grep -q 'PAPER_CLOCK_OK' /tmp/crypto-paper-probe-1.txt
          grep -q 'bootstrap=existing' /tmp/crypto-paper-probe-2.txt
          grep -q 'trade_policy=NOT_ACTIVATED' /tmp/crypto-paper-probe-2.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-probe-2.txt

          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python"             "$PAPER/ops/run_paper_activation_dry_run.py"             --paper-ledger "$PAPER_DB"             --signal-ledger "$SIGNAL_DB"             --candle-cache "$REPO/runtime/data/live_base_15m_cache.sqlite3"             --max-events 100 | tee /tmp/crypto-paper-dryrun-deploy-probe.txt
          grep -q 'PAPER_DRY_RUN_OK' /tmp/crypto-paper-dryrun-deploy-probe.txt
          grep -q 'paper_db_unchanged=YES' /tmp/crypto-paper-dryrun-deploy-probe.txt
          grep -q 'ready_candidates=' /tmp/crypto-paper-dryrun-deploy-probe.txt
          grep -q 'attention_required=' /tmp/crypto-paper-dryrun-deploy-probe.txt
          grep -q 'trade_policy=NOT_ACTIVATED' /tmp/crypto-paper-dryrun-deploy-probe.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-dryrun-deploy-probe.txt

          "$PAPER/.venv/bin/python" -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); count=lambda t:int(c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]); assert count("paper_fund_creations")==1; assert count("paper_decision_intents")==0; assert count("paper_simulated_fills")==0; assert count("paper_position_cash_mutations")==0; assert count("paper_nav_snapshots")==0; assert count("paper_replay_index")==1; assert count("paper_activation_state")==1; assert count("paper_processed_events")==0; c.close(); print("PAPER_DB_NO_TRADE_INVARIANT=YES")' "$PAPER_DB"

          cp "$PAPER/ops/paper/launchd/$LABEL.plist" "$PLIST_DEST"
          plutil -lint "$PLIST_DEST"
          launchctl bootout "gui/$UID_NOW/$LABEL" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$UID_NOW" "$PLIST_DEST"
          launchctl kickstart -k "gui/$UID_NOW/$LABEL"
          sleep 3
          launchctl print "gui/$UID_NOW/$LABEL" >/tmp/crypto-paper-launchctl.txt
          egrep 'state =|runs =|pid =|last exit code =|run interval =' /tmp/crypto-paper-launchctl.txt | head -30
          grep -q 'PAPER_CLOCK_OK' "$REPO/runtime/paper/paper_clock.out.log"

          if [ "$DRY_HAD_PLIST" = "1" ]; then
            test -f "$PAPER/ops/paper/launchd/$DRY_LABEL.plist"
            test -f "$PAPER/ops/run_paper_dry_run_clock.py"
            cp "$PAPER/ops/paper/launchd/$DRY_LABEL.plist" "$DRY_PLIST_DEST"
            plutil -lint "$DRY_PLIST_DEST"
            launchctl bootstrap "gui/$UID_NOW" "$DRY_PLIST_DEST"
            launchctl kickstart -k "gui/$UID_NOW/$DRY_LABEL"
            sleep 2
            launchctl print "gui/$UID_NOW/$DRY_LABEL" >/tmp/crypto-paper-dryrun-launchctl.txt
            egrep 'state =|runs =|pid =|last exit code =|run interval =' /tmp/crypto-paper-dryrun-launchctl.txt | head -30
          fi

          test "$(git -C "$PAPER" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$PAPER" status --porcelain)"
          trap - EXIT
          rm -f "$BACKUP" "$DRY_BACKUP"
          echo "PAPER_DEPLOY_PASS=YES"

      - name: PAPER RULES REFRESH
        if: steps.parse.outputs.command == 'rulesrefresh'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          DB="$REPO/runtime/paper/paper_fund.sqlite3"

          test "$(id -u)" = "504"
          test -f "$DB"
          test -x "$PAPER/.venv/bin/python"
          test -z "$(git -C "$PAPER" status --porcelain)"
          test -f "$PAPER/ops/refresh_paper_venue_rules.py"

          BEFORE_HEAD="$(git -C "$PAPER" rev-parse HEAD)"
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python"             "$PAPER/ops/refresh_paper_venue_rules.py"             --paper-ledger "$DB" | tee /tmp/crypto-paper-venue-rule-refresh.txt

          grep -q 'PAPER_VENUE_RULE_REFRESH_OK symbol=BTCUSDT' /tmp/crypto-paper-venue-rule-refresh.txt
          grep -q 'PAPER_VENUE_RULE_REFRESH_OK symbol=ETHUSDT' /tmp/crypto-paper-venue-rule-refresh.txt
          grep -q 'PAPER_VENUE_RULE_REFRESH_OK symbol=SOLUSDT' /tmp/crypto-paper-venue-rule-refresh.txt
          grep -q 'trade_policy=NOT_ACTIVATED' /tmp/crypto-paper-venue-rule-refresh.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-venue-rule-refresh.txt

          "$PAPER/.venv/bin/python" -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); count=lambda t:int(c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]); assert count("paper_fund_creations")==1; assert count("paper_decision_intents")==0; assert count("paper_simulated_fills")==0; assert count("paper_position_cash_mutations")==0; assert count("paper_nav_snapshots")==0; assert count("paper_replay_index")==1; rows=c.execute("SELECT symbol,COUNT(*) FROM paper_venue_rule_snapshots GROUP BY symbol").fetchall(); d=dict(rows); assert all(d.get(s,0)>=1 for s in ("BTCUSDT","ETHUSDT","SOLUSDT")); c.close(); print("PAPER_VENUE_RULE_CACHE_PASS=YES")' "$DB"

          test "$(git -C "$PAPER" rev-parse HEAD)" = "$BEFORE_HEAD"
          test -z "$(git -C "$PAPER" status --porcelain)"
          echo "PAPER_RULES_REFRESH_PASS=YES"

      - name: PAPER ACTIVATION INIT
        if: steps.parse.outputs.command == 'activationinit'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          PAPER_DB="$REPO/runtime/paper/paper_fund.sqlite3"
          SIGNAL_DB="$REPO/runtime/ledger/live_signal_ledger.sqlite3"

          test "$(id -u)" = "504"
          test -f "$PAPER_DB"
          test -f "$SIGNAL_DB"
          test -x "$PAPER/.venv/bin/python"
          test -f "$PAPER/ops/init_paper_activation.py"
          test -z "$(git -C "$PAPER" status --porcelain)"

          BEFORE_HEAD="$(git -C "$PAPER" rev-parse HEAD)"
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python"             "$PAPER/ops/init_paper_activation.py"             --paper-ledger "$PAPER_DB"             --signal-ledger "$SIGNAL_DB" | tee /tmp/crypto-paper-activation-init-1.txt
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python"             "$PAPER/ops/init_paper_activation.py"             --paper-ledger "$PAPER_DB"             --signal-ledger "$SIGNAL_DB" | tee /tmp/crypto-paper-activation-init-2.txt

          grep -q 'PAPER_ACTIVATION_INIT_OK' /tmp/crypto-paper-activation-init-1.txt
          grep -Eq 'write=(inserted|unchanged)' /tmp/crypto-paper-activation-init-1.txt
          grep -q 'PAPER_ACTIVATION_INIT_OK write=unchanged' /tmp/crypto-paper-activation-init-2.txt
          grep -q 'trade_policy=NOT_ACTIVATED' /tmp/crypto-paper-activation-init-2.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-activation-init-2.txt
          A1="$(sed -n 's/.* activation=\([0-9a-f]\{64\}\).*/\1/p' /tmp/crypto-paper-activation-init-1.txt | tail -1)"
          A2="$(sed -n 's/.* activation=\([0-9a-f]\{64\}\).*/\1/p' /tmp/crypto-paper-activation-init-2.txt | tail -1)"
          test -n "$A1"
          test "$A1" = "$A2"

          "$PAPER/.venv/bin/python" -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); count=lambda t:int(c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]); assert count("paper_fund_creations")==1; assert count("paper_decision_intents")==0; assert count("paper_simulated_fills")==0; assert count("paper_position_cash_mutations")==0; assert count("paper_nav_snapshots")==0; assert count("paper_replay_index")==1; assert count("paper_activation_state")==1; assert count("paper_processed_events")==0; c.close(); print("PAPER_ACTIVATION_NO_TRADE_INVARIANT=YES")' "$PAPER_DB"

          test "$(git -C "$PAPER" rev-parse HEAD)" = "$BEFORE_HEAD"
          test -z "$(git -C "$PAPER" status --porcelain)"
          echo "PAPER_ACTIVATION_INIT_PASS=YES"

      - name: PAPER READ-ONLY DRY RUN
        if: steps.parse.outputs.command == 'dryrun'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          PAPER_DB="$REPO/runtime/paper/paper_fund.sqlite3"
          SIGNAL_DB="$REPO/runtime/ledger/live_signal_ledger.sqlite3"
          CANDLE_DB="$REPO/runtime/data/live_base_15m_cache.sqlite3"

          test "$(id -u)" = "504"
          test -f "$PAPER_DB"
          test -f "$SIGNAL_DB"
          test -f "$CANDLE_DB"
          test -x "$PAPER/.venv/bin/python"
          test -f "$PAPER/ops/run_paper_activation_dry_run.py"
          test -z "$(git -C "$PAPER" status --porcelain)"

          BEFORE_HEAD="$(git -C "$PAPER" rev-parse HEAD)"
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python"             "$PAPER/ops/run_paper_activation_dry_run.py"             --paper-ledger "$PAPER_DB"             --signal-ledger "$SIGNAL_DB"             --candle-cache "$CANDLE_DB"             --max-events 100 | tee /tmp/crypto-paper-dry-run.txt

          grep -q 'PAPER_DRY_RUN_OK' /tmp/crypto-paper-dry-run.txt
          grep -q 'paper_db_unchanged=YES' /tmp/crypto-paper-dry-run.txt
          grep -q 'trade_policy=NOT_ACTIVATED' /tmp/crypto-paper-dry-run.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-dry-run.txt

          "$PAPER/.venv/bin/python" -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); count=lambda t:int(c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]); assert count("paper_fund_creations")==1; assert count("paper_decision_intents")==0; assert count("paper_simulated_fills")==0; assert count("paper_position_cash_mutations")==0; assert count("paper_nav_snapshots")==0; assert count("paper_replay_index")==1; assert count("paper_activation_state")==1; assert count("paper_processed_events")==0; c.close(); print("PAPER_DRY_RUN_NO_TRADE_INVARIANT=YES")' "$PAPER_DB"

          test "$(git -C "$PAPER" rev-parse HEAD)" = "$BEFORE_HEAD"
          test -z "$(git -C "$PAPER" status --porcelain)"
          echo "PAPER_DRY_RUN_PASS=YES"

      - name: PAPER PORTFOLIO
        if: steps.parse.outputs.command == 'portfolio'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          PAPER_DB="$REPO/runtime/paper/paper_fund.sqlite3"
          CANDLE_DB="$REPO/runtime/data/live_base_15m_cache.sqlite3"

          test "$(id -u)" = "504"
          test -f "$PAPER_DB"
          test -f "$CANDLE_DB"
          test -x "$PAPER/.venv/bin/python"
          test -f "$PAPER/ops/show_paper_portfolio.py"
          test -z "$(git -C "$PAPER" status --porcelain)"

          BEFORE_HEAD="$(git -C "$PAPER" rev-parse HEAD)"
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python" \
            "$PAPER/ops/show_paper_portfolio.py" \
            --paper-ledger "$PAPER_DB" \
            --candle-cache "$CANDLE_DB" | tee /tmp/crypto-paper-portfolio.txt

          grep -q 'PAPER_PORTFOLIO_OK' /tmp/crypto-paper-portfolio.txt
          grep -q 'trade_success=NOT_YET_MEASURED' /tmp/crypto-paper-portfolio.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-portfolio.txt
          test "$(git -C "$PAPER" rev-parse HEAD)" = "$BEFORE_HEAD"
          test -z "$(git -C "$PAPER" status --porcelain)"
          echo "PAPER_PORTFOLIO_PASS=YES"

      - name: PAPER PERFORMANCE
        if: steps.parse.outputs.command == 'performance'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          PAPER_DB="$REPO/runtime/paper/paper_fund.sqlite3"

          test "$(id -u)" = "504"
          test -f "$PAPER_DB"
          test -x "$PAPER/.venv/bin/python"
          test -f "$PAPER/ops/show_paper_performance.py"
          test -z "$(git -C "$PAPER" status --porcelain)"

          BEFORE_HEAD="$(git -C "$PAPER" rev-parse HEAD)"
          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python" \
            "$PAPER/ops/show_paper_performance.py" \
            --paper-ledger "$PAPER_DB" | tee /tmp/crypto-paper-performance.txt

          grep -q 'PAPER_PERFORMANCE_OK' /tmp/crypto-paper-performance.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-performance.txt
          test "$(git -C "$PAPER" rev-parse HEAD)" = "$BEFORE_HEAD"
          test -z "$(git -C "$PAPER" status --porcelain)"
          echo "PAPER_PERFORMANCE_PASS=YES"

      - name: PAPER DRY-RUN CLOCK DEPLOY
        if: steps.parse.outputs.command == 'dryrunclockdeploy'
        shell: bash
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          PAPER="/Users/crypto-signal-agent/Crypto-Signal-Paper"
          DB="$REPO/runtime/paper/paper_fund.sqlite3"
          LABEL="com.cryptosignal.paperdryrun"
          PLIST_SRC="$PAPER/ops/paper/launchd/$LABEL.plist"
          PLIST_DEST="$HOME/Library/LaunchAgents/$LABEL.plist"
          BACKUP="/tmp/$LABEL.plist.backup.$"
          UID_NOW="$(id -u)"
          HAD_PLIST=0

          test "$UID_NOW" = "504"
          test -f "$DB"
          test -f "$PLIST_SRC"
          test -f "$PAPER/ops/run_paper_dry_run_clock.py"
          test -x "$PAPER/.venv/bin/python"
          test -z "$(git -C "$PAPER" status --porcelain)"
          test "$(git -C "$PAPER" rev-parse HEAD)" = "$GITHUB_SHA"

          PYTHONPATH="$PAPER/src" "$PAPER/.venv/bin/python"             "$PAPER/ops/run_paper_activation_dry_run.py"             --paper-ledger "$DB"             --signal-ledger "$REPO/runtime/ledger/live_signal_ledger.sqlite3"             --candle-cache "$REPO/runtime/data/live_base_15m_cache.sqlite3"             --max-events 100 | tee /tmp/crypto-paper-dryrun-clock-probe.txt
          grep -q 'PAPER_DRY_RUN_OK' /tmp/crypto-paper-dryrun-clock-probe.txt
          grep -q 'paper_db_unchanged=YES' /tmp/crypto-paper-dryrun-clock-probe.txt
          grep -q 'ready_candidates=' /tmp/crypto-paper-dryrun-clock-probe.txt
          grep -q 'attention_required=' /tmp/crypto-paper-dryrun-clock-probe.txt
          grep -q 'trade_policy=NOT_ACTIVATED' /tmp/crypto-paper-dryrun-clock-probe.txt
          grep -q 'REAL_CAPITAL=0' /tmp/crypto-paper-dryrun-clock-probe.txt

          if [ -f "$PLIST_DEST" ]; then
            HAD_PLIST=1
            cp "$PLIST_DEST" "$BACKUP"
          fi
          rollback_dryrun_clock() {
            set +e
            echo "PAPER_DRYRUN_CLOCK_ROLLBACK=YES"
            launchctl bootout "gui/$UID_NOW/$LABEL" >/dev/null 2>&1
            if [ "$HAD_PLIST" = "1" ]; then
              cp "$BACKUP" "$PLIST_DEST"
              launchctl bootstrap "gui/$UID_NOW" "$PLIST_DEST" >/dev/null 2>&1
              launchctl kickstart -k "gui/$UID_NOW/$LABEL" >/dev/null 2>&1
            else
              rm -f "$PLIST_DEST"
            fi
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback_dryrun_clock; fi; rm -f "$BACKUP"; exit "$rc"' EXIT

          launchctl bootout "gui/$UID_NOW/$LABEL" >/dev/null 2>&1 || true
          cp "$PLIST_SRC" "$PLIST_DEST"
          plutil -lint "$PLIST_DEST"
          launchctl bootstrap "gui/$UID_NOW" "$PLIST_DEST"
          launchctl kickstart -k "gui/$UID_NOW/$LABEL"
          sleep 3

          launchctl print "gui/$UID_NOW/$LABEL" >/tmp/crypto-paper-dryrun-clock.txt
          egrep 'state =|runs =|pid =|last exit code =|run interval =' /tmp/crypto-paper-dryrun-clock.txt | head -30

          "$PAPER/.venv/bin/python" -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); count=lambda t:int(c.execute("SELECT COUNT(*) FROM "+t).fetchone()[0]); assert count("paper_fund_creations")==1; assert count("paper_decision_intents")==0; assert count("paper_simulated_fills")==0; assert count("paper_position_cash_mutations")==0; assert count("paper_nav_snapshots")==0; assert count("paper_replay_index")==1; assert count("paper_activation_state")==1; assert count("paper_processed_events")==0; c.close(); print("PAPER_DRYRUN_CLOCK_NO_TRADE_INVARIANT=YES")' "$DB"

          test -z "$(git -C "$PAPER" status --porcelain)"
          trap - EXIT
          rm -f "$BACKUP"
          echo "PAPER_DRYRUN_CLOCK_DEPLOY_PASS=YES"
