name: Crypto Stream S16 Closeout UID504

on:
  push:
    branches:
      - 'stream/s16-closeout-v1-complete'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-s16-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-s16-closeout:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and Development immutability
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-s16-closeout-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-s16-closeout-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "STREAM_S16_CLOSEOUT_EXACT_SOURCE_PASS=YES"

      - name: Focused S16 authority closeout
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q tests/test_r14_release_package.py tests/test_stream_s16_controlled_cutover.py
          grep -F "INTELLIGENCE_STREAM_V1_COMPLETE" CURRENT_STATUS.md >/dev/null
          grep -F "S16 Controlled Cutover: PASS" docs/CRYPTO_SIGNAL_INTELLIGENCE_STREAM_V1_MASTER_ROADMAP.md >/dev/null
          grep -F "Intelligence Stream V1: COMPLETE / ACCEPTED" docs/CRYPTO_SIGNAL_INTELLIGENCE_STREAM_V1_MASTER_ROADMAP.md >/dev/null
          grep -F "Status: **PASS**" docs/CRYPTO_SIGNAL_STREAM_S16_ACCEPTANCE.md >/dev/null
          grep -F "PRODUCT_DEPLOY_PASS=YES" docs/CRYPTO_SIGNAL_STREAM_S16_ACCEPTANCE.md >/dev/null
          grep -F "S16 Controlled Cutover is PASS" README.md >/dev/null
          grep -F "Intelligence Stream V1 S0-S16 is COMPLETE / ACCEPTED" README.md >/dev/null
          grep -F "workflow_dispatch:" .github/workflows/crypto-stream-s16-controlled-cutover-hosted.yml >/dev/null
          if grep -F -- "- 'main'" .github/workflows/crypto-stream-s16-controlled-cutover-hosted.yml; then
            echo "S16_AUTOMATIC_MAIN_TRIGGER_STILL_PRESENT" >&2
            exit 1
          fi
          echo "STREAM_S16_CLOSEOUT_AUTHORITY_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-s16-closeout-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_S16_CLOSEOUT_UID504_NON_MUTATING_PASS=YES"
