name: Crypto R15 Final Exact Head Gate

on:
  push:
    branches:
      - r15-final-exact-head-gate-temp
    paths:
      - ".github/workflows/crypto-r15-final-exact-head-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    name: R15 exact-head full regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7626e90ce5b434131cdbdb636b266b894e9609a0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.1" "ruff>=0.13" "mypy>=1.18"
      - name: Full regression
        run: |
          bash -n ops/install_ssd_hotplug_recovery.sh
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R15_FINAL_EXACT_HEAD_GATE_PASS=YES"
          echo "R15_EXACT_HEAD=7626e90ce5b434131cdbdb636b266b894e9609a0"
