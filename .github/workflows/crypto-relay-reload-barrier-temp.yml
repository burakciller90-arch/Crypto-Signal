name: Crypto Relay Reload Barrier TEMP

on:
  push:
    branches: [fix/continuity-relay-reload-barrier]
    paths:
      - ".github/workflows/crypto-relay-reload-barrier-temp.yml"
      - ".github/workflows/crypto-install-local-20m-wake.yml"
      - "tests/test_continuity_hardening.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "PyYAML>=6.0"
      - name: Relay reload barrier focused gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/crypto-install-local-20m-wake.yml")
          data = yaml.safe_load(path.read_text())
          jobs = data["jobs"]
          steps = jobs["install"]["steps"]
          run_step = next(step for step in steps if step.get("name") == "Install receipt-bound rolling 1200s Crypto timer")
          shell = run_step["run"]
          Path("/tmp/crypto-install-local-20m-wake.sh").write_text(shell)
          PY
          bash -n /tmp/crypto-install-local-20m-wake.sh
          python -m pytest -q tests/test_continuity_hardening.py
          python -m ruff check tests/test_continuity_hardening.py
          echo "RELAY_RELOAD_BARRIER_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "RELAY_RELOAD_BARRIER_FULL_PASS=YES"
