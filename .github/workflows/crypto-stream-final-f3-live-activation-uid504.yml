name: Crypto Stream Final F3 Live Activation UID504

on:
  push:
    branches:
      - 'stream/final-f3-live-activation'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f3-live-activation
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2
      - name: Read F3 runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          echo "=== supervisor pid ==="
          cat "$ROOT/ssd-service-supervisor.pid" 2>/dev/null || true
          echo "=== supervisor tail ==="
          tail -120 "$ROOT/ServiceLogs/supervisor.log" 2>/dev/null || true
          echo "=== live out tail ==="
          tail -160 "$ROOT/ServiceLogs/live.out.log" 2>/dev/null || true
          echo "=== live err tail ==="
          tail -160 "$ROOT/ServiceLogs/live.err.log" 2>/dev/null || true
          echo "=== snapshot out tail ==="
          tail -80 "$ROOT/ServiceLogs/market-tape-snapshot.out.log" 2>/dev/null || true
          echo "=== snapshot err tail ==="
          tail -80 "$ROOT/ServiceLogs/market-tape-snapshot.err.log" 2>/dev/null || true
          echo "F3_RUNTIME_DIAGNOSTIC_READ_ONLY=YES"
          echo "REAL_CAPITAL=0"

  verify:
    needs: diagnose
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2

      - name: Diagnose active F3 production cycle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          test "$(git -C "$DEV" rev-parse HEAD)" = "0bb40b16ffe0415f30d835c9a22c3f2aff4ba355"
          sup="$(cat "$ROOT/ssd-service-supervisor.pid")"
          kill -0 "$sup"
          echo "F3_SUPERVISOR_ACTIVE=YES pid=$sup"
          echo "=== live.out ==="
          tail -240 "$ROOT/ServiceLogs/live.out.log" 2>/dev/null || true
          echo "=== live.err ==="
          tail -240 "$ROOT/ServiceLogs/live.err.log" 2>/dev/null || true
          echo "=== snapshot.out ==="
          tail -120 "$ROOT/ServiceLogs/market-tape-snapshot.out.log" 2>/dev/null || true
          echo "=== snapshot.err ==="
          tail -120 "$ROOT/ServiceLogs/market-tape-snapshot.err.log" 2>/dev/null || true
          echo "=== supervisor ==="
          tail -160 "$ROOT/ServiceLogs/supervisor.log" 2>/dev/null || true
          "$DEV/.venv/bin/python" - "$ROOT" <<'PY'
          import json
          import sqlite3
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          market=root/"Development/runtime/market_tape/market_tape.sqlite3"
          stream=root/"Development/runtime/stream/intelligence_stream.sqlite3"
          with sqlite3.connect(market) as c:
              derivative=c.execute("SELECT COUNT(*),MIN(event_at_ms),MAX(event_at_ms),MAX(ingested_at_ms) FROM market_tape_derivatives").fetchone()
          with sqlite3.connect(stream) as c:
              boundaries=c.execute("SELECT projector_id,activated_at_ms FROM stream_family_projection_boundaries ORDER BY projector_id").fetchall()
              rows=c.execute("SELECT subtype,COUNT(*),MIN(event_at_ms),MAX(event_at_ms) FROM stream_source_events GROUP BY subtype ORDER BY subtype").fetchall()
          print(json.dumps({"derivatives":derivative,"boundaries":boundaries,"source_rows":rows}))
          PY
          echo "F3_DIAGNOSTIC_READ_ONLY=YES REAL_CAPITAL=0"
