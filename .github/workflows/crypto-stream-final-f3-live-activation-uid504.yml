name: Crypto Stream Final F3 Runtime Ordering UID504

on:
  push:
    branches:
      - 'stream/final-f3-live-activation'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f3-runtime-ordering
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2

      - name: Verify exact F3 runtime ordering source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          "$PY" -m pytest -q             tests/test_wc2_live_clock_wiring.py             tests/test_intelligence_stream_family.py             tests/test_wc2_ssd_supervisor_single_owner.py
          "$PY" -m ruff check             ops/run_live_evidence_clock.py             tests/test_wc2_live_clock_wiring.py
          "$PY" -m mypy ops/run_live_evidence_clock.py
          echo "F3_RUNTIME_ORDERING_PASS=YES"
          echo "WC2_POLICY_UNCHANGED=YES"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"
