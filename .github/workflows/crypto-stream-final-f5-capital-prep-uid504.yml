name: Crypto Stream Final F5 Capital Readiness UID504

on:
  push:
    branches:
      - 'stream/final-f5-capital-live-closure'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f5-capital-prep
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and focused tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          test -x "$PY"
          "$PY" -m pytest -q \
            tests/test_stream_f5_capital_readiness_audit.py \
            tests/test_intelligence_stream_capital_forward_runtime.py \
            tests/test_wc2_prepared_live_runtime.py \
            tests/test_wc2_live_clock_wiring.py
          "$PY" -m ruff check \
            ops/audit_stream_f5_capital_readiness.py \
            src/crypto_signal/product/intelligence_stream_capital_forward_runtime.py \
            src/crypto_signal/product/intelligence_stream_capital_forward_evidence.py \
            src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py \
            ops/run_live_evidence_clock.py \
            tests/test_stream_f5_capital_readiness_audit.py \
            tests/test_intelligence_stream_capital_forward_runtime.py \
            tests/test_wc2_prepared_live_runtime.py
          "$PY" -m mypy \
            src/crypto_signal/product/intelligence_stream_capital_forward_runtime.py \
            src/crypto_signal/product/intelligence_stream_capital_forward_evidence.py \
            src/crypto_signal/evaluation/untouched_forward_prepared_runtime.py \
            ops/run_live_evidence_clock.py
          echo "F5_READINESS_TEST_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Snapshot live ledgers without mutation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          OUT="$RUNNER_TEMP/stream-final-f5-prep"
          SNAP="$OUT/db-snapshots"
          mkdir -p "$SNAP"

          test "$(id -u)" = "504"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"

          DEV_BEFORE="$(git -C "$DEV" rev-parse HEAD)"
          PRODUCT_BEFORE="$(git -C "$PRODUCT" rev-parse HEAD)"

          SRC_EPOCH2="$DEV/runtime/paper/paper_fund_epoch2.sqlite3"
          SRC_STREAM="$DEV/runtime/stream/intelligence_stream.sqlite3"
          test -f "$SRC_EPOCH2"
          test -f "$SRC_STREAM"

          SRC_EPOCH2="$SRC_EPOCH2" SRC_STREAM="$SRC_STREAM" SNAP="$SNAP"           /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python - <<'PY'
          from __future__ import annotations
          import hashlib
          import os
          import shutil
          import sqlite3
          import time
          from pathlib import Path

          snap = Path(os.environ["SNAP"])
          sources = {
              "epoch2": Path(os.environ["SRC_EPOCH2"]),
              "stream": Path(os.environ["SRC_STREAM"]),
          }

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def state(path: Path) -> dict[str, str | None]:
              return {
                  suffix: digest(Path(str(path) + suffix))
                  for suffix in ("", "-wal", "-shm")
              }

          for label, source in sources.items():
              raw = snap / f"{label}.raw.sqlite3"
              stable = False
              for _attempt in range(1, 8):
                  before = state(source)
                  for suffix in ("", "-wal", "-shm"):
                      src = Path(str(source) + suffix)
                      dst = Path(str(raw) + suffix)
                      if src.is_file():
                          shutil.copy2(src, dst)
                      elif dst.exists():
                          dst.unlink()
                  after = state(source)
                  if before == after:
                      stable = True
                      break
                  time.sleep(0.05)
              if not stable:
                  raise SystemExit(f"F5_SNAPSHOT_SOURCE_UNSTABLE:{label}")

              final = snap / f"{label}.sqlite3"
              if final.exists():
                  final.unlink()
              with sqlite3.connect(raw) as src, sqlite3.connect(final) as dst:
                  src.backup(dst)
                  quick = dst.execute("PRAGMA quick_check").fetchone()
                  if quick is None or str(quick[0]).lower() != "ok":
                      raise SystemExit(f"F5_SNAPSHOT_QUICK_CHECK_FAIL:{label}")

              for suffix in ("", "-wal", "-shm"):
                  candidate = Path(str(raw) + suffix)
                  if candidate.exists():
                      candidate.unlink()
              print(f"F5_STABLE_SNAPSHOT_PASS={label}")
          PY

          /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python ops/audit_stream_f5_capital_readiness.py             --epoch2 "$SNAP/epoch2.sqlite3"             --stream "$SNAP/stream.sqlite3"             --output "$OUT/capital-readiness.json"             | tee "$OUT/capital-readiness.log"

          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$DEV_BEFORE"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_BEFORE"

          {
            echo "DEV_HEAD=$DEV_BEFORE"
            echo "PRODUCT_HEAD=$PRODUCT_BEFORE"
            echo "F5_READINESS_NON_MUTATING_PASS=YES"
            echo "HISTORICAL_BACKFILL=NO"
            echo "REAL_CAPITAL=0"
          } | tee "$OUT/checkouts.txt"

      - name: Upload F5 prep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f5-capital-prep-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-final-f5-prep
          if-no-files-found: error
          retention-days: 14
