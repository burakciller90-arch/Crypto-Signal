name: Crypto Market Tape Capacity Probe

on:
  push:
    branches:
      - v1.1-liquidity-dynamics-v1
    paths:
      - ".github/workflows/crypto-market-tape-capacity-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Read-only Market Tape capacity probe
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Probe as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set -euo pipefail
          DIR="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/market_tape"
          DB="$DIR/market_tape.sqlite3"
          RAW="$DIR/raw_market_tape.sqlite3"

          echo "=== RAW WINDOW ==="
          sqlite3 "$RAW" "SELECT COUNT(*), MIN(event_at_ms), MAX(event_at_ms), MIN(ingested_at_ms), MAX(ingested_at_ms) FROM raw_market_events;"
          echo "=== NORMALIZED WINDOW ==="
          sqlite3 "$DB" "SELECT COUNT(*), MIN(event_at_ms), MAX(event_at_ms) FROM market_tape_orderbooks;"
          sqlite3 "$DB" "SELECT COUNT(*), MIN(event_at_ms), MAX(event_at_ms) FROM market_tape_trades;"
          echo "=== FILE BYTES ==="
          stat -f '%N %z' "$DB" "$RAW"
          echo "=== DISK ==="
          df -k /Volumes/Crypto-504
          echo "MARKET_TAPE_CAPACITY_PROBE_PASS=YES"
          SH
