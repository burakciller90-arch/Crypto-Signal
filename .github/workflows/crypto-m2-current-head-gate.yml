name: Crypto M2 Current Head Gate

on:
  push:
    branches:
      - m2-liquidity-current-head-gate-temp
    paths:
      - ".github/workflows/crypto-m2-current-head-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    name: M2 current-head full regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d179563b7d96a180b5cc7186ed1b3f8a6d48757
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.1" "ruff>=0.13" "mypy>=1.18"
      - name: Full regression
        run: |
          python -m pytest -q tests/test_liquidity_dynamics_engine.py
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_CURRENT_HEAD_FULL_GATE_PASS=YES"
          echo "M2_EXACT_HEAD=1d179563b7d96a180b5cc7186ed1b3f8a6d48757"
