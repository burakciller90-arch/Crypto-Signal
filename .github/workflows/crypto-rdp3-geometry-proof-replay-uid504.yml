name: RDP3 Geometry Proof Replay UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/ledger/store.py"
      - "src/crypto_signal/ledger/geometry_proof.py"
      - "tests/test_rdp3_geometry_proof_ledger.py"
      - ".github/workflows/crypto-rdp3-geometry-proof-replay-uid504.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test -d "$WB/.git"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP3_B_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP3_B_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused immutable Geometry Proof replay acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp3_geometry_proof_ledger.py \
            tests/test_rdp3_frozen_geometry_proof.py \
            tests/test_immutable_ledger.py \
            tests/test_live_freeze_clock.py
          "$PY" -m ruff check \
            src/crypto_signal/ledger/store.py \
            tests/test_rdp3_geometry_proof_ledger.py
          "$PY" -m mypy \
            src/crypto_signal/ledger/store.py \
            src/crypto_signal/ledger/geometry_proof.py
          "$PY" -m py_compile \
            src/crypto_signal/ledger/store.py \
            src/crypto_signal/ledger/geometry_proof.py
          echo "RDP3_B_IMMUTABLE_GEOMETRY_REPLAY_PASS=YES"
          echo "REAL_CAPITAL=0"
