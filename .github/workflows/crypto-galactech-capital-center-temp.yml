name: Crypto GALACTECH Capital Center TEMP

on:
  push:
    branches: [v1.1-galactech-capital-center-v1]
    paths:
      - ".github/workflows/crypto-galactech-capital-center-temp.yml"
      - "src/crypto_signal/product/**"
      - "tests/test_dashboard_web.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Capital Center focused gate
        run: |
          python -m pytest -q tests/test_dashboard_web.py tests/test_paper_epochs.py tests/test_r14_release_package.py
          python -m ruff check src/crypto_signal/product tests/test_dashboard_web.py
          python -m mypy src/crypto_signal/product
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "GALACTECH_CAPITAL_CENTER_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "GALACTECH_CAPITAL_CENTER_FULL_PASS=YES"
