name: Install Approved KIOXIA Provision Script

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-approved-kioxia-provision-script.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 5
    steps:
      - name: Install one-time approved provisioning script
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "501"
          SCRIPT="/Users/burakciller/KIOXIA_PROVISION_APPROVED.sh"
          cat > "$SCRIPT" <<'ZSH'
          #!/bin/zsh
          set -euo pipefail

          if [ "$(id -u)" -ne 0 ]; then
            echo "ERROR: run with sudo: sudo /bin/zsh /Users/burakciller/KIOXIA_PROVISION_APPROVED.sh"
            exit 77
          fi

          DISK="/dev/disk4"
          PART="/dev/disk4s2"
          CURRENT="/Volumes/KIOXIA"
          LOG="/Users/burakciller/KIOXIA_PROVISION_APPROVED.log"

          exec > >(tee -a "$LOG") 2>&1
          echo "=== KIOXIA PROVISION START $(date '+%Y-%m-%d %H:%M:%S %z') ==="

          field() {
            local key="$1"
            local dev="$2"
            /usr/sbin/diskutil info "$dev" | /usr/bin/awk -F: -v k="$key" '
              $1 ~ "^[[:space:]]*" k "[[:space:]]*$" {
                sub(/^[^:]*:[[:space:]]*/, "", $0)
                gsub(/[[:space:]]+$/, "", $0)
                print $0
                exit
              }'
          }

          echo "=== PRECHECK WHOLE DISK ==="
          DEVICE_ID="$(field "Device Identifier" "$DISK")"
          WHOLE="$(field "Whole" "$DISK")"
          MEDIA_NAME="$(field "Device / Media Name" "$DISK")"
          PROTOCOL="$(field "Protocol" "$DISK")"
          LOCATION="$(field "Device Location" "$DISK")"
          SIZE_LINE="$(field "Disk Size" "$DISK")"
          echo "DEVICE_ID=$DEVICE_ID"
          echo "WHOLE=$WHOLE"
          echo "MEDIA_NAME=$MEDIA_NAME"
          echo "PROTOCOL=$PROTOCOL"
          echo "LOCATION=$LOCATION"
          echo "SIZE_LINE=$SIZE_LINE"

          test "$DEVICE_ID" = "disk4"
          test "$WHOLE" = "Yes"
          test "$MEDIA_NAME" = "EXCERIA PLUS G2"
          test "$PROTOCOL" = "USB"
          test "$LOCATION" = "External"
          printf '%s\n' "$SIZE_LINE" | /usr/bin/grep -Eq '^1\.0 TB \(1000204886016 Bytes\)'

          echo "=== PRECHECK EXISTING PARTITION ==="
          PART_ID="$(field "Device Identifier" "$PART")"
          PART_WHOLE="$(field "Part of Whole" "$PART")"
          VOL_NAME="$(field "Volume Name" "$PART")"
          MOUNT_POINT="$(field "Mount Point" "$PART")"
          FS_PERSONALITY="$(field "File System Personality" "$PART")"
          echo "PART_ID=$PART_ID"
          echo "PART_WHOLE=$PART_WHOLE"
          echo "VOL_NAME=$VOL_NAME"
          echo "MOUNT_POINT=$MOUNT_POINT"
          echo "FS_PERSONALITY=$FS_PERSONALITY"

          test "$PART_ID" = "disk4s2"
          test "$PART_WHOLE" = "disk4"
          test "$VOL_NAME" = "KIOXIA"
          test "$MOUNT_POINT" = "$CURRENT"
          test "$FS_PERSONALITY" = "ExFAT"
          test -d "$CURRENT"

          echo "=== PRECHECK CONTENT ==="
          ROOT_ITEMS="$(/usr/bin/find "$CURRENT" -mindepth 1 -maxdepth 1 -print | /usr/bin/sort)"
          printf '%s\n' "$ROOT_ITEMS"
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            b="$(basename "$p")"
            case "$b" in
              .Spotlight-V100|.fseventsd) ;;
              *)
                echo "ABORT: unexpected user content found: $p"
                exit 70
                ;;
            esac
          done <<< "$ROOT_ITEMS"

          echo "=== VERIFY LOCAL PROJECT ACCOUNTS ==="
          user_for_uid() {
            /usr/bin/dscl . -search /Users UniqueID "$1" | /usr/bin/awk 'NR==1{print $1}'
          }
          U501="$(user_for_uid 501)"
          U502="$(user_for_uid 502)"
          U503="$(user_for_uid 503)"
          U504="$(user_for_uid 504)"
          echo "UID501_USER=$U501"
          echo "UID502_USER=$U502"
          echo "UID503_USER=$U503"
          echo "UID504_USER=$U504"
          test -n "$U501"
          test -n "$U502"
          test -n "$U503"
          test -n "$U504"

          G501="$(id -g "$U501")"
          G502="$(id -g "$U502")"
          G503="$(id -g "$U503")"
          G504="$(id -g "$U504")"

          echo "DESTRUCTIVE_TARGET_CONFIRMED=YES"
          echo "DESTRUCTIVE_USER_APPROVAL=YES"
          /bin/sync

          echo "=== ERASE /dev/disk4 AS APFS/GPT ==="
          /usr/sbin/diskutil eraseDisk APFS "Admin-501" GPT "$DISK"

          echo "=== DISCOVER APFS CONTAINER ==="
          CONTAINER="$(/usr/sbin/diskutil apfs list | /usr/bin/awk '
            /APFS Container Reference:/ {
              c=$0
              sub(/^.*APFS Container Reference:[[:space:]]*/, "", c)
              sub(/[[:space:]].*$/, "", c)
            }
            /Physical Store disk4s2/ {
              print c
              exit
            }')"
          test -n "$CONTAINER"
          echo "APFS_CONTAINER=$CONTAINER"

          echo "=== CREATE PROJECT VOLUMES ==="
          /usr/sbin/diskutil apfs addVolume "$CONTAINER" APFS "Durdurulmaz-502"
          /usr/sbin/diskutil apfs addVolume "$CONTAINER" APFS "Quantum-503"
          /usr/sbin/diskutil apfs addVolume "$CONTAINER" APFS "Crypto-504"

          echo "=== ENABLE OWNERSHIP + ISOLATE ROOTS ==="
          for v in Admin-501 Durdurulmaz-502 Quantum-503 Crypto-504; do
            /usr/sbin/diskutil enableOwnership "/Volumes/$v" || true
          done

          /usr/sbin/chown "$U501:$G501" "/Volumes/Admin-501"
          /usr/sbin/chown "$U502:$G502" "/Volumes/Durdurulmaz-502"
          /usr/sbin/chown "$U503:$G503" "/Volumes/Quantum-503"
          /usr/sbin/chown "$U504:$G504" "/Volumes/Crypto-504"

          /bin/chmod 700 "/Volumes/Admin-501"
          /bin/chmod 700 "/Volumes/Durdurulmaz-502"
          /bin/chmod 700 "/Volumes/Quantum-503"
          /bin/chmod 700 "/Volumes/Crypto-504"

          echo "=== FINAL VERIFY ==="
          for v in Admin-501 Durdurulmaz-502 Quantum-503 Crypto-504; do
            test -d "/Volumes/$v"
            /usr/bin/stat -f '%N uid=%u gid=%g mode=%Sp' "/Volumes/$v"
            /usr/sbin/diskutil info "/Volumes/$v" | /usr/bin/grep -E 'Device Identifier|Volume Name|Mount Point|File System Personality|Disk Size|Volume Free Space'
          done

          /usr/sbin/diskutil list "$DISK"
          /usr/sbin/diskutil apfs list "$CONTAINER"

          echo "KIOXIA_SHARED_APFS_PROVISION_PASS=YES"
          echo "=== KIOXIA PROVISION END $(date '+%Y-%m-%d %H:%M:%S %z') ==="
          ZSH
          chmod 700 "$SCRIPT"
          /bin/zsh -n "$SCRIPT"
          echo "SCRIPT=$SCRIPT"
          /usr/bin/shasum -a 256 "$SCRIPT"
          echo "KIOXIA_PROVISION_SCRIPT_INSTALL_PASS=YES"
