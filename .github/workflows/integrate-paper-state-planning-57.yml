name: Integrate Paper State Planning 57

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  integrate:
    if: github.actor == 'burakciller90-arch' && github.event.issue.title == '[CURSOR-INTEGRATE] PAPER57'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    steps:
      - name: Integrate reviewed Stage 6C state and planning foundation
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="/Users/crypto-signal-agent/Crypto-Signal"
          WT="$HOME/.cursor/worktrees/crypto-signal/supervisor-57"
          FILES=(
            "src/crypto_signal/paper/state.py"
            "src/crypto_signal/paper/planning.py"
            "tests/test_paper_state.py"
            "tests/test_paper_planning.py"
          )

          test -d "$WT"
          EXPECTED="$(printf '?? src/crypto_signal/paper/planning.py\n?? src/crypto_signal/paper/state.py\n?? tests/test_paper_planning.py\n?? tests/test_paper_state.py\n' | LC_ALL=C sort)"
          ACTUAL="$(git -C "$WT" status --porcelain | LC_ALL=C sort)"
          echo "=== REVIEWED WORKTREE SCOPE ==="
          printf '%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          for path in "${FILES[@]}"; do
            test -f "$WT/$path"
            test ! -L "$WT/$path"
          done

          echo "=== CANONICAL PRECONDITION ==="
          test -z "$(git -C "$REPO" status --porcelain)"
          BASIC="$(printf 'x-access-token:%s' "$GH_JOB_TOKEN" | base64)"
          git -C "$REPO" -c http.extraheader="AUTHORIZATION: Basic $BASIC" fetch --no-tags origin main
          git -C "$REPO" merge --ff-only FETCH_HEAD

          for path in "${FILES[@]}"; do
            test ! -e "$REPO/$path"
          done
          cp "$WT/src/crypto_signal/paper/state.py" "$REPO/src/crypto_signal/paper/state.py"
          cp "$WT/src/crypto_signal/paper/planning.py" "$REPO/src/crypto_signal/paper/planning.py"
          cp "$WT/tests/test_paper_state.py" "$REPO/tests/test_paper_state.py"
          cp "$WT/tests/test_paper_planning.py" "$REPO/tests/test_paper_planning.py"

          echo "=== FOCUSED VALIDATION ==="
          cd "$REPO"
          PYTHONPATH=src ./.venv/bin/python -m pytest -q tests/test_paper_state.py tests/test_paper_planning.py
          ./.venv/bin/python -m ruff check src/crypto_signal/paper/state.py src/crypto_signal/paper/planning.py tests/test_paper_state.py tests/test_paper_planning.py
          PYTHONPATH=src ./.venv/bin/python -m mypy src/crypto_signal/paper/state.py src/crypto_signal/paper/planning.py

          echo "=== EXACT CANONICAL DIFF ==="
          ACTUAL="$(git status --porcelain | LC_ALL=C sort)"
          printf '%s\n' "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          git add -- "${FILES[@]}"
          git -c user.name="Crypto Signal Supervisor" -c user.email="supervisor@local.invalid"             commit -m "feat(paper): add deterministic state and conservative planning"
          git -c http.extraheader="AUTHORIZATION: Basic $BASIC" push origin HEAD:main
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)"
