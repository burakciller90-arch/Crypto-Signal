name: Crypto R19 Probability Calibration Gate Slice1 Acceptance (Temporary)

on:
  push:
    branches:
      - v1.1-r19-probability-calibration-gate-v1-slice1
    paths:
      - "research/alpha_factory/probability_calibration_gate.py"
      - "tests/test_alpha_factory_probability_calibration_gate.py"
      - "docs/R19_PROBABILITY_CALIBRATION_GATE_SLICE1.md"
      - ".github/workflows/crypto-r19-probability-calibration-slice1-acceptance.yml"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact hosted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: R19 focused acceptance
        run: |
          python -m pytest -q tests/test_alpha_factory_probability_calibration_gate.py tests/test_confluence_threshold_research.py
          python -m ruff check research/alpha_factory/probability_calibration_gate.py tests/test_alpha_factory_probability_calibration_gate.py
          python -m mypy research/alpha_factory/probability_calibration_gate.py
          echo "R19_PROBABILITY_CALIBRATION_SLICE1_FOCUSED_PASS=YES"
      - name: Full repository acceptance
        run: |
          python -m pytest -q
          python -m ruff check src tests research ops/verify_stage10_integrated.py
          python -m mypy src research ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R19_PROBABILITY_CALIBRATION_SLICE1_FULL_PASS=YES"
