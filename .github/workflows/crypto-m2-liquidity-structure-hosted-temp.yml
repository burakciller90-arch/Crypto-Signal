name: Crypto M2 Liquidity Structure Hosted TEMP

on:
  push:
    branches: [v1.1-liquidity-intelligence-v2]
    paths:
      - ".github/workflows/crypto-m2-liquidity-structure-hosted-temp.yml"
      - "src/crypto_signal/intelligence/liquidity_dynamics.py"
      - "src/crypto_signal/intelligence/liquidity_structure.py"
      - "tests/test_liquidity_dynamics_engine.py"
      - "tests/test_liquidity_structure_engine.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18" "pyarrow==22.0.0"
      - name: M2 focused gate
        run: |
          python -m pytest -q tests/test_liquidity_dynamics_engine.py tests/test_liquidity_structure_engine.py
          python -m ruff check src/crypto_signal/intelligence/liquidity_dynamics.py src/crypto_signal/intelligence/liquidity_structure.py tests/test_liquidity_dynamics_engine.py tests/test_liquidity_structure_engine.py
          python -m mypy src/crypto_signal/intelligence/liquidity_dynamics.py src/crypto_signal/intelligence/liquidity_structure.py
          echo "M2_LIQUIDITY_STRUCTURE_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests
          python -m mypy src
          echo "M2_LIQUIDITY_STRUCTURE_FULL_PASS=YES"
