name: World-Class WC0 Dashboard Restart Handoff Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-command.yml"
      - ".github/workflows/world-class-wc0-dashboard-restart-handoff-hosted.yml"
      - "tests/test_wc0_runtime_wiring.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc0-dashboard-restart-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC0 restart handoff acceptance
        run: |
          python -m pytest -q tests/test_wc0_runtime_wiring.py tests/test_wc0_production_import_isolation.py
          python -m ruff check tests/test_wc0_runtime_wiring.py tests/test_wc0_production_import_isolation.py
          echo "WC0_DASHBOARD_RESTART_HANDOFF_FOCUSED_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC0_DASHBOARD_RESTART_HANDOFF_FULL_PASS=YES"
          echo "WC0_REAL_CAPITAL_ZERO_PASS=YES"
