name: Crypto Stream Final F4 Live Activation UID504

on:
  push:
    branches:
      - 'stream/final-f4-live-activation'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f4-live-activation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2

      - name: Headless reload canonical supervisor
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          EXPECTED_MAIN="3ec48a3728b919e3783546e57eab7afebab1d18d"
          test "$(id -u)" = "504"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$DEV" status --porcelain)"

          old_sup="$(cat "$ROOT/ssd-service-supervisor.pid" 2>/dev/null || true)"
          test -n "$old_sup"
          kill -0 "$old_sup"
          ps -p "$old_sup" -o command= | grep -F "$ROOT/ssd-service-supervisor.sh" >/dev/null

          cp "$GITHUB_WORKSPACE/ops/ssd_runtime_supervisor.sh"             "$ROOT/ssd-service-supervisor.sh"
          chmod 700 "$ROOT/ssd-service-supervisor.sh"

          kill -TERM "$old_sup"
          stopped=0
          for _ in {1..20}; do
            if ! kill -0 "$old_sup" >/dev/null 2>&1; then
              stopped=1
              break
            fi
            sleep 1
          done
          test "$stopped" = "1"
          rm -f "$ROOT/ssd-service-supervisor.pid"

          CRYPTO_SIGNAL_ROOT="$ROOT"             bash "$GITHUB_WORKSPACE/ops/r11/start_ssd_runtime.command"

          new_sup="$(cat "$ROOT/ssd-service-supervisor.pid")"
          test -n "$new_sup"
          test "$new_sup" != "$old_sup"
          kill -0 "$new_sup"
          ps -p "$new_sup" -o command= | grep -F "$ROOT/ssd-service-supervisor.sh" >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health             | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok"; assert d["real_capital"]==0; assert d["read_only"] is True'
          echo "F4_HEADLESS_SUPERVISOR_RELOAD_PASS=YES old=$old_sup new=$new_sup"
          echo "REAL_CAPITAL=0"

      - name: Verify physical F4 trust activation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          EXPECTED_MAIN="3ec48a3728b919e3783546e57eab7afebab1d18d"
          test "$(id -u)" = "504"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$DEV" status --porcelain)"

          sup="$(cat "$ROOT/ssd-service-supervisor.pid")"
          test -n "$sup"
          kill -0 "$sup"
          ps -p "$sup" -o command= | grep -F "$ROOT/ssd-service-supervisor.sh" >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health             | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok"; assert d["real_capital"]==0; assert d["read_only"] is True'

          PY="$DEV/.venv/bin/python"
          export PYTHONPATH="$DEV/src"
          "$PY" - "$ROOT" <<'PY'
          import json
          import sqlite3
          import sys
          import time
          from pathlib import Path

          root = Path(sys.argv[1])
          event_db = root / "Development/runtime/events/event_source.sqlite3"
          divergence_db = root / "Development/runtime/data/provider_divergence.sqlite3"
          stream_db = root / "Development/runtime/stream/intelligence_stream.sqlite3"
          live_log = root / "ServiceLogs/live.out.log"
          required = {"event_risk_change", "provider_quality_change"}

          def state():
              with sqlite3.connect(
                  f"{event_db.resolve().as_uri()}?mode=ro",
                  uri=True,
              ) as c:
                  c.execute("PRAGMA query_only=ON")
                  event_quick = c.execute("PRAGMA quick_check").fetchone()[0]
                  coverage_count = c.execute(
                      "SELECT COUNT(*) FROM event_calendar_coverages"
                  ).fetchone()[0]
                  event_count = c.execute(
                      "SELECT COUNT(*) FROM structured_event_observations"
                  ).fetchone()[0]

              with sqlite3.connect(
                  f"{divergence_db.resolve().as_uri()}?mode=ro",
                  uri=True,
              ) as c:
                  c.execute("PRAGMA query_only=ON")
                  divergence_quick = c.execute("PRAGMA quick_check").fetchone()[0]
                  divergence_count = c.execute(
                      "SELECT COUNT(*) FROM provider_divergence_snapshots"
                  ).fetchone()[0]

              with sqlite3.connect(
                  f"{stream_db.resolve().as_uri()}?mode=ro",
                  uri=True,
              ) as c:
                  c.execute("PRAGMA query_only=ON")
                  stream_quick = c.execute("PRAGMA quick_check").fetchone()[0]
                  real_capital = c.execute(
                      "SELECT value FROM stream_meta WHERE key='real_capital'"
                  ).fetchone()
                  boundaries = {
                      str(row[0]): int(row[1])
                      for row in c.execute(
                          """
                          SELECT projector_id, activated_at_ms
                          FROM stream_family_projection_boundaries
                          WHERE projector_id IN (
                              'event_risk_change',
                              'provider_quality_change'
                          )
                          """
                      ).fetchall()
                  }
                  trust_events = [
                      tuple(row)
                      for row in c.execute(
                          """
                          SELECT subtype, COUNT(*), MIN(event_at_ms), MAX(event_at_ms)
                          FROM stream_source_events
                          WHERE subtype IN (
                              'event_risk_block',
                              'event_risk_change',
                              'event_risk_recovery',
                              'data_quality_degraded',
                              'data_quality_recovered'
                          )
                          GROUP BY subtype
                          ORDER BY subtype
                          """
                      ).fetchall()
                  ]
              log = live_log.read_text(errors="replace") if live_log.exists() else ""
              return {
                  "event_quick": event_quick,
                  "coverage_count": int(coverage_count),
                  "structured_event_count": int(event_count),
                  "divergence_quick": divergence_quick,
                  "divergence_count": int(divergence_count),
                  "stream_quick": stream_quick,
                  "real_capital": None if real_capital is None else str(real_capital[0]),
                  "boundaries": boundaries,
                  "trust_events": trust_events,
                  "summary_marker": "stream_trust status=SUMMARY" in log,
                  "provider_marker": "projector=provider_quality_change" in log,
                  "event_marker": "projector=event_risk_change" in log,
                  "no_backfill_marker": "HISTORICAL_BACKFILL=NO REAL_CAPITAL=0" in log,
              }

          deadline = time.time() + 360
          last = None
          while time.time() < deadline:
              last = state()
              if (
                  last["event_quick"] == "ok"
                  and last["divergence_quick"] == "ok"
                  and last["stream_quick"] == "ok"
                  and last["real_capital"] == "0"
                  and last["coverage_count"] > 0
                  and last["divergence_count"] > 0
                  and required.issubset(last["boundaries"])
                  and last["summary_marker"]
                  and last["provider_marker"]
                  and last["event_marker"]
                  and last["no_backfill_marker"]
              ):
                  print(json.dumps(last, sort_keys=True))
                  print("F4_LIVE_ACTIVATION_PASS=YES")
                  print("ROUTINE_INITIAL_TRUST_BASELINE_SPAM=NO")
                  print("HISTORICAL_BACKFILL=NO")
                  print("REAL_CAPITAL=0")
                  raise SystemExit(0)
              time.sleep(10)

          print(json.dumps(last, sort_keys=True), file=sys.stderr)
          raise SystemExit("F4_LIVE_ACTIVATION_TIMEOUT")
          PY
