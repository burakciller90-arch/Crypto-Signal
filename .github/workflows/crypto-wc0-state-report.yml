name: Crypto WC0 UID504 State Report

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[WC0 REPORT] ')
    name: UID504 Read-Only WC0 State Report
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 10
    env:
      ROOT: /Volumes/Crypto-504/Crypto-Signal
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect read-only WC0 state
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/wc0-state-report.txt"
          ROOT="$ROOT"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          {
            echo "=== IDENTITY ==="
            id
            echo "=== DEVELOPMENT ==="
            git -C "$DEV" status --short --branch 2>&1
            echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null)"
            echo "=== PRODUCT ==="
            git -C "$PRODUCT" status --short --branch 2>&1
            echo "PRODUCT_HEAD=$(git -C "$PRODUCT" rev-parse HEAD 2>/dev/null)"
            echo "=== SUPERVISOR ==="
            sup="$(cat "$ROOT/ssd-service-supervisor.pid" 2>/dev/null || true)"
            dash="$(cat "$ROOT/dashboard.pid" 2>/dev/null || true)"
            echo "SUPERVISOR_PID=$sup"
            echo "DASHBOARD_PID=$dash"
            [ -n "$sup" ] && ps -p "$sup" -o pid=,ppid=,user=,etime=,command= 2>&1
            [ -n "$dash" ] && ps -p "$dash" -o pid=,ppid=,user=,etime=,command= 2>&1
            echo "=== PORT 48700 ==="
            /usr/sbin/lsof -nP -iTCP:48700 -sTCP:LISTEN 2>&1
            echo "=== HEALTH ==="
            curl -fsS --max-time 5 http://127.0.0.1:48700/api/health 2>&1
            echo
            echo "=== ROUTES ==="
            for route in / /galactech /legacy /api/r25/operational-truth; do
              code="$(curl -sS -o "$RUNNER_TEMP/wc0-route.out" -w '%{http_code}' --max-time 5 "http://127.0.0.1:48700$route" 2>/dev/null || true)"
              echo "$route HTTP=$code"
            done
            echo "=== PRODUCT IMPORT ==="
            PYTHONPATH="$PRODUCT/src" "$PRODUCT/.venv/bin/python" - <<'PY'
import crypto_signal.product.web as web
print("WEB_IMPORT=PASS", web.PRODUCT_VERSION)
PY
            echo "=== CONTINUITY ==="
            "$DEV/.venv/bin/python" "$DEV/ops/continuity/continuity_status.py" 2>&1
            echo "=== SAFETY ==="
            echo "REAL_CAPITAL_EXPECTED=0"
            echo "WC0_STATE_REPORT_READONLY=YES"
          } | tee "$OUT"
          exit 0

      - name: Publish state report
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
import json
import os
import urllib.request
from pathlib import Path

out = Path(os.environ["RUNNER_TEMP"]) / "wc0-state-report.txt"
body = out.read_text(errors="replace") if out.exists() else "WC0 state report output missing"
if len(body) > 60000:
    body = body[-60000:]
payload = json.dumps({"body": "## UID504 WC0 read-only state report\n\n```text\n" + body + "\n```"}).encode()
url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments"
req = urllib.request.Request(
    url,
    data=payload,
    headers={
        "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json",
    },
    method="POST",
)
with urllib.request.urlopen(req, timeout=20) as response:
    if response.status not in (200, 201):
        raise SystemExit(f"comment publish failed: {response.status}")
print("WC0_STATE_REPORT_PUBLISHED=YES")
PY
