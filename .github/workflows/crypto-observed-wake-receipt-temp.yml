name: Crypto Observed Wake Receipt TEMP

on:
  push:
    branches: [fix/continuity-observed-receipt-only]
    paths:
      - ".github/workflows/crypto-observed-wake-receipt-temp.yml"
      - "ops/continuity/**"
      - "tests/test_continuity_hardening.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused continuity gate
        run: |
          python -m py_compile             ops/continuity/interval_wake_daemon.py             ops/continuity/recurring_wake.py             ops/continuity/relay_submit.py             ops/continuity/relay_daemon.py
          python -m pytest -q tests/test_continuity_hardening.py
          python -m ruff check --ignore EXE001             ops/continuity/interval_wake_daemon.py             ops/continuity/recurring_wake.py             ops/continuity/relay_submit.py             ops/continuity/relay_daemon.py             tests/test_continuity_hardening.py
          python -m mypy             ops/continuity/interval_wake_daemon.py             ops/continuity/recurring_wake.py             ops/continuity/relay_submit.py             ops/continuity/relay_daemon.py
          echo "OBSERVED_WAKE_RECEIPT_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "OBSERVED_WAKE_RECEIPT_FULL_PASS=YES"
