name: Rebind Crypto Chat Relay

on:
  workflow_dispatch:
    inputs:
      target:
        description: "ChatGPT conversation URL (https://chatgpt.com/c/...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebind:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install dynamic relay and bind requested chat
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          LOCAL="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/continuity/wake"
          case "$TARGET" in
            https://chatgpt.com/c/*) ;;
            *) echo "INVALID_TARGET"; exit 2 ;;
          esac
          test -d "$SHARED"
          mkdir -p "$LOCAL"
          printf '%s\n' "$TARGET" > "$SHARED/current_chat_url"
          printf '%s\n' "$TARGET" > "$LOCAL/current_chat_url"
          printf '%s\n' "$TARGET" > "$LOCAL/expected_chat_url"
          cat ops/continuity/relay_daemon.py > "$SHARED/relay_daemon.py"
          cat ops/continuity/relay_watchdog.sh > "$SHARED/relay_watchdog.sh"
          echo "SHARED_DAEMON_SHA=$(shasum -a 256 "$SHARED/relay_daemon.py" | awk '{print $1}')"
          echo "SHARED_WATCHDOG_SHA=$(shasum -a 256 "$SHARED/relay_watchdog.sh" | awk '{print $1}')"
          touch "$SHARED/restart_requested"
          echo "BINDING_WRITTEN=$TARGET"
          echo "RESTART_REQUESTED=YES"

      - name: Reload UID504 continuity policy
        shell: bash
        run: |
          set +e
          UID_NOW="$(id -u)"
          LABEL="com.cryptosignal.continuitybridge"
          launchctl kickstart -k "gui/$UID_NOW/$LABEL" >/dev/null 2>&1 || true
          sleep 2
          launchctl print "gui/$UID_NOW/$LABEL" 2>&1 | egrep 'state =|pid =|last exit code =' | head -30 || true
          echo "CONTINUITY_BRIDGE_RELOAD_ATTEMPTED=YES"

      - name: Verify binding files
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          LOCAL="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/continuity/wake"
          test "$(cat "$SHARED/current_chat_url")" = "$TARGET"
          test "$(cat "$LOCAL/current_chat_url")" = "$TARGET"
          test "$(cat "$LOCAL/expected_chat_url")" = "$TARGET"
          echo "RELAY_BINDING_FILES_PASS=YES"
