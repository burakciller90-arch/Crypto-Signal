name: RDP2 Source Contract Focused UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/data/source_contract.py"
      - "tests/test_rdp2_source_contract.py"
      - ".github/workflows/crypto-rdp2-source-contract-focused-uid504.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact Workbench baseline and PR source
        shell: bash
        run: |
          set -euo pipefail
          WB="/Volumes/Crypto-504/Crypto-Signal-Workbench/repo"
          test "$(id -u)" = "504"
          test -d "$WB/.git"
          test "$(git -C "$WB" branch --show-current)" = "main"
          test -z "$(git -C "$WB" status --porcelain)"
          test "$(git -C "$WB" rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "RDP2_WORKBENCH_BASELINE_PASS=YES"
          echo "RDP2_EXACT_PR_SOURCE_PASS=YES"

      - name: Focused source-contract acceptance
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" -m pytest -q \
            tests/test_rdp2_source_contract.py \
            tests/test_raw_market_tape.py \
            tests/test_market_data_gap_ledger.py \
            tests/test_market_tape_store.py \
            tests/test_data_health.py
          "$PY" -m ruff check \
            src/crypto_signal/data/source_contract.py \
            tests/test_rdp2_source_contract.py
          "$PY" -m mypy src/crypto_signal/data/source_contract.py
          echo "RDP2_SOURCE_CONTRACT_FOCUSED_PASS=YES"
          echo "REAL_CAPITAL=0"
