name: World-Class WC2 Same-Cycle Paper Hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_paper.py"
      - "tests/test_wc2_same_cycle_paper.py"
      - ".github/workflows/world-class-wc2-same-cycle-paper-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc2-same-cycle-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
      - name: Focused WC2 same-cycle paper acceptance
        run: |
          python -m pytest -q             tests/test_wc2_same_cycle_paper.py             tests/test_shadow_cycle_runtime.py             tests/test_shadow_replay_orchestrator.py             tests/test_wc2_untouched_forward_journal.py             tests/test_r22_intent_preview.py             tests/test_position_sizing_bridge.py
          python -m ruff check             src/crypto_signal/evaluation/untouched_forward_paper.py             tests/test_wc2_same_cycle_paper.py
          python -m mypy             src/crypto_signal/evaluation/untouched_forward_paper.py
          echo "WC2_EVERY_FORECAST_PAPER_INTENT_PASS=YES"
          echo "WC2_HOLD_CASH_NO_FAKE_FILL_PASS=YES"
          echo "WC2_PAPER_EXACT_REPLAY_PASS=YES"
          echo "WC2_CANONICAL_EPOCH2_MUTATION=NO"
          echo "WC2_REAL_CAPITAL_ZERO_PASS=YES"
      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_SAME_CYCLE_PAPER_FULL_PASS=YES"
