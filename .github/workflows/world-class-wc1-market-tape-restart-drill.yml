name: World-Class WC1 Market Tape Restart Drill

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/wc1_market_tape_restart_acceptance.py"
      - "ops/run_market_tape_stream.py"
      - "src/crypto_signal/data/market_tape_wire_collection.py"
      - "tests/test_market_tape_wire_collection.py"
      - ".github/workflows/world-class-wc1-market-tape-restart-drill.yml"
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: wc1-market-tape-restart-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and immutable Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC1_RESTART_DRILL_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc1-restart-drill-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused safety acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m py_compile ops/wc1_market_tape_restart_acceptance.py ops/run_market_tape_stream.py
          "$TEST_PY" -m pytest -q tests/test_market_tape_wire_collection.py tests/test_market_tape_collector_runtime.py
          "$TEST_PY" -m ruff check ops/wc1_market_tape_restart_acceptance.py ops/run_market_tape_stream.py src/crypto_signal/data/market_tape_wire_collection.py tests/test_market_tape_wire_collection.py
          "$TEST_PY" -m mypy ops/wc1_market_tape_restart_acceptance.py ops/run_market_tape_stream.py src/crypto_signal/data/market_tape_wire_collection.py
          "$TEST_PY" ops/wc1_market_tape_restart_acceptance.py --help >/dev/null
          ! grep -E 'place_order|submit_order|api_secret|api_key|leverage|martingale' ops/wc1_market_tape_restart_acceptance.py
          grep -F 'REAL_CAPITAL=0' ops/wc1_market_tape_restart_acceptance.py >/dev/null
          echo "WC1_RESTART_DRILL_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC1_RESTART_DRILL_FULL_PASS=YES"

      - name: Prove Development remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC1_RESTART_DRILL_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"

  live-restart-drill:
    if: >
      github.event_name == 'issues' &&
      github.actor == 'burakciller90-arch' &&
      github.event.issue.title == '[WC1] MARKET TAPE RESTART ACCEPTANCE'
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact default-branch runtime source
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC1_RESTART_DRILL_RUNTIME_SOURCE_PASS=YES"

      - name: Restart only exact Market Tape lock holder and prove recovery
        shell: bash
        run: |
          set -euo pipefail
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$PY" "$GITHUB_WORKSPACE/ops/wc1_market_tape_restart_acceptance.py" \
            --root /Volumes/Crypto-504/Crypto-Signal \
            --ready-timeout-seconds 420 \
            --restart-timeout-seconds 420 \
            --product-timeout-seconds 180
