name: Crypto R15 Orphan Detector Probe Simple

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-orphan-detector-probe-simple.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: UID504 bridge
        run: |
          sudo -k
          sudo -n -H -u crypto-signal-agent /usr/bin/id
      - name: Exact runner candidates
        run: |
          echo "=== UID504 RunnerService candidates ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep 'crypto-signal-agent' | grep 'RunnerService.js' || true
          echo "=== UID504 runsvc candidates ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep 'crypto-signal-agent' | grep './runsvc.sh' || true
          echo "=== canonical listeners ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep '/Volumes/Crypto-504/Crypto-Signal/Runner/bin/Runner.Listener' || true
          echo "=== canonical workers ==="
          sudo -n -H -u crypto-signal-agent /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep '/Volumes/Crypto-504/Crypto-Signal/Runner/bin/Runner.Worker' || true
      - name: Old orphan cwd and ancestry
        run: |
          for p in 65421 65425; do
            echo "=== PID $p ==="
            sudo -n -H -u crypto-signal-agent /bin/ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= || true
            sudo -n -H -u crypto-signal-agent /usr/sbin/lsof -a -p "$p" -d cwd -Fn 2>&1 || true
          done
      - name: R15 runner service launchd
        run: |
          sudo -n -H -u crypto-signal-agent /bin/launchctl print gui/504/com.cryptosignal.r15-runner-service 2>&1 | head -180 || true
      - name: R15 logs
        run: |
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -180 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log" || true
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -180 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" || true
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/runner-service-launchagent.err.log" || true
          sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "/Volumes/Crypto-504/Crypto-Signal/RunnerLogs/r15-runner-service.err.log" || true
          echo "R15_ORPHAN_DETECTOR_SIMPLE_PROBE_DONE=YES"
