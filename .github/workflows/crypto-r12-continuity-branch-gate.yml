name: Crypto R12 Continuity Branch Gate

on:
  push:
    branches:
      - stage12-continuity-hardening-v1

permissions:
  contents: read

jobs:
  test:
    name: R12 continuity full branch gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "ruff>=0.13" "mypy>=1.18"
      - name: Full branch gate
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          python -m py_compile             ops/continuity/continuity_contracts.py             ops/continuity/relay_submit.py             ops/continuity/relay_daemon.py             ops/continuity/recurring_wake.py             ops/continuity/bridge_watchdog.py             ops/continuity/wake_chatgpt.py             ops/continuity/resume_continuity.py
          bash -n ops/continuity/bootstrap_continuity.command
          zsh -n ops/continuity/continuation_arm.sh
          zsh -n ops/continuity/wake_enqueue.sh
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "R12_CONTINUITY_BRANCH_FULL_GATE_PASS=YES"
