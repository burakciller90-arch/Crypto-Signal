name: WC4 Champion Challenger Cycle UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "research/alpha_factory/**"
      - "tests/test_alpha_factory_*.py"
      - ".github/workflows/wc4-champion-challenger-cycle-uid504.yml"

permissions:
  contents: read

concurrency:
  group: wc4-champion-challenger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: WC4 exact-head research acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and clean Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC4_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc4-champion-challenger-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused WC4 champion challenger acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q \
            tests/test_alpha_factory_champion_challenger_cycle.py \
            tests/test_alpha_factory_ml_promotion_dossier.py \
            tests/test_alpha_factory_ml_family_untouched_forward.py \
            tests/test_alpha_factory_ml_family_robustness_ablation.py \
            tests/test_alpha_factory_ml_family_cost_stress.py \
            tests/test_alpha_factory_ml_walk_forward.py
          "$TEST_PY" -m ruff check \
            research/alpha_factory/champion_challenger_cycle.py \
            tests/test_alpha_factory_champion_challenger_cycle.py
          "$TEST_PY" -m mypy \
            research/alpha_factory/champion_challenger_cycle.py
          echo "WC4_FOCUSED_PASS=YES"

      - name: Full Alpha Factory research regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_alpha_factory_*.py
          "$TEST_PY" -m ruff check research tests/test_alpha_factory_*.py
          "$TEST_PY" -m mypy research
          echo "WC4_ALPHA_FACTORY_REGRESSION_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC4_FULL_REGRESSION_PASS=YES"

      - name: Prove Development remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC4_DEVELOPMENT_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
