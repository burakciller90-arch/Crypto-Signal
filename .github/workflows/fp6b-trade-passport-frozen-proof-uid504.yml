name: FP6-B Trade Passport Frozen Proof UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/product/trade_passport_frozen_proof.py"
      - "tests/test_fp6b_trade_passport_frozen_proof.py"
      - "docs/agent/checkpoints/2026-09-30-fp6b-trade-passport-frozen-proof-start.md"
      - "docs/agent/checkpoints/2026-09-30-fp6b-shared-venv-triage.md"
      - ".github/workflows/fp6b-trade-passport-frozen-proof-uid504.yml"
      - ".github/workflows/wc6-paper-recovery-reconciliation-uid504.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp6b-trade-passport-frozen-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: FP6-B exact-head frozen proof acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and frozen RDP11 boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          TARGET="3d9f33db3f1189571d40566125fbeabd00c04930"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$TARGET"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "FP6B_EXACT_SOURCE_PASS=YES"
          echo "FP6B_RDP11_FROZEN_TARGET_EXACT=YES"
          echo "REAL_CAPITAL=0"

      - name: Create isolated acceptance environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/fp6b-trade-passport-frozen-proof-venv"
          test -x "$BASE_PY"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "FP6B_ISOLATED_ACCEPTANCE_ENV=YES"
          echo "REAL_CAPITAL=0"

      - name: Focused FP6-B frozen-proof tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -vv tests/test_fp6b_trade_passport_frozen_proof.py 2>&1 | tee "$RUNNER_TEMP/fp6b-focused.log"

      - name: Preserve focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp6b-focused-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/fp6b-focused.log
          if-no-files-found: warn
          retention-days: 7

      - name: FP6-A lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_fp6a_trade_passport_lifecycle.py

      - name: S10 frozen visual-proof regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_intelligence_stream_visual_proof.py

      - name: RDP10 exact-evidence regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_intelligence_stream_exact_evidence.py

      - name: Final Product read-model regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_final_product_read_model.py

      - name: R22 and FP3 regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q tests/test_transaction_tape_atomic.py tests/test_autopilot_forward_actions.py

      - name: FP6-B Ruff and mypy
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m ruff check \
            src/crypto_signal/product/trade_passport_frozen_proof.py \
            tests/test_fp6b_trade_passport_frozen_proof.py
          "$TEST_PY" -m mypy src/crypto_signal/product/trade_passport_frozen_proof.py
          "$TEST_PY" -m py_compile src/crypto_signal/product/trade_passport_frozen_proof.py
          echo "FP6B_FOCUSED_STATIC_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Whole repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "FP6B_FULL_REGRESSION_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove frozen runtime remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          TARGET="3d9f33db3f1189571d40566125fbeabd00c04930"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$TARGET"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$TARGET"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "FP6B_DEVELOPMENT_NON_MUTATING_PASS=YES"
          echo "FP6B_PRODUCT_NON_MUTATING_PASS=YES"
          echo "FP6B_RDP11_TARGET_UNCHANGED_PASS=YES"
          echo "CURRENT_DATA_SUBSTITUTION=NO"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"
