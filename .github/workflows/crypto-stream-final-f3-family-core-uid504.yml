name: Crypto Stream Final F3 Family Core UID504

on:
  push:
    branches:
      - 'stream/final-f3-live-intelligence'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f3-family-core
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and family core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          "$PY" -m pytest -q tests/test_intelligence_stream_family.py
          "$PY" -m ruff check             src/crypto_signal/product/intelligence_stream_family.py             src/crypto_signal/product/intelligence_stream_family_sources.py             src/crypto_signal/product/intelligence_stream_policy.py             tests/test_intelligence_stream_family.py
          "$PY" -m mypy             src/crypto_signal/product/intelligence_stream_family.py             src/crypto_signal/product/intelligence_stream_family_sources.py
          echo "F3_FAMILY_CORE_PASS=YES"
          echo "HISTORICAL_BACKFILL=NO"
          echo "REAL_CAPITAL=0"
