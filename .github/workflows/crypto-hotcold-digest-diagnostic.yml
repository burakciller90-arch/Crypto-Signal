name: Crypto HotCold Digest Diagnostic

on:
  push:
    branches:
      - v1.1-market-tape-hotcold-v1
    paths:
      - ".github/workflows/crypto-hotcold-digest-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e .
          python -m pip install pyarrow==22.0.0
      - name: Compare SQLite and Parquet row semantics
        run: |
          python - <<'PY'
          import hashlib
          import sqlite3
          import tempfile
          from pathlib import Path

          from crypto_signal.data.raw_market_tape import RawMarketTapeStore
          from crypto_signal.data.market_tape_cold_archive import (
              _canonical_row_bytes,
              _read_parquet,
              _read_rows,
              _write_parquet,
          )

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              db=root/"raw.sqlite3"
              RawMarketTapeStore(db).initialize()
              identity=hashlib.sha256(b"diag").hexdigest()
              with sqlite3.connect(db) as con:
                  con.execute(
                      """
                      INSERT INTO raw_market_events(
                        event_identity,exchange,channel,symbol,event_kind,
                        source_timestamp_ms,event_at_ms,ingested_at_ms,
                        sequence,update_id,payload_json
                      ) VALUES (?, 'bybit', 'orderbook.50.BTCUSDT',
                        'BTCUSDT','delta',10002,10000,10003,1,1,
                        '{"topic":"orderbook.50.BTCUSDT","type":"delta"}')
                      """,
                      (identity,),
                  )
              columns=(
                "event_identity","exchange","channel","symbol","event_kind",
                "source_timestamp_ms","event_at_ms","ingested_at_ms",
                "sequence","update_id","payload_json",
              )
              source=_read_rows(
                  db=db, table="raw_market_events", columns=columns,
                  start_ms=0, end_ms=20000, identity_column="event_identity",
              )
              path=root/"raw.parquet"
              _write_parquet(path, source)
              restored=_read_parquet(path)
              print("SOURCE_REPR=",repr(source))
              print("RESTORED_REPR=",repr(restored))
              print("SOURCE_BYTES=",_canonical_row_bytes(source[0]))
              print("RESTORED_BYTES=",_canonical_row_bytes(restored[0]))
              print("SOURCE_TYPES=",{k:type(v).__name__ for k,v in source[0].items()})
              print("RESTORED_TYPES=",{k:type(v).__name__ for k,v in restored[0].items()})
              print("EQUAL=",source==restored)
          PY
