name: Crypto HotCold Digest Diagnostic

on:
  push:
    branches:
      - v1.1-market-tape-hotcold-v1
    paths:
      - ".github/workflows/crypto-hotcold-digest-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e .
          python -m pip install pytest pyarrow==22.0.0
      - name: Compare exact failing fixture
        run: |
          python - <<'PY'
          import runpy
          import tempfile
          from pathlib import Path

          from crypto_signal.data.market_tape_cold_archive import (
              _TABLE_SPECS,
              _canonical_rows_sha256,
              _read_parquet,
              _read_partition_rows,
              _write_parquet,
          )

          ns=runpy.run_path("tests/test_market_tape_cold_archive.py")
          insert=ns["_insert_partition"]
          hour=ns["HOUR_MS"]

          with tempfile.TemporaryDirectory() as td:
              hot=Path(td)/"hot"
              hot.mkdir()
              insert(hot,start_ms=10*hour,label="old")
              insert(hot,start_ms=20*hour,label="fresh")
              rows_by_key=_read_partition_rows(
                  normalized_db=hot/"market_tape.sqlite3",
                  raw_db=hot/"raw_market_tape.sqlite3",
                  start_ms=10*hour,
                  end_ms=11*hour,
              )
              for spec in _TABLE_SPECS:
                  rows=rows_by_key[spec.key]
                  print("TABLE",spec.key,"SOURCE",repr(rows))
                  if not rows:
                      continue
                  path=Path(td)/spec.filename
                  _write_parquet(path,rows)
                  restored=_read_parquet(path)
                  print("TABLE",spec.key,"RESTORED",repr(restored))
                  print("SOURCE_DIGEST",spec.key,_canonical_rows_sha256(rows))
                  print("RESTORED_DIGEST",spec.key,_canonical_rows_sha256(restored))
                  print("EQUAL",spec.key,rows==restored)
                  print("SOURCE_TYPES",spec.key,[{k:type(v).__name__ for k,v in row.items()} for row in rows])
                  print("RESTORED_TYPES",spec.key,[{k:type(v).__name__ for k,v in row.items()} for row in restored])
          PY
