name: Crypto R15 Runner Bootstrap Deep Forensics

on:
  push:
    branches: [r15-ssd-hotplug-recovery-v1]
    paths: [".github/workflows/crypto-r15-runner-bootstrap-deep-forensics.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Inspect installed watchdog and runner logs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set +e
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          WATCH="$HOME/Library/Application Support/CryptoSignalRecovery/hotplug-watchdog.sh"
          echo "=== INSTALLED WATCHDOG START_RUNNER ==="
          awk '/^start_runner\(\) \{/{p=1} p{print} /^mount_transition="NO"/{exit}' "$WATCH"
          echo "=== WATCHDOG SHA ==="
          shasum -a 256 "$WATCH"
          echo "=== SOURCE-LIKE RUNNER LOGS ==="
          for f in \
            "$ROOT/RunnerLogs/r15-recovery-runner.out.log" \
            "$ROOT/RunnerLogs/r15-recovery-runner.err.log" \
            "$ROOT/RunnerLogs/terminal-watchdog-runner.out.log" \
            "$ROOT/RunnerLogs/terminal-watchdog-runner.err.log" \
            "$ROOT/RunnerLogs/manual-504-runner.out.log" \
            "$ROOT/RunnerLogs/manual-504-runner.err.log" \
            "$ROOT/RunnerLogs/hotplug-runner.out.log" \
            "$ROOT/RunnerLogs/hotplug-runner.err.log"
          do
            echo "--- $f"
            ls -l "$f" 2>&1
            tail -160 "$f" 2>&1
          done
          echo "=== RUNSVC CONTENT ==="
          sed -n '1,220p' "$ROOT/Runner/runsvc.sh" 2>&1
          echo "=== RUNNER SERVICE SCRIPT ==="
          sed -n '1,220p' "$ROOT/Runner/bin/RunnerService.js" 2>&1
          echo "R15_RUNNER_BOOTSTRAP_DEEP_FORENSICS_DONE=YES"
          SH