name: Crypto R15 Final Live Acceptance

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-final-live-acceptance.yml"

permissions:
  contents: read

jobs:
  accept:
    name: Final live acceptance on UID504
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - name: Identity and listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          pids="$(ps -axo pid=,command= | awk -v expected="$EXPECTED" '{pid=$1; sub(/^[[:space:]]*[0-9]+[[:space:]]+/, "", $0); if ($0 == expected) print pid}')"
          count="$(printf '%s\n' "$pids" | awk 'NF{n++} END{print n+0}')"
          echo "LISTENER_COUNT=$count"
          echo "LISTENER_PID=$pids"
          test "$count" = "1"
          listener="$pids"
          service="$(ps -p "$listener" -o ppid= | tr -d ' ')"
          wrapper="$(ps -p "$service" -o ppid= | tr -d ' ')"
          ps -p "$wrapper","$service","$listener" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
          test "$(ps -p "$service" -o command=)" = "./externals/node20/bin/node ./bin/RunnerService.js"
          test "$(ps -p "$wrapper" -o command=)" = "/bin/bash ./runsvc.sh"

      - name: R15 state and health
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          LOCAL="$HOME/Library/Application Support/CryptoSignalRecovery"
          echo "=== STATE ==="
          cat "$LOCAL/ssd-state"
          test "$(cat "$LOCAL/ssd-state")" = "ready"
          echo "=== HEALTH ==="
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health | tee /tmp/r15-final-health.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-final-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY

      - name: SQLite integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          for db in             "$ROOT/Development/runtime/ledger/live_signal_ledger.sqlite3"             "$ROOT/Development/runtime/data/live_base_15m_cache.sqlite3"             "$ROOT/Development/runtime/paper/paper_fund.sqlite3"             "$ROOT/Development/runtime/alerts/alert_outbox.sqlite3"
          do
            result="$(sqlite3 "$db" 'PRAGMA quick_check;')"
            echo "$db $result"
            test "$result" = "ok"
          done

      - name: Recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          LOG="$HOME/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log"
          echo "=== RECOVERY TAIL ==="
          tail -160 "$LOG"
          grep -F "RUNNER_ORPHAN_PARENT_STOP_PASS=YES" "$LOG"
          grep -F "RUNNER_RESTART_REQUESTED=YES" "$LOG" | tail -1
          grep -F "SSD_HOTPLUG_RECOVERY_PASS=YES" "$LOG" | tail -1
          echo "R15_FINAL_LIVE_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
