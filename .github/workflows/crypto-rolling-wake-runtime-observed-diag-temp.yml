name: Crypto Rolling Wake Runtime Observed DIAG TEMP

on:
  push:
    branches: [diag/rolling-wake-observed-runtime-20260922]
    paths:
      - ".github/workflows/crypto-rolling-wake-runtime-observed-diag-temp.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Read-only rolling wake runtime parity and receipt truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"

          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          INSTALL="$HOME/Library/Application Support/CryptoSignal/continuity20m"
          RUNTIME="$INSTALL/runtime"
          SHARED="/Users/Shared/.crypto-signal-wake-relay"
          LOCAL_STATE="$DEV/runtime/continuity"

          echo "=== EXACT GITHUB BASE ==="
          echo "WORKFLOW_HEAD=$(git rev-parse HEAD)"
          echo "EXPECTED_MAIN=26ea9a9579987eb48eb02cf596cdfe1946ee7010"

          echo "=== DEVELOPMENT CHECKOUT ==="
          git -C "$DEV" status --short --branch || true
          echo "DEVELOPMENT_HEAD=$(git -C "$DEV" rev-parse HEAD 2>/dev/null || true)"

          echo "=== FILE PARITY ==="
          for pair in             "ops/continuity/interval_wake_daemon.py|$INSTALL/interval_wake_daemon.py"             "ops/continuity/recurring_wake.py|$INSTALL/recurring_wake.py"             "ops/continuity/relay_submit.py|$INSTALL/relay_submit.py"             "ops/continuity/relay_daemon.py|$SHARED/relay_daemon.py"
          do
            src="${pair%%|*}"
            dst="${pair#*|}"
            echo "PAIR=$src -> $dst"
            test -f "$src"
            test -f "$dst"
            src_sha="$(shasum -a 256 "$src" | awk '{print $1}')"
            dst_sha="$(shasum -a 256 "$dst" | awk '{print $1}')"
            echo "SOURCE_SHA256=$src_sha"
            echo "INSTALLED_SHA256=$dst_sha"
            if [ "$src_sha" = "$dst_sha" ]; then
              echo "PARITY=YES"
            else
              echo "PARITY=NO"
            fi
          done

          echo "=== ROLLING TIMER PROCESS ==="
          PID="$(cat "$RUNTIME/rolling_wake.pid" 2>/dev/null || true)"
          echo "ROLLING_PID=$PID"
          if [ -n "$PID" ]; then
            ps -p "$PID" -o pid=,ppid=,uid=,user=,etime=,command= || true
          fi

          echo "=== ROLLING TIMER STATUS ==="
          cat "$RUNTIME/rolling_wake_status" 2>/dev/null || echo "ROLLING_STATUS_MISSING"
          echo "ROLLING_HEARTBEAT=$(cat "$RUNTIME/rolling_wake_heartbeat" 2>/dev/null || true)"
          NOW="$(date +%s)"
          HB="$(cat "$RUNTIME/rolling_wake_heartbeat" 2>/dev/null || true)"
          if [[ "$HB" =~ ^[0-9]+$ ]]; then
            echo "ROLLING_HEARTBEAT_AGE_SECONDS=$((NOW-HB))"
          fi

          LAST_RECEIPT="$(sed -n 's/^last_receipt_epoch=//p' "$RUNTIME/rolling_wake_status" 2>/dev/null | head -1)"
          NEXT_DUE="$(sed -n 's/^next_due_epoch=//p' "$RUNTIME/rolling_wake_status" 2>/dev/null | head -1)"
          PENDING="$(sed -n 's/^pending_event_id=//p' "$RUNTIME/rolling_wake_status" 2>/dev/null | head -1)"
          if [[ "$LAST_RECEIPT" =~ ^[0-9]+$ ]] && [[ "$NEXT_DUE" =~ ^[0-9]+$ ]]; then
            echo "RECEIPT_TO_NEXT_DUE_SECONDS=$((NEXT_DUE-LAST_RECEIPT))"
          fi
          echo "PENDING_EVENT_ID=$PENDING"

          echo "=== EXACT CHAT BINDING ==="
          for f in             "$LOCAL_STATE/wake/current_chat_url"             "$LOCAL_STATE/wake/expected_chat_url"             "$SHARED/current_chat_url"             "$SHARED/expected_chat_url"
          do
            echo "$f=$(cat "$f" 2>/dev/null || true)"
          done

          echo "=== PAUSE / QUEUES / RECEIPTS ==="
          test -f "$LOCAL_STATE/user_pause" && echo "LOCAL_PAUSED=YES" || echo "LOCAL_PAUSED=NO"
          test -f "$SHARED/user_pause" && echo "SHARED_PAUSED=YES" || echo "SHARED_PAUSED=NO"
          echo "RELAY_QUEUE_COUNT=$(find "$SHARED/queue" -maxdepth 1 -type f -name '*.wake' 2>/dev/null | wc -l | tr -d ' ')"
          echo "LOCAL_QUEUE_COUNT=$(find "$LOCAL_STATE/wake/queue" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "LATEST_RECEIPTS:"
          ls -1t "$SHARED/receipts"/*.state 2>/dev/null | head -5 | while read -r f; do
            echo "--- $f"
            cat "$f"
          done

          echo "=== ROLLING OUT LOG TAIL ==="
          tail -80 "$RUNTIME/rolling_wake.out.log" 2>/dev/null || true
          echo "=== ROLLING ERR LOG TAIL ==="
          tail -80 "$RUNTIME/rolling_wake.err.log" 2>/dev/null || true
          echo "=== RELAY LOG TAIL ==="
          tail -120 "$SHARED/relay.log" 2>/dev/null || true

          echo "=== CONTRACT CHECKS ==="
          grep -F 'require_observed=exact_locked_wake' "$INSTALL/relay_submit.py" >/dev/null
          grep -F 'wait_for_exact_observation' "$SHARED/relay_daemon.py" >/dev/null
          grep -F 'status != "OBSERVED"' "$INSTALL/relay_submit.py" >/dev/null
          test "$((NEXT_DUE-LAST_RECEIPT))" = "1200"
          echo "ROLLING_WAKE_OBSERVED_RUNTIME_DIAG_PASS=YES"
