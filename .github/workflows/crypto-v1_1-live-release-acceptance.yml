name: Crypto v1.1 UID504 Live Release Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    name: UID504 read-only v1.1 release acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Exact accepted main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "504"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = "main"
          echo "V1_1_UID504_EXACT_MAIN_PASS=YES sha=${{ github.sha }}"

      - name: Deployed product source hash parity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          PRODUCT="$ROOT/Product"
          test -d "$PRODUCT/src/crypto_signal/product"
          EXPECTED="$(mktemp)"
          DEPLOYED="$(mktemp)"
          (
            cd "$GITHUB_WORKSPACE"
            find src/crypto_signal/product -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256
            shasum -a 256 ops/run_dashboard.py
          ) > "$EXPECTED"
          (
            cd "$PRODUCT"
            find src/crypto_signal/product -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256
            shasum -a 256 ops/run_dashboard.py
          ) > "$DEPLOYED"
          diff -u "$EXPECTED" "$DEPLOYED"
          echo "V1_1_DEPLOYED_PRODUCT_HASH_PARITY_PASS=YES"

      - name: Read-only SSD runtime topology and SQLite audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 \
            "$GITHUB_WORKSPACE/ops/r11_runtime_acceptance.py" \
            --root "$ROOT" \
            --min-free-bytes 1073741824 \
            | tee /tmp/v1_1-r11-runtime-audit.log
          grep -F 'R11_RUNTIME_AUDIT_PASS=YES' /tmp/v1_1-r11-runtime-audit.log >/dev/null
          echo "V1_1_UID504_RUNTIME_TOPOLOGY_SQLITE_PASS=YES"

      - name: Live GALACTECH root and authority truth
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HTML="/tmp/v1_1-root.html"
          LEGACY_HTML="/tmp/v1_1-legacy.html"
          HEALTH="/tmp/v1_1-health.json"
          INTEL="/tmp/v1_1-intel.json"
          curl -fsS --max-time 5 http://127.0.0.1:48700/ > "$ROOT_HTML"
          curl -fsS --max-time 5 http://127.0.0.1:48700/legacy > "$LEGACY_HTML"
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/health > "$HEALTH"
          curl -fsS --max-time 5 http://127.0.0.1:48700/api/intelligence-center > "$INTEL"
          grep -F 'data-ui-version="galactech-v1.1-polish"' "$ROOT_HTML" >/dev/null
          grep -F 'REAL_CAPITAL=0' "$ROOT_HTML" >/dev/null
          grep -F 'data-ui-version="galactech-command-center-v1"' "$LEGACY_HTML" >/dev/null
          python3 - "$HEALTH" "$INTEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          health = json.loads(Path(sys.argv[1]).read_text())
          intel = json.loads(Path(sys.argv[2]).read_text())
          assert health.get("status") == "ok"
          assert health.get("read_only") is True
          assert health.get("real_capital") == 0
          assert health.get("ledger_present") is True
          assert intel.get("read_only") is True
          assert intel.get("real_capital") == 0
          probability = intel.get("probability_status")
          assert probability in {"not_calibrated", "calibrated"}
          PY
          echo "V1_1_LIVE_GALACTECH_AUTHORITY_TRUTH_PASS=YES"

      - name: Runtime freshness endurance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          PRODUCT="$ROOT/Product"
          PAPER_DB="$PRODUCT/runtime/paper/paper_fund.sqlite3"
          test -f "$PAPER_DB"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 \
            "$GITHUB_WORKSPACE/ops/verify_stage10_integrated.py" \
            --paper-ledger "$PAPER_DB" \
            --cycles 12 \
            --pause-seconds 0.25 \
            | tee /tmp/v1_1-stage10-runtime.log
          grep -F 'STAGE10_RUNTIME_ACCEPTANCE_PASS=YES' /tmp/v1_1-stage10-runtime.log >/dev/null
          node "$GITHUB_WORKSPACE/tests/js/test_product_freshness.js"
          echo "V1_1_RUNTIME_FRESHNESS_ENDURANCE_PASS=YES"

      - name: Replay audit and probability boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_immutable_forecast_stream.py \
            tests/test_decision_proof_live_feed.py \
            tests/test_transaction_tape.py \
            tests/test_transaction_tape_atomic.py \
            tests/test_alpha_factory_probability_calibration_gate.py \
            tests/test_galactech_archive.py \
            tests/test_galactech_accessibility_performance.py
          echo "V1_1_REPLAY_PROBABILITY_ACCESSIBILITY_PASS=YES"

      - name: Continuity remains paused and isolated
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ops/continuity/continuity_status.py" \
            | tee /tmp/v1_1-continuity.log
          grep -F 'PAUSED=YES' /tmp/v1_1-continuity.log >/dev/null
          grep -F 'ACTIVE_LEASES=0' /tmp/v1_1-continuity.log >/dev/null
          grep -F 'WAKE_QUEUE=0' /tmp/v1_1-continuity.log >/dev/null
          grep -F 'RELAY_SHARED_PAUSED=YES' /tmp/v1_1-continuity.log >/dev/null
          grep -F 'RELAY_QUEUE=0' /tmp/v1_1-continuity.log >/dev/null
          echo "V1_1_CONTINUITY_PAUSED_ISOLATED_PASS=YES"

      - name: Final read-only release boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "V1_1_NO_REBOOT_LOGOUT_SSD_DETACH_EXECUTED=YES"
          echo "V1_1_REAL_CAPITAL_ZERO_PASS=YES"
          echo "V1_1_NO_EXCHANGE_ORDER_CREDENTIAL_AUTHORITY_PASS=YES"
          echo "V1_1_UID504_LIVE_RELEASE_ACCEPTANCE=PASS"