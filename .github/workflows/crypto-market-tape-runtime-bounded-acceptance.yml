name: Crypto Market Tape Runtime Bounded Acceptance

on:
  push:
    branches:
      - v1.1-market-tape-runtime-v1
    paths:
      - ".github/workflows/crypto-market-tape-runtime-bounded-acceptance.yml"

permissions:
  contents: read

jobs:
  accept:
    name: UID504 bounded Market Tape runtime acceptance
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Prepare accepted runtime source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crypto-market-tape-runtime-accept
          mkdir -p /tmp/crypto-market-tape-runtime-accept
          cp -R src ops /tmp/crypto-market-tape-runtime-accept/
          chmod -R a+rX /tmp/crypto-market-tape-runtime-accept

      - name: Run one bounded runtime cycle as UID504
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          test "$(sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          sudo -n -H -u crypto-signal-agent /bin/bash <<'SH'
          set -euo pipefail
          DIR="/Volumes/Crypto-504/Crypto-Signal/Development/runtime/market_tape"
          DB="$DIR/market_tape.sqlite3"
          RAW="$DIR/raw_market_tape.sqlite3"
          before="$(sqlite3 "$RAW" 'SELECT COUNT(*) FROM raw_market_events;')"
          echo "RAW_ROWS_BEFORE=$before"
          PYTHONPATH=/tmp/crypto-market-tape-runtime-accept/src             /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python             /tmp/crypto-market-tape-runtime-accept/ops/run_market_tape_runtime.py             --max-cycles 1             --chunk-messages 1000
          after="$(sqlite3 "$RAW" 'SELECT COUNT(*) FROM raw_market_events;')"
          echo "RAW_ROWS_AFTER=$after"
          test "$after" -gt "$before"

          test "$(sqlite3 "$DB" 'PRAGMA quick_check;')" = "ok"
          test "$(sqlite3 "$RAW" 'PRAGMA quick_check;')" = "ok"
          echo "NORMALIZED_QUICK_CHECK=ok"
          echo "RAW_QUICK_CHECK=ok"

          STATUS="$DIR/runtime_status.json"
          test -s "$STATUS"
          cat "$STATUS"
          grep -q '"state":"collecting"' "$STATUS"
          grep -q '"cycle":1' "$STATUS"
          grep -q '"real_capital":0' "$STATUS"

          echo "MARKET_TAPE_RUNTIME_BOUNDED_ACCEPTANCE_PASS=YES"
          echo "REAL_CAPITAL=0"
          SH

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/crypto-market-tape-runtime-accept
