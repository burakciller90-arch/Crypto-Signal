name: Crypto Stream S2 Event Context Hosted

on:
  push:
    branches:
      - stream/s2-event-context-ledger-slice1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-s2-event-context:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"

      - name: Focused Stream S2 acceptance
        run: |
          python -m pytest -q             tests/test_intelligence_stream_ledger.py             tests/test_confluence_matrix_v2.py             tests/test_decision_ledger.py
          python -m ruff check             src/crypto_signal/product/intelligence_stream_models.py             src/crypto_signal/product/intelligence_stream_ledger.py             tests/test_intelligence_stream_ledger.py
          python -m mypy             src/crypto_signal/product/intelligence_stream_models.py             src/crypto_signal/product/intelligence_stream_ledger.py
          echo "STREAM_S2_EVENT_CONTEXT_FOCUSED_PASS=YES"

      - name: Whole-repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "STREAM_S2_EVENT_CONTEXT_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"
