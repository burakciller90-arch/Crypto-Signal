name: Crypto Mac UID501 Command

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-uid501.yml"

permissions:
  contents: read
  issues: read

jobs:
  probe:
    if: github.event_name == 'push'
    name: UID501 Bridge Probe
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Verify UID501 runner
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID501 BRIDGE PROBE ==="
          echo "USER=$(whoami)"
          echo "UID=$(id -u)"
          echo "GID=$(id -g)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          id
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          test "$(id -u)" = "501"
          echo "UID501_BRIDGE_PASS=YES"

  command:
    if: github.event_name == 'issues' && github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[MAC501] ')
    name: UID501 Command Bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 20
    steps:
      - name: Parse command
        id: parse
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="command" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          case "$cmd" in
            status|repo|services|disk|externaldisk|hostdiag|audiorestart|audioadminrestart|loadtree|loadtree2|bginventory|bgsafecheck|cryptomigrationdiag|cryptomigrationdiag2|cryptodashboarddiag|cryptorunnertree|cryptorunnercutoverdiag|cryptossdrunnerps|uidsudo|uid504runneradminstart|uid504runnerguiadminstart|cryptofinalaudit|cryptofinaladmincleanup|cryptofinalterminalcleanup|crypto504grant501|coldarchivecheck|visualcleanup504|dashboardrestart504|dashboardthrottle504|dashboarddedupe504|webkitcleanup502)
              ;;
            *)
              echo "Unsupported command: $cmd"
              exit 2
              ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: STATUS
        if: steps.parse.outputs.command == 'status'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID501 BRIDGE STATUS ==="
          echo "USER=$(whoami)"
          echo "UID=$(id -u)"
          echo "GID=$(id -g)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          id
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          test "$(id -u)" = "501"
          echo "UID501_BRIDGE_PASS=YES"

      - name: REPO
        if: steps.parse.outputs.command == 'repo'
        shell: bash
        run: |
          set +e
          echo "=== HOME ==="
          ls -la "$HOME" | head -120
          echo "=== CRYPTO SIGNAL REPOS ==="
          for repo in             "$HOME/Crypto-Signal"             "/Users/crypto-signal-agent/Crypto-Signal"             "/Users/crypto-signal-agent/Crypto-Signal-Paper"             "/Users/crypto-signal-agent/Crypto-Signal-Product"
          do
            echo "--- $repo"
            if [ -d "$repo/.git" ]; then
              git -C "$repo" status --short --branch
              git -C "$repo" rev-parse HEAD
            else
              echo "NOT_A_GIT_REPO_OR_NOT_ACCESSIBLE"
            fi
          done
          exit 0

      - name: SERVICES
        if: steps.parse.outputs.command == 'services'
        shell: bash
        run: |
          set +e
          echo "=== GUI SERVICES UID501 ==="
          launchctl print "gui/$(id -u)" 2>&1 | egrep 'com\.cryptosignal|state =|pid =' | head -200
          exit 0

      - name: DISK
        if: steps.parse.outputs.command == 'disk'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          echo "=== HOME SIZE ==="
          du -sh "$HOME" 2>/dev/null || true


      - name: EXTERNAL DISK READ ONLY
        if: steps.parse.outputs.command == 'externaldisk'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DISK4 IDENTITY ==="
          diskutil info /dev/disk4
          echo "=== DISK4 LAYOUT ==="
          diskutil list /dev/disk4
          echo "=== APFS ==="
          diskutil apfs list
          echo "=== EXPECTED PROJECT VOLUMES ==="
          for v in Admin-501 Durdurulmaz-502 Quantum-503 Crypto-504 AI_PROJECTS KIOXIA; do
            echo "--- $v"
            if [ -e "/Volumes/$v" ]; then
              diskutil info "/Volumes/$v" || true
              ls -lad "/Volumes/$v" || true
              du -sh "/Volumes/$v" 2>/dev/null || true
            else
              echo "NOT_MOUNTED_OR_ABSENT"
            fi
          done
          echo "EXTERNAL_DISK_READ_ONLY_PASS=YES"





      - name: CRYPTO DASHBOARD SSD DIAG
        if: steps.parse.outputs.command == 'cryptodashboarddiag'
        shell: bash
        run: |
          set +e
          echo "=== DASHBOARD LAUNCHD ==="
          /bin/launchctl print gui/504/com.cryptosignal.dashboard 2>&1 | /usr/bin/head -220
          echo "=== DASHBOARD PLIST ==="
          /usr/bin/plutil -p /Users/crypto-signal-agent/Library/LaunchAgents/com.cryptosignal.dashboard.plist 2>&1
          echo "=== SSD DASHBOARD ERR ==="
          /usr/bin/tail -160 /Volumes/Crypto-504/Crypto-Signal/Development/runtime/dashboard/dashboard.err.log 2>&1
          echo "=== SSD DASHBOARD OUT ==="
          /usr/bin/tail -160 /Volumes/Crypto-504/Crypto-Signal/Development/runtime/dashboard/dashboard.out.log 2>&1
          echo "=== SSD PRODUCT PATHS ==="
          /bin/ls -l /Volumes/Crypto-504/Crypto-Signal/Product/.venv/bin/python
          /bin/ls -l /Volumes/Crypto-504/Crypto-Signal/Product/ops/run_dashboard.py
          echo "=== DIRECT IMPORT / HELP ==="
          /Volumes/Crypto-504/Crypto-Signal/Product/.venv/bin/python -c 'import sys,fastapi,uvicorn; print(sys.executable); print("IMPORT_OK")' 2>&1
          PYTHONPATH=/Volumes/Crypto-504/Crypto-Signal/Product/src /Volumes/Crypto-504/Crypto-Signal/Product/.venv/bin/python /Volumes/Crypto-504/Crypto-Signal/Product/ops/run_dashboard.py --help 2>&1 | /usr/bin/head -100
          echo "CRYPTO_DASHBOARD_DIAG_PASS=YES"
          exit 0

      - name: CRYPTO MIGRATION DIAG 2
        if: steps.parse.outputs.command == 'cryptomigrationdiag2'
        shell: bash
        run: |
          set +e
          echo "=== UID504 MIGRATION SHELLS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[a]ctions-runner-crypto/_work/_temp/.*\.sh'
          for p in $(/bin/ps -axo pid=,ppid=,user=,command= | /usr/bin/awk '$3=="crypto-signal-agent" && $0 ~ /actions-runner-crypto\/_work\/_temp\/.*\.sh/ {print $1}'); do
            echo "--- shell=$p"
            /bin/ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            c1="$(/usr/bin/pgrep -P "$p" | /usr/bin/paste -sd ' ' - || true)"
            echo "CHILDREN=$c1"
            for q in $c1; do
              /bin/ps -p "$q" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              c2="$(/usr/bin/pgrep -P "$q" | /usr/bin/paste -sd ' ' - || true)"
              echo "GRANDCHILDREN_OF_$q=$c2"
              for r in $c2; do /bin/ps -p "$r" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=; done
            done
          done
          echo "=== DISKUTIL PROCS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[d]iskutil|[g]it status|[r]sync' | /usr/bin/head -100
          echo "CRYPTO_MIGRATION_DIAG2_PASS=YES"
          exit 0

      - name: CRYPTO MIGRATION DIAG
        if: steps.parse.outputs.command == 'cryptomigrationdiag'
        shell: bash
        run: |
          set +e
          echo "=== UID504 RUNNER / MIGRATION TREE ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[R]unner.Worker|crypto-ssd-cutover|d3d48ab6-f93f-49b5-a00a-67898bc4d116|[r]sync|[g]it .*worktree|[s]qlite3|[c]url .*48700|[s]leep' | /usr/bin/head -240
          echo "=== TARGET TREE ==="
          for p in             /Volumes/Crypto-504/Crypto-Signal             /Volumes/Crypto-504/Crypto-Signal/Development             /Volumes/Crypto-504/Crypto-Signal/Live             /Volumes/Crypto-504/Crypto-Signal/Product             /Volumes/Crypto-504/Crypto-Signal/Alerts             /Volumes/Crypto-504/Crypto-Signal/Paper             /Volumes/Crypto-504/Crypto-Signal/Runner; do
            echo "--- $p"
            [ -e "$p" ] && /usr/bin/du -sh "$p" 2>/dev/null || echo MISSING
          done
          echo "=== INTERNAL SOURCES ==="
          for p in             /Users/crypto-signal-agent/Crypto-Signal             /Users/crypto-signal-agent/Crypto-Signal-Live             /Users/crypto-signal-agent/Crypto-Signal-Product             /Users/crypto-signal-agent/Crypto-Signal-Alerts             /Users/crypto-signal-agent/Crypto-Signal-Paper             /Users/crypto-signal-agent/actions-runner-crypto; do
            if [ -e "$p" ]; then echo "PRESENT $p"; else echo "ABSENT $p"; fi
          done
          echo "=== SSD HEALTH FILE ==="
          /bin/ls -l /Volumes/Crypto-504/Crypto-Signal/dashboard-health.json 2>/dev/null
          /bin/cat /Volumes/Crypto-504/Crypto-Signal/dashboard-health.json 2>/dev/null
          echo
          echo "=== UID504 CRYPTO SERVICES ==="
          /bin/launchctl print gui/504 2>/dev/null | /usr/bin/grep -E 'com\.cryptosignal|actions\.runner.*Crypto-Signal' | /usr/bin/head -120
          echo "CRYPTO_MIGRATION_DIAG_PASS=YES"
          exit 0


      - name: CRYPTO RUNNER TREE
        if: steps.parse.outputs.command == 'cryptorunnertree'
        shell: bash
        run: |
          set +e
          echo "=== CRYPTO UID504 RUNNER ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[a]ctions-runner-crypto/(bin/Runner\.(Listener|Worker)|runsvc\.sh)|[R]unner.Worker spawnclient' | /usr/bin/head -120
          echo "=== CHILD TREE ==="
          for p in $(/usr/bin/pgrep -f '/Users/crypto-signal-agent/actions-runner-crypto/bin/Runner.(Listener|Worker)' 2>/dev/null); do
            echo "--- pid=$p"
            /bin/ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            for c in $(/usr/bin/pgrep -P "$p" 2>/dev/null); do
              /bin/ps -p "$c" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              for g in $(/usr/bin/pgrep -P "$c" 2>/dev/null); do
                /bin/ps -p "$g" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              done
            done
          done
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "CRYPTO_RUNNER_TREE_PASS=YES"
          exit 0


      - name: CRYPTO RUNNER CUTOVER DIAG
        if: steps.parse.outputs.command == 'cryptorunnercutoverdiag'
        shell: bash
        run: |
          set +e
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          HOME_ROOT="/Users/crypto-signal-agent"
          LABEL="actions.runner.burakciller90-arch-Crypto-Signal.crypto-signal-uid504"
          echo "=== MARKERS ==="
          /bin/ls -l "$ROOT"/RUNNER_CUTOVER_* 2>/dev/null
          echo "=== CUTOVER LOG ==="
          /usr/bin/tail -120 "$ROOT/runner-cutover.log" 2>/dev/null
          echo "=== HELPER LOGS ==="
          /usr/bin/tail -120 "$ROOT/runner-helper.launchd.out.log" 2>/dev/null
          /usr/bin/tail -120 "$ROOT/runner-helper.launchd.err.log" 2>/dev/null
          echo "=== RUNNER PLIST ==="
          /usr/bin/plutil -p "$HOME_ROOT/Library/LaunchAgents/$LABEL.plist" 2>/dev/null
          echo "=== LAUNCHCTL UID504 ==="
          /bin/launchctl print "gui/504/$LABEL" 2>&1 | /usr/bin/head -120
          echo "=== INTERNAL RUNNER ==="
          if [ -e "$HOME_ROOT/actions-runner-crypto" ]; then
            /bin/ls -ld "$HOME_ROOT/actions-runner-crypto"
            /usr/bin/du -sh "$HOME_ROOT/actions-runner-crypto" 2>/dev/null
          else
            echo "INTERNAL_RUNNER_ABSENT=YES"
          fi
          echo "=== SSD RUNNER ==="
          /bin/ls -ld "$ROOT/Runner" 2>/dev/null
          /usr/bin/du -sh "$ROOT/Runner" 2>/dev/null
          echo "CRYPTO_RUNNER_CUTOVER_DIAG_PASS=YES"
          exit 0


      - name: CRYPTO SSD RUNNER PS
        if: steps.parse.outputs.command == 'cryptossdrunnerps'
        shell: bash
        run: |
          set +e
          echo "=== SSD RUNNER PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '/Volumes/Crypto-504/Crypto-Signal/Runner|[R]unner\.(Listener|Worker)' | /usr/bin/head -200
          echo "=== INTERNAL RUNNER PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '/Users/crypto-signal-agent/actions-runner-crypto' | /usr/bin/head -120
          echo "=== UID504 PROCESSES ON SSD ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/awk '$3=="crypto-signal-agent" && $0 ~ /\/Volumes\/Crypto-504/ {print}'
          echo "CRYPTO_SSD_RUNNER_PS_PASS=YES"
          exit 0


      - name: HIGH LOAD WEBKIT CLEANUP VIA UID501
        if: steps.parse.outputs.command == 'webkitcleanup502'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "=== WEBKIT BEFORE ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command= \
            | /usr/bin/awk '$3=="durdurulamaz-agent" && $0 ~ /com\.apple\.WebKit\.WebContent\.xpc/ {print}' \
            | /usr/bin/head -80 || true

          test "$(/usr/bin/sudo -n -u durdurulamaz-agent /usr/bin/id -u)" = "502"

          targets="$(
            /bin/ps -axo pid=,user=,%cpu=,%mem=,command= \
              | /usr/bin/awk '$2=="durdurulamaz-agent" && $0 ~ /com\.apple\.WebKit\.WebContent\.xpc/ && ($3+0 >= 50 || $4+0 >= 5) {print $1}'
          )"
          echo "WEBKIT_HIGH_LOAD_TARGETS=$(echo "$targets" | tr '\n' ' ')"

          if [ -z "$targets" ]; then
            echo "WEBKIT_HIGH_LOAD_CLEANUP_PASS=NO_TARGET"
            exit 0
          fi

          for pid in $targets; do
            /usr/bin/sudo -n -u durdurulamaz-agent /bin/kill -TERM "$pid" 2>/dev/null || true
          done
          /bin/sleep 2
          for pid in $targets; do
            if /bin/kill -0 "$pid" 2>/dev/null; then
              /usr/bin/sudo -n -u durdurulamaz-agent /bin/kill -KILL "$pid" 2>/dev/null || true
            fi
          done
          /bin/sleep 2

          echo "=== WEBKIT AFTER ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command= \
            | /usr/bin/awk '$3=="durdurulamaz-agent" && $0 ~ /com\.apple\.WebKit\.WebContent\.xpc/ {print}' \
            | /usr/bin/head -80 || true
          echo "WEBKIT_HIGH_LOAD_CLEANUP_PASS=YES"

      - name: UID504 DASHBOARD THROTTLE VIA UID501
        if: steps.parse.outputs.command == 'dashboardthrottle504'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PATTERN='^/Volumes/Crypto-504/Crypto-Signal/Product/.venv/bin/python /Volumes/Crypto-504/Crypto-Signal/Product/ops/run_dashboard.py( |$)'
          pids="$(/usr/bin/pgrep -f "$PATTERN" 2>/dev/null || true)"
          echo "DASHBOARD_THROTTLE_PIDS=$(echo "$pids" | tr '\n' ' ')"
          test -n "$pids"

          for pid in $pids; do
            /usr/bin/sudo -n -u crypto-signal-agent /usr/bin/renice 20 -p "$pid" || true
            /usr/bin/sudo -n -u crypto-signal-agent /usr/bin/taskpolicy -b -p "$pid" || true
            /usr/bin/sudo -n -u crypto-signal-agent /bin/kill -KILL "$pid" 2>/dev/null || true
          done

          /bin/sleep 2
          /bin/ps -p "$(/bin/echo "$pids" | /usr/bin/paste -sd, -)" -o pid=,ppid=,user=,ni=,%cpu=,%mem=,rss=,etime=,state=,command= || true
          echo "UID504_DASHBOARD_THROTTLE_PASS=YES"

      - name: UID504 DASHBOARD DEDUPE VIA UID501
        if: steps.parse.outputs.command == 'dashboarddedupe504'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PATTERN='^/Volumes/Crypto-504/Crypto-Signal/Product/.venv/bin/python /Volumes/Crypto-504/Crypto-Signal/Product/ops/run_dashboard.py( |$)'

          echo "=== DASHBOARD BEFORE ==="
          pids="$(/usr/bin/pgrep -f "$PATTERN" 2>/dev/null || true)"
          test -n "$pids"
          /bin/ps -p "$(/bin/echo "$pids" | /usr/bin/paste -sd, -)" -o pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command= || true

          kept=""
          for pid in $pids; do
            ppid="$(/bin/ps -p "$pid" -o ppid= | /usr/bin/tr -d ' ')"
            if [ "$ppid" = "1" ]; then
              echo "DASHBOARD_ORPHAN_KILL_PID=$pid"
              /usr/bin/sudo -n -u crypto-signal-agent /bin/kill -TERM "$pid" 2>/dev/null || true
              /bin/sleep 1
              if /bin/kill -0 "$pid" 2>/dev/null; then
                /usr/bin/sudo -n -u crypto-signal-agent /bin/kill -KILL "$pid" 2>/dev/null || true
              fi
            else
              kept="$kept $pid"
            fi
          done

          /bin/sleep 2
          current="$(/usr/bin/pgrep -f "$PATTERN" 2>/dev/null || true)"
          count="$(printf '%s\n' "$current" | /usr/bin/awk 'NF{n++} END{print n+0}')"
          echo "DASHBOARD_COUNT_AFTER=$count"
          test "$count" = "1"
          survivor="$(printf '%s\n' "$current" | /usr/bin/head -1)"
          survivor_ppid="$(/bin/ps -p "$survivor" -o ppid= | /usr/bin/tr -d ' ')"
          test "$survivor_ppid" != "1"
          /bin/ps -p "$survivor" -o pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command=
          echo "LOAD_AFTER=$(/usr/sbin/sysctl -n vm.loadavg)"
          /usr/bin/memory_pressure | /usr/bin/grep -E 'System-wide memory free percentage' | /usr/bin/head -1 || true
          echo "UID504_DASHBOARD_DEDUPE_PASS=YES"

      - name: UID504 DASHBOARD RESTART VIA UID501
        if: steps.parse.outputs.command == 'dashboardrestart504'
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          PATTERN='^/Volumes/Crypto-504/Crypto-Signal/Product/.venv/bin/python /Volumes/Crypto-504/Crypto-Signal/Product/ops/run_dashboard.py( |$)'

          before="$(/usr/bin/pgrep -f "$PATTERN" 2>/dev/null || true)"
          echo "DASHBOARD_BEFORE_PIDS=$(echo "$before" | tr '\n' ' ')"
          test -n "$before"
          /bin/ps -p "$(/bin/echo "$before" | /usr/bin/paste -sd, -)" -o pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command= || true

          for pid in $before; do
            /usr/bin/sudo -n -u crypto-signal-agent /bin/kill -TERM "$pid" 2>/dev/null || true
          done

          for _ in {1..10}; do
            alive=0
            for pid in $before; do
              if /bin/kill -0 "$pid" 2>/dev/null; then alive=1; fi
            done
            [ "$alive" = "0" ] && break
            /bin/sleep 1
          done

          for pid in $before; do
            if /bin/kill -0 "$pid" 2>/dev/null; then
              echo "DASHBOARD_FORCE_KILL_PID=$pid"
              /usr/bin/sudo -n -u crypto-signal-agent /bin/kill -KILL "$pid" 2>/dev/null || true
            fi
          done

          for _ in {1..10}; do
            alive=0
            for pid in $before; do
              if /bin/kill -0 "$pid" 2>/dev/null; then alive=1; fi
            done
            [ "$alive" = "0" ] && break
            /bin/sleep 1
          done

          for pid in $before; do
            if /bin/kill -0 "$pid" 2>/dev/null; then
              echo "DASHBOARD_OLD_PID_STILL_ALIVE=$pid"
              exit 93
            fi
          done

          new_pid=""
          for _ in {1..60}; do
            current="$(/usr/bin/pgrep -f "$PATTERN" 2>/dev/null || true)"
            count="$(printf '%s\n' "$current" | /usr/bin/awk 'NF{n++} END{print n+0}')"
            if [ "$count" = "1" ]; then
              candidate="$(printf '%s\n' "$current" | /usr/bin/head -1)"
              if ! printf '%s\n' "$before" | /usr/bin/grep -qx "$candidate"; then
                new_pid="$candidate"
                break
              fi
            fi
            /bin/sleep 1
          done

          test -n "$new_pid"
          /bin/sleep 5
          echo "DASHBOARD_AFTER_PID=$new_pid"
          /bin/ps -p "$new_pid" -o pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command=
          echo "LOAD_AFTER=$(/usr/sbin/sysctl -n vm.loadavg)"
          /usr/bin/memory_pressure | /usr/bin/grep -E 'System-wide memory free percentage' | /usr/bin/head -1 || true
          echo "UID504_DASHBOARD_RESTART_PASS=YES"

      - name: UID504 VISUAL SNAPSHOT CLEANUP VIA UID501
        if: steps.parse.outputs.command == 'visualcleanup504'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "=== HEADLESS BEFORE ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command= \
            | /usr/bin/grep -E '[G]oogle Chrome.*--headless=new|[C]hromium.*--headless=new|[M]icrosoft Edge.*--headless=new' \
            | /usr/bin/head -120 || true

          /usr/bin/sudo -n -u crypto-signal-agent /usr/bin/pkill -TERM -f -- '--headless=new' 2>/dev/null || true
          /bin/sleep 2
          /usr/bin/sudo -n -u crypto-signal-agent /usr/bin/pkill -KILL -f -- '--headless=new' 2>/dev/null || true
          /bin/sleep 1

          echo "=== HEADLESS AFTER ==="
          left="$(/usr/bin/pgrep -f -- '--headless=new' 2>/dev/null || true)"
          if [ -n "$left" ]; then
            /bin/ps -p "$(/bin/echo "$left" | /usr/bin/paste -sd, -)" -o pid=,ppid=,user=,%cpu=,%mem=,rss=,etime=,command= || true
            echo "UID504_VISUAL_CLEANUP_PASS=NO"
            exit 92
          fi
          echo "UID504_VISUAL_CLEANUP_PASS=YES"

      - name: UID501 SUDO PROBE
        if: steps.parse.outputs.command == 'uidsudo'
        shell: bash
        run: |
          set +e
          echo "=== ID ==="; id
          /usr/bin/sudo -n -u crypto-signal-agent /usr/bin/id
          rc=$?
          echo "SUDO_AS_UID504_RC=$rc"
          /usr/bin/sudo -n /usr/bin/true
          echo "SUDO_ROOT_RC=$?"
          echo "UID501_SUDO_PROBE_PASS=YES"
          exit 0


