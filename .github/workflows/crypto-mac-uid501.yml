          done
          /usr/bin/find "/Users/durdurulamaz-agent/Durdurulmaz-Supervisor/.continuation_leases/active" -maxdepth 1 -type f -print 2>/dev/null | /usr/bin/head -50

          echo "=== TARGET LAUNCHAGENT DETAILS ==="
          for p in             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.ssd-permission-probe.plist"             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.natural-forward-runtime-v6.plist"             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.operations.sidecar.plist"             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.scientific.p9econ001.plist"; do
            echo "--- $p"
            /usr/bin/stat -f '%Sm %z bytes' -t '%Y-%m-%d %H:%M:%S %z' "$p" 2>/dev/null || true
            /usr/bin/plutil -p "$p" 2>/dev/null || true
          done

          echo "=== UID502 SAFARI / WEBKIT ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '^ *[0-9]+ +[0-9]+ +durdurulamaz-agent .*Safari|^ *[0-9]+ +[0-9]+ +durdurulamaz-agent .*WebKit' | /usr/bin/head -120

