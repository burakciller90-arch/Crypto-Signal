name: Crypto Mac UID501 Command

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-uid501.yml"

permissions:
  contents: read
  issues: read

jobs:
  probe:
    if: github.event_name == 'push'
    name: UID501 Bridge Probe
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Verify UID501 runner
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID501 BRIDGE PROBE ==="
          echo "USER=$(whoami)"
          echo "UID=$(id -u)"
          echo "GID=$(id -g)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          id
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          test "$(id -u)" = "501"
          echo "UID501_BRIDGE_PASS=YES"

  command:
    if: github.event_name == 'issues' && github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[MAC501] ')
    name: UID501 Command Bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 20
    steps:
      - name: Parse command
        id: parse
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="command" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          case "$cmd" in
            status|repo|services|disk|externaldisk|hostdiag|audiorestart|audioadminrestart|loadtree|loadtree2|bginventory|bgsafecheck|cryptomigrationdiag|cryptomigrationdiag2)
              ;;
            *)
              echo "Unsupported command: $cmd"
              exit 2
              ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: STATUS
        if: steps.parse.outputs.command == 'status'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID501 BRIDGE STATUS ==="
          echo "USER=$(whoami)"
          echo "UID=$(id -u)"
          echo "GID=$(id -g)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          id
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          test "$(id -u)" = "501"
          echo "UID501_BRIDGE_PASS=YES"

      - name: REPO
        if: steps.parse.outputs.command == 'repo'
        shell: bash
        run: |
          set +e
          echo "=== HOME ==="
          ls -la "$HOME" | head -120
          echo "=== CRYPTO SIGNAL REPOS ==="
          for repo in             "$HOME/Crypto-Signal"             "/Users/crypto-signal-agent/Crypto-Signal"             "/Users/crypto-signal-agent/Crypto-Signal-Paper"             "/Users/crypto-signal-agent/Crypto-Signal-Product"
          do
            echo "--- $repo"
            if [ -d "$repo/.git" ]; then
              git -C "$repo" status --short --branch
              git -C "$repo" rev-parse HEAD
            else
              echo "NOT_A_GIT_REPO_OR_NOT_ACCESSIBLE"
            fi
          done
          exit 0

      - name: SERVICES
        if: steps.parse.outputs.command == 'services'
        shell: bash
        run: |
          set +e
          echo "=== GUI SERVICES UID501 ==="
          launchctl print "gui/$(id -u)" 2>&1 | egrep 'com\.cryptosignal|state =|pid =' | head -200
          exit 0

      - name: DISK
        if: steps.parse.outputs.command == 'disk'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          echo "=== HOME SIZE ==="
          du -sh "$HOME" 2>/dev/null || true


      - name: EXTERNAL DISK READ ONLY
        if: steps.parse.outputs.command == 'externaldisk'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DISK4 IDENTITY ==="
          diskutil info /dev/disk4
          echo "=== DISK4 LAYOUT ==="
          diskutil list /dev/disk4
          echo "=== APFS ==="
          diskutil apfs list
          echo "=== EXPECTED PROJECT VOLUMES ==="
          for v in Admin-501 Durdurulmaz-502 Quantum-503 Crypto-504 AI_PROJECTS KIOXIA; do
            echo "--- $v"
            if [ -e "/Volumes/$v" ]; then
              diskutil info "/Volumes/$v" || true
              ls -lad "/Volumes/$v" || true
              du -sh "/Volumes/$v" 2>/dev/null || true
            else
              echo "NOT_MOUNTED_OR_ABSENT"
            fi
          done
          echo "EXTERNAL_DISK_READ_ONLY_PASS=YES"




      - name: CRYPTO MIGRATION DIAG 2
        if: steps.parse.outputs.command == 'cryptomigrationdiag2'
        shell: bash
        run: |
          set +e
          echo "=== UID504 MIGRATION SHELLS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[a]ctions-runner-crypto/_work/_temp/.*\.sh'
          for p in $(/bin/ps -axo pid=,ppid=,user=,command= | /usr/bin/awk '$3=="crypto-signal-agent" && $0 ~ /actions-runner-crypto\/_work\/_temp\/.*\.sh/ {print $1}'); do
            echo "--- shell=$p"
            /bin/ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            c1="$(/usr/bin/pgrep -P "$p" | /usr/bin/paste -sd ' ' - || true)"
            echo "CHILDREN=$c1"
            for q in $c1; do
              /bin/ps -p "$q" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              c2="$(/usr/bin/pgrep -P "$q" | /usr/bin/paste -sd ' ' - || true)"
              echo "GRANDCHILDREN_OF_$q=$c2"
              for r in $c2; do /bin/ps -p "$r" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=; done
            done
          done
          echo "=== DISKUTIL PROCS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[d]iskutil|[g]it status|[r]sync' | /usr/bin/head -100
          echo "CRYPTO_MIGRATION_DIAG2_PASS=YES"
          exit 0

      - name: CRYPTO MIGRATION DIAG
        if: steps.parse.outputs.command == 'cryptomigrationdiag'
        shell: bash
        run: |
          set +e
          echo "=== UID504 RUNNER / MIGRATION TREE ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[R]unner.Worker|crypto-ssd-cutover|d3d48ab6-f93f-49b5-a00a-67898bc4d116|[r]sync|[g]it .*worktree|[s]qlite3|[c]url .*48700|[s]leep' | /usr/bin/head -240
          echo "=== TARGET TREE ==="
          for p in             /Volumes/Crypto-504/Crypto-Signal             /Volumes/Crypto-504/Crypto-Signal/Development             /Volumes/Crypto-504/Crypto-Signal/Live             /Volumes/Crypto-504/Crypto-Signal/Product             /Volumes/Crypto-504/Crypto-Signal/Alerts             /Volumes/Crypto-504/Crypto-Signal/Paper             /Volumes/Crypto-504/Crypto-Signal/Runner; do
            echo "--- $p"
            [ -e "$p" ] && /usr/bin/du -sh "$p" 2>/dev/null || echo MISSING
          done
          echo "=== INTERNAL SOURCES ==="
          for p in             /Users/crypto-signal-agent/Crypto-Signal             /Users/crypto-signal-agent/Crypto-Signal-Live             /Users/crypto-signal-agent/Crypto-Signal-Product             /Users/crypto-signal-agent/Crypto-Signal-Alerts             /Users/crypto-signal-agent/Crypto-Signal-Paper             /Users/crypto-signal-agent/actions-runner-crypto; do
            if [ -e "$p" ]; then echo "PRESENT $p"; else echo "ABSENT $p"; fi
          done
          echo "=== SSD HEALTH FILE ==="
          /bin/ls -l /Volumes/Crypto-504/Crypto-Signal/dashboard-health.json 2>/dev/null
          /bin/cat /Volumes/Crypto-504/Crypto-Signal/dashboard-health.json 2>/dev/null
          echo
          echo "=== UID504 CRYPTO SERVICES ==="
          /bin/launchctl print gui/504 2>/dev/null | /usr/bin/grep -E 'com\.cryptosignal|actions\.runner.*Crypto-Signal' | /usr/bin/head -120
          echo "CRYPTO_MIGRATION_DIAG_PASS=YES"
          exit 0

      - name: HOST DIAG
        if: steps.parse.outputs.command == 'hostdiag'
        shell: bash
        run: |
          set +e
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "=== MEMORY ==="
          /usr/bin/memory_pressure | /usr/bin/head -40
          echo "=== TOP CPU ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/sort -k4 -nr | /usr/bin/head -40
          echo "=== TARGET PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[c]oreaudiod|[S]torageManagementService|Storage\.appex|[r]un_alert_clock\.py|[p]9_natural_forward_runtime_entrypoint\.py|[W]indowServer|[W]ebKit\.WebContent|[R]unner\.(Worker|Listener)' | /usr/bin/head -120
          echo "=== AUDIO LAUNCHD MATCHES ==="
          /bin/launchctl print system 2>&1 | /usr/bin/grep -i -C 3 'coreaudiod\|audio' | /usr/bin/head -160
          echo "=== GUI501 RELEVANT ==="
          /bin/launchctl print gui/501 2>&1 | /usr/bin/grep -E -i -C 2 'cryptosignal|durdurulmaz|Storage|Safari|audio|actions\.runner' | /usr/bin/head -260
          echo "=== THERMAL ==="
          /usr/bin/pmset -g therm 2>&1 | /usr/bin/head -80
          echo "HOST_DIAG_PASS=YES"
          exit 0


      - name: AUDIO RESTART
        if: steps.parse.outputs.command == 'audiorestart'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_PID="$(pgrep -x coreaudiod | head -1 || true)"
          echo "COREAUDIOD_BEFORE_PID=$BEFORE_PID"
          if [ -n "$BEFORE_PID" ]; then
            ps -p "$BEFORE_PID" -o pid=,user=,%cpu=,%mem=,etime=,command= || true
          fi
          /usr/bin/sudo -n /bin/launchctl kickstart -k system/com.apple.audio.coreaudiod
          sleep 5
          AFTER_PID="$(pgrep -x coreaudiod | head -1 || true)"
          test -n "$AFTER_PID"
          echo "COREAUDIOD_AFTER_PID=$AFTER_PID"
          test "$AFTER_PID" != "$BEFORE_PID"
          ps -p "$AFTER_PID" -o pid=,user=,%cpu=,%mem=,etime=,command=
          echo "AUDIO_RESTART_PASS=YES"


      - name: LOAD TREE
        if: steps.parse.outputs.command == 'loadtree'
        shell: bash
        run: |
          set +e
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "=== MIGRATION / HASH / COPY PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[r]sync|[d]itto|[s]hasum|[f]ind .*Durdurulmaz|[r]m -rf|durdurulmaz-(move-staging|ssd-complete)|_temp/.*\.sh' | /usr/bin/head -220
          echo "=== DURDURULMAZ RUNNER TREES ==="
          for root in 8550 94505; do
            echo "--- root=$root"
            /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/awk -v r="$root" '$2==r || $1==r {print}'
          done
          echo "=== TOP CPU ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/sort -k4 -nr | /usr/bin/head -45
          echo "LOAD_TREE_PASS=YES"
          exit 0


      - name: LOAD TREE 2
        if: steps.parse.outputs.command == 'loadtree2'
        shell: bash
        run: |
          set +e
          echo "=== RUNNER DESCENDANTS ==="
          for worker in 62228 51245; do
            echo "--- worker=$worker"
            ps -p "$worker" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            C1="$(pgrep -P "$worker" | paste -sd ' ' - || true)"
            echo "CHILDREN=$C1"
            for p in $C1; do
              ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              C2="$(pgrep -P "$p" | paste -sd ' ' - || true)"
              echo "GRANDCHILDREN_OF_$p=$C2"
              for q in $C2; do
                ps -p "$q" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              done
            done
          done
          echo "=== DURABLE SUPERVISOR ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -E '[n]atural_forward_durable_day_supervisor\.py|[p]9_natural_forward_runtime_entrypoint\.py'
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "LOAD_TREE_2_PASS=YES"
          exit 0


      - name: AUDIO ADMIN RESTART
        if: steps.parse.outputs.command == 'audioadminrestart'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_PID="$(pgrep -x coreaudiod | head -1 || true)"
          echo "COREAUDIOD_BEFORE_PID=$BEFORE_PID"
          ps -p "$BEFORE_PID" -o pid=,user=,%cpu=,%mem=,etime=,command= || true
          /usr/bin/osascript -e 'do shell script "/bin/launchctl kickstart -k system/com.apple.audio.coreaudiod" with administrator privileges'
          sleep 5
          AFTER_PID="$(pgrep -x coreaudiod | head -1 || true)"
          test -n "$AFTER_PID"
          echo "COREAUDIOD_AFTER_PID=$AFTER_PID"
          ps -p "$AFTER_PID" -o pid=,user=,%cpu=,%mem=,etime=,command=
          echo "AUDIO_ADMIN_RESTART_PASS=YES"

      - name: BACKGROUND INVENTORY
        if: steps.parse.outputs.command == 'bginventory'
        shell: bash
        run: |
          set +e
          echo "=== LOAD / MEMORY ==="
          /usr/sbin/sysctl -n vm.loadavg
          /usr/bin/memory_pressure | /usr/bin/grep -E 'System-wide memory free percentage' | /usr/bin/head -1

          echo "=== TOP CPU ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/sort -k4 -nr | /usr/bin/head -70

          echo "=== TOP MEMORY ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/sort -k5 -nr | /usr/bin/head -50

          echo "=== USER LAUNCHAGENTS 501 ==="
          /usr/bin/find /Users/burakciller/Library/LaunchAgents -maxdepth 1 -type f -name '*.plist' -print 2>/dev/null | /usr/bin/sort

          echo "=== USER LAUNCHAGENTS 502 ==="
          /usr/bin/find /Users/durdurulamaz-agent/Library/LaunchAgents -maxdepth 1 -type f -name '*.plist' -print 2>/dev/null | /usr/bin/sort

          echo "=== USER LAUNCHAGENTS 503 ==="
          /usr/bin/find /Users/quantum-capital-agent/Library/LaunchAgents -maxdepth 1 -type f -name '*.plist' -print 2>/dev/null | /usr/bin/sort

          echo "=== USER LAUNCHAGENTS 504 ==="
          /usr/bin/find /Users/crypto-signal-agent/Library/LaunchAgents -maxdepth 1 -type f -name '*.plist' -print 2>/dev/null | /usr/bin/sort

          echo "=== LOADED PROJECT / RUNNER SERVICES GUI501 ==="
          /bin/launchctl print gui/501 2>/dev/null | /usr/bin/grep -E 'com\.(crypto|durdurulmaz|quantum)|actions\.runner|cursor|Storage|Safari' | /usr/bin/head -500

          echo "=== PROJECT PROCESSES ALL USERS ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[C]rypto-Signal|[D]urdurulmaz|[Q]uantum-Capital|[R]unner\.(Listener|Worker)|[c]ursor-agent|[r]elay_daemon|[b]ridge_watchdog|[r]ecurring_wake|[l]ive-watch|[n]atural_forward' | /usr/bin/head -300

          echo "=== AUDIO HAL PLUGINS ==="
          /bin/ls -la /Library/Audio/Plug-Ins/HAL 2>/dev/null
          /bin/ls -la /System/Library/Audio/Plug-Ins/HAL 2>/dev/null

          echo "=== AUDIO PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[c]oreaudiod|[b]luetoothaudiod|AudioComponent|ParrotAudioPlugin|[a]udio\.DriverHelper' | /usr/bin/head -120

          echo "=== RECENT ONE-SHOT / MIGRATION LAUNCHAGENTS ==="
          for root in /Users/burakciller /Users/durdurulamaz-agent /Users/quantum-capital-agent /Users/crypto-signal-agent; do
            /usr/bin/find "$root/Library/LaunchAgents" -maxdepth 1 -type f \( -iname '*once*' -o -iname '*migrat*' -o -iname '*probe*' -o -iname '*restart*' -o -iname '*cutover*' -o -iname '*ssd*' \) -print 2>/dev/null
          done | /usr/bin/sort

          echo "BACKGROUND_INVENTORY_PASS=YES"
          exit 0


      - name: BACKGROUND SAFE CHECK
        if: steps.parse.outputs.command == 'bgsafecheck'
        shell: bash
        run: |
          set +e
          echo "=== CONSOLE / LOGIN SESSIONS ==="
          /usr/bin/stat -f 'CONSOLE_OWNER=%Su CONSOLE_UID=%u' /dev/console
          /usr/bin/who

          echo "=== DURDURULMAZ PAUSE / ACTIVE STATE ==="
          for p in             "/Users/Shared/.durdurulmaz-wake-relay/user_pause"             "/Users/durdurulamaz-agent/Durdurulmaz-Supervisor/.user_pause"             "/Users/durdurulamaz-agent/Durdurulmaz-Supervisor/.continuity_paused"             "/Users/durdurulamaz-agent/Durdurulmaz-Supervisor/.active_task"; do
            if [ -e "$p" ]; then echo "PRESENT $p"; else echo "ABSENT $p"; fi
          done
          /usr/bin/find "/Users/durdurulamaz-agent/Durdurulmaz-Supervisor/.continuation_leases/active" -maxdepth 1 -type f -print 2>/dev/null | /usr/bin/head -50

          echo "=== TARGET LAUNCHAGENT DETAILS ==="
          for p in             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.ssd-permission-probe.plist"             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.natural-forward-runtime-v6.plist"             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.operations.sidecar.plist"             "/Users/burakciller/Library/LaunchAgents/com.durdurulmaz.scientific.p9econ001.plist"; do
            echo "--- $p"
            /usr/bin/stat -f '%Sm %z bytes' -t '%Y-%m-%d %H:%M:%S %z' "$p" 2>/dev/null || true
            /usr/bin/plutil -p "$p" 2>/dev/null || true
          done

          echo "=== UID502 SAFARI / WEBKIT ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '^ *[0-9]+ +[0-9]+ +durdurulamaz-agent .*Safari|^ *[0-9]+ +[0-9]+ +durdurulamaz-agent .*WebKit' | /usr/bin/head -120

          echo "=== CORE AUDIO NOW ==="
          /bin/ps -axo pid=,user=,%cpu=,%mem=,etime=,command= | /usr/bin/grep '[c]oreaudiod'

          echo "BACKGROUND_SAFE_CHECK_PASS=YES"
          exit 0