name: Crypto Mac UID501 Command

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mac-uid501.yml"

permissions:
  contents: read
  issues: read

jobs:
  probe:
    if: github.event_name == 'push'
    name: UID501 Bridge Probe
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - name: Verify UID501 runner
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID501 BRIDGE PROBE ==="
          echo "USER=$(whoami)"
          echo "UID=$(id -u)"
          echo "GID=$(id -g)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          id
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          test "$(id -u)" = "501"
          echo "UID501_BRIDGE_PASS=YES"

  command:
    if: github.event_name == 'issues' && github.actor == 'burakciller90-arch' && startsWith(github.event.issue.title, '[MAC501] ')
    name: UID501 Command Bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 20
    steps:
      - name: Parse command
        id: parse
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s\n' "$ISSUE_BODY" | awk -F: 'tolower($1)=="command" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit}')"
          case "$cmd" in
            status|repo|services|disk|hostdiag|audiorestart|loadtree|loadtree2)
              ;;
            *)
              echo "Unsupported command: $cmd"
              exit 2
              ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"

      - name: STATUS
        if: steps.parse.outputs.command == 'status'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UID501 BRIDGE STATUS ==="
          echo "USER=$(whoami)"
          echo "UID=$(id -u)"
          echo "GID=$(id -g)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          id
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          test "$(id -u)" = "501"
          echo "UID501_BRIDGE_PASS=YES"

      - name: REPO
        if: steps.parse.outputs.command == 'repo'
        shell: bash
        run: |
          set +e
          echo "=== HOME ==="
          ls -la "$HOME" | head -120
          echo "=== CRYPTO SIGNAL REPOS ==="
          for repo in             "$HOME/Crypto-Signal"             "/Users/crypto-signal-agent/Crypto-Signal"             "/Users/crypto-signal-agent/Crypto-Signal-Paper"             "/Users/crypto-signal-agent/Crypto-Signal-Product"
          do
            echo "--- $repo"
            if [ -d "$repo/.git" ]; then
              git -C "$repo" status --short --branch
              git -C "$repo" rev-parse HEAD
            else
              echo "NOT_A_GIT_REPO_OR_NOT_ACCESSIBLE"
            fi
          done
          exit 0

      - name: SERVICES
        if: steps.parse.outputs.command == 'services'
        shell: bash
        run: |
          set +e
          echo "=== GUI SERVICES UID501 ==="
          launchctl print "gui/$(id -u)" 2>&1 | egrep 'com\.cryptosignal|state =|pid =' | head -200
          exit 0

      - name: DISK
        if: steps.parse.outputs.command == 'disk'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          echo "=== HOME SIZE ==="
          du -sh "$HOME" 2>/dev/null || true


      - name: HOST DIAG
        if: steps.parse.outputs.command == 'hostdiag'
        shell: bash
        run: |
          set +e
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "=== MEMORY ==="
          /usr/bin/memory_pressure | /usr/bin/head -40
          echo "=== TOP CPU ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/sort -k4 -nr | /usr/bin/head -40
          echo "=== TARGET PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[c]oreaudiod|[S]torageManagementService|Storage\.appex|[r]un_alert_clock\.py|[p]9_natural_forward_runtime_entrypoint\.py|[W]indowServer|[W]ebKit\.WebContent|[R]unner\.(Worker|Listener)' | /usr/bin/head -120
          echo "=== AUDIO LAUNCHD MATCHES ==="
          /bin/launchctl print system 2>&1 | /usr/bin/grep -i -C 3 'coreaudiod\|audio' | /usr/bin/head -160
          echo "=== GUI501 RELEVANT ==="
          /bin/launchctl print gui/501 2>&1 | /usr/bin/grep -E -i -C 2 'cryptosignal|durdurulmaz|Storage|Safari|audio|actions\.runner' | /usr/bin/head -260
          echo "=== THERMAL ==="
          /usr/bin/pmset -g therm 2>&1 | /usr/bin/head -80
          echo "HOST_DIAG_PASS=YES"
          exit 0


      - name: AUDIO RESTART
        if: steps.parse.outputs.command == 'audiorestart'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_PID="$(pgrep -x coreaudiod | head -1 || true)"
          echo "COREAUDIOD_BEFORE_PID=$BEFORE_PID"
          if [ -n "$BEFORE_PID" ]; then
            ps -p "$BEFORE_PID" -o pid=,user=,%cpu=,%mem=,etime=,command= || true
          fi
          /usr/bin/sudo -n /bin/launchctl kickstart -k system/com.apple.audio.coreaudiod
          sleep 5
          AFTER_PID="$(pgrep -x coreaudiod | head -1 || true)"
          test -n "$AFTER_PID"
          echo "COREAUDIOD_AFTER_PID=$AFTER_PID"
          test "$AFTER_PID" != "$BEFORE_PID"
          ps -p "$AFTER_PID" -o pid=,user=,%cpu=,%mem=,etime=,command=
          echo "AUDIO_RESTART_PASS=YES"


      - name: LOAD TREE
        if: steps.parse.outputs.command == 'loadtree'
        shell: bash
        run: |
          set +e
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "=== MIGRATION / HASH / COPY PROCESSES ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[r]sync|[d]itto|[s]hasum|[f]ind .*Durdurulmaz|[r]m -rf|durdurulmaz-(move-staging|ssd-complete)|_temp/.*\.sh' | /usr/bin/head -220
          echo "=== DURDURULMAZ RUNNER TREES ==="
          for root in 8550 94505; do
            echo "--- root=$root"
            /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/awk -v r="$root" '$2==r || $1==r {print}'
          done
          echo "=== TOP CPU ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/sort -k4 -nr | /usr/bin/head -45
          echo "LOAD_TREE_PASS=YES"
          exit 0


      - name: LOAD TREE 2
        if: steps.parse.outputs.command == 'loadtree2'
        shell: bash
        run: |
          set +e
          echo "=== RUNNER DESCENDANTS ==="
          for worker in 62228 51245; do
            echo "--- worker=$worker"
            ps -p "$worker" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
            C1="$(pgrep -P "$worker" | tr '
' ' ' || true)"
            echo "CHILDREN=$C1"
            for p in $C1; do
              ps -p "$p" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              C2="$(pgrep -P "$p" | tr '
' ' ' || true)"
              echo "GRANDCHILDREN_OF_$p=$C2"
              for q in $C2; do
                ps -p "$q" -o pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command=
              done
            done
          done
          echo "=== DURABLE SUPERVISOR ==="
          /bin/ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | /usr/bin/grep -E '[n]atural_forward_durable_day_supervisor\.py|[p]9_natural_forward_runtime_entrypoint\.py'
          echo "=== LOAD ==="
          /usr/sbin/sysctl -n vm.loadavg
          echo "LOAD_TREE_2_PASS=YES"
          exit 0
