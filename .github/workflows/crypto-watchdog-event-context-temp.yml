name: Crypto Watchdog Event Context TEMP

on:
  push:
    branches: [fix/continuity-watchdog-event-context]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2"
      - name: Focused continuity gate
        run: |
          python -m pytest -q tests/test_continuity_hardening.py tests/test_continuity_contracts.py
          python -m py_compile ops/continuity/interval_wake_daemon.py ops/continuity/relay_submit.py ops/continuity/relay_daemon.py
          grep -F 'if [ "${{ github.event_name }}" = "schedule" ]; then' .github/workflows/crypto-20m-continuity-wake.yml
          ! grep -F '\${{ github.event_name }}' .github/workflows/crypto-20m-continuity-wake.yml
          grep -F 'crypto-20m-emergency:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}' .github/workflows/crypto-20m-continuity-wake.yml
          grep -F 'crypto-20m-continuity-manual:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}' .github/workflows/crypto-20m-continuity-wake.yml
          ! grep -F '\${GITHUB_RUN_ID}' .github/workflows/crypto-20m-continuity-wake.yml
          echo "WATCHDOG_EVENT_CONTEXT_FOCUSED_PASS=YES"
