name: WC2 Readiness Lower Bound UID504

on:
  pull_request:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_readiness_lower_bound.py"
      - "src/crypto_signal/evaluation/untouched_forward_policy.py"
      - "src/crypto_signal/evaluation/untouched_forward_journal.py"
      - "tests/test_wc2_readiness_lower_bound.py"
      - ".github/workflows/wc2-readiness-lower-bound-uid504.yml"
  push:
    branches: [main]
    paths:
      - "src/crypto_signal/evaluation/untouched_forward_readiness_lower_bound.py"
      - "src/crypto_signal/evaluation/untouched_forward_policy.py"
      - "src/crypto_signal/evaluation/untouched_forward_journal.py"
      - "tests/test_wc2_readiness_lower_bound.py"
      - ".github/workflows/wc2-readiness-lower-bound-uid504.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wc2-readiness-lower-bound-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: WC2 exact-head readiness lower-bound acceptance
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify exact source and clean Development
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test "$(id -u)" = "504"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC2_LOWER_BOUND_EXACT_SOURCE_PASS=YES"

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          BASE_PY="/Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/wc2-readiness-lower-bound-venv"
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Focused lower-bound contract acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q             tests/test_wc2_readiness_lower_bound.py             tests/test_wc2_untouched_forward_policy.py             tests/test_wc2_untouched_forward_journal.py
          "$TEST_PY" -m ruff check             src/crypto_signal/evaluation/untouched_forward_readiness_lower_bound.py             tests/test_wc2_readiness_lower_bound.py
          "$TEST_PY" -m mypy             src/crypto_signal/evaluation/untouched_forward_readiness_lower_bound.py
          echo "WC2_LOWER_BOUND_FOCUSED_PASS=YES"
          echo "WC2_LOWER_BOUND_REVIEW_ELIGIBLE_CLAIM=NO"
          echo "WC2_LOWER_BOUND_DECISIVE_MAPPING_APPLIED=NO"
          echo "REAL_CAPITAL=0"

      - name: Live read-only WC2 lower-bound snapshot
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          POLICY="$DEV/runtime/wc2/wc2_forward_policy.sqlite3"
          COHORT="$DEV/runtime/wc2/wc2_untouched_forward.sqlite3"
          test -f "$POLICY"
          test -f "$COHORT"
          policy_before="$(shasum -a 256 "$POLICY" | awk '{print $1}')"
          cohort_before="$(shasum -a 256 "$COHORT" | awk '{print $1}')"
          export WC2_POLICY_PATH="$POLICY"
          export WC2_COHORT_PATH="$COHORT"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          "$TEST_PY" - <<'PY'
          import os
          import time
          from pathlib import Path
          from crypto_signal.evaluation.untouched_forward_readiness_lower_bound import (
              read_wc2_readiness_lower_bound,
          )

          snapshot = read_wc2_readiness_lower_bound(
              policy_path=Path(os.environ["WC2_POLICY_PATH"]),
              cohort_path=Path(os.environ["WC2_COHORT_PATH"]),
              observed_at_ms=time.time_ns() // 1_000_000,
          )
          print(f"WC2_LOWER_BOUND_STATUS={snapshot.status.value}")
          print(f"WC2_LOWER_BOUND_CALENDAR_DAYS={snapshot.calendar_duration_days}")
          print(f"WC2_LOWER_BOUND_FORECASTS={snapshot.forecast_n}")
          print(f"WC2_LOWER_BOUND_RESOLVED={snapshot.resolved_n}")
          print(f"WC2_LOWER_BOUND_UNRESOLVED={snapshot.unresolved_n}")
          print(
              "WC2_LOWER_BOUND_PAPER_COVERED_FORECASTS="
              f"{snapshot.paper_decision_covered_forecast_n}"
          )
          print(f"WC2_LOWER_BOUND_TRADE_INTENTS={snapshot.trade_intent_n}")
          print(
              "WC2_LOWER_BOUND_TRADE_INTENTS_WITH_EXECUTION="
              f"{snapshot.trade_intent_with_execution_n}"
          )
          print(
              "WC2_LOWER_BOUND_RESOLVED_ASSET_UPPER="
              + ",".join(
                  f"{name}:{count}"
                  for name, count in snapshot.resolved_upper_bound_by_asset
              )
          )
          print(
              "WC2_LOWER_BOUND_RESOLVED_REGIME_UPPER="
              + (
                  ",".join(
                      f"{name}:{count}"
                      for name, count in snapshot.resolved_upper_bound_by_regime
                  )
                  or "EMPTY"
              )
          )
          print(
              "WC2_LOWER_BOUND_QUALIFYING_REGIME_UPPER="
              f"{snapshot.qualifying_regime_upper_bound}"
          )
          print(
              "WC2_LOWER_BOUND_GUARANTEED_REASONS="
              + (
                  ",".join(snapshot.guaranteed_reason_codes)
                  or "NONE"
              )
          )
          print(
              "WC2_LOWER_BOUND_DECISIVE_MAPPING_APPLIED="
              + ("YES" if snapshot.decisive_mapping_applied else "NO")
          )
          print(
              "WC2_LOWER_BOUND_REVIEW_ELIGIBLE_CLAIM="
              + ("YES" if snapshot.review_eligible_claimed else "NO")
          )
          print(f"WC2_LOWER_BOUND_SNAPSHOT_IDENTITY={snapshot.snapshot_identity}")
          print("REAL_CAPITAL=0")
          PY
          policy_after="$(shasum -a 256 "$POLICY" | awk '{print $1}')"
          cohort_after="$(shasum -a 256 "$COHORT" | awk '{print $1}')"
          test "$policy_before" = "$policy_after"
          test "$cohort_before" = "$cohort_after"
          echo "WC2_LOWER_BOUND_LIVE_SOURCE_BYTE_STABLE_PASS=YES"
          echo "WC2_LOWER_BOUND_LIVE_READONLY_PASS=YES"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "WC2_LOWER_BOUND_FULL_REGRESSION_PASS=YES"

      - name: Prove Development remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "WC2_LOWER_BOUND_DEVELOPMENT_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
