name: Crypto M2 Liquidity Live Memory Smoke

on:
  push:
    branches:
      - v1.1-liquidity-dynamics-v1
    paths:
      - ".github/workflows/crypto-m2-liquidity-live-memory-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: M2 live Bybit in-memory liquidity smoke
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare branch source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crypto-m2-live-memory
          mkdir -p /tmp/crypto-m2-live-memory
          cp -R src /tmp/crypto-m2-live-memory/
          chmod -R a+rX /tmp/crypto-m2-live-memory

      - name: Collect bounded public order-book evidence and analyze
        shell: bash
        run: |
          set -euo pipefail
          sudo -k
          test "$(sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          sudo -n -H -u crypto-signal-agent /usr/bin/env \
            PYTHONPATH=/tmp/crypto-m2-live-memory/src \
            /Volumes/Crypto-504/Crypto-Signal/Development/.venv/bin/python - <<'PY'
          import asyncio
          import time

          from crypto_signal.data.adapters.bybit_microstructure_ws import (
              BybitSpotMicrostructureStream,
          )
          from crypto_signal.intelligence.liquidity_dynamics import (
              LiquidityDynamicsConfig,
              LiquidityDynamicsStatus,
              build_liquidity_dynamics_evidence_freeze,
          )

          SYMBOLS = ("BTCUSDT", "ETHUSDT", "SOLUSDT")
          TARGET = 6

          async def collect():
              stream = BybitSpotMicrostructureStream()
              books = {symbol: [] for symbol in SYMBOLS}
              async with asyncio.timeout(90):
                  async for event in stream.stream_wire_events(
                      symbols=SYMBOLS,
                      depth=50,
                  ):
                      if event.orderbook is not None:
                          bucket = books[event.symbol]
                          if len(bucket) < TARGET:
                              bucket.append(event.orderbook)
                      if all(len(items) >= TARGET for items in books.values()):
                          break
              return books

          books_by_symbol = asyncio.run(collect())
          as_of_ms = time.time_ns() // 1_000_000

          for symbol in SYMBOLS:
              books = tuple(books_by_symbol[symbol])
              print(f"M2_LIVE_BOOKS symbol={symbol} count={len(books)}")
              assert len(books) >= 3
              freeze = build_liquidity_dynamics_evidence_freeze(
                  books,
                  as_of_ms=as_of_ms,
                  config=LiquidityDynamicsConfig(
                      depth_levels=10,
                      lookback_ms=120_000,
                      minimum_snapshots=3,
                      max_snapshot_age_ms=30_000,
                      max_snapshot_gap_ms=30_000,
                  ),
              )
              analysis = freeze.analysis
              print(
                  "M2_LIVE_LIQUIDITY "
                  f"symbol={symbol} "
                  f"status={analysis.status.value} "
                  f"quality={analysis.source_quality.value} "
                  f"snapshots={analysis.consumed_snapshot_count} "
                  f"latest_age_ms={analysis.latest_snapshot_age_ms} "
                  f"flags={','.join(analysis.uncertainty_flags) or '-'} "
                  f"evidence={analysis.evidence_identity} "
                  f"freeze={freeze.freeze_identity}"
              )
              assert analysis.status is LiquidityDynamicsStatus.MEASURED
              assert analysis.metrics is not None
              metrics = analysis.metrics
              print(
                  "M2_LIVE_METRICS "
                  f"symbol={symbol} "
                  f"bid_added={metrics.gross_bid_added_notional} "
                  f"bid_removed={metrics.gross_bid_removed_notional} "
                  f"ask_added={metrics.gross_ask_added_notional} "
                  f"ask_removed={metrics.gross_ask_removed_notional} "
                  f"bid_change_per_s={metrics.bid_depth_change_notional_per_second} "
                  f"ask_change_per_s={metrics.ask_depth_change_notional_per_second} "
                  f"bid_persistence={metrics.best_bid_price_persistence_fraction} "
                  f"ask_persistence={metrics.best_ask_price_persistence_fraction}"
              )

          print("M2_LIQUIDITY_LIVE_MEMORY_SMOKE_PASS=YES")
          print("REAL_CAPITAL=0")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/crypto-m2-live-memory
