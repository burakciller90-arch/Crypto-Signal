name: Crypto Market Tape Heartbeat Final Gate

on:
  push:
    branches:
      - v1.1-market-tape-hotcold-v1
    paths:
      - ".github/workflows/crypto-market-tape-heartbeat-final-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    name: Current HotCold heartbeat full gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install             "pytest>=8.4" "pytest-asyncio>=1.1"             "ruff>=0.13" "mypy>=1.18"             "pyarrow==22.0.0"
      - name: Full gate
        run: |
          python -m pytest -q             tests/test_market_tape_hotcold.py             tests/test_market_tape_cold_archive.py             tests/test_market_tape_runtime.py             tests/test_market_tape_runtime_service.py
          python -m pytest -q
          python -m ruff check             src tests ops/verify_stage10_integrated.py             ops/run_market_tape_runtime.py             ops/market_tape/archive_hot_to_parquet.py             ops/market_tape/run_market_tape_supervisor.py
          python -m mypy             src ops/verify_stage10_integrated.py             ops/run_market_tape_runtime.py             ops/market_tape/archive_hot_to_parquet.py             ops/market_tape/run_market_tape_supervisor.py
          bash -n ops/install_market_tape_runtime.sh
          bash -n ops/market_tape/start_market_tape_supervisor.sh
          bash -n ops/market_tape/stop_market_tape_supervisor.sh
          bash -n ops/ssd_runtime_supervisor.sh
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "MARKET_TAPE_HEARTBEAT_FINAL_GATE_PASS=YES"
