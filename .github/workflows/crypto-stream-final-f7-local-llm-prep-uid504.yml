name: Crypto Stream Final F7 Local Rewrite Prep UID504

on:
  push:
    branches:
      - 'stream/final-f7-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-final-f7-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-final-f7-prep:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'stream/final-f7-')
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Verify exact source and create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BASE_PY="$DEV/.venv/bin/python"
          TEST_VENV="$RUNNER_TEMP/stream-final-f7-prep-venv"
          test "$(id -u)" = "504"
          test -x "$BASE_PY"
          test -z "$(git -C "$DEV" status --porcelain)"
          echo "DEV_HEAD_BEFORE=$(git -C "$DEV" rev-parse HEAD)" >> "$RUNNER_TEMP/stream-f7-dev-state"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --quiet
          git diff --quiet origin/main...HEAD --             CURRENT_STATUS.md             PROJECT_CHRONICLE.md             docs/CRYPTO_SIGNAL_INTELLIGENCE_STREAM_V1_FINAL_COMPLETION_ROADMAP.md             ops/ssd_runtime_supervisor.sh
          rm -rf "$TEST_VENV"
          "$BASE_PY" -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --upgrade pip
          "$TEST_VENV/bin/python" -m pip install -e "$GITHUB_WORKSPACE"
          "$TEST_VENV/bin/python" -m pip install             "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18"
          echo "TEST_PY=$TEST_VENV/bin/python" >> "$GITHUB_ENV"
          echo "STREAM_F7_PREP_EXACT_SOURCE_PASS=YES"
          echo "F5_F6_AUTHORITY_UNTOUCHED=YES"
          echo "REAL_CAPITAL=0"

      - name: Focused F7 guarded local rewrite acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q             tests/test_intelligence_stream_local_rewriter.py             tests/test_intelligence_stream_ledger.py             tests/test_intelligence_stream_forward_runtime.py             tests/test_intelligence_stream_production_projector.py             tests/test_wc2_live_clock_wiring.py
          "$TEST_PY" -m ruff check             src/crypto_signal/product/intelligence_stream_local_rewriter.py             src/crypto_signal/product/intelligence_stream_narrative.py             src/crypto_signal/product/intelligence_stream_forward_runtime.py             src/crypto_signal/product/intelligence_stream_production_projector.py             ops/run_live_evidence_clock.py             tests/test_intelligence_stream_local_rewriter.py             tests/test_intelligence_stream_ledger.py             tests/test_intelligence_stream_forward_runtime.py             tests/test_intelligence_stream_production_projector.py             tests/test_wc2_live_clock_wiring.py
          "$TEST_PY" -m mypy             src/crypto_signal/product/intelligence_stream_local_rewriter.py             src/crypto_signal/product/intelligence_stream_narrative.py             src/crypto_signal/product/intelligence_stream_forward_runtime.py             src/crypto_signal/product/intelligence_stream_production_projector.py             ops/run_live_evidence_clock.py
          echo "STREAM_F7_PREP_FOCUSED_PASS=YES"
          echo "OLLAMA_PHYSICAL_ACTIVATION=DEFERRED_UNTIL_F5_F6_ACCEPTED"
          echo "REAL_CAPITAL=0"

      - name: Whole-repository regression
        shell: bash
        run: |
          set -euo pipefail
          "$TEST_PY" -m pytest -q
          "$TEST_PY" -m ruff check src tests ops/verify_stage10_integrated.py
          "$TEST_PY" -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node --check src/crypto_signal/product/galactech/app.js
          node tests/js/test_product_freshness.js
          echo "STREAM_F7_PREP_FULL_PASS=YES"
          echo "REAL_CAPITAL=0"

      - name: Prove Development checkout remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEV="/Volumes/Crypto-504/Crypto-Signal/Development"
          BEFORE="$(sed -n 's/^DEV_HEAD_BEFORE=//p' "$RUNNER_TEMP/stream-f7-dev-state")"
          AFTER="$(git -C "$DEV" rev-parse HEAD)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test "$BEFORE" = "$AFTER"
          echo "STREAM_F7_PREP_UID504_NON_MUTATING_PASS=YES"
          echo "REAL_CAPITAL=0"
