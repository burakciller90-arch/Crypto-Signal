name: Crypto Stream Final F6 Live Acceptance UID504

on:
  push:
    branches:
      - 'stream/final-f6-live-acceptance'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f6-live-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Fast-forward Development and Product to exact merged F6 main
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          EXPECTED_MAIN="115aaf9c97eca012503224c3a64a97526c1bf4dd"

          test "$(id -u)" = "504"
          echo "F6_DIAG_DEV_HEAD=$(git -C "$DEV" rev-parse HEAD)"
          echo "F6_DIAG_PRODUCT_HEAD=$(git -C "$PRODUCT" rev-parse HEAD)"
          echo "F6_DIAG_DEV_STATUS_BEGIN"
          git -C "$DEV" status --porcelain=v1 || true
          echo "F6_DIAG_DEV_STATUS_END"
          echo "F6_DIAG_PRODUCT_STATUS_BEGIN"
          git -C "$PRODUCT" status --porcelain=v1 || true
          echo "F6_DIAG_PRODUCT_STATUS_END"
          echo "F6_DIAG_WORKFLOW_MERGE_BASE=$(git merge-base HEAD "$EXPECTED_MAIN" || true)"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          git diff --quiet "$EXPECTED_MAIN"...HEAD -- . ':(exclude).github/workflows/crypto-stream-final-f6-live-acceptance-uid504.yml'

          DEV_BEFORE="$(git -C "$DEV" rev-parse HEAD)"
          PRODUCT_BEFORE="$(git -C "$PRODUCT" rev-parse HEAD)"

          git -C "$DEV" fetch origin main --quiet
          git -C "$PRODUCT" fetch origin main --quiet
          test "$(git -C "$DEV" rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git -C "$PRODUCT" rev-parse origin/main)" = "$EXPECTED_MAIN"

          git -C "$DEV" merge-base --is-ancestor "$DEV_BEFORE" "$EXPECTED_MAIN"
          git -C "$PRODUCT" merge-base --is-ancestor "$PRODUCT_BEFORE" "$EXPECTED_MAIN"
          git -C "$DEV" merge --ff-only "$EXPECTED_MAIN"
          git -C "$PRODUCT" merge --ff-only "$EXPECTED_MAIN"

          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          echo "F6_DEVELOPMENT_EXACT_MAIN_PASS=YES before=$DEV_BEFORE after=$EXPECTED_MAIN"
          echo "F6_PRODUCT_EXACT_MAIN_PASS=YES before=$PRODUCT_BEFORE after=$EXPECTED_MAIN"
          echo "REAL_CAPITAL=0"

      - name: Headless reload canonical supervisor
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          EXPECTED_MAIN="115aaf9c97eca012503224c3a64a97526c1bf4dd"

          test "$(id -u)" = "504"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$DEV" status --porcelain)"

          old_sup="$(cat "$ROOT/ssd-service-supervisor.pid" 2>/dev/null || true)"
          test -n "$old_sup"
          kill -0 "$old_sup"
          ps -p "$old_sup" -o command= | grep -F "$ROOT/ssd-service-supervisor.sh" >/dev/null

          old_dashboard="$(cat "$ROOT/dashboard.pid" 2>/dev/null || true)"
          test -n "$old_dashboard"
          kill -0 "$old_dashboard"
          ps -p "$old_dashboard" -o command= | grep -F "$ROOT/Product/ops/run_dashboard.py" >/dev/null
          kill -TERM "$old_dashboard"
          dashboard_stopped=0
          for _ in {1..20}; do
            if ! kill -0 "$old_dashboard" >/dev/null 2>&1; then
              dashboard_stopped=1
              break
            fi
            sleep 1
          done
          test "$dashboard_stopped" = "1"
          rm -f "$ROOT/dashboard.pid"

          cp "$DEV/ops/ssd_runtime_supervisor.sh" "$ROOT/ssd-service-supervisor.sh"
          chmod 700 "$ROOT/ssd-service-supervisor.sh"

          kill -TERM "$old_sup"
          stopped=0
          for _ in {1..20}; do
            if ! kill -0 "$old_sup" >/dev/null 2>&1; then
              stopped=1
              break
            fi
            sleep 1
          done
          test "$stopped" = "1"
          rm -f "$ROOT/ssd-service-supervisor.pid"

          CRYPTO_SIGNAL_ROOT="$ROOT" bash "$DEV/ops/r11/start_ssd_runtime.command"

          new_sup="$(cat "$ROOT/ssd-service-supervisor.pid")"
          test -n "$new_sup"
          test "$new_sup" != "$old_sup"
          kill -0 "$new_sup"
          ps -p "$new_sup" -o command= | grep -F "$ROOT/ssd-service-supervisor.sh" >/dev/null

          for _ in {1..30}; do
            if curl -fsS --max-time 5 http://127.0.0.1:48700/api/health > "$RUNNER_TEMP/f6-health.json"; then
              break
            fi
            sleep 2
          done
          /usr/bin/python3 - "$RUNNER_TEMP/f6-health.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text())
          assert p["status"] == "ok", p
          assert p["real_capital"] == 0, p
          assert p["read_only"] is True, p
          assert p.get("product_root") == "stream", p
          PY

          new_dashboard="$(cat "$ROOT/dashboard.pid")"
          test -n "$new_dashboard"
          test "$new_dashboard" != "$old_dashboard"
          kill -0 "$new_dashboard"
          ps -p "$new_dashboard" -o command= | grep -F "$ROOT/Product/ops/run_dashboard.py" >/dev/null

          echo "F6_HEADLESS_SUPERVISOR_RELOAD_PASS=YES old=$old_sup new=$new_sup"
          echo "F6_DASHBOARD_RESTART_PASS=YES old=$old_dashboard new=$new_dashboard"
          echo "REAL_CAPITAL=0"

      - name: Verify real live exact-evidence API and detached UI
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          EXPECTED_MAIN="115aaf9c97eca012503224c3a64a97526c1bf4dd"
          OUT="$RUNNER_TEMP/stream-final-f6-live-acceptance"
          mkdir -p "$OUT"

          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$DEV" status --porcelain)"
          export PYTHONPATH="$DEV/src"
          export OUT

          "$DEV/.venv/bin/python" - "$DEV" <<'PY' | tee "$OUT/f6-live-acceptance.log"
          from __future__ import annotations

          import json
          import os
          import sqlite3
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from crypto_signal.product.intelligence_stream_read_model import (
              IntelligenceStreamReadModel,
          )

          dev = Path(sys.argv[1])
          stream = dev / "runtime/stream/intelligence_stream.sqlite3"
          read_model = IntelligenceStreamReadModel(stream)
          base = "http://127.0.0.1:48700"

          def get_json(path: str) -> dict[str, object]:
              with urllib.request.urlopen(base + path, timeout=10) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              assert isinstance(payload, dict), payload
              return payload

          def get_text(path: str) -> str:
              with urllib.request.urlopen(base + path, timeout=10) as response:
                  return response.read().decode("utf-8")

          uri = f"{stream.resolve().as_uri()}?mode=ro"
          with sqlite3.connect(uri, uri=True) as db:
              db.row_factory = sqlite3.Row
              db.execute("PRAGMA query_only=ON")
              rows = db.execute(
                  """
                  SELECT n.narrative_identity
                  FROM stream_narrative_messages AS n
                  JOIN stream_narrative_plans AS p
                    ON p.plan_identity = n.plan_identity
                  JOIN stream_fact_bundles AS f
                    ON f.fact_bundle_identity = p.fact_bundle_identity
                  WHERE f.payload_json LIKE '%"projector_id"%'
                  ORDER BY n.event_at_ms DESC, n.narrative_identity DESC
                  LIMIT 240
                  """
              ).fetchall()

          required = {
              "market_geometry_change",
              "liquidity_change",
              "order_flow_change",
              "derivatives_change",
              "provider_quality_change",
          }
          selected: dict[str, str] = {}
          for row in rows:
              identity = str(row["narrative_identity"])
              detail = read_model.read_message_detail(identity)
              if detail is None:
                  continue
              fact = detail.get("fact_bundle")
              if not isinstance(fact, dict):
                  continue
              projector = fact.get("projector_id")
              if isinstance(projector, str):
                  selected.setdefault(projector, identity)

          missing = required - set(selected)
          assert not missing, sorted(missing)

          allowed = {
              "READY_EXACT",
              "IDENTITY_ONLY_EXACT",
              "UNAVAILABLE_EXPLICIT",
          }
          reports: dict[str, object] = {}
          for projector in sorted(required):
              identity = selected[projector]
              payload = get_json(
                  f"/api/stream/messages/{urllib.parse.quote(identity)}/evidence"
              )
              assert payload.get("status") == "ready", payload
              evidence = payload.get("evidence")
              assert isinstance(evidence, dict), payload
              assert evidence.get("current_data_substitution") is False, evidence
              assert evidence.get("real_capital") == 0, evidence
              for key in ("resolutions", "reference_resolutions"):
                  values = evidence.get(key, [])
                  assert isinstance(values, list), evidence
                  for item in values:
                      assert isinstance(item, dict), item
                      assert str(item.get("resolution_state")) in allowed, item
              reports[projector] = {
                  "narrative_identity": identity,
                  "resolution_counts": evidence.get("resolution_counts"),
              }

          geometry_identity = selected["market_geometry_change"]
          detached = get_text(
              "/stream-evidence?narrative="
              + urllib.parse.quote(geometry_identity)
              + "&kind=geometry"
          )
          assert 'data-ui-version="crypto-signal-stream-v1-s10-evidence"' in detached
          assert "evidence.js" in detached
          evidence_js = get_text("/stream/evidence.js")
          for state in sorted(allowed):
              assert state in evidence_js
          assert "/evidence" in evidence_js
          assert "current data ile ikame yapılmadı" in evidence_js.lower()

          report = {
              "status": "PASS",
              "required_projectors": sorted(required),
              "reports": reports,
              "current_data_substitution": False,
              "historical_backfill": False,
              "production_authority": False,
              "real_capital": 0,
          }
          out = Path(os.environ["OUT"]) / "f6-live-acceptance.json"
          out.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n")
          print(json.dumps(report, sort_keys=True))
          print("F6_PHYSICAL_LIVE_ACCEPTANCE_PASS=YES")
          print("HISTORICAL_BACKFILL=NO")
          print("REAL_CAPITAL=0")
          PY

          test -z "$(git -C "$DEV" status --porcelain)"
          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"

      - name: Upload F6 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f6-live-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-final-f6-live-acceptance
          if-no-files-found: warn
          retention-days: 14
