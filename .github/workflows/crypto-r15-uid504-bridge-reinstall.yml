name: Crypto R15 UID504 Bridge Reinstall

on:
  push:
    branches:
      - r15-ssd-hotplug-recovery-v1
    paths:
      - ".github/workflows/crypto-r15-uid504-bridge-reinstall.yml"

permissions:
  contents: read

jobs:
  reinstall:
    name: Reinstall R15 through passwordless UID504 bridge
    runs-on: [self-hosted, crypto-signal, uid501]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install current R15 as UID504
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/id -u)" = "504"
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash ops/install_ssd_hotplug_recovery.sh
          echo "R15_UID504_BRIDGE_INSTALL_PASS=YES"

      - name: Force one bounded watchdog cycle
        shell: bash
        run: |
          set -euo pipefail
          WATCH="/Users/crypto-signal-agent/Library/Application Support/CryptoSignalRecovery/hotplug-watchdog.sh"
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/env HOME=/Users/crypto-signal-agent /bin/bash "$WATCH" || true
          sleep 5

      - name: Verify orphan cleared and canonical runner recovered
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          EXPECTED="$ROOT/Runner/bin/Runner.Listener run --startuptype service"
          ok=0
          for _ in {1..90}; do
            count="$(ps -axo command= | awk -v expected="$EXPECTED" '$0 == expected {n++} END{print n+0}')"
            orphan="$(ps -axo user=,command= | awk '$1=="crypto-signal-agent" && $0 ~ /^crypto-signal-agent[[:space:]]+\.\/externals\/node20\/bin\/node \.\/bin\/RunnerService\.js$/ {n++} END{print n+0}')"
            if [ "$count" = "1" ] && [ "$orphan" = "1" ] && curl -fsS --max-time 3 http://127.0.0.1:48700/api/health >/tmp/r15-bridge-health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          echo "=== UID504 RUNNER PROCESSES ==="
          ps -axo pid=,ppid=,user=,%cpu=,%mem=,etime=,state=,command= | grep -E '[R]unnerService\.js|[R]unner\.Listener|[R]unner\.Worker|[.]\/runsvc\.sh' | head -200
          echo "=== R15 LOG ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.log"
          echo "=== R15 ERR ==="
          /usr/bin/sudo -n -H -u crypto-signal-agent /usr/bin/tail -120 "/Users/crypto-signal-agent/Library/Logs/CryptoSignalRecovery/hotplug-watchdog.err.log" || true
          echo "=== HEALTH ==="
          cat /tmp/r15-bridge-health.json 2>/dev/null || true
          test "$ok" = "1"
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/r15-bridge-health.json"))
          assert data.get("status") == "ok"
          assert data.get("real_capital") == 0
          assert data.get("read_only") is True
          PY
          echo "R15_UID504_BRIDGE_RECOVERY_PASS=YES"
          echo "REAL_CAPITAL=0"
