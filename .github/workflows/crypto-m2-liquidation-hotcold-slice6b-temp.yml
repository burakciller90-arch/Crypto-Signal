name: Crypto M2 Liquidation HotCold Slice6B TEMP

on:
  push:
    branches: [v1.1-liquidation-hotcold-v2-slice6b]
    paths:
      - ".github/workflows/crypto-m2-liquidation-hotcold-slice6b-temp.yml"
      - "src/crypto_signal/data/market_tape_cold_archive.py"
      - "src/crypto_signal/data/market_tape_hotcold.py"
      - "tests/test_market_tape_cold_archive.py"
      - "tests/test_market_tape_hotcold.py"
      - "tests/test_liquidation_cold_archive.py"
      - "docs/M2_LIQUIDATION_HOTCOLD_SLICE6B.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.4" "pytest-asyncio>=1.2" "ruff>=0.13" "mypy>=1.18" "pyarrow>=22,<23"
      - name: Slice6B focused gate
        run: |
          python -m pytest -q tests/test_market_tape_hotcold.py tests/test_market_tape_cold_archive.py tests/test_liquidation_market_tape_persistence.py tests/test_liquidation_wire_collection.py tests/test_liquidation_cold_archive.py
          python -m ruff check src/crypto_signal/data/market_tape_cold_archive.py src/crypto_signal/data/market_tape_hotcold.py tests/test_market_tape_hotcold.py tests/test_market_tape_cold_archive.py tests/test_liquidation_cold_archive.py
          python -m mypy src/crypto_signal/data/market_tape_cold_archive.py src/crypto_signal/data/market_tape_hotcold.py
          echo "M2_LIQUIDATION_HOTCOLD_SLICE6B_FOCUSED_PASS=YES"
      - name: Full repository regression
        run: |
          python -m pytest -q
          python -m ruff check src tests ops/verify_stage10_integrated.py
          python -m mypy src ops/verify_stage10_integrated.py
          node --check src/crypto_signal/product/static/freshness.js
          node --check src/crypto_signal/product/static/app.js
          node tests/js/test_product_freshness.js
          echo "M2_LIQUIDATION_HOTCOLD_SLICE6B_FULL_PASS=YES"
