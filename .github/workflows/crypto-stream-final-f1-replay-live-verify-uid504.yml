name: Crypto Stream Final F1 Replay Live Verify UID504

on:
  push:
    branches:
      - 'stream/final-f1-replay-live-verify'

permissions:
  contents: read

concurrency:
  group: crypto-stream-final-f1-replay-live-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, crypto-signal, uid504]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Sync exact main and verify real supervisor cycle
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/Volumes/Crypto-504/Crypto-Signal"
          DEV="$ROOT/Development"
          PRODUCT="$ROOT/Product"
          LOG="$ROOT/ServiceLogs/live.out.log"
          OUT="$RUNNER_TEMP/stream-final-f1-replay-live"
          EXPECTED_MAIN="9f747628f4c7b137362e8d184e4b61ce166b39ad"
          mkdir -p "$OUT"

          test "$(id -u)" = "504"
          test "$(git -C "$DEV" rev-parse --is-inside-work-tree)" = "true"
          test "$(git -C "$PRODUCT" rev-parse --is-inside-work-tree)" = "true"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"
          test -f "$LOG"

          DEV_BEFORE="$(git -C "$DEV" rev-parse HEAD)"
          PRODUCT_BEFORE="$(git -C "$PRODUCT" rev-parse HEAD)"
          POLICY="$DEV/runtime/wc2/wc2_forward_policy.sqlite3"
          PROTOCOL="$DEV/runtime/wc2/wc2_collection_protocol.wc2-collection-protocol.sqlite3"
          POLICY_BEFORE="$(shasum -a 256 "$POLICY" | awk '{print $1}')"
          PROTOCOL_BEFORE="$(shasum -a 256 "$PROTOCOL" | awk '{print $1}')"
          MARKERS_BEFORE="$(grep -c '^wc2_liveness status=SUMMARY ' "$LOG" || true)"

          git -C "$DEV" fetch --quiet origin main
          test "$(git -C "$DEV" rev-parse origin/main)" = "$EXPECTED_MAIN"
          git -C "$DEV" merge-base --is-ancestor "$DEV_BEFORE" "$EXPECTED_MAIN"
          git -C "$DEV" merge --ff-only "$EXPECTED_MAIN"

          test "$(git -C "$DEV" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_BEFORE"

          FOUND=0
          for _attempt in $(seq 1 75); do
            MARKERS_NOW="$(grep -c '^wc2_liveness status=SUMMARY ' "$LOG" || true)"
            if [ "$MARKERS_NOW" -gt "$MARKERS_BEFORE" ]; then
              FOUND=1
              break
            fi
            sleep 4
          done
          test "$FOUND" = "1"

          LATEST="$(grep '^wc2_liveness status=SUMMARY ' "$LOG" | tail -n 1)"
          printf '%s\n' "$LATEST" | tee "$OUT/latest-wc2-liveness-summary.txt"
          printf '%s\n' "$LATEST" | grep -q 'POLICY_UNCHANGED=YES'
          printf '%s\n' "$LATEST" | grep -q 'HISTORICAL_BACKFILL=NO'
          printf '%s\n' "$LATEST" | grep -q 'REAL_CAPITAL=0'
          if printf '%s\n' "$LATEST" | grep -q 'no_prepared_receipt'; then
            echo "F1_REPLAY_FALSE_GAP_STILL_PRESENT=YES" >&2
            exit 1
          fi
          printf '%s\n' "$LATEST" | grep -q 'skipped_ineligible_source'

          POLICY_AFTER="$(shasum -a 256 "$POLICY" | awk '{print $1}')"
          PROTOCOL_AFTER="$(shasum -a 256 "$PROTOCOL" | awk '{print $1}')"
          test "$POLICY_AFTER" = "$POLICY_BEFORE"
          test "$PROTOCOL_AFTER" = "$PROTOCOL_BEFORE"
          test "$(git -C "$PRODUCT" rev-parse HEAD)" = "$PRODUCT_BEFORE"
          test -z "$(git -C "$DEV" status --porcelain)"
          test -z "$(git -C "$PRODUCT" status --porcelain)"

          {
            echo "EXPECTED_MAIN=$EXPECTED_MAIN"
            echo "DEV_BEFORE=$DEV_BEFORE"
            echo "DEV_AFTER=$(git -C "$DEV" rev-parse HEAD)"
            echo "PRODUCT_BEFORE=$PRODUCT_BEFORE"
            echo "PRODUCT_AFTER=$(git -C "$PRODUCT" rev-parse HEAD)"
            echo "POLICY_SHA256=$POLICY_AFTER"
            echo "PROTOCOL_SHA256=$PROTOCOL_AFTER"
            echo "MARKERS_BEFORE=$MARKERS_BEFORE"
            echo "MARKERS_AFTER=$(grep -c '^wc2_liveness status=SUMMARY ' "$LOG" || true)"
            echo "F1_REPLAY_FALSE_GAP_CLOSED_LIVE=YES"
            echo "POLICY_UNCHANGED=YES"
            echo "HISTORICAL_BACKFILL=NO"
            echo "REAL_CAPITAL=0"
          } | tee "$OUT/verification.txt"

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-final-f1-replay-live-${{ github.run_id }}
          path: ${{ runner.temp }}/stream-final-f1-replay-live
          if-no-files-found: error
          retention-days: 14
